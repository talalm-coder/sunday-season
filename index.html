/* settle everything riding on a gameweek once its games are in */
/* Settle every open bet whose gameweek now has games logged. Working from the
   bets rather than from one gameweek means nothing is ever stranded if a game
   is logged under a different round number than the bet expected. */
function settleBets(){
  const b=bets(), played=playedGws();
  if(!played.length)return 0;
  const latest=played[played.length-1];
  let done=0;
  b.open=b.open.filter(bet=>{
    const gw=bet.gw;
    let games=gamesInGw(gw);
    /* the bet was for a week that never materialised under that number —
       once a later week has been played, settle it against the newest one */
    if(!games.length){
      if(gw>latest)return true;            // still in the future, leave it riding
      games=gamesInGw(latest);
      if(!games.length)return true;
    }
    const legs=bet.legs||[{pid:bet.pid,k:bet.k,odds:bet.odds}];
    let odds=1, allIn=true, anyPlayed=false;
    for(const leg of legs){
      const g=games.find(x=>[...(x.teamA||[]),...(x.teamB||[])].includes(leg.pid));
      if(!g)continue;                       // that player sat out: leg voids at 1.00
      anyPlayed=true;
      const hit=marketResult(leg.pid,g,leg.k);
      if(hit===false){allIn=false;break}
      if(hit===true)odds*=leg.odds;
    }
    if(!anyPlayed){                         // nobody on the slip played — full refund
      b.wallets[bet.by]=wallet(bet.by)+bet.stake;
      b.settled.unshift({...bet,res:'void',ret:bet.stake,when:Date.now()});
      done++; return false;
    }
    const ret=allIn?Math.round(bet.stake*odds):0;
    if(ret)b.wallets[bet.by]=wallet(bet.by)+ret;
    b.settled.unshift({...bet,res:allIn?'won':'lost',ret,
      settledOdds:Math.round(odds*100)/100,voided:legs.length-legsPlayed(legs,games),when:Date.now()});
    done++; return false;
  });
  b.settled=b.settled.slice(0,200);
  return done;
}
function legsPlayed(legs,games){
  return legs.filter(l=>games.some(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(l.pid))).length;
}
/* the best single return anyone has landed */
function biggestWins(n){
  return bets().settled.filter(x=>x.res==='won')
    .sort((a,b)=>(b.ret-b.stake)-(a.ret-a.stake)).slice(0,n||5);
}
function betTitle(x){
  const legs=x.legs||[{pid:x.pid,k:x.k}];
  if(legs.length===1)return `${esc((player(legs[0].pid)||{}).name||'—')} · ${esc(betLabel(legs[0].k))}`;
  const kind={2:'Double',3:'Treble',4:'Four-fold'}[legs.length]||`${legs.length}-fold`;
  return `<b>${kind}</b> · ${legs.length} selections`;
}
function legLines(x){
  const legs=x.legs||[];
  if(legs.length<2)return '';
  return `<div class="sb-legs">${legs.map(l=>
    `<span>${esc((player(l.pid)||{}).name||'—')} — ${esc(betLabel(l.k))} <i>${l.odds.toFixed(2)}</i></span>`).join('')}</div>`;
}
function pnl(pid){
  const h=bets().settled.filter(x=>x.by===pid&&x.res!=='void');
  const staked=h.reduce((t,x)=>t+x.stake,0);
  const back=h.reduce((t,x)=>t+(x.ret||0),0);
  const won=h.filter(x=>x.res==='won').length;
  const best=h.filter(x=>x.res==='won').sort((a,b)=>b.ret-a.ret)[0];
  return {staked,back,profit:back-staked,won,played:h.length,
          strike:h.length?Math.round(won/h.length*100):0,best};
}
/* Nobody sits out the season because they went bust — if you are broke with
   nothing riding, you can take a top-up. It is counted, so everyone can see. */
function isBroke(pid){
  const b=bets();
  return wallet(pid)<BET_RULES.min && !b.open.some(x=>x.by===pid);
}
async function takeBailout(){
  const me=fplMine(); if(!me)return;
  if(!isBroke(me.pid)){toast('You still have money to play with');return}
  const b=bets();
  if(!b.bailouts)b.bailouts={};
  b.bailouts[me.pid]=(b.bailouts[me.pid]||0)+1;
  b.wallets[me.pid]=wallet(me.pid)+BET_RULES.bailout;
  try{ if(!CLOUD_FAIL)await save() }catch(e){}
  haptic('success'); render();
  toast(`${usd(BET_RULES.bailout)} added — go steady this time`);
}
function bailoutCount(pid){ return (bets().bailouts||{})[pid]||0 }
function betTable(){
  const b=bets(), f=fpl();
  return (f.managers||[]).map(m=>{
    const open=b.open.filter(x=>x.by===m.pid).reduce((t,x)=>t+x.stake,0);
    const hist=b.settled.filter(x=>x.by===m.pid);
    const won=hist.filter(x=>x.res==='won').length;
    const P=pnl(m.pid);
    return {m,bal:wallet(m.pid),open,won,played:P.played,profit:P.profit,
            total:wallet(m.pid)+open};
  }).sort((a,b2)=>b2.profit-a.profit||b2.total-a.total);
}

let GTYPED='', GSOLVED=0, GTRIES=0;
function startGuess(){
  const pool=CAREERS.filter(c=>!GSEENP.includes(c.n));
  const use=pool.length?pool:(GSEENP=[],CAREERS);
  const pick=use[Math.floor(Math.random()*use.length)];
  GSEENP=[...GSEENP,pick.n];
  GUESS={n:pick.n,clubs:pick.c,hint:pick.h};
  GREVEAL=0; GUESSDONE=null; GTYPED=''; haptic('light'); render();
}
let GSEENP=[];
function revealMore(){ if(!GUESS)return; GREVEAL=1; haptic('light'); render(); }
/* forgiving matching — surnames, accents and spacing all count */
function normName(x){
  return String(x||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}
function guessMatches(typed,answer){
  const t=normName(typed), a=normName(answer);
  if(!t)return false;
  if(t===a)return true;
  const parts=a.split(' ');
  const surname=parts[parts.length-1];
  if(t===surname)return true;
  if(parts.length>2&&t===parts.slice(1).join(' '))return true;   // "van dijk"
  return false;
}
async function submitTyped(){
  if(!GUESS||GUESSDONE)return;
  const right=guessMatches(GTYPED,GUESS.n);
  GTRIES++;
  if(right){
    GSTREAK++; GSOLVED++; haptic('success');
    GUESSDONE={right:true};
    await postScore('whoami',GSTREAK,`best streak · ${GSOLVED} solved`);
  } else {
    GSTREAK=0; haptic('heavy'); GUESSDONE={right:false};
  }
  render();
}
function giveUpGuess(){ if(!GUESS)return; GSTREAK=0; GUESSDONE={right:false,gave:true}; render(); }

let BTAB='markets', BSLIP=[], BSTAKE=100, BPLAYER=null;
const BET_MAXLEGS=4;
const slipOdds=()=>BSLIP.reduce((t,x)=>t*x.odds,1);
function inSlip(pid,k){ return BSLIP.some(x=>x.pid===pid&&x.k===k) }
function clearSlip(){ BSLIP=[]; render() }
async function customStake(){
  const me=fplMine(); if(!me)return;
  const v=await askText('Stake',`Between ${usd(BET_RULES.min)} and ${usd(Math.min(BET_RULES.max,wallet(me.pid)))}`,String(BSTAKE),'Set');
  if(v===null)return;
  const n=Math.round(Number(String(v).replace(/[^0-9]/g,'')));
  if(!n||n<BET_RULES.min){toast(`Minimum stake is ${usd(BET_RULES.min)}`);return}
  BSTAKE=Math.min(n,BET_RULES.max,wallet(me.pid)); render();
}
function maxStake(){
  const me=fplMine(); if(!me)return;
  BSTAKE=Math.max(BET_RULES.min,Math.min(BET_RULES.max,wallet(me.pid)));
  haptic('light'); render();
}
function pickBet(pid,k){
  const at=BSLIP.findIndex(x=>x.pid===pid&&x.k===k);
  if(at>=0){ BSLIP.splice(at,1); haptic('light'); render(); return }
  /* one market per player per slip — you cannot back both sides of the same thing */
  if(BSLIP.some(x=>x.pid===pid)){ toast('One pick per player on a slip'); return }
  if(BSLIP.length>=BET_MAXLEGS){ toast(`Up to ${BET_MAXLEGS} selections`); return }
  const m=playerMarkets(pid).find(x=>x.k===k);
  if(!m)return;
  BSLIP.push({pid,k,odds:m.odds,l:m.l});
  haptic('light'); render();
}
/* The slip lives outside the main container: .main uses will-change:transform,
   which would otherwise make position:fixed resolve against it instead of the
   viewport, leaving the slip stranded at the bottom of the page. */
function paintSlip(){
  const el=$('#slipMount'); if(!el)return;
  if(VIEW!=='bets'||!BSLIP.length){el.innerHTML='';return}
  el.innerHTML=`<div class="sb-slip">
      <div class="sb-slip-h">
        <b>${BSLIP.length===1?'Single':({2:'Double',3:'Treble',4:'Four-fold'}[BSLIP.length])}</b>
        <span class="sb-slip-odds">${slipOdds().toFixed(2)}</span>
        <button class="sb-clear" onclick="clearSlip()">Clear</button>
      </div>
      <div class="sb-picks">${BSLIP.map(x=>`
        <div class="sb-pk"><span>${esc((player(x.pid)||{}).name||'')} — ${esc(x.l)}</span>
          <b>${x.odds.toFixed(2)}</b>
          <button onclick="pickBet('${x.pid}','${x.k}')">✕</button></div>`).join('')}</div>
      <div class="sb-stake">
        ${[50,100,250,500].map(v=>`<button class="${BSTAKE===v?'on':''}" onclick="BSTAKE=${v};render()">${usd(v)}</button>`).join('')}
        <button onclick="customStake()">Custom</button>
        <button onclick="maxStake()">Max</button>
      </div>
      <div class="sb-slip-b">
        <div>Returns <b>${usd(BSTAKE*slipOdds())}</b></div>
        <button class="btn pri" onclick="placeBet()">Place ${usd(BSTAKE)}</button>
      </div>
      ${BSLIP.length<BET_MAXLEGS?`<div class="sb-tip">Add up to ${BET_MAXLEGS} selections — the odds multiply.</div>`:''}
    </div>`;
}

/* ---------- FIRSTS, appended to the Records tab ---------- */
function histFirsts(){
  const gs=allTimeGames?allTimeGames():allGames();
  if(!gs.length)return '';
  const rows=[];
  const g0=gs[0];
  rows.push(['🌅','First ever game',`${fdate(g0.date)} · ${g0.scoreA}–${g0.scoreB}`]);
  const fg=gs.find(g=>Object.keys(g.goals||{}).length);
  if(fg){const pid=Object.keys(fg.goals)[0];
    rows.push(['⚽','First ever goal',`${(player(pid)||{}).name||'—'} · ${fdate(fg.date)}`])}
  const fh=gs.find(g=>Object.values(g.goals||{}).some(n=>n>=3));
  if(fh){const pid=Object.entries(fh.goals).find(([,n])=>n>=3)[0];
    rows.push(['⚡','First hat-trick',`${(player(pid)||{}).name||'—'} · ${fdate(fh.date)}`])}
  const fc=gs.find(g=>g.scoreA===0||g.scoreB===0);
  if(fc)rows.push(['🧤','First shut-out',`${fdate(fc.date)} · ${fc.scoreA}–${fc.scoreB}`]);
  const fd=gs.find(g=>g.result==='D');
  if(fd)rows.push(['🤝','First draw',`${fdate(fd.date)} · ${fd.scoreA}–${fd.scoreB}`]);
  return `<div class="sechead">Firsts</div>
    <div class="card">${rows.map(([e,t,d])=>`
      <div class="row"><div style="font-size:20px;flex:0 0 26px">${e}</div>
        <div class="rt"><div class="r1">${t}</div><div class="r2">${esc(d)}</div></div></div>`).join('')}</div>`;
}

    <p>Records build up as you play. Come back after a few games.</p></div>`;
  const top=(k,fmt)=>{const a=[...lt].filter(x=>x[k]>0).sort((p,q)=>q[k]-p[k])[0];
    return a?{n:a.name,v:fmt?fmt(a[k]):a[k]}:null};
  const runW=[...lt].map(x=>({n:x.name,v:longestRun(x.seq,r=>r==='W')})).sort((a,b)=>b.v-a.v)[0];
  const runU=[...lt].map(x=>({n:x.name,v:longestRun(x.seq,r=>r!=='L')})).sort((a,b)=>b.v-a.v)[0];

  games.forEach(({g,s})=>{

    ${card('💥','Biggest win',big?`${Math.max(big.a,big.b)}–${Math.min(big.a,big.b)}`:'—',big?fdate(big.date):'')}

  </div>
  <div class="sechead">Lifetime table</div>
  <div class="card"><div class="tw"><table class="sticky">

/* ---------- RIVALRIES ---------- */
function rivalries(minGames){
  const min=minGames||3;
  const ids=season().players.map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, m={};
  allGames().forEach(g=>{
    const A=(g.teamA||[]).filter(x=>ids.includes(x)), B=(g.teamB||[]).filter(x=>ids.includes(x));
    A.forEach(a=>B.forEach(b=>{
      const k=key(a,b); if(!m[k])m[k]={a:a<b?a:b,b:a<b?b:a,aw:0,bw:0,d:0,P:0};
      const e=m[k]; e.P++;
      if(g.result==='D')e.d++;
      else{
        const winnerOnA=g.result==='A';
        const aOnA=A.includes(e.a);
        const aWon=(winnerOnA&&aOnA)||(!winnerOnA&&!aOnA);
        aWon?e.aw++:e.bw++;
      }
    }));
  });
  return Object.values(m).filter(x=>x.P>=min)
    .map(x=>({...x,gap:Math.abs(x.aw-x.bw),
      heat:Math.round((1-Math.abs(x.aw-x.bw)/Math.max(x.aw+x.bw,1))*100)}))
    .sort((p,q)=>q.P-p.P).sort((p,q)=>p.gap-q.gap||q.P-p.P);
}
function histRivals(){
  const rv=rivalries(3);
  if(!rv.length)return `<div class="empty"><div class="ee">⚔️</div><h3>No rivalries yet</h3>
    <p>Once two players have faced each other three times, the closest match-ups show up here.</p></div>`;
  const top=rv.slice(0,10);
  return `<div class="note" style="padding:0 4px 12px">The tightest head-to-heads in the group — closest record first.</div>
    ${top.map((x,i)=>{
      const a=player(x.a),b=player(x.b); if(!a||!b)return '';
      const tot=Math.max(x.aw+x.bw,1);
      return `<div class="card rival" style="margin-bottom:10px">
        <div class="rv-h">${i===0?'🔥 Closest rivalry':`${x.P} meetings`}</div>
        <div class="rv-b">
          <div class="rv-p" onclick="openPlayer('${a.id}')">${avatar(a,38)}<span>${esc(a.name)}</span></div>
          <div class="rv-s"><b>${x.aw}</b><span>–</span><b>${x.bw}</b>
            ${x.d?`<div class="rv-d">${x.d} draw${x.d===1?'':'s'}</div>`:''}</div>
          <div class="rv-p right" onclick="openPlayer('${b.id}')">${avatar(b,38)}<span>${esc(b.name)}</span></div>
        </div>
        <div class="rv-bar"><i style="width:${Math.round(x.aw/tot*100)}%"></i></div>
        <div class="rv-f">${x.aw===x.bw?'Dead level':`${esc(x.aw>x.bw?a.name:b.name)} leads by ${x.gap}`} · ${x.P} games</div>
      </div>`}).join('')}`;
}

/* ---------- MOST IMPROVED ---------- */
function histImproved(){
  const g=allGames(); if(g.length<6)return `<div class="empty"><div class="ee">📈</div><h3>Not enough games</h3>
    <p>Once the season is a few weeks old you'll see who has kicked on.</p></div>`;
  const half=Math.floor(g.length/2);
  const calc=list=>{const m={};
    list.forEach(x=>{
      [['A',x.teamA],['B',x.teamB]].forEach(([sd,t])=>(t||[]).forEach(pid=>{
        const e=m[pid]=m[pid]||{P:0,pts:0,G:0};
        e.P++; e.G+=(x.goals&&x.goals[pid])||0;
        if(x.result==='D')e.pts++; else if(x.result===sd)e.pts+=3;
      }));
    });
    return m};
  const first=calc(g.slice(0,half)), second=calc(g.slice(half));
  const rows=[];
  season().players.forEach(p=>{
    const f=first[p.id],s2=second[p.id];
    if(!f||!s2||f.P<2||s2.P<2)return;
    const fp=f.pts/f.P, sp=s2.pts/s2.P;
    rows.push({id:p.id,name:p.name,before:fp,after:sp,diff:sp-fp,
      gBefore:f.G/f.P,gAfter:s2.G/s2.P});
  });
  if(!rows.length)return `<div class="empty"><div class="ee">📈</div><h3>Not enough data</h3>
    <p>Players need at least two games in each half of the season.</p></div>`;
  rows.sort((a,b)=>b.diff-a.diff);
  const up=rows.filter(r=>r.diff>0).slice(0,5), down=rows.filter(r=>r.diff<0).slice(-5).reverse();
  const row=r=>`<div class="row tap" onclick="openPlayer('${r.id}')">
    <div class="rt"><div class="r1" style="font-size:15px">${esc(r.name)}</div>
      <div class="r2">${r.before.toFixed(2)} → ${r.after.toFixed(2)} points per game</div></div>
    <div class="rv" style="font-weight:800;color:${r.diff>0?'var(--green)':'var(--red)'}">
      ${r.diff>0?'▲':'▼'} ${Math.abs(r.diff).toFixed(2)}</div></div>`;
  return `<div class="note" style="padding:0 4px 12px">Comparing the first half of the season with the second — who has kicked on?</div>
    ${up.length?`<div class="sechead">📈 Kicked on</div><div class="card">${up.map(row).join('')}</div>`:''}
    ${down.length?`<div class="sechead">📉 Tailed off</div><div class="card">${down.map(row).join('')}</div>`:''}
    <div class="note">Minimum two games in each half.</div>`;
}

/* ============ CHEMISTRY ============ */
/* How often two players win when they're on the SAME team. */
function chemPairs(minGames){
  const min=minGames||2, g=allGames(), ids=season().players.filter(p=>p.active!==false).map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, map={};
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,team])=>{
      const t=(team||[]).filter(id=>ids.includes(id));
      for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
        const k=key(t[i],t[j]); if(!map[k])map[k]={a:t[i],b:t[j],P:0,W:0,D:0,L:0};
        map[k].P++;
        if(x.result==='D')map[k].D++; else if(x.result===sd)map[k].W++; else map[k].L++;
      }});
  });
  return Object.values(map).filter(p=>p.P>=min).map(p=>({...p,
    wr:p.W/p.P, pts:p.W*3+p.D, ppg:(p.W*3+p.D)/p.P,
    chem:Math.round(((p.W*3+p.D)/p.P)/3*100)   // 0-100 chemistry score
  })).sort((x,y)=>y.chem-x.chem||y.P-x.P);
}
function chemColor(v){
  if(v>=75)return '#30D158'; if(v>=60)return '#9ACD32'; if(v>=45)return '#FFD60A';
  if(v>=30)return '#FF9F0A'; return '#FF453A';
}
function statChem(){
  const pairs=chemPairs(CHEMMIN);
  if(!pairs.length)return `<div class="empty"><div class="ee">🔗</div><h3>Not enough data yet</h3>
    <p>Once players have shared a team a few times, their chemistry shows up here.</p></div>`;
  const best=pairs.slice(0,6), worst=pairs.slice(-6).reverse().filter(p=>!best.includes(p));
  const roster=season().players.filter(p=>p.active!==false)
    .filter(p=>pairs.some(x=>x.a===p.id||x.b===p.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const find=(a,b)=>pairs.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
  return `
    <div class="chips" style="margin-bottom:12px">
      ${[2,3,5].map(n=>`<button class="${CHEMMIN===n?'on':''}" onclick="CHEMMIN=${n};render()">${n}+ together</button>`).join('')}
    </div>
    <div class="grid g2">
      <div><div class="sechead">Best partnerships</div>
        <div class="card">${best.map(p=>chemRow(p)).join('')}</div></div>
      ${worst.length?`<div><div class="sechead">Struggle together</div>
        <div class="card">${worst.map(p=>chemRow(p)).join('')}</div></div>`:''}
    </div>
    <div class="sechead">Chemistry matrix</div>
    <div class="cm-legend">
      <span class="cm-sw" style="background:${chemColor(20)}"></span><i>poor</i>
      <span class="cm-sw" style="background:${chemColor(50)}"></span><i>even</i>
      <span class="cm-sw" style="background:${chemColor(80)}"></span><i>strong</i>
      <span class="cm-sw cm-none"></span><i>never together</i>
    </div>
    <div class="card cm-wrap"><div class="tw"><table class="chemgrid cm">
      <thead><tr><td class="cg-corner"></td>${roster.map(p=>`
        <td class="cg-h" title="${esc(p.name)}">
          <span class="cg-av">${avatar(p,20)}</span>
          <span>${esc(p.name.slice(0,3))}</span></td>`).join('')}</tr></thead>
      <tbody>${roster.map(r=>{
        const mine=roster.map(c=>r.id===c.id?null:find(r.id,c.id)).filter(Boolean);
        const avg=mine.length?Math.round(mine.reduce((t,x)=>t+x.chem,0)/mine.length):null;
        return `<tr>
        <td class="cg-n"><span class="cg-av">${avatar(r,20)}</span><b>${esc(r.name.split(' ')[0])}</b>
          ${avg!=null?`<i>${avg}</i>`:''}</td>
        ${roster.map(c=>{
          if(r.id===c.id)return '<td class="cg-x"></td>';
          const pr=find(r.id,c.id);
          if(!pr)return '<td class="cg-e"></td>';
          const strong=pr.chem>=65||pr.chem<=35;
          return `<td class="cg-c ${strong?'hot':''}" style="background:${chemColor(pr.chem)}"
            onclick="toast('${esc(r.name)} + ${esc(c.name)}: ${pr.W}W-${pr.D}D-${pr.L}L in ${pr.P} — chem ${pr.chem}')">${pr.chem}</td>`;
        }).join('')}</tr>`}).join('')}</tbody></table></div></div>
    <div class="scrollhint">← swipe the matrix sideways →</div>
    <div class="note">Chemistry is points-per-game when two players are on the same team, scaled to 100. Tap a square for the record. Only pairs with ${CHEMMIN}+ games together are shown.</div>`;
}
function chemRow(p){
  const a=player(p.a),b=player(p.b); if(!a||!b)return '';
  return `<div class="row"><div class="rt">
    <div class="r1" style="font-size:15px">${esc(a.name)} <span style="color:var(--label3)">+</span> ${esc(b.name)}</div>

}

let SORT={k:'pts',d:-1},PF='ALL',SMODE='table',SMIN=0,SCOMP='all',CHEMMIN=2;
function statsPool(){
  const games=SCOMP==='all'?allGames():compGames(SCOMP);
  let st=statsFor(games).filter(x=>x.P>0);
  if(PF!=='ALL')st=st.filter(x=>x.pos===PF);
  if(SMIN>0)st=st.filter(x=>x.P>=SMIN);
  const total=games.length;
  st.forEach(x=>{
    x.app=total?x.P/total:0;
    x.gi=x.G;                                   // goal involvement (goals recorded)
    x.ptsShare=0; x.csr=x.P?x.cs/x.P:0;
    x.gdpg=x.P?x.GD/x.P:0;
  });
  const totPts=st.reduce((t,x)=>t+x.pts,0)||1;
  st.forEach(x=>x.ptsShare=x.pts/totPts);
  return {st,total};
}

    ${spark(m,col)}
    <div class="note" style="padding:4px 0 0">Cumulative points across the last ${Math.min(m.seq.length,12)} games.</div></div>`;
  return line(a,'var(--tint)')+line(b,'var(--blue)');
}

function togetherStat(x,y){let tog=0,togW=0,vs=0,aw=0,bw=0;
  allGames().forEach(g=>{const A=g.teamA||[],B=g.teamB||[];
    const xa=A.includes(x),xb=B.includes(x),ya=A.includes(y),yb=B.includes(y);
    if(!(xa||xb)||!(ya||yb))return;
    if((xa&&ya)||(xb&&yb)){tog++;if(g.result===(xa?'A':'B'))togW++}
    else{vs++;if(g.result===(xa?'A':'B'))aw++;else if(g.result===(ya?'A':'B'))bw++}});
  return{tog,togW,vs,aw,bw}}

async function clearBoard(){const b=board();b[b.side||'A']={};if(b.pos)b.pos[b.side||'A']={};await saveBoard();paintTac()}
async function autoFillBoard(){
  const b=board(),side=b.side||'A',f=fmById(b.fid);
  const other=side==='A'?'B':'A';
  const taken=Object.values(b[other]||{}).filter(Boolean);
  const order={GK:0,DEF:1,MID:2,ATT:3};
  const pool=[...season().players].filter(p=>p.active!==false&&!taken.includes(p.id));
  const used=new Set(); const out={};
  f.slots.forEach((sl,i)=>{
    const want=sl[2];
    let pick=pool.find(p=>!used.has(p.id)&&p.pos===want);
    if(!pick)pick=pool.find(p=>!used.has(p.id)&&Math.abs((order[p.pos]??2)-(order[want]??2))===1);
    if(!pick)pick=pool.find(p=>!used.has(p.id));
    if(pick){used.add(pick.id);out[i]=pick.id}
  });
  b[side]=out; await saveBoard(); paintTac(); toast('Line-up filled by position');
}
function wireBoard(){
  const pitch=$('#pitch'); if(!pitch)return;
  const b=board(),side=b.side||'A';
  pitch.querySelectorAll('.tok').forEach(tok=>{
    const slot=+tok.dataset.slot;
    let dragging=false,moved=false,sx=0,sy=0,rect=null,raf=0,lastX=0,lastY=0;
    const put=(cx,cy)=>{
      const x=Math.max(5,Math.min(95,((cx-rect.left)/rect.width)*100));
      const y=Math.max(5,Math.min(95,((cy-rect.top)/rect.height)*100));
      return [x,y];
    };
    tok.addEventListener('pointerdown',e=>{
      dragging=true;moved=false;sx=e.clientX;sy=e.clientY;
      rect=pitch.getBoundingClientRect();          // measured once per drag, not per move
      tok.setPointerCapture(e.pointerId);
      tok.classList.add('drag');
      e.preventDefault();
    });
    tok.addEventListener('pointermove',e=>{
      if(!dragging)return;
      if(!moved&&Math.abs(e.clientX-sx)<5&&Math.abs(e.clientY-sy)<5)return;
      moved=true; lastX=e.clientX; lastY=e.clientY;
      if(raf)return;                                // coalesce to one update per frame
      raf=requestAnimationFrame(()=>{
        raf=0; const [x,y]=put(lastX,lastY);
        tok.style.left=x+'%'; tok.style.top=y+'%';
      });
    });
    const finish=async e=>{
      if(!dragging)return; dragging=false;
      if(raf){cancelAnimationFrame(raf);raf=0}
      tok.classList.remove('drag');
      try{tok.releasePointerCapture(e.pointerId)}catch(_){}
      if(moved){
        const [x,y]=put(e.clientX??lastX,e.clientY??lastY);
        if(!b.pos)b.pos={}; if(!b.pos[side])b.pos[side]={};
        b.pos[side][slot]=[Math.round(x),Math.round(y)];
        tok.style.left=Math.round(x)+'%'; tok.style.top=Math.round(y)+'%';
        await saveBoard();                          // no repaint — the token is already where it should be
      } else {
        if(TSEL){ b[side][slot]=TSEL; TSEL=null; await saveBoard(); paintTac(); }
        else if(b[side][slot]){ delete b[side][slot]; await saveBoard(); paintTac(); }
        else { toast('Pick a player from the list first'); }
      }
    };
    tok.addEventListener('pointerup',finish);
    tok.addEventListener('pointercancel',finish);
  });
}

function tacBalance(){

        return `<div class="card"><div style="padding:13px 15px 4px;font-weight:700;font-size:15px;color:${sd==='A'?'var(--tint)':'var(--blue)'}">
          Team ${sd} <span style="float:right;font-size:12px;color:var(--label2)">${strength.toFixed(1)}</span></div>
          ${team.map(p=>`<div class="row" style="padding:9px 15px">${avatar(p,28)}
            <div class="rt"><div class="r1" style="font-size:14.5px">${esc(p.name)}${p.pos?` <span class="pill ${p.pos}">${p.pos}</span>`:''}</div></div></div>`).join('')}
        </div>`}).join('')}</div>
      <div class="note">Balance gap: <b>${Math.abs(r.sa-r.sb).toFixed(2)}</b> — the lower the number, the more even the sides. Shuffle again for a different split.</div>
      <button class="btn sec full sm" onclick="doBalance()">🔀 Shuffle again</button>`:''}`;

function balTog(id){BAL.sel.has(id)?BAL.sel.delete(id):BAL.sel.add(id);paintTac()}
function balAll(){season().players.filter(p=>p.active!==false).forEach(p=>BAL.sel.add(p.id));paintTac()}
function balNone(){BAL.sel.clear();BAL.done=null;paintTac()}
function doBalance(){
  const ids=[...BAL.sel]; if(ids.length<2){toast('Pick at least two players');return}
  const st=statsAll();
  const rate=id=>{const m=st.find(x=>x.id===id);if(!m||!m.P)return 1.0;
    return Math.max(.3,Math.min(3, m.ppg*0.55 + m.gpg*0.8 + m.wr*1.2))};
  let best=null;
  for(let attempt=0;attempt<400;attempt++){
    const sh=[...ids].sort(()=>Math.random()-.5);
    const A=[],B=[];let sa=0,sb=0;
    // greedy with jitter: strongest available to the weaker side
    sh.sort((x,y)=>rate(y)-rate(x));
    sh.forEach(id=>{ if(sa<=sb){A.push(id);sa+=rate(id)}else{B.push(id);sb+=rate(id)} });
    if(Math.abs(A.length-B.length)>1)continue;
    const gap=Math.abs(sa-sb);
    if(!best||gap<best.gap)best={A,B,sa,sb,gap};
    if(gap<0.05)break;
  }
  if(!best){toast('Could not split those players');return}
  BAL.done={A:best.A.map(player).filter(Boolean),B:best.B.map(player).filter(Boolean),sa:best.sa,sb:best.sb};
  paintTac(); toast('Teams balanced');
}

/* ============ LEAGUE (table + season history) ============ */
/* ---- league zones, Premier League style ----
   1 champion · 2-5 Champions League · 6-7 Europa · bottom 3 relegation.
   Zones scale down sensibly for small leagues so they never overlap. ---- */
function zoneOf(i,total){
  const z=zoneBands(total),pos=i+1;
  if(pos===1)return 'z-champ';
  if(z.rel&&pos>=z.rel)return 'z-rel';
  if(pos<=z.ucl)return 'z-ucl';
  if(z.eur&&pos<=z.eur)return 'z-eur';
  if(z.con&&pos<=z.con)return 'z-con';
  return '';
}
/* Premier League shape, scaled to however many players you have:
   1 champion · UCL · Europa · Conference · bottom 3 relegated. */
function zoneBands(total){
  const ucl=Math.min(5,Math.max(2,Math.floor(total*0.28)));
  const eur=total>=8?Math.min(7,ucl+2):0;
  const con=total>=10?Math.min(8,eur+1):0;
  const rel=total>=8?total-2:0;
  // never let the european places collide with the drop zone
  const cap=rel?rel-1:total;
  return {ucl:Math.min(ucl,cap), eur:eur?Math.min(eur,cap):0, con:con?Math.min(con,cap):0, rel};
}
function leagueKey(total){
  const z=zoneBands(total);
  const items=[['z-champ','Champion','1']];
  if(z.ucl>=2)items.push(['z-ucl','Champions League',`2–${z.ucl}`]);
  if(z.eur>z.ucl)items.push(['z-eur','Europa League',z.eur===z.ucl+1?`${z.eur}`:`${z.ucl+1}–${z.eur}`]);
  if(z.con>z.eur)items.push(['z-con','Conference League',z.con===z.eur+1?`${z.con}`:`${z.eur+1}–${z.con}`]);
  if(z.rel)items.push(['z-rel','Relegation',`${z.rel}–${total}`]);
  return `<div class="lgkey">${items.map(([c,l,r])=>`<div class="lgkey-i">
    <span class="lgkey-d ${c}"></span><span class="lgkey-l">${l}</span><span class="lgkey-r">${r}</span></div>`).join('')}</div>`;
}

function newGame(){if(!requireAdmin())return;
  const cid=(comp().type==='league'?comp().id:lgComp().id);

     A:new Set(),B:new Set(),fillA:[],fillB:[],goals:{},sa:0,sb:0,q:'',__sel:new Set()};

function openGame(id){if(!requireAdmin())return;const g=season().games.find(x=>x.id===id);if(!g)return;
  G={id:g.id,compId:g.compId,date:g.date,round:g.round||'',A:new Set(g.teamA||[]),B:new Set(g.teamB||[]),
     fillA:[...(g.fillA||[])],fillB:[...(g.fillB||[])],goals:{...(g.goals||{})},

function gameSheet(){

const sideOf=pid=>G.A.has(pid)?'A':G.B.has(pid)?'B':'';
function setSide(pid,sd){
  G.A.delete(pid);G.B.delete(pid);
  if(sd)G[sd].add(pid);else delete G.goals[pid];
  paintGame()}
const teamCount=sd=>G[sd].size+G['fill'+sd].length;
const goalSum=sd=>[...G[sd]].reduce((t,p)=>t+(G.goals[p]||0),0);
function paintGame(){ return keepFocus(()=>_paintGame()); }
function _paintGame(){

  const teamCol=sd=>sd==='A'?'var(--tint)':'var(--blue)';

      <div class="pgteam-body">
        ${ids.length||fills.length?`${ids.map(id=>chip(player(id),sd.toLowerCase())).join('')}
          ${fills.map((n,fi)=>`<button class="pgchip fill" onclick="rmFiller('${sd}',${fi})">
            <span class="fillav">👤</span><span>${esc(n)}</span><i class="x">✕</i></button>`).join('')}`
        :`<div class="pgteam-empty">${G.__sel.size?`Tap “Add ${G.__sel.size}” below`:'Pick players below, then add them here'}</div>`}
      </div>

    </div>`;
  };
  $('#gb').innerHTML=`
    <div class="lbl">Competition</div>
    <div class="chips">${comps().map(c=>`<button class="${c.id===G.compId?'on':''}" onclick="pickComp('${c.id}')">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
    <div class="grid g2" style="margin-top:14px">

    <div class="btnrow" style="margin:10px 0 4px">
      <button class="btn sec sm" onclick="autoSplit()">⚖️ Auto-split</button>
      <button class="btn sec sm" onclick="clearTeams()">Clear all</button>
    </div>

    <div class="lbl">Available
      <span style="text-transform:none;font-weight:400;color:var(--label3)">tap as many as you like, then add them to a team</span></div>
    <input class="search" placeholder="Search players…" value="${esc(G.q||'')}" oninput="G.q=this.value;paintGame()" id="gq">
    ${pool.length?`<div class="btnrow" style="margin:9px 0 0">
      <button class="btn sec sm" onclick="pgSelectAll()">${pool.every(p=>G.__sel.has(p.id))?'Deselect all':`Select all ${pool.length}`}</button>
      ${G.__sel.size?`<button class="btn sec sm" onclick="pgClearSel()">Clear ${G.__sel.size}</button>`:''}
    </div>`:''}
    ${G.__sel.size?`<div class="pgselbar">
      <span><b>${G.__sel.size}</b> selected</span>
      <span class="pgselbtns">
        <button onclick="pgPlace('A')">Add to A</button>
        <button class="b" onclick="pgPlace('B')">Add to B</button>
      </span></div>`:''}
    <div class="pgpool">
      ${pool.length?pool.map(p=>`<button class="pgchip ${G.__sel.has(p.id)?'sel':''}" onclick="pgSelect('${p.id}')">
        ${avatar(p,26)}<span>${esc(p.name.split(' ')[0])}</span>${G.__sel.has(p.id)?'<i class="tick">✓</i>':''}</button>`).join('')
      :`<div class="note" style="padding:8px 4px">${q?'No players match.':'Everyone\'s been placed.'}</div>`}
    </div>
    <div class="note" style="padding:8px 4px 0">Fillers are one-off guests — they make the teams add up but don't join the squad or the table.</div>

    <div class="lbl">Score</div>
    <div class="pgscore">
      <div class="pgscore-t" style="--tc:var(--tint)">
        <div class="pgscore-l">Team A</div>

      <div class="pgscore-x">–</div>

    </div>
    <div style="text-align:center;padding:12px 0 2px;font-size:15px;font-weight:600;color:var(--label2)">
      ${G.sa===G.sb?'Draw — 1 point each':`Team ${G.sa>G.sb?'A':'B'} wins — 3 points`}</div>

    ${(G.A.size||G.B.size)?`<div class="lbl">Who scored? <span style="text-transform:none;font-weight:400;color:var(--label3)">optional</span></div>
      ${mismatch?`<div class="warn">⚠️ Goals don't add up to the score — A ${gA}/${G.sa}, B ${gB}/${G.sb}. You can fix it or save anyway.</div>`:''}
      <div class="card">${[...G.A,...G.B].map(pid=>{const p=player(pid),n=G.goals[pid]||0;
        return `<div class="row"><div class="rt"><div class="r1" style="font-size:15px">${esc(p?p.name:'')}
          <span style="font-size:11px;font-weight:700;color:${G.A.has(pid)?'var(--tint)':'var(--blue)'}">${G.A.has(pid)?'A':'B'}</span></div></div>
          <div class="gstep"><button onclick="setGoal('${pid}',-1)">−</button><span class="gv">${n}</span><button onclick="setGoal('${pid}',1)">+</button></div></div>`}).join('')}</div>
      <div class="note">Attributed: A ${gA} · B ${gB}${(G.fillA.length||G.fillB.length)?' (fillers\' goals go unattributed)':''}</div>`:''}

    ${(G.sa||G.sb||G.A.size||G.B.size)?`<div class="lbl">Match report</div>
      <div class="card pad report">${esc(matchReport({scoreA:G.sa,scoreB:G.sb,teamA:[...G.A],teamB:[...G.B],
        fillA:G.fillA,fillB:G.fillB,goals:G.goals}))}</div>`:''}
    ${G.id?`<button class="btn dan full" style="margin-top:18px" onclick="deleteGame()">Delete this game</button>`:''}
    <div class="formbar">
      <button class="btn sec" onclick="closeSheet()">Cancel</button>
      <button class="btn pri" onclick="saveGame()">${G.id?'Save changes':'Save game'}</button>
    </div><div style="height:6px"></div>`;
  const el=$('#gq');if(el&&G.q){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function pgSelect(pid){
  // already on a team? tapping takes them off. Otherwise toggle them in the selection.
  if(G.A.has(pid)||G.B.has(pid)){setSide(pid,'');return}
  G.__sel.has(pid)?G.__sel.delete(pid):G.__sel.add(pid);paintGame()}
function pgPlace(sd){
  if(!G.__sel.size)return;
  const ids=[...G.__sel]; G.__sel.clear();
  ids.forEach(pid=>{G.A.delete(pid);G.B.delete(pid);G[sd].add(pid)});
  paintGame(); toast(`${ids.length} added to Team ${sd}`);}
function pgSelectAll(){
  const all=season().players.filter(p=>p.active!==false&&!G.A.has(p.id)&&!G.B.has(p.id));
  const q=(G.q||'').toLowerCase().trim();
  const pool=q?all.filter(p=>p.name.toLowerCase().includes(q)):all;
  const everyone=pool.every(p=>G.__sel.has(p.id));
  pool.forEach(p=>everyone?G.__sel.delete(p.id):G.__sel.add(p.id));
  paintGame()}
function pgClearSel(){G.__sel.clear();paintGame()}
function pickComp(cid){G.compId=cid;if(!G.id)G.round=nextRound(cid);paintGame()}
function clearTeams(){G.A.clear();G.B.clear();G.fillA=[];G.fillB=[];G.goals={};paintGame()}
async function addFiller(sd){
  const n=await askText('Add a filler','Just for this game — they won\'t join the squad.','','Add');
  if(n===null)return;G['fill'+sd].push(n||'Filler');await 0;paintGame()}
function rmFiller(sd,i){G['fill'+sd].splice(i,1);paintGame()}
function autoSplit(){
  const ids=[...G.A,...G.B];
  if(ids.length<2){toast('Pick some players first');return}
  const st=statsAll(),r=ids.map(id=>({id,v:(st.find(x=>x.id===id)||{}).ppg||0})).sort((a,b)=>b.v-a.v);
  G.A.clear();G.B.clear();r.forEach((x,i)=>{(i%4===0||i%4===3?G.A:G.B).add(x.id)});paintGame();toast('Split by form')}
function setScore(sd,d){if(sd==='A')G.sa=Math.max(0,G.sa+d);else G.sb=Math.max(0,G.sb+d);paintGame()}
function setGoal(pid,d){G.goals[pid]=Math.max(0,(G.goals[pid]||0)+d);if(!G.goals[pid])delete G.goals[pid];
  const sd=G.A.has(pid)?'A':'B',t=goalSum(sd);
  if(sd==='A'&&t>G.sa)G.sa=t;if(sd==='B'&&t>G.sb)G.sb=t;paintGame()}
async function saveGame(){if(!requireAdmin())return;
  snapshot(G.id?'editing a game':'logging a game');
  const _lvlBefore=levelSnapshot();
  if(!teamCount('A')||!teamCount('B')){toast('Both teams need at least one player');return}
  const gA=goalSum('A'),gB=goalSum('B');
  if((gA>0||gB>0)&&(gA!==G.sa||gB!==G.sb)){
    const c=await askChoice('Goals don\'t match the score',
      `Score is ${G.sa}–${G.sb} but you've credited ${gA}–${gB} in goals.`,
      [{label:`Use the goals (${gA}–${gB})`,value:'goals'},{label:`Keep the score (${G.sa}–${G.sb})`,value:'score'}]);
    if(!c)return;
    if(c==='goals'){G.sa=gA;G.sb=gB}
  }
  const S=season();
  const posSnap={}; [...G.A,...G.B].forEach(pid=>{const pl=player(pid); if(pl)posSnap[pid]=pl.pos||'MID'});
  const g={id:G.id||uid(),compId:G.compId,created:G.id?(S.games.find(x=>x.id===G.id)?.created||Date.now()):Date.now(),
    date:G.date,round:(G.round||'').trim(),teamA:[...G.A],teamB:[...G.B],fillA:[...G.fillA],fillB:[...G.fillB],
    pos:posSnap,goals:{...G.goals},scoreA:G.sa,scoreB:G.sb,result:G.sa>G.sb?'A':G.sb>G.sa?'B':'D'};
  if(G.id)S.games[S.games.findIndex(x=>x.id===G.id)]=g;else S.games.push(g);
  await save();closeSheet();
  const i=allGames().findIndex(x=>x.id===g.id),ms=feed().filter(e=>e.i===i);
  render();
  recordOvr();
  try{await fplAfterGame()}catch(e){}
  try{ payWages(); settleBets();
    const sp=paySponsors();
    if(sp.length)setTimeout(()=>toast(`🤝 ${sp.map(x=>`${x.name} — ${usd(x.pay)} from ${x.n}`).join(' · ')}`),1400);
  }catch(e){}
  const _ups=levelUps(_lvlBefore);
  logEntry(G.id?'edit':'add',`${G.id?'Edited':'Logged'} ${G.round||'a game'} \u2014 ${G.sa}\u2013${G.sb}`);
  if(_ups.length){ setTimeout(()=>celebrate(_ups),260); }
  else if(ms.length){const p=player(ms[0].pid);toast(`${ms[0].e} ${p?p.name:''} — ${ms[0].t}!`)}
  else toast(G.id?'Game saved':'Game logged')}
async function deleteGame(){if(!requireAdmin())return;
  snapshot('deleting a game');if(!await askConfirm('Delete game?','This removes it and its stats permanently.','Delete',true))return;
  const S=season();S.games=S.games.filter(x=>x.id!==G.id);logEntry('delete',`Deleted ${G.round||'a game'}`);fplResync();await save();closeSheet();render();toast('Game deleted')}

async function drawBracket(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  if(c.bracket&&!await askConfirm('Redraw bracket?','Existing results will be cleared.','Redraw',true))return;
  const sh=[...ids].sort(()=>Math.random()-.5);
  c.bracket=buildBracket(sh);await save();render();toast('⚔️ Bracket drawn')}
async function drawGroups(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  const n=await askChoice('How many groups?','',[{label:'2 groups',value:2},{label:'3 groups',value:3},{label:'4 groups',value:4}]);
  if(!n)return;
  const sh=[...ids].sort(()=>Math.random()-.5),gk='ABCDEFGH'.slice(0,n).split(''),gr={};
  gk.forEach(k=>gr[k]=[]);sh.forEach((id,i)=>gr[gk[i%n]].push(id));
  c.groups=gr;c.advance=2;
  c.fixtures=[];gk.forEach(k=>roundRobin(gr[k]).forEach(f=>c.fixtures.push({...f,g:k})));
  delete c.bracket;await save();render();toast(`🌍 ${n} groups drawn · ${c.fixtures.length} fixtures`)}
async function drawKOFromGroups(){if(!requireAdmin())return;
  const c=comp();if(!c.groups){toast('Draw the groups first');return}
  if(c.bracket&&!await askConfirm('Redraw knockout?','Existing knockout results will be cleared.','Redraw',true))return;
  const adv=c.advance||2,q=[];
  Object.keys(c.groups).sort().forEach(k=>groupTable(c,k).slice(0,adv).forEach((r,i)=>q.push({id:r.id,g:k,pos:i})));
  if(q.length<2){toast('Not enough qualified teams');return}
  const w=q.filter(x=>x.pos===0),r=q.filter(x=>x.pos>0).reverse();
  c.bracket=buildBracket([...w,...r].map(x=>x.id));await save();render();toast('⚔️ Knockout drawn')}
async function resetComp(){if(!requireAdmin())return;const c=comp();
  if(!await askConfirm('Reset draw and results?','Teams are kept. The bracket, groups and fixtures are cleared.','Reset',true))return;
  delete c.bracket;delete c.groups;delete c.fixtures;await save();render();toast('Competition reset')}

async function koResult(ri,mi){if(!requireAdmin())return;
  const c=comp(),m=c.bracket.rounds[ri][mi];
  if(!m.a||!m.b){toast('Waiting on earlier rounds');return}
  scoreSheet(teamName(c,m.a),teamName(c,m.b),m.done?m.sa:0,m.done?m.sb:0,true,async(sa,sb)=>{
    m.sa=sa;m.sb=sb;m.done=true;
    // clear downstream then advance
    for(let r=ri+1;r<c.bracket.rounds.length;r++)c.bracket.rounds[r].forEach(x=>{x.a=null;x.b=null;x.sa=null;x.sb=null;x.done=false;x.bye=false});
    for(let r=0;r<c.bracket.rounds.length-1;r++)c.bracket.rounds[r].forEach((x,i)=>{
      if(x.done&&x.sa!==null&&x.sb!==null&&x.sa!==x.sb)advance(c.bracket,r,i,x.sa>x.sb?x.a:x.b);
      else if(x.done&&x.bye)advance(c.bracket,r,i,x.a||x.b)});
    await save();closeSheet();render();
    const w=bracketWinner(c.bracket);
    toast(w?`🏆 ${teamName(c,w)} win the ${c.name}!`:'Result saved')})}
async function grResult(i){if(!requireAdmin())return;
  const c=comp(),f=c.fixtures[i];
  scoreSheet(teamName(c,f.a),teamName(c,f.b),f.done?f.sa:0,f.done?f.sb:0,false,async(sa,sb)=>{
    f.sa=sa;f.sb=sb;f.done=true;await save();closeSheet();render();toast('Result saved')})}
function scoreSheet(an,bn,sa,sb,noDraw,cb){
  window.__sc={sa,sb};
  openSheet('Enter result','<div id="scb"></div>','Save');
  const paint=()=>{const s=window.__sc;
    $('#scb').innerHTML=`<div class="grid g2" style="margin-top:6px">
      ${[['a',an,s.sa],['b',bn,s.sb]].map(([k,n,v])=>`<div class="card pad" style="text-align:center;margin:0">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>
        <div class="stepper"><button onclick="__scAdj('${k}',-1)">−</button><span class="sv">${v}</span>
          <button onclick="__scAdj('${k}',1)">+</button></div></div>`).join('')}</div>
      <div style="text-align:center;padding:16px 0 4px;font-size:15px;font-weight:600;color:var(--label2)">
        ${s.sa===s.sb?(noDraw?'⚠️ Knockout ties need a winner — decide on penalties':'Draw'):`${esc(s.sa>s.sb?an:bn)} win`}</div>`};
  window.__scAdj=(k,d)=>{const s=window.__sc;s[k==='a'?'sa':'sb']=Math.max(0,s[k==='a'?'sa':'sb']+d);paint()};
  window.__paint=paint;paint();
  $('#_sact').onclick=()=>{const s=window.__sc;
    if(noDraw&&s.sa===s.sb){toast('A knockout tie needs a winner');return}cb(s.sa,s.sb)}}

    DB=inc;CUR=(inc.current&&inc.seasons.some(s=>s.id===inc.current))?inc.current:inc.seasons[0].id;
    COMP=season().comps[0].id;WIPE_OK=true;await save();WIPE_OK=false;go('home');toast(`✅ Restored · ${ng} games`)}
  catch(e){toast("That doesn't look like a Sunday Season backup")}}

    ${st.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.name)}</b>${m.pos?' · '+m.pos:''}</td><td class="c">${m.P}</td><td class="c">${m.W}</td>
      <td class="c">${m.D}</td><td class="c">${m.L}</td><td class="c">${m.GF}</td><td class="c">${m.GA}</td>
      <td class="c">${m.GD>0?'+':''}${m.GD}</td><td class="c">${m.G}</td><td class="r">${m.pts}</td></tr>`).join('')}</tbody></table>`;
  const h=docHTML('Season report',`${g.length} games · ${goals} goals`,body);
  openViewer('Season report',`<div class="doc">${h.split('<body>')[1].split('</body>')[0]}</div>`,'season-report.html',h)}
function exportPlayer(pid){
  const p=player(pid),m=statsAll().find(x=>x.id===pid),car=careerOf(pid);
  if(!m){toast('No data');return}
  const c=clubOf(p),r=rtg(p),ps=p.ps?PS_BY[p.ps]:null;
  const pscol=ps?PS_CAT[ps.cat].col:'#F4C048';
  const ov=m.P?m.index:'—';
  const av=avatar(p,150);
  const crestSvg=c?crest(c,40):'';
  const psSvg=ps?psDiamond(p.ps,54):'';
  const stat=(l,v)=>`<div class="c-st"><b>${v}</b><span>${l}</span></div>`;
  const card=`
  <div class="cardwrap">
    <div class="futcard" style="--fc:${pscol}">
      <div class="fc-glow"></div>
      <div class="fc-inner">
        <div class="fc-head">
          <div class="fc-l">
            <div class="fc-ov">${ov}</div>
            <div class="fc-pos">${p.pos||'--'}</div>
            ${psSvg?`<div class="fc-ps">${psSvg}</div>`:''}
            ${crestSvg?`<div class="fc-cr">${crestSvg}</div>`:''}
            ${p.nation?`<div class="fc-fl">${p.nation}</div>`:''}
          </div>
          <div class="fc-av">${av}</div>
        </div>
        <div class="fc-name">${esc(p.name)}</div>
        ${r?`<div class="fc-like">PLAYS LIKE <b>${esc(r)}</b></div>`:''}
        <div class="fc-grid">
          ${stat('PTS',m.pts)}${stat('GOALS',m.G)}${stat('WIN%',Math.round(m.wr*100))}
          ${stat('PLAYED',m.P)}${stat('CLEAN SHEETS',m.cs)}${stat('POTY IDX',ov)}
        </div>
        ${ps?`<div class="fc-psbar"><div class="fc-psd">${psDiamond(p.ps,34)}</div>
          <div class="fc-pst"><div class="fc-psn">${esc(ps.name)}</div><div class="fc-psc">${PS_CAT[ps.cat].name} PlayStyle</div></div></div>`:''}
        ${car?`<div class="fc-lvl">
          <div class="fc-lvb">${car.lvl.n>=30?'🥇':car.lvl.e}</div>
          <div class="fc-lvt"><div class="fc-lvn">${car.lvl.t}</div>
            <div class="fc-lvx">Level ${car.lvl.n} · ${car.xp.toLocaleString()} XP</div></div></div>`:''}
        <div class="fc-foot">${c?esc(c.name)+' · ':''}Sunday Season</div>
      </div>
    </div>
  </div>`;
  const css=`
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
    body{font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;
      background:radial-gradient(120% 100% at 50% 0%,#20242e,#0b0c10);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .cardwrap{width:100%;max-width:380px}
    .futcard{position:relative;border-radius:26px;padding:3px;
      background:linear-gradient(160deg,#FFE9A8 0%,var(--fc) 40%,#12131a 100%);
      box-shadow:0 30px 70px rgba(0,0,0,.55)}
    .fc-glow{position:absolute;inset:0;border-radius:26px;
      background:radial-gradient(70% 45% at 50% 0%,color-mix(in srgb,var(--fc) 55%,transparent),transparent);
      filter:blur(20px);z-index:0}
    .fc-inner{position:relative;z-index:1;border-radius:23px;padding:22px 20px 16px;
      background:radial-gradient(130% 90% at 50% 0%,color-mix(in srgb,var(--fc) 30%,#16171e),#0f1015 62%)}
    .fc-head{display:flex;gap:14px;align-items:flex-start}
    .fc-l{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;min-width:58px}
    .fc-ov{font-size:46px;font-weight:900;line-height:.85;color:#fff;letter-spacing:-.05em;text-shadow:0 2px 10px rgba(0,0,0,.5)}
    .fc-pos{font-size:15px;font-weight:800;color:color-mix(in srgb,var(--fc) 75%,#fff);letter-spacing:.05em}
    .fc-ps,.fc-cr{margin-top:4px}
    .fc-fl{font-size:22px;margin-top:2px}
    .fc-av{flex:1;display:flex;justify-content:center}
    .fc-av>*{filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
    .fc-name{text-align:center;color:#fff;font-size:27px;font-weight:800;letter-spacing:-.02em;
      text-transform:uppercase;margin:10px 0 2px}
    .fc-like{text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:14px}
    .fc-like b{color:color-mix(in srgb,var(--fc) 75%,#fff)}
    .fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;
      padding:16px 0;border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13)}
    .c-st{text-align:center}
    .c-st b{display:block;font-size:23px;font-weight:800;color:#fff;letter-spacing:-.03em}
    .c-st span{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.5)}
    .fc-psbar{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 13px;border-radius:14px;
      background:color-mix(in srgb,var(--fc) 16%,rgba(255,255,255,.04))}
    .fc-psn{font-size:16px;font-weight:800;color:#fff}
    .fc-psc{font-size:11px;font-weight:600;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
    .fc-lvl{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.05)}
    .fc-lvb{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:22px;background:linear-gradient(150deg,var(--fc),color-mix(in srgb,var(--fc) 50%,#000))}
    .fc-lvn{font-size:16px;font-weight:800;color:#fff}
    .fc-lvx{font-size:11.5px;color:rgba(255,255,255,.55)}
    .fc-foot{text-align:center;margin-top:16px;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.4)}
    .psdia{position:relative;display:inline-flex}.psdia svg{display:block}
    .psplus-spark{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(135deg,#FFE9A8,#F4C048);color:#7a5713;font-size:11px;font-weight:900;
      display:flex;align-items:center;justify-content:center}
    .av,.avatar{border-radius:50%}
  `;
  const full=`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(p.name)} — Sunday Season</title><style>${css}</style></head>
    <body>${card}</body></html>`;
  openViewer(p.name,`<div style="background:radial-gradient(120% 100% at 50% 0%,#20242e,#0b0c10);padding:20px;border-radius:14px"><style>${css.replace(/body\{[^}]*\}/,'')}</style>${card}
    <button class="btn pri full" style="margin-top:16px" onclick="downloadCardPNG('${pid}')">📸 Save as image (PNG)</button></div>`,
    `${p.name.replace(/\s+/g,'-').toLowerCase()}-card.html`,full)}
function exportWrapped(){
  const st=statsAll().filter(x=>x.P>0).sort(tableSort);
  if(!st.length){toast('Play a game first');return}
  const g=allGames(),goals=g.reduce((t,x)=>t+(x.scoreA||0)+(x.scoreB||0),0);
  const boot=[...st].filter(x=>x.G>0).sort((a,b)=>b.G-a.G).slice(0,8);
  const idx=[...st].sort((a,b)=>b.index-a.index).slice(0,8);
  const car=st.map(m=>({m,c:careerOf(m.id)})).sort((a,b)=>b.c.xp-a.c.xp).slice(0,6);
  const fd=feed().slice(0,10);
  const bar=(rows,max)=>rows.map(r=>`<div style="display:flex;align-items:center;gap:11px;margin:8px 0">
    <span style="width:96px;font-size:12.5px;font-weight:600">${esc(r.n)}</span>
    <span style="flex:1;height:15px;background:#23232E;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(3,r.v/max*100)}%;background:linear-gradient(90deg,#8A6B14,#FFD60A)"></i></span>
    <span style="width:34px;text-align:right;font-size:12.5px;font-weight:700;color:#FFD60A">${r.v}</span></div>`).join('');
  const eb=t=>`<div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#FFD60A;margin-bottom:12px">${t}</div>`;
  const h1=t=>`<div style="font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin-bottom:16px">${t}</div>`;
  const slide=i=>`<div class="slide">${i}</div>`;
  const inner=`
   ${slide(`${eb(esc(season().name))}<div style="font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:.96">Season<br><span style="color:#FFD60A">Wrapped</span></div>
     <div style="display:flex;gap:30px;margin-top:26px">
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${goals}</div><div style="font-size:10.5px;color:#8A8A97">GOALS</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${g.length}</div><div style="font-size:10.5px;color:#8A8A97">GAMES</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${st.length}</div><div style="font-size:10.5px;color:#8A8A97">PLAYERS</div></div></div>`)}
   ${slide(`${eb('Final standings')}${h1('The table')}
     <table style="width:100%;border-collapse:collapse">${st.slice(0,12).map((m,i)=>`<tr>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:${i<3?'#FFD60A':'#8A8A97'};font-size:12px">${i+1}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;font-weight:600;font-size:13px">${esc(m.name)}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.W}-${m.D}-${m.L}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.G}⚽</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;text-align:right;font-weight:800;font-size:15px;color:#FFD60A">${m.pts}</td></tr>`).join('')}</table>`)}
   ${boot.length?slide(`${eb('Golden boot')}${h1(esc(boot[0].name)+' leads the line')}${bar(boot.map(m=>({n:m.name,v:m.G})),boot[0].G)}`):''}
   ${slide(`${eb('Player of the season')}${h1('POTY index')}${bar(idx.map(m=>({n:m.name,v:m.index})),100)}`)}
   ${slide(`${eb('Career mode')}${h1('Levels reached')}
     ${car.map(({m,c})=>`<div style="display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid #23232E">
       <div style="font-size:25px">${c.lvl.e}</div><div style="flex:1"><div style="font-weight:700;font-size:14.5px">${esc(m.name)}</div>
       <div style="font-size:11.5px;color:#8A8A97">Lv${c.lvl.n} ${c.lvl.t} · ${c.xp.toLocaleString()} XP</div></div>
       <div style="font-size:12px;font-weight:700;color:#FFD60A">${c.ch.filter(x=>x.done).length}/${c.ch.length}</div></div>`).join('')}`)}
   ${fd.length?slide(`${eb('Milestones')}${h1('Moments that mattered')}
     ${fd.map(e=>{const p=player(e.pid);return `<div style="display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid #23232E">
       <span style="font-size:19px">${e.e}</span><b style="flex:1;font-size:13px">${esc(p?p.name:'')}</b>
       <span style="font-size:11px;color:#8A8A97">${esc(e.t)}</span></div>`}).join('')}`):''}`;
  const css=`<style>@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;letter-spacing:-.01em;background:#0B0B0F;color:#fff}
    .slide{background:#0B0B0F;color:#fff;padding:18mm 14mm;min-height:250mm;page-break-after:always}
    @media screen{.slide{min-height:auto;padding:26px 22px;border-bottom:1px solid #23232E}}</style>`;
  const full=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Season Wrapped</title>${css}</head><body>${inner}</body></html>`;
  openViewer('Season Wrapped',`<div style="background:#0B0B0F;color:#fff;border-radius:14px;overflow:hidden">${css}${inner}</div>`,'season-wrapped.html',full)}


/* ============ BOOT ============ */
/* The quick-add button only belongs on the screens where it does something:
   logging a game, or adding a player on the squad page. Everywhere else it was
   just floating over the content. */
const FAB_VIEWS=['home','league','squad'];
function paintFab(){
  const f=document.getElementById('fab'); if(!f)return;
  const show=FAB_VIEWS.includes(VIEW);
  f.classList.toggle('fab-off',!show);
  f.setAttribute('aria-hidden',show?'false':'true');
  f.title = VIEW==='squad' ? 'Add a player' : 'Log a game';
}
document.getElementById('fab').onclick=()=>{if(!requireAdmin())return; if(VIEW==='squad')editPlayer(null);else newGame()};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#sideAdmin').onclick=()=>go('admin');
$('#drawerBg').onclick=closeDrawer;
$('#drawerClose').onclick=closeDrawer;
if(wideScreen())openDrawer();   // roomy screens start with the menu showing
$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const m={'1':'home','2':'league','3':'fixtures','4':'squad','5':'tactics','6':'career','7':'stats','8':'compare','9':'comps','0':'admin'};
  if(m[e.key])go(m[e.key]);
  if(e.key==='n'&&isAdmin())newGame();
  if(e.key==='Escape'){closeSheet();closeViewer();closeDrawer();$('#abg').classList.remove('open')}});
(async function(){
  await loadDB();
  if(supa){ await initSupa(); } else { applyAdminClass(); }
  loadLocalBoard();
  /* Prices are fully derived from the games, so recompute once at boot. This
     self-heals any map saved under older rules and guarantees the stocks chart
     and the market always agree. */
  try{ if(season()&&season().games&&season().games.length)recalcPrices(); }catch(e){}
  try{fplAutoLogin()}catch(e){}
  /* also handle a personal link tapped while the app is already open (a hash
     change alone does not reload the page) */
  window.addEventListener('hashchange',()=>{try{fplAutoLogin();render()}catch(e){}});
  initHaptics();
  buildNav();go('home');initGestures();
  applySeasonTint();
  /* the splash covers the first paint, then fades */
  setTimeout(()=>{
    const sp=$('#splash'); if(sp)sp.classList.add('gone');
    document.documentElement.classList.remove('booting');
    syncThemeColour();
  },420);
  setTimeout(()=>{const sp=$('#splash'); if(sp)sp.remove(); syncThemeColour()},900);
  if(!supaConfigured && Store.tier()==='memory')setTimeout(()=>toast('⚠️ This browser blocks saving — back up before closing'),1400);
  if(supaConfigured && !supa)setTimeout(()=>toast('⚠️ Could not reach the shared database — check your setup'),1400);
})();

</script>
