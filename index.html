      <button class="btn sec" onclick="closeSheet()">Cancel</button>
      <button class="btn pri" onclick="saveGame()">${G.id?'Save changes':'Save game'}</button>
    </div><div style="height:6px"></div>`;
  const el=$('#gq');if(el&&G.q){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function pgSelect(pid){
  // if already on a team, tapping removes; otherwise select for placement
  if(G.A.has(pid)||G.B.has(pid)){setSide(pid,'');return}
  G.__sel=(G.__sel===pid?null:pid);paintGame()}
function pgPlace(sd){ if(!G.__sel)return; const pid=G.__sel; G.__sel=null; setSide(pid,sd); }
function pickComp(cid){G.compId=cid;if(!G.id)G.round=nextRound(cid);paintGame()}
function clearTeams(){G.A.clear();G.B.clear();G.fillA=[];G.fillB=[];G.goals={};paintGame()}
async function addFiller(sd){
  const n=await askText('Add a filler','Just for this game — they won\'t join the squad.','','Add');

function autoSplit(){
  const ids=[...G.A,...G.B];
  if(ids.length<2){toast('Pick some players first');return}
  const st=statsAll(),r=ids.map(id=>({id,v:(st.find(x=>x.id===id)||{}).ppg||0})).sort((a,b)=>b.v-a.v);
  G.A.clear();G.B.clear();r.forEach((x,i)=>{(i%4===0||i%4===3?G.A:G.B).add(x.id)});paintGame();toast('Split by form')}
function setScore(sd,d){if(sd==='A')G.sa=Math.max(0,G.sa+d);else G.sb=Math.max(0,G.sb+d);paintGame()}
function setGoal(pid,d){G.goals[pid]=Math.max(0,(G.goals[pid]||0)+d);if(!G.goals[pid])delete G.goals[pid];
  const sd=G.A.has(pid)?'A':'B',t=goalSum(sd);
  if(sd==='A'&&t>G.sa)G.sa=t;if(sd==='B'&&t>G.sb)G.sb=t;paintGame()}
async function saveGame(){if(!requireAdmin())return;

  if(G.id)S.games[S.games.findIndex(x=>x.id===G.id)]=g;else S.games.push(g);

/* ============ DRAWS ============ */
async function drawBracket(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  if(c.bracket&&!await askConfirm('Redraw bracket?','Existing results will be cleared.','Redraw',true))return;
  const sh=[...ids].sort(()=>Math.random()-.5);
  c.bracket=buildBracket(sh);await save();render();toast('⚔️ Bracket drawn')}
async function drawGroups(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  const n=await askChoice('How many groups?','',[{label:'2 groups',value:2},{label:'3 groups',value:3},{label:'4 groups',value:4}]);
  if(!n)return;
  const sh=[...ids].sort(()=>Math.random()-.5),gk='ABCDEFGH'.slice(0,n).split(''),gr={};
  gk.forEach(k=>gr[k]=[]);sh.forEach((id,i)=>gr[gk[i%n]].push(id));
  c.groups=gr;c.advance=2;
  c.fixtures=[];gk.forEach(k=>roundRobin(gr[k]).forEach(f=>c.fixtures.push({...f,g:k})));
  delete c.bracket;await save();render();toast(`🌍 ${n} groups drawn · ${c.fixtures.length} fixtures`)}
async function drawKOFromGroups(){if(!requireAdmin())return;
  const c=comp();if(!c.groups){toast('Draw the groups first');return}
  if(c.bracket&&!await askConfirm('Redraw knockout?','Existing knockout results will be cleared.','Redraw',true))return;
  const adv=c.advance||2,q=[];
  Object.keys(c.groups).sort().forEach(k=>groupTable(c,k).slice(0,adv).forEach((r,i)=>q.push({id:r.id,g:k,pos:i})));
  if(q.length<2){toast('Not enough qualified teams');return}
  const w=q.filter(x=>x.pos===0),r=q.filter(x=>x.pos>0).reverse();
  c.bracket=buildBracket([...w,...r].map(x=>x.id));await save();render();toast('⚔️ Knockout drawn')}
async function resetComp(){if(!requireAdmin())return;const c=comp();
  if(!await askConfirm('Reset draw and results?','Teams are kept. The bracket, groups and fixtures are cleared.','Reset',true))return;
  delete c.bracket;delete c.groups;delete c.fixtures;await save();render();toast('Competition reset')}

/* ============ ENTER RESULTS ============ */
async function koResult(ri,mi){if(!requireAdmin())return;
  const c=comp(),m=c.bracket.rounds[ri][mi];
  if(!m.a||!m.b){toast('Waiting on earlier rounds');return}
  scoreSheet(teamName(c,m.a),teamName(c,m.b),m.done?m.sa:0,m.done?m.sb:0,true,async(sa,sb)=>{
    m.sa=sa;m.sb=sb;m.done=true;
    // clear downstream then advance
    for(let r=ri+1;r<c.bracket.rounds.length;r++)c.bracket.rounds[r].forEach(x=>{x.a=null;x.b=null;x.sa=null;x.sb=null;x.done=false;x.bye=false});
    for(let r=0;r<c.bracket.rounds.length-1;r++)c.bracket.rounds[r].forEach((x,i)=>{
      if(x.done&&x.sa!==null&&x.sb!==null&&x.sa!==x.sb)advance(c.bracket,r,i,x.sa>x.sb?x.a:x.b);
      else if(x.done&&x.bye)advance(c.bracket,r,i,x.a||x.b)});
    await save();closeSheet();render();
    const w=bracketWinner(c.bracket);
    toast(w?`🏆 ${teamName(c,w)} win the ${c.name}!`:'Result saved')})}
async function grResult(i){if(!requireAdmin())return;
  const c=comp(),f=c.fixtures[i];
  scoreSheet(teamName(c,f.a),teamName(c,f.b),f.done?f.sa:0,f.done?f.sb:0,false,async(sa,sb)=>{
    f.sa=sa;f.sb=sb;f.done=true;await save();closeSheet();render();toast('Result saved')})}
function scoreSheet(an,bn,sa,sb,noDraw,cb){
  window.__sc={sa,sb};
  openSheet('Enter result','<div id="scb"></div>','Save');
  const paint=()=>{const s=window.__sc;
    $('#scb').innerHTML=`<div class="grid g2" style="margin-top:6px">
      ${[['a',an,s.sa],['b',bn,s.sb]].map(([k,n,v])=>`<div class="card pad" style="text-align:center;margin:0">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>
        <div class="stepper"><button onclick="__scAdj('${k}',-1)">−</button><span class="sv">${v}</span>
          <button onclick="__scAdj('${k}',1)">+</button></div></div>`).join('')}</div>
      <div style="text-align:center;padding:16px 0 4px;font-size:15px;font-weight:600;color:var(--label2)">
        ${s.sa===s.sb?(noDraw?'⚠️ Knockout ties need a winner — decide on penalties':'Draw'):`${esc(s.sa>s.sb?an:bn)} win`}</div>`};
  window.__scAdj=(k,d)=>{const s=window.__sc;s[k==='a'?'sa':'sb']=Math.max(0,s[k==='a'?'sa':'sb']+d);paint()};
  window.__paint=paint;paint();
  $('#_sact').onclick=()=>{const s=window.__sc;
    if(noDraw&&s.sa===s.sb){toast('A knockout tie needs a winner');return}cb(s.sa,s.sb)}}

async function deleteSeason(id){
  if(!requireAdmin())return;
  const s=DB.seasons.find(x=>x.id===id); if(!s)return;
  if(DB.seasons.length<=1){ toast('This is your only season — you can\'t delete it'); return; }
  const games=(s.games||[]).length, players=(s.players||[]).length;
  // Warning 1
  if(!await askConfirm('Delete this season?',
     `“${s.name}” has ${games} game${games===1?'':'s'} and ${players} player${players===1?'':'s'}. This can’t be undone.`,
     'Continue',true))return;
  // Warning 2 — only if it actually holds data
  if(games>0 || players>0){
    if(!await askConfirm('Are you completely sure?',
       'Everything in this season — the table, stats, career progress and history — will be permanently erased.',
       'Yes, delete it',true))return;
    // Warning 3 — type the name to confirm
    const typed=await askText('Type the season name to confirm','This is permanent. Type the exact name below.',
       '', 'Delete forever');
    if(typed===null)return;
    if((typed||'').trim().toLowerCase()!==s.name.trim().toLowerCase()){
      toast('Name didn\'t match — season kept safe'); return;
    }
  }
  const wasCurrent=(id===CUR);
  DB.seasons=DB.seasons.filter(x=>x.id!==id);
  if(wasCurrent){ CUR=DB.seasons[0].id; COMP=season().comps[0].id; }
  await save(); render(); toast('Season deleted');
}

function backupJSON(){

  downloadFile(`season-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`,
    JSON.stringify({format:'season-tracker',version:7,exported:d.toISOString(),db:DB},null,2),'application/json')}
async function restoreMenu(){if(!requireAdmin())return;
  const c=await askChoice('Restore data','Choose a backup file, or paste its contents.',
    [{label:'📁 Choose a file',value:'file'},{label:'📋 Paste backup text',value:'paste'}]);
  if(c==='file')$('#restoreFile')?.click();
  else if(c==='paste'){
    const t=await askText('Paste backup','Paste the contents of your .json backup','','Restore');
    if(t)doRestore(t)}}
async function restoreJSON(f){if(!requireAdmin())return;if(!f)return;try{doRestore(await f.text())}catch(e){toast("Couldn't read that file")}}
async function doRestore(text){if(!requireAdmin())return;
  try{
    const d=JSON.parse(text),inc=(d&&d.db&&d.db.seasons)?d.db:((d&&d.seasons)?d:null);
    if(!inc||!Array.isArray(inc.seasons)||!inc.seasons.length)throw 0;
    const ng=inc.seasons.reduce((t,s)=>t+((s.games||[]).length),0);
    if(!await askConfirm('Restore backup?',`Backup: ${inc.seasons.length} season(s), ${ng} game(s).\nThis replaces what's here now.`,'Restore',true))return;
    inc.seasons.forEach(s=>{s.players=s.players||[];s.games=s.games||[];
      if(!s.comps?.length){const lg={id:uid(),name:'League',type:'league',icon:'🏆',created:Date.now()};
        s.comps=[lg];s.games.forEach(g=>{if(!g.compId)g.compId=lg.id})}});
    DB=inc;CUR=(inc.current&&inc.seasons.some(s=>s.id===inc.current))?inc.current:inc.seasons[0].id;
    COMP=season().comps[0].id;await save();go('home');toast(`✅ Restored · ${ng} games`)}
  catch(e){toast("That doesn't look like a Sunday Season backup")}}

td{padding:7px 6px;font-size:11.5px;border-bottom:1px solid #eee}
thead td{font-size:9px;font-weight:700;color:#888;text-transform:uppercase;border-bottom:1.5px solid #ccc}
.c{text-align:center}.r{text-align:right;font-weight:700}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:6px}
.t{border:1px solid #eee;border-radius:9px;padding:10px}.t b{font-size:21px;display:block}.t s{font-size:9px;color:#888;text-decoration:none;text-transform:uppercase}
.ft{margin-top:20px;padding-top:9px;border-top:1px solid #ddd;font-size:9px;color:#999;display:flex;justify-content:space-between}
@media screen{body{background:#fff;padding:22px}}</style>`;
function docHTML(title,sub,body){
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title>${PDFCSS}</head><body>
  <div class="hd"><div><div class="sub">${esc(season().name)}</div><h1>${esc(title)}</h1></div><div class="sub">${esc(sub)}</div></div>
  ${body}<div class="ft"><span>Sunday Season</span><span>${new Date().toLocaleDateString('en-GB')}</span></div></body></html>`}
function exportSeason(){
  const st=lgStats().filter(x=>x.P>0).sort(tableSort);
  if(!st.length){toast('No games yet');return}
  const g=compGames(lgComp().id),goals=g.reduce((t,x)=>t+(x.scoreA||0)+(x.scoreB||0),0);
  const body=`<div class="tl"><div class="t"><b>${g.length}</b><s>Games</s></div><div class="t"><b>${goals}</b><s>Goals</s></div>
    <div class="t"><b>${st.length}</b><s>Players</s></div><div class="t"><b>${(goals/Math.max(1,g.length)).toFixed(1)}</b><s>Per game</s></div></div>
    <h2>Table</h2><table><thead><tr><td>#</td><td>Player</td><td class="c">P</td><td class="c">W</td><td class="c">D</td><td class="c">L</td>
    <td class="c">GF</td><td class="c">GA</td><td class="c">GD</td><td class="c">⚽</td><td class="r">Pts</td></tr></thead><tbody>
    ${st.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.name)}</b>${m.pos?' · '+m.pos:''}</td><td class="c">${m.P}</td><td class="c">${m.W}</td>
      <td class="c">${m.D}</td><td class="c">${m.L}</td><td class="c">${m.GF}</td><td class="c">${m.GA}</td>
      <td class="c">${m.GD>0?'+':''}${m.GD}</td><td class="c">${m.G}</td><td class="r">${m.pts}</td></tr>`).join('')}</tbody></table>`;
  const h=docHTML('Season report',`${g.length} games · ${goals} goals`,body);
  openViewer('Season report',`<div class="doc">${h.split('<body>')[1].split('</body>')[0]}</div>`,'season-report.html',h)}
function exportPlayer(pid){
  const p=player(pid),m=statsAll().find(x=>x.id===pid),car=careerOf(pid);
  if(!m){toast('No data');return}
  const c=clubOf(p),r=rtg(p),ps=p.ps?PS_BY[p.ps]:null;
  const pscol=ps?PS_CAT[ps.cat].col:'#F4C048';
  const ov=m.P?m.index:'—';
  const av=avatar(p,150);
  const crestSvg=c?crest(c,40):'';
  const psSvg=ps?psDiamond(p.ps,54):'';
  const stat=(l,v)=>`<div class="c-st"><b>${v}</b><span>${l}</span></div>`;
  const card=`
  <div class="cardwrap">
    <div class="futcard" style="--fc:${pscol}">
      <div class="fc-glow"></div>
      <div class="fc-inner">
        <div class="fc-head">
          <div class="fc-l">
            <div class="fc-ov">${ov}</div>
            <div class="fc-pos">${p.pos||'--'}</div>
            ${psSvg?`<div class="fc-ps">${psSvg}</div>`:''}
            ${crestSvg?`<div class="fc-cr">${crestSvg}</div>`:''}
            ${p.nation?`<div class="fc-fl">${p.nation}</div>`:''}
          </div>
          <div class="fc-av">${av}</div>
        </div>
        <div class="fc-name">${esc(p.name)}</div>
        ${r?`<div class="fc-like">PLAYS LIKE <b>${esc(r)}</b></div>`:''}
        <div class="fc-grid">
          ${stat('PTS',m.pts)}${stat('GOALS',m.G)}${stat('WIN%',Math.round(m.wr*100))}
          ${stat('PLAYED',m.P)}${stat('CLEAN SHEETS',m.cs)}${stat('POTY IDX',ov)}
        </div>
        ${ps?`<div class="fc-psbar"><div class="fc-psd">${psDiamond(p.ps,34)}</div>
          <div class="fc-pst"><div class="fc-psn">${esc(ps.name)}</div><div class="fc-psc">${PS_CAT[ps.cat].name} PlayStyle</div></div></div>`:''}
        ${car?`<div class="fc-lvl">
          <div class="fc-lvb">${car.lvl.n>=30?'🥇':car.lvl.e}</div>
          <div class="fc-lvt"><div class="fc-lvn">${car.lvl.t}</div>
            <div class="fc-lvx">Level ${car.lvl.n} · ${car.xp.toLocaleString()} XP</div></div></div>`:''}
        <div class="fc-foot">${c?esc(c.name)+' · ':''}Sunday Season</div>
      </div>
    </div>
  </div>`;
  const css=`
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
    body{font-family:-apple-system,'SF Pro Display',Inter,system-ui,sans-serif;
      background:radial-gradient(120% 100% at 50% 0%,#20242e,#0b0c10);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .cardwrap{width:100%;max-width:380px}
    .futcard{position:relative;border-radius:26px;padding:3px;
      background:linear-gradient(160deg,#FFE9A8 0%,var(--fc) 40%,#12131a 100%);
      box-shadow:0 30px 70px rgba(0,0,0,.55)}
    .fc-glow{position:absolute;inset:0;border-radius:26px;
      background:radial-gradient(70% 45% at 50% 0%,color-mix(in srgb,var(--fc) 55%,transparent),transparent);
      filter:blur(20px);z-index:0}
    .fc-inner{position:relative;z-index:1;border-radius:23px;padding:22px 20px 16px;
      background:radial-gradient(130% 90% at 50% 0%,color-mix(in srgb,var(--fc) 30%,#16171e),#0f1015 62%)}
    .fc-head{display:flex;gap:14px;align-items:flex-start}
    .fc-l{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;min-width:58px}
    .fc-ov{font-size:46px;font-weight:900;line-height:.85;color:#fff;letter-spacing:-.05em;text-shadow:0 2px 10px rgba(0,0,0,.5)}
    .fc-pos{font-size:15px;font-weight:800;color:color-mix(in srgb,var(--fc) 75%,#fff);letter-spacing:.05em}
    .fc-ps,.fc-cr{margin-top:4px}
    .fc-fl{font-size:22px;margin-top:2px}
    .fc-av{flex:1;display:flex;justify-content:center}
    .fc-av>*{filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
    .fc-name{text-align:center;color:#fff;font-size:27px;font-weight:800;letter-spacing:-.02em;
      text-transform:uppercase;margin:10px 0 2px}
    .fc-like{text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:14px}
    .fc-like b{color:color-mix(in srgb,var(--fc) 75%,#fff)}
    .fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;
      padding:16px 0;border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13)}
    .c-st{text-align:center}
    .c-st b{display:block;font-size:23px;font-weight:800;color:#fff;letter-spacing:-.03em}
    .c-st span{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.5)}
    .fc-psbar{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 13px;border-radius:14px;
      background:color-mix(in srgb,var(--fc) 16%,rgba(255,255,255,.04))}
    .fc-psn{font-size:16px;font-weight:800;color:#fff}
    .fc-psc{font-size:11px;font-weight:600;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
    .fc-lvl{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.05)}
    .fc-lvb{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:22px;background:linear-gradient(150deg,var(--fc),color-mix(in srgb,var(--fc) 50%,#000))}
    .fc-lvn{font-size:16px;font-weight:800;color:#fff}
    .fc-lvx{font-size:11.5px;color:rgba(255,255,255,.55)}
    .fc-foot{text-align:center;margin-top:16px;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.4)}
    .psdia{position:relative;display:inline-flex}.psdia svg{display:block}
    .psplus-spark{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(135deg,#FFE9A8,#F4C048);color:#7a5713;font-size:11px;font-weight:900;
      display:flex;align-items:center;justify-content:center}
    .av,.avatar{border-radius:50%}
  `;
  const full=`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(p.name)} — Sunday Season</title><style>${css}</style></head>
    <body>${card}</body></html>`;
  openViewer(p.name,`<div style="background:radial-gradient(120% 100% at 50% 0%,#20242e,#0b0c10);padding:20px;border-radius:14px"><style>${css.replace(/body\{[^}]*\}/,'')}</style>${card}
    <button class="btn pri full" style="margin-top:16px" onclick="downloadCardPNG('${pid}')">📸 Save as image (PNG)</button></div>`,
    `${p.name.replace(/\s+/g,'-').toLowerCase()}-card.html`,full)}
function exportWrapped(){
  const st=statsAll().filter(x=>x.P>0).sort(tableSort);
  if(!st.length){toast('Play a game first');return}
  const g=allGames(),goals=g.reduce((t,x)=>t+(x.scoreA||0)+(x.scoreB||0),0);
  const boot=[...st].filter(x=>x.G>0).sort((a,b)=>b.G-a.G).slice(0,8);
  const idx=[...st].sort((a,b)=>b.index-a.index).slice(0,8);
  const car=st.map(m=>({m,c:careerOf(m.id)})).sort((a,b)=>b.c.xp-a.c.xp).slice(0,6);
  const fd=feed().slice(0,10);
  const bar=(rows,max)=>rows.map(r=>`<div style="display:flex;align-items:center;gap:11px;margin:8px 0">
    <span style="width:96px;font-size:12.5px;font-weight:600">${esc(r.n)}</span>
    <span style="flex:1;height:15px;background:#23232E;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(3,r.v/max*100)}%;background:linear-gradient(90deg,#8A6B14,#FFD60A)"></i></span>
    <span style="width:34px;text-align:right;font-size:12.5px;font-weight:700;color:#FFD60A">${r.v}</span></div>`).join('');
  const eb=t=>`<div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#FFD60A;margin-bottom:12px">${t}</div>`;
  const h1=t=>`<div style="font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin-bottom:16px">${t}</div>`;
  const slide=i=>`<div class="slide">${i}</div>`;
  const inner=`
   ${slide(`${eb(esc(season().name))}<div style="font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:.96">Season<br><span style="color:#FFD60A">Wrapped</span></div>
     <div style="display:flex;gap:30px;margin-top:26px">
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${goals}</div><div style="font-size:10.5px;color:#8A8A97">GOALS</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${g.length}</div><div style="font-size:10.5px;color:#8A8A97">GAMES</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${st.length}</div><div style="font-size:10.5px;color:#8A8A97">PLAYERS</div></div></div>`)}
   ${slide(`${eb('Final standings')}${h1('The table')}
     <table style="width:100%;border-collapse:collapse">${st.slice(0,12).map((m,i)=>`<tr>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:${i<3?'#FFD60A':'#8A8A97'};font-size:12px">${i+1}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;font-weight:600;font-size:13px">${esc(m.name)}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.W}-${m.D}-${m.L}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.G}⚽</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;text-align:right;font-weight:800;font-size:15px;color:#FFD60A">${m.pts}</td></tr>`).join('')}</table>`)}
   ${boot.length?slide(`${eb('Golden boot')}${h1(esc(boot[0].name)+' leads the line')}${bar(boot.map(m=>({n:m.name,v:m.G})),boot[0].G)}`):''}
   ${slide(`${eb('Player of the season')}${h1('POTY index')}${bar(idx.map(m=>({n:m.name,v:m.index})),100)}`)}
   ${slide(`${eb('Career mode')}${h1('Levels reached')}
     ${car.map(({m,c})=>`<div style="display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid #23232E">
       <div style="font-size:25px">${c.lvl.e}</div><div style="flex:1"><div style="font-weight:700;font-size:14.5px">${esc(m.name)}</div>
       <div style="font-size:11.5px;color:#8A8A97">Lv${c.lvl.n} ${c.lvl.t} · ${c.xp.toLocaleString()} XP</div></div>
       <div style="font-size:12px;font-weight:700;color:#FFD60A">${c.ch.filter(x=>x.done).length}/${c.ch.length}</div></div>`).join('')}`)}
   ${fd.length?slide(`${eb('Milestones')}${h1('Moments that mattered')}
     ${fd.map(e=>{const p=player(e.pid);return `<div style="display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid #23232E">
       <span style="font-size:19px">${e.e}</span><b style="flex:1;font-size:13px">${esc(p?p.name:'')}</b>
       <span style="font-size:11px;color:#8A8A97">${esc(e.t)}</span></div>`}).join('')}`):''}`;
  const css=`<style>@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;letter-spacing:-.01em;background:#0B0B0F;color:#fff}
    .slide{background:#0B0B0F;color:#fff;padding:18mm 14mm;min-height:250mm;page-break-after:always}
    @media screen{.slide{min-height:auto;padding:26px 22px;border-bottom:1px solid #23232E}}</style>`;
  const full=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Season Wrapped</title>${css}</head><body>${inner}</body></html>`;
  openViewer('Season Wrapped',`<div style="background:#0B0B0F;color:#fff;border-radius:14px;overflow:hidden">${css}${inner}</div>`,'season-wrapped.html',full)}


/* ============ BOOT ============ */
document.getElementById('fab').onclick=()=>{if(!requireAdmin())return; if(VIEW==='squad')editPlayer(null);else newGame()};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#sideAdmin').onclick=()=>go('admin');
$('#drawerBg').onclick=closeDrawer;
$('#drawerClose').onclick=closeDrawer;
if(wideScreen())openDrawer();   // roomy screens start with the menu showing
$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const m={'1':'home','2':'league','3':'fixtures','4':'squad','5':'tactics','6':'career','7':'stats','8':'compare','9':'comps','0':'admin'};
  if(m[e.key])go(m[e.key]);
  if(e.key==='n'&&isAdmin())newGame();
  if(e.key==='Escape'){closeSheet();closeViewer();closeDrawer();$('#abg').classList.remove('open')}});
(async function(){
  await loadDB();
  if(supa){ await initSupa(); } else { applyAdminClass(); }
  buildNav();go('home');initGestures();
  if(!supaConfigured && Store.tier()==='memory')setTimeout(()=>toast('⚠️ This browser blocks saving — back up before closing'),1400);
  if(supaConfigured && !supa)setTimeout(()=>toast('⚠️ Could not reach the shared database — check your setup'),1400);
})();

</script>
</body>
</html>
