}
kbd{display:inline-block;background:var(--fill2);border-radius:5px;padding:1px 6px;
  font:600 11.5px ui-monospace,SFMono-Regular,monospace;color:var(--label);border:1px solid var(--sep)}

.crosslink{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--fill);
  border:none;border-radius:22px;padding:6px 12px 6px 7px;font-size:13.5px;font-weight:600;
  color:var(--tint);cursor:pointer}
.crosslink svg{width:14px;height:14px;stroke:var(--tint);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.crosslink .av{width:22px;height:22px;font-size:9px}

/* ================= FPL MARKET ================= */
.mk-banner{display:flex;align-items:center;gap:8px;background:var(--tint-soft);border-radius:12px;
  padding:10px 12px;margin-bottom:10px;font-size:13.5px;color:var(--label)}
.mk-banner.swap{background:color-mix(in srgb,var(--orange) 15%,transparent)}
.mk-banner button{margin-left:auto;background:none;border:none;color:var(--tint);font-weight:700;
  font-size:13px;cursor:pointer;flex:0 0 auto}
.mk-bud{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.mk-bud>div{padding:10px 6px;text-align:center;border-right:1px solid var(--sep)}
.mk-bud>div:last-child{border-right:none}
.mk-bud b{display:block;font-size:17px;font-weight:800;color:var(--tint)}
.mk-bud span{font-size:9.5px;font-weight:700;color:var(--label3);letter-spacing:.06em;text-transform:uppercase}
.mk-list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mk-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:none;
  border-bottom:.5px solid var(--sep);cursor:pointer;text-align:left}
.mk-row:last-child{border-bottom:none}
.mk-row:active{background:var(--fill)}
.mk-row.own{background:color-mix(in srgb,var(--tint) 8%,transparent)}
.mk-row.poor{opacity:.42}
.mk-pos{flex:0 0 34px;font-size:9.5px;font-weight:900;letter-spacing:.04em;text-align:center;
  color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);border-radius:6px;padding:3px 0}
.mk-kit{flex:0 0 auto;display:flex}
.mk-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mk-n{font-size:14.5px;font-weight:700;color:var(--label);display:flex;align-items:center;gap:6px}
.mk-in{font-style:normal;font-size:8.5px;font-weight:900;background:var(--tint);color:#fff;
  padding:2px 6px;border-radius:20px}
.mk-sub{font-size:11.5px;color:var(--label3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-r{flex:0 0 auto;text-align:right}
.mk-price{display:block;font-size:14.5px;font-weight:800;color:var(--label)}
.mk-pts{display:block;font-size:11px;color:var(--label3)}
/* remove-× on a pitch shirt */
.sh{position:relative}
.sh-x{position:absolute;top:-6px;right:2px;width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;z-index:2}
.sh-name.empty{background:rgba(255,255,255,.22);color:#fff}

.sh-c{white-space:nowrap;padding:3px 9px;font-size:9px}
.sh-top.empty.req{border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.24)}
.sh-line.flexline{opacity:.96}
.sh-line.flexline .sh-name.empty{background:rgba(255,255,255,.16);letter-spacing:.08em;font-size:9.5px}

.row.chip-armed{background:color-mix(in srgb,var(--orange) 10%,transparent)}
.chip-state.armed{background:color-mix(in srgb,var(--orange) 20%,transparent);color:#B36F00}
[data-theme="dark"] .chip-state.armed{color:#FBBF24}
.row.chip-blocked{opacity:.5}

/* ---- drawer proportions across phone sizes ---- */
.side{width:min(84vw,290px);flex-basis:min(84vw,290px)}
@media(min-width:900px){ .side{width:252px;flex-basis:252px} body.drawer .main{padding-left:252px} }
.side .brand{padding:6px 12px 14px;min-height:34px}
.side .brand span{font-size:clamp(17px,4.6vw,22px);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side nav{-webkit-overflow-scrolling:touch}
.side nav button{padding:11px 12px;font-size:clamp(14.5px,3.9vw,15.5px)}
/* very short screens (SE, mini in landscape): tighten so every item reaches */
@media(max-height:700px){
  .side .brand{padding-bottom:8px}
  .side nav button{padding:8.5px 12px}
}
/* the navbar itself must clear the notch too */
.navbar{padding-top:env(safe-area-inset-top,0px)}
.largetitle{padding-top:2px}

/* ---- responsive taps: kill the 300ms delay and give instant feedback ---- */
button,a,.row.tap,[onclick],select,input,label{touch-action:manipulation}
.row.tap,button:not(:disabled){-webkit-user-select:none;user-select:none}
.row.tap:active{background:var(--fill);transition:none}
.btn:active{transform:scale(.975);transition:transform .06s}
.side nav button:active{background:var(--fill2)}
/* stop the page behind a sheet from scrolling with it */
body.sheet-open{overflow:hidden;position:fixed;width:100%}
/* inputs: 16px stops iOS zooming in on focus */
input,select,textarea{font-size:16px}

/* ================= SKY SPORTS ================= */
:root{--skyRed:#E4002B;--skyNavy:#0B1B33;--skyYellow:#FFE500;--beinPurple:#6A1B9A}
.sky-h{font-size:12px;font-weight:900;letter-spacing:.16em;color:#fff;text-transform:uppercase;
  background:linear-gradient(90deg,var(--skyRed),#B00020);padding:8px 14px;border-radius:8px;
  margin:18px 0 12px;display:inline-block;box-shadow:0 3px 10px rgba(228,0,43,.32)}
.sky-h.mnf{background:linear-gradient(90deg,var(--beinPurple),#3F0D5C);box-shadow:0 3px 10px rgba(106,27,154,.32)}
/* deadline-day ticker */
.ddl{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;margin-bottom:14px;
  background:var(--skyYellow);box-shadow:var(--shadow)}
.ddl-tag{background:#111;color:var(--skyYellow);font-size:9.5px;font-weight:900;letter-spacing:.1em;
  padding:9px 10px;display:flex;align-items:center;flex:0 0 auto}
.ddl-track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.ddl-run{display:flex;gap:22px;white-space:nowrap;padding-left:14px;
  animation:ddlrun 26s linear infinite;will-change:transform}
.ddl-run span{font-size:12.5px;font-weight:700;color:#111}
.ddl-run b{font-weight:800}
.ddl-run .up{color:#0A7D2C}.ddl-run .dn{color:#B3001B}
@keyframes ddlrun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ddl-run{animation:none}}
/* man of the match */
.sky-motm{border-radius:16px;overflow:hidden;margin-bottom:6px;box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--skyNavy),#132B4D 60%,#0B1B33)}
.sky-motm-tag{background:var(--skyRed);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.14em;
  padding:6px 14px;display:flex;align-items:center;gap:6px}
.sky-motm-tag span{font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.78);text-transform:none;font-size:10px}
.sky-motm-b{display:flex;align-items:center;gap:13px;padding:14px}
.sky-motm-av{flex:0 0 auto}
.sky-motm-t{flex:1;min-width:0}
.sky-motm-t b{display:block;color:#fff;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sky-motm-t span{display:block;color:rgba(255,255,255,.72);font-size:13px;margin-top:2px}
.sky-motm-t i{display:block;color:rgba(255,255,255,.45);font-size:11.5px;font-style:normal;margin-top:3px}
.sky-motm-go{flex:0 0 auto;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12px;
  font-weight:700;padding:8px 11px;border-radius:20px;cursor:pointer}
/* award race cards */
.sky-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.sky-cap{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep);
  background:linear-gradient(90deg,color-mix(in srgb,var(--skyRed) 10%,transparent),transparent)}
.sky-em{font-size:23px;flex:0 0 auto}
.sky-cap b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.sky-cap i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.sky-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--sep);cursor:pointer}
.sky-row:last-child{border-bottom:none}
.sky-row:active{background:var(--fill)}
.sky-row.lead{background:color-mix(in srgb,var(--skyRed) 7%,transparent)}
.sky-pos{flex:0 0 20px;font-size:12px;font-weight:800;color:var(--label3);text-align:center}
.sky-row.lead .sky-pos{color:var(--skyRed)}
.sky-av{flex:0 0 auto;display:flex}
.sky-nm{flex:1;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row.lead .sky-nm{font-weight:800}
.sky-val{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--label2)}
.sky-val.up{color:var(--green)}
/* MNF analysis */
.mnf-wrap{display:grid;gap:11px}
.mnf-card{background:linear-gradient(150deg,#241033,#160A22 70%);border-radius:14px;padding:14px;
  border:1px solid rgba(168,85,247,.22);box-shadow:var(--shadow)}
.mnf-t{font-size:10.5px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#C084FC}
.mnf-b{font-size:18px;font-weight:800;color:#fff;margin:5px 0 5px;letter-spacing:-.02em}
.mnf-d{font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.55}

/* ================= FPL STOCKS ================= */
.idx{background:linear-gradient(150deg,#141821,#0C0F16);border-radius:15px;overflow:hidden;

.stk-list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.stk{border-bottom:.5px solid var(--sep);cursor:pointer}

.stk.open{background:var(--fill)}
.stk-row{display:flex;align-items:center;gap:10px;padding:10px 13px}
.stk-kit{flex:0 0 auto;display:flex}
.stk-nm{flex:1;min-width:0}

.stk-nm i{display:block;font-style:normal;font-size:11px;color:var(--label3);margin-top:1px}
.stk-spark{flex:0 0 auto;display:flex;align-items:center}
.stk-px{flex:0 0 auto;text-align:right;min-width:76px}
.stk-px b{display:block;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}

.stk-px .up{color:#fff;background:#30D158}
.stk-px .dn{color:#fff;background:#FF453A}
.stk-px .flat{color:var(--label3);background:var(--fill2)}
.stk-open{padding:4px 13px 14px;animation:in .22s ease}
.stk-rangebar{display:flex;gap:5px;margin-bottom:8px}

.stk-rangebar button.on{background:var(--tint);color:#fff}
.stk-chart{width:100%;height:170px;display:block;overflow:visible}
.stk-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stk-facts>div{background:var(--card);border-radius:9px;padding:8px 4px;text-align:center}
.stk-facts b{display:block;font-size:13.5px;font-weight:800}
.stk-facts span{font-size:8.5px;font-weight:700;color:var(--label3);letter-spacing:.05em;text-transform:uppercase}
.stk-sub{background:var(--card);border-radius:10px;overflow:hidden}
.stk-sub-r{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:.5px solid var(--sep);font-size:13px}
.stk-sub-r:last-child{border-bottom:none}
.stk-sub-r span{color:var(--label2)}
.stk-sub-r b{font-weight:700;font-variant-numeric:tabular-nums}
.stk-sub-r b.up{color:var(--green)}.stk-sub-r b.dn{color:var(--red)}

/* ============ SKY / beIN — stronger broadcast look ============ */
.sky-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(115deg,#E4002B 0%,#B00020 42%,#0B1B33 42%,#0B1B33 100%);
  padding:18px 16px 20px;box-shadow:0 10px 26px rgba(11,27,51,.34)}
.sky-hero:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
.sky-hero-t{position:relative;font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.8)}
.sky-hero-b{position:relative;font-size:40px;font-weight:900;color:#fff;letter-spacing:-.035em;margin-top:5px;line-height:1}
.sky-hero-s{position:relative;font-size:12.5px;color:rgba(255,255,255,.66);margin-top:5px}
.sky-h{position:relative;padding-left:14px}
.sky-h:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:5px;height:70%;background:#fff;border-radius:3px}

/* ---- squad numbers ---- */
.shirt-pick{display:flex;align-items:center;gap:12px;width:100%;background:var(--fill);border:none;
  border-radius:12px;padding:11px 13px;margin-bottom:14px;cursor:pointer;text-align:left;font-size:14.5px;color:var(--label)}
.shirt-big{flex:0 0 44px;height:44px;border-radius:11px;background:var(--label);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.shirt-pick .chev{margin-left:auto;color:var(--label3);font-size:19px}
.shirtno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;
  border-radius:5px;background:var(--fill2);color:var(--label2);font-size:10.5px;font-weight:800;
  font-variant-numeric:tabular-nums;margin-right:6px}

.r-elite{background:#0A7D2C}.r-great{background:#30A14E}.r-good{background:#6E9E3E}
.r-ok{background:#A0863C}.r-poor{background:#B3401B}

.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.cab-i{border-radius:13px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid transparent}

.cab-i.silver{background:linear-gradient(160deg,#FBFCFD,#D6DCE4 60%,#AEB6C0);border-color:#C6CDD6;color:#2A3038}
.cab-i.bronze{background:linear-gradient(160deg,#F7E2CE,#D69A62 60%,#A9713F);border-color:#C98F55;color:#3A2311}
.cab-e{font-size:26px;line-height:1}
.cab-t{font-size:12.5px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
.cab-s{font-size:10.5px;opacity:.78;margin-top:2px;line-height:1.3}
/* ---- press room ---- */
.press{display:grid;gap:10px}
.press-c{display:flex;gap:11px;background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--shadow);

  display:flex;align-items:center;justify-content:center;font-size:20px}
.press-b{flex:1;min-width:0}
.press-n{font-size:13px;font-weight:800;color:var(--pc)}
.press-r{font-size:10.5px;color:var(--label3);margin-bottom:5px}
.press-q{font-size:14px;line-height:1.55;color:var(--label)}
/* ---- build-up ---- */
.bu{background:linear-gradient(140deg,#10233F,#0A1526);border-radius:15px;padding:14px;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.08)}
.bu-t{font-size:10px;font-weight:900;letter-spacing:.16em;color:#7FB3FF}
.bu-h{font-size:19px;font-weight:800;color:#fff;margin:4px 0 10px}
.bu-r{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.bu-r:first-of-type{border-top:none}
.bu-lab{flex:0 0 76px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em}
.bu-v{flex:1;font-size:14px;color:#fff;font-weight:600}
.bu-form{display:flex;gap:3px}
.bu-form i{width:15px;height:15px;border-radius:4px;font-style:normal;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:#fff}
.bu-form i.W{background:#30D158}.bu-form i.D{background:#8D9BB5}.bu-form i.L{background:#FF453A}
.totw-r{position:absolute;top:-4px;left:-4px;min-width:24px;height:17px;border-radius:5px;
  font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.totw-p{position:relative}

.aw-cap{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.aw-em{font-size:23px}
.aw-cap b{display:block;font-size:15.5px;font-weight:800}
.aw-cap i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.aw-pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;padding:14px 10px 16px}
.aw-slot{text-align:center;cursor:pointer;padding:8px 4px;border-radius:12px}
.aw-slot:active{background:var(--fill)}
.aw-slot.empty{visibility:hidden}
.aw-slot .av{margin:0 auto}
.aw-medal{font-size:20px;margin-bottom:4px}
.aw-slot.p1{background:color-mix(in srgb,#F4C048 14%,transparent);padding-top:12px;padding-bottom:20px}
.aw-n{font-size:13px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aw-slot.p1 .aw-n{font-size:14.5px;font-weight:800}
.aw-v{font-size:11px;color:var(--label3);margin-top:2px}
/* ================= GAMES ================= */
.g-hero{background:linear-gradient(140deg,#1B2A4A,#0D1524);border-radius:16px;padding:22px 16px;text-align:center;
  box-shadow:var(--shadow)}
.g-hero.alt{background:linear-gradient(140deg,#2B1240,#160A22)}
.g-hero-e{font-size:44px}
.g-hero-t{font-size:25px;font-weight:900;color:#fff;letter-spacing:-.03em;margin-top:6px}
.g-hero-s{font-size:13.5px;color:rgba(255,255,255,.62);margin-top:6px;line-height:1.5}
.g-bar{height:5px;border-radius:5px;background:var(--fill2);overflow:hidden;margin-bottom:9px}
.g-bar-f{height:100%;background:var(--tint);transition:width .3s cubic-bezier(.32,.72,0,1)}
.g-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--label3);margin-bottom:14px}
.g-q{font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-.02em;margin-bottom:16px}
.g-opts{display:grid;gap:9px}
.g-opt{background:var(--card);border:1.5px solid var(--sep);border-radius:13px;padding:14px;font-size:15.5px;
  font-weight:600;color:var(--label);text-align:left;cursor:pointer;transition:transform .1s,background .18s}
.g-opt:active{transform:scale(.985)}
.g-opt.right{background:color-mix(in srgb,var(--green) 18%,var(--card));border-color:var(--green);color:var(--green)}
.g-opt.wrong{background:color-mix(in srgb,var(--red) 16%,var(--card));border-color:var(--red);color:var(--red)}
.g-opt.dim{opacity:.45}
.g-result{text-align:center;padding:26px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.g-res-e{font-size:52px}
.g-res-b{font-size:40px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.g-res-s{font-size:14.5px;color:var(--label2);margin-top:4px}
.g-clues{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:4px}
.g-clue{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:.5px solid var(--sep);
  animation:in .25s ease}
.g-clue:last-child{border-bottom:none}
.g-clue span{color:var(--label2);font-size:14px}
.g-clue b{font-size:15px;font-weight:800}

/* ---- Who Am I ---- */
.wai{background:linear-gradient(150deg,#2B1240,#160A22);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow)}
.wai-t{font-size:11px;font-weight:900;letter-spacing:.16em;color:#C084FC;text-transform:uppercase}
.wai-clubs{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.wai-c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;
  border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600}
.wai-hint{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.5}
.wai-in{width:100%;margin-top:12px;background:var(--card);border:1.5px solid var(--sep);border-radius:13px;
  padding:14px;font-size:17px;font-weight:600;color:var(--label)}
.wai-in:focus{border-color:var(--tint);outline:none}
.wai-res{margin-top:12px;border-radius:13px;padding:15px;text-align:center;font-size:16px}
.wai-res.ok{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.wai-res.no{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:-1px;z-index:9999;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:linear-gradient(165deg,#1E7F45,#12652F 55%,#0A4A22);
  transition:opacity .38s ease,visibility .38s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.sp-badge{animation:spPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes spPop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
.sp-name{color:#fff;font-size:20px;font-weight:800;letter-spacing:-.02em;opacity:.94}
.sp-dots{display:flex;gap:6px}
.sp-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);
  animation:spD 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}
.sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes spD{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.sp-badge,.sp-dots i{animation:none}}
/* ================= SKELETON ================= */
.skel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.skel-r{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.skel-r:last-child{border-bottom:none}
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 37%,var(--fill) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:6px}
.sk.circle{border-radius:50%;flex:0 0 auto}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
/* ================= SEASON TINT ================= */
body[data-season="1"]{--seasonA:#0A84FF;--seasonB:#5E5CE6}
body[data-season="2"]{--seasonA:#FF9500;--seasonB:#FF375F}
body[data-season="3"]{--seasonA:#30D158;--seasonB:#00C7BE}
body[data-season="4"]{--seasonA:#BF5AF2;--seasonB:#FF2D55}
body[data-season="5"]{--seasonA:#FFD60A;--seasonB:#FF9F0A}
/* the season tint now shows as a thin rule under the title, so the heading
   itself stays solid black and the emoji renders properly */
.largetitle{color:var(--label)}
.subtitle{position:relative}

/* ================= BETTING (Sky Bet look) ================= */
.sb-banner{display:flex;align-items:center;justify-content:space-between;background:#0B1B33;
  border-radius:11px;padding:9px 13px;margin-bottom:12px}
.sb-banner span{font-size:9.5px;font-weight:900;letter-spacing:.13em;color:#7FB3FF}
.sb-banner b{font-size:14px;font-weight:800;color:#fff}
.sb-pick{margin-bottom:12px}
.sb-lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--label3);
  text-transform:uppercase;margin-bottom:7px}
.sb-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.sb-scroll::-webkit-scrollbar{display:none}
.sb-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--sep);
  border-radius:22px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600;color:var(--label);cursor:pointer}
.sb-chip.on{border-color:#1B7A3E;background:color-mix(in srgb,#1B7A3E 12%,var(--card))}
.sb-head{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,#0B1B33,#12294A);
  border-radius:13px;padding:12px 14px;margin-bottom:10px}
.sb-h-t b{display:flex;align-items:center;color:#fff;font-size:18px;font-weight:800}
.sb-h-t span{display:block;color:rgba(255,255,255,.6);font-size:12.5px;margin-top:2px}
.sb-list{background:var(--card);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.sb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:12px 13px;background:none;border:none;border-bottom:.5px solid var(--sep);cursor:pointer;text-align:left}
.sb-row:last-child{border-bottom:none}
.sb-row:active{background:var(--fill)}
.sb-row.on{background:color-mix(in srgb,#1B7A3E 10%,transparent)}
.sb-m b{display:block;font-size:14.5px;font-weight:700;color:var(--label)}
.sb-m i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.sb-o{flex:0 0 auto;min-width:58px;text-align:center;background:#1B7A3E;color:#fff;border-radius:8px;
  padding:8px 6px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sb-row.on .sb-o{background:#0F5C2C;box-shadow:0 0 0 2px rgba(27,122,62,.35)}
.sb-wallet{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
.sb-wallet>div{padding:11px 6px;text-align:center;border-right:1px solid var(--sep)}
.sb-wallet>div:last-child{border-right:none}
.sb-wallet b{display:block;font-size:18px;font-weight:800;color:var(--tint)}
.sb-wallet span{font-size:9.5px;font-weight:700;color:var(--label3);letter-spacing:.05em;text-transform:uppercase}
.sb-x{background:var(--fill);border:none;border-radius:18px;padding:6px 11px;font-size:12px;
  font-weight:700;color:var(--red);cursor:pointer;flex:0 0 auto}
.sb-res{font-size:13px;font-weight:800;padding:3px 9px;border-radius:7px}
.sb-res.won{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.sb-res.lost{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.sb-res.void{background:var(--fill2);color:var(--label3)}
/* the slip that slides up when you pick a price */
.sb-slip{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:.5px solid var(--sep);box-shadow:0 -10px 26px rgba(0,0,0,.2);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.32,.72,0,1)}
.sb-slip-t{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--label2)}
.sb-slip-t b{color:var(--label)}
.sb-slip-t span{margin-left:auto;background:#1B7A3E;color:#fff;border-radius:7px;padding:4px 9px;
  font-weight:800;font-variant-numeric:tabular-nums}
.sb-stake{display:flex;gap:7px;margin:10px 0}
.sb-stake button{flex:1;background:var(--fill);border:none;border-radius:9px;padding:9px 0;
  font-size:14px;font-weight:700;color:var(--label2);cursor:pointer}
.sb-stake button.on{background:var(--label);color:var(--bg)}
.sb-slip-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sb-slip-b div{font-size:13.5px;color:var(--label2)}
.sb-slip-b b{font-size:17px;color:var(--label);font-weight:800}
@media(min-width:900px){.sb-slip{left:auto;right:24px;bottom:24px;width:380px;border-radius:16px;border:1px solid var(--sep)}}

/* ---- chemistry matrix ---- */
.cm-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;font-size:11.5px;color:var(--label3)}
.cm-sw{width:15px;height:15px;border-radius:4px;display:inline-block}
.cm-sw.cm-none{background:var(--fill2)}
.cm-legend i{font-style:normal;margin-right:8px}
.cm-wrap{padding:4px}
table.cm{border-collapse:separate;border-spacing:2px}
table.cm .cg-h{min-width:38px;text-align:center;font-size:9.5px;font-weight:800;color:var(--label3);padding:4px 2px}
table.cm .cg-h .cg-av{display:block;margin:0 auto 2px}
table.cm .cg-n{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:4px 8px 4px 4px;
  white-space:nowrap;display:flex;align-items:center;gap:6px}
table.cm .cg-n b{font-size:12.5px;font-weight:700}
table.cm .cg-n i{font-style:normal;font-size:10px;color:var(--label3);margin-left:auto;
  background:var(--fill);border-radius:5px;padding:1px 5px}
table.cm .cg-c{width:38px;height:34px;text-align:center;font-size:11.5px;font-weight:800;color:#fff;
  border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
table.cm .cg-c.hot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
table.cm .cg-x{background:var(--fill2);border-radius:6px}
table.cm .cg-e{background:var(--fill);border-radius:6px}
table.cm .cg-corner{position:sticky;left:0;background:var(--card);z-index:2}

.sb-grp{font-size:10.5px;font-weight:900;letter-spacing:.11em;color:var(--label3);
  text-transform:uppercase;margin:14px 2px 7px}
.sb-pnl{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;margin:6px 0 4px}
.sb-pnl>div{padding:10px 4px;text-align:center;border-right:1px solid var(--sep)}
.sb-pnl>div:last-child{border-right:none}
.sb-pnl b{display:block;font-size:15.5px;font-weight:800}
.sb-pnl span{font-size:9px;font-weight:700;color:var(--label3);letter-spacing:.04em;text-transform:uppercase}
.sb-wallet b.up{color:var(--green)} .sb-wallet b.dn{color:var(--red)}

.sb-slip-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sb-slip-h b{font-size:15px}
.sb-slip-odds{background:#1B7A3E;color:#fff;border-radius:7px;padding:4px 10px;font-weight:800;
  font-variant-numeric:tabular-nums;font-size:15px}
.sb-clear{margin-left:auto;background:none;border:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer}
.sb-picks{max-height:132px;overflow-y:auto;margin-bottom:9px}
.sb-pk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:13px}
.sb-pk:last-child{border-bottom:none}
.sb-pk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label2)}
.sb-pk b{font-variant-numeric:tabular-nums}
.sb-pk button{background:none;border:none;color:var(--label3);font-size:14px;cursor:pointer;padding:0 2px}
.sb-tip{font-size:11.5px;color:var(--label3);text-align:center;margin-top:8px}
.sb-legs{display:flex;flex-direction:column;gap:2px;margin:3px 0 2px}
.sb-legs span{font-size:11.5px;color:var(--label3)}
.sb-legs i{font-style:normal;font-weight:700;color:var(--label2)}

.sb-signin{background:var(--card);border-radius:16px;padding:26px 18px;text-align:center;box-shadow:var(--shadow)}
.sb-si-e{font-size:42px}
.sb-si-t{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.sb-si-s{font-size:13.5px;color:var(--label2);margin-top:7px;line-height:1.55}
.sb-bust{background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 32%,transparent);
  border-radius:14px;padding:14px;margin:10px 0}
.sb-bust b{display:block;font-size:15.5px}
.sb-bust span{display:block;font-size:13px;color:var(--label2);margin-top:3px;line-height:1.5}

/* fill the full screen including the safe areas */
#splash{height:100svh;min-height:100%}
@supports (height:100dvh){ #splash{height:100dvh} }
.side{min-height:100svh}
@supports (height:100dvh){ .side{min-height:100dvh} }
/* the drawer and page should paint behind the home indicator, not stop short */
.main{min-height:100svh;background:var(--bg)}
@supports (height:100dvh){ .main{min-height:100dvh} }
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);
  background:var(--bg);z-index:1;pointer-events:none}
body.drawer::after{background:var(--card)}

/* ================= SHOP ================= */
.wal{display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(120deg,#10233F,#0A1526);border-radius:14px;padding:13px 15px;margin-bottom:6px}
.wal-l{font-size:9.5px;font-weight:900;letter-spacing:.14em;color:#7FB3FF}
.wal-v{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.1}
.wal-r{display:flex;gap:16px;text-align:right}
.wal-r b{display:block;font-size:14px;font-weight:800;color:#fff}
.wal-r span{font-size:9.5px;color:rgba(255,255,255,.45);letter-spacing:.05em;text-transform:uppercase}
.wal-note{font-size:11.5px;color:var(--label3);padding:0 4px 10px;line-height:1.5}
.row.boot-on{background:color-mix(in srgb,var(--green) 9%,transparent)}
.sp-bar{height:7px;border-radius:5px;background:var(--fill2);overflow:hidden;margin-top:10px}
.sp-bar div{height:100%;border-radius:5px;transition:width .4s cubic-bezier(.32,.72,0,1)}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-item{background:var(--card);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;border:1.5px solid transparent}
.sh-item.on{border-color:var(--tint)}
.sh-sw{height:66px;position:relative}
.sh-eq{position:absolute;top:6px;left:6px;background:var(--tint);color:#fff;font-size:8.5px;
  font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:12px}
.sh-b{padding:9px 10px}
.sh-n{font-size:13.5px;font-weight:700}
.sh-d{font-size:11px;color:var(--label3);margin-top:1px;line-height:1.35;min-height:29px}
.sh-p{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.sh-price{font-size:13px;font-weight:800;color:var(--tint)}
.sh-price.no{color:var(--label3)}
.sh-owned{font-size:11px;font-weight:700;color:var(--green)}
.sh-buy{background:var(--tint);color:#fff;border:none;border-radius:16px;padding:5px 12px;
  font-size:11.5px;font-weight:800;cursor:pointer}
.sh-buy:disabled{background:var(--fill2);color:var(--label3)}
.sh-buy.sec{background:var(--fill2);color:var(--label2)}

/* cosmetics applied to the real player card */
.fut.cf-carbon{border:2px solid #3a3a3c;box-shadow:0 0 0 1px #1c1c1e inset,0 14px 40px rgba(0,0,0,.4)}
.fut.cf-chrome{border:2px solid transparent;background-clip:padding-box;
  box-shadow:0 0 0 2px #c7ced6,0 14px 40px rgba(0,0,0,.34)}
.fut.cf-emerald{box-shadow:0 0 0 2px #1DB954,0 14px 40px rgba(29,185,84,.28)}
.fut.cf-ruby{box-shadow:0 0 0 2px #E63946,0 14px 40px rgba(230,57,70,.28)}
.fut.cf-gold{box-shadow:0 0 0 2.5px #F4C048,0 14px 44px rgba(244,192,72,.36)}
.fut.cf-obsidian{box-shadow:0 0 0 2px #7b5cff,0 14px 44px rgba(123,92,255,.3)}
.fut.cf-aurora{box-shadow:0 0 0 3px transparent,0 14px 44px rgba(0,198,255,.3);
  background-image:linear-gradient(115deg,rgba(0,198,255,.35),rgba(123,47,247,.3),rgba(0,255,163,.3)),
    linear-gradient(168deg,#22242C,#0D0E12)}
.fut.cf-holo{box-shadow:0 0 0 3px transparent,0 16px 46px rgba(0,0,0,.35);
  background-image:linear-gradient(115deg,rgba(255,154,158,.5),rgba(161,196,253,.45),rgba(194,255,216,.45),rgba(251,194,235,.5)),
    linear-gradient(168deg,#22242C,#0D0E12)}
.fut.cb-night{background-image:radial-gradient(70% 45% at 50% 0,rgba(120,180,255,.3),transparent 60%),linear-gradient(160deg,#0B1B33,#132B4D)}
.fut.cb-stands{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 3px,transparent 3px 8px),linear-gradient(160deg,#2b2b30,#16161a)}
.fut.cb-retro{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 3px,transparent 3px 6px),linear-gradient(160deg,#1a2b1a,#0d160d)}
.fut.cb-smoke{background-image:radial-gradient(60% 70% at 30% 30%,rgba(255,255,255,.22),transparent 62%),linear-gradient(160deg,#3a3a40,#141416)}
.fut.cb-sunset{background-image:linear-gradient(160deg,rgba(255,149,0,.55),rgba(255,55,95,.4) 55%,rgba(0,0,0,.9))}

/* ---- one palette per style, used by the swatch, the frame and the background ---- */
.sw-f_base,.sw-b_base{background:linear-gradient(150deg,#3A3A3C,#1C1C1E)}

/* ---- Admin = whoever has entered the password. When NOT hosted (no Supabase),
   the app is fully local and you're always the admin. When hosted, the password
   both unlocks editing AND is what lets writes reach the shared database. ---- */
/* The password is stored as a hash so it isn't sitting in the page source as
   plain text. This raises the bar against casual snooping — it is NOT real
   security, because the check still happens in the browser. */
const ADMIN_PIN_HASH='9642e13c';
function pinHash(v){
  let h=0x811c9dc5;
  const t=String(v||'').trim().toUpperCase();
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return h.toString(16).padStart(8,'0');
}
function pinSaved(){
  /* localStorage survives closing the browser; sessionStorage is a fallback for
     locked-down browsers that block it. */
  try{ if(localStorage.getItem('ss_pin')==='1')return true }catch(e){}
  try{ if(sessionStorage.getItem('ss_pin')==='1')return true }catch(e){}
  return false;
}

  if(pinHash(v)===ADMIN_PIN_HASH){

    try{sessionStorage.setItem('ss_pin','1')}catch(e){}
    applyAdminClass(); render(); toast('🔓 Admin unlocked');
  } else { toast('Incorrect password'); }
}

async function initSupa(){
  if(!supa)return;
  applyAdminClass();
  /* ---- in-app keep-alive ----
     Any visit pings the database, which resets Supabase's 7-day pause timer.
     This covers the season well (someone opens the link most weeks) but it can
     only run while a page is open — the GitHub Action covers the quiet gaps. */
  const ping=()=>{ try{ supa.from('tracker_kv').select('key').limit(1)
      .then(({error})=>{ if(!error)markSync(); }); }catch(e){} };
  ping();                                            // on load
  setInterval(ping, 25*60*1000);                     // every 25 min while open
  document.addEventListener('visibilitychange',()=>{ // when you come back to the tab
    if(document.visibilityState==='visible')ping();
  });
  supa.channel('kv-sync').on('postgres_changes',{event:'*',schema:'public',table:'tracker_kv',filter:`key=eq.${MAIN_KEY}`},
    payload=>{ if(payload.new&&payload.new.value){
      const incoming=payload.new.value;
      if(!incoming.seasons||!incoming.seasons.length)return;           // malformed — ignore
      if(!writeIsSafe(incoming)&&dbSize(DB)>dbSize(incoming)){          // a wipe arriving from elsewhere
        toast('⚠️ Ignored an update that would have emptied the season'); return;
      }
      const sheetOpen=$('#sbg')&&$('#sbg').classList.contains('open');
      DB=incoming; if(!DB.current||!DB.seasons?.some(s=>s.id===DB.current))DB.current=DB.seasons?.[0]?.id;
      CUR=DB.current; if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
      if(payload.new.updated_at)REMOTE_STAMP=payload.new.updated_at;
      saveMirror(DB);
      if(!sheetOpen)render();
    }}).subscribe();
}

/* ============================================================
   SAFETY NET — a local mirror of the last known-good data.
   Written on every successful load and save. If the cloud ever comes
   back empty or unreachable, this is what stops a wipe.
   ============================================================ */
const MIRROR_KEY='ss_mirror_v1', MIRROR_HIST='ss_mirror_hist_v1';
function dbSize(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.games||[]).length),0)}catch(e){return 0} }
function dbPlayers(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.players||[]).length),0)}catch(e){return 0} }
function saveMirror(d){
  /* never let an accidental emptying overwrite the good local copy */
  if(!WIPE_OK && !writeIsSafe(d)) return;
  try{
    const rec={t:Date.now(),games:dbSize(d),players:dbPlayers(d),db:d};
    localStorage.setItem(MIRROR_KEY,JSON.stringify(rec));
    /* keep a rolling set of older snapshots too, in case the newest is already bad */
    let hist=[];try{hist=JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){}
    const last=hist[hist.length-1];
    if(!last||last.games!==rec.games||Date.now()-last.t>6*3600*1000){
      hist.push({t:rec.t,games:rec.games,players:rec.players,db:d});
      while(hist.length>5)hist.shift();
      try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(e){
        hist=hist.slice(-2);try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(_){}
      }
    }
  }catch(e){}
}
function readMirror(){ try{return JSON.parse(localStorage.getItem(MIRROR_KEY)||'null')}catch(e){return null} }
function mirrorHistory(){ try{return JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){return []} }
/* Guard: refuse a write that would destroy far more than it should. */
function writeIsSafe(next){
  const m=readMirror(); if(!m)return true;
  const now=dbSize(next), was=m.games;
  if(was>=3 && now===0) return false;              // everything vanished
  if(was>=10 && now < was*0.5) return false;       // more than half gone at once
  return true;
}

const Store={
  mem:{},
  hasWS:(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'),
  hasLS:(function(){try{localStorage.setItem('__p','1');localStorage.removeItem('__p');return true}catch(e){return false}})(),
  tier(){return supaConfigured?'cloud':this.hasWS?'app':this.hasLS?'browser':'memory'},
  async get(k){
    if(supaConfigured&&supa&&k===MAIN_KEY){
      try{const {data,error}=await supa.from('tracker_kv').select('value,updated_at').eq('key',k).maybeSingle();
        if(error){CLOUD_FAIL='The database did not respond ('+(error.message||'error')+')';hbPush(false);return null}
        CLOUD_FAIL=null; markSync(); hbPush(true);
        if(data){ REMOTE_STAMP=data.updated_at||null; return data.value; }
        /* genuinely empty: a brand-new project with no row yet */
        CLOUD_EMPTY=true; return null;
      }catch(e){ CLOUD_FAIL='Could not reach the database'; return null; }
    }
    if(this.hasWS){try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch(e){}}
    if(this.hasLS){try{const v=localStorage.getItem('st_'+k);if(v!==null)return JSON.parse(v)}catch(e){}}
    return (k in this.mem)?JSON.parse(this.mem[k]):null},
  async set(k,v){const s=JSON.stringify(v);this.mem[k]=s;
    if(supaConfigured&&supa&&k===MAIN_KEY){
      if(CLOUD_FAIL){ toast('⛔️ Not saved — the database is unreachable, so your data is protected'); return; }
      if(!writeIsSafe(v)&&!WIPE_OK){
        toast('🛑 Blocked: that would erase most of your season. Use Admin → Restore if this was intended.');
        return;
      }
      try{
        /* concurrency guard: if someone else saved after we loaded, don't clobber it */
        if(REMOTE_STAMP){
          const chk=await supa.from('tracker_kv').select('updated_at').eq('key',k).maybeSingle();
          if(!chk.error&&chk.data&&chk.data.updated_at&&chk.data.updated_at>REMOTE_STAMP){
            CONFLICT=chk.data.updated_at;
            toast('⚠️ Someone else saved a change — reload before editing so nothing is lost');
            return;
          }
        }
        const stamp=new Date().toISOString();
        const {error}=await supa.from('tracker_kv').upsert({key:k,value:v,updated_at:stamp});
        if(!error){ REMOTE_STAMP=stamp; CONFLICT=null; saveMirror(v); markSync(); return; }
        toast('⚠️ Could not save to the cloud — check your connection'); return;
      }catch(e){ toast('⚠️ Cloud save failed — check your connection'); return; }
    }
    if(k===MAIN_KEY)saveMirror(v);
    if(this.hasWS){try{await window.storage.set(k,s)}catch(e){}}
    if(this.hasLS){try{localStorage.setItem('st_'+k,s)}catch(e){}}}
};

const SYNC_KEY='ss_last_sync';
function markSync(){ try{localStorage.setItem(SYNC_KEY,String(Date.now()))}catch(e){} }

const daysSince=t=>t?Math.floor((Date.now()-t)/86400000):null;
/* ---- monitoring dashboard (Datadog-style) ---- */
const HB_KEY='ss_hb_v1';               // rolling record of connection checks
function hbPush(ok){
  try{
    let h=[];try{h=JSON.parse(localStorage.getItem(HB_KEY)||'[]')}catch(e){}
    h.push({t:Date.now(),ok:!!ok});
    while(h.length>40)h.shift();
    localStorage.setItem(HB_KEY,JSON.stringify(h));
  }catch(e){}
}
function hbList(){ try{return JSON.parse(localStorage.getItem(HB_KEY)||'[]')}catch(e){return []} }
function monitors(){
  const sync=lastSync(), bk=lastBackup(), mir=readMirror(), snaps=mirrorHistory();
  const sd=daysSince(sync), bd=daysSince(bk);
  const M=[];
  const S=(level,label,value,detail)=>({level,label,value,detail});
  // 1. database
  if(!supaConfigured) M.push(S('info','Database','LOCAL ONLY','Not hosted — data lives on this device only'));
  else if(CLOUD_FAIL) M.push(S('crit','Database','UNREACHABLE',CLOUD_FAIL));
  else M.push(S('ok','Database','CONNECTED',sync?`Last successful call ${fmtWhen(sync)}`:'Responding normally'));
  // 2. pause watch
  if(supaConfigured){
    const d=sd===null?99:sd;
    M.push(d>=6?S('crit','Pause watch',`${d} DAYS IDLE`,'Supabase pauses free projects around 7 days — open the app or check the keep-alive')
      :d>=4?S('warn','Pause watch',`${d} DAYS IDLE`,'Getting close to the 7-day pause window')
      :S('ok','Pause watch',`${d} DAY${d===1?'':'S'} IDLE`,'Comfortably inside the 7-day window'));
  }
  // 3. write protection
  M.push(CLOUD_FAIL?S('warn','Write protection','ENGAGED','Saving is blocked so nothing can overwrite your data')
    :S('ok','Write protection','ARMED','Blocks any save that would erase the season'));
  // 4. local mirror
  M.push(mir&&mir.games!=null
    ? S('ok','Local mirror',`${mir.games} GAME${mir.games===1?'':'S'}`,`Mirrored ${fmtWhen(mir.t)}`)
    : S('warn','Local mirror','EMPTY','Will populate the next time data loads'));
  // 5. snapshots
  M.push(snaps.length>=1?S('ok','Snapshots',`${snaps.length} KEPT`,snaps.length>1?'Restorable from Admin → Safety net':'More build up as you log games')
    :S('warn','Snapshots','NONE YET','They start saving the first time data loads'));
  // 6. offsite backup
  M.push(bd===null?S('crit','Offsite backup','NEVER','Download one and email it to yourself')
    :bd>45?S('warn','Offsite backup',`${bd} DAYS OLD`,'Worth downloading a fresh copy')
    :S('ok','Offsite backup',`${bd} DAY${bd===1?'':'S'} OLD`,'Recent enough'));
  // 7. conflicts
  if(CONFLICT)M.push(S('warn','Sync conflict','DETECTED','Another device saved after you loaded — reload before editing'));
  return M;
}

async function restoreSnapshot(i){
  if(!requireAdmin())return;
  const h=mirrorHistory(),x=h[i]; if(!x){toast('Snapshot not found');return}
  if(!await askConfirm('Restore this snapshot?',
     `${x.games} games and ${x.players} players from ${fmtWhen(x.t)}. This replaces what's there now.`,
     'Restore',true))return;
  snapshot('restoring a snapshot');
  WIPE_OK=true; DB=x.db; CUR=DB.current||DB.seasons[0].id;
  if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
  await save(); WIPE_OK=false; render(); toast('✅ Snapshot restored');
}
async function pushMirrorToCloud(){
  if(!requireAdmin())return;
  const rec=RECOVERED||readMirror(); if(!rec){toast('No local copy found');return}
  if(!await askConfirm('Restore to the cloud?',
     `This will write your local copy (${rec.games} games, ${rec.players} players) back to the database, replacing whatever is there now.`,
     'Restore',false))return;
  CLOUD_FAIL=null; WIPE_OK=true;
  DB=rec.db; CUR=DB.current||DB.seasons[0].id;
  if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
  await save(); WIPE_OK=false;
  if(CLOUD_FAIL){toast('Still cannot reach the database');render();return}
  RECOVERED=null; render(); toast('✅ Your data is back in the cloud');
}
async function retryCloud(){
  CLOUD_FAIL=null; toast('Reconnecting…');
  const fresh=await Store.get(MAIN_KEY);
  if(CLOUD_FAIL){ render(); toast('Still cannot reach the database'); return; }
  if(fresh&&fresh.seasons&&fresh.seasons.length){
    DB=fresh; CUR=DB.current||DB.seasons[0].id;
    if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
    render(); toast('✅ Reconnected — your data is back');
  } else { render(); toast('Connected, but the database is empty'); }
}

/* Player of the Month — goals and clean sheets weighted equally so
   keepers and defenders can win it too. */
function potm(){
  const g=allGames().filter(x=>x.date);
  const months={};
  g.forEach(x=>{const k=(x.date||'').slice(0,7); if(!k)return; (months[k]=months[k]||[]).push(x)});
  const out=[];
  Object.keys(months).sort().forEach(k=>{
    const gl=months[k], m={};
    gl.forEach(x=>{
      [['A',x.teamA,x.scoreA,x.scoreB],['B',x.teamB,x.scoreB,x.scoreA]].forEach(([sd,team,gf,ga])=>{
        (team||[]).forEach(pid=>{
          const p=player(pid); if(!p)return;
          const e=m[pid]=m[pid]||{id:pid,name:p.name,pos:p.pos,P:0,W:0,D:0,L:0,G:0,cs:0,pts:0};
          e.P++; e.G+=(x.goals&&x.goals[pid])||0;
          if((ga??0)===0)e.cs++;
          if(x.result==='D'){e.D++;e.pts++} else if(x.result===sd){e.W++;e.pts+=3} else e.L++;
        })});
    });
    const arr=Object.values(m).filter(x=>x.P>=2);
    if(!arr.length)return;
    arr.forEach(x=>x.score=x.pts + x.G*1.5 + x.cs*1.5 + x.P*0.25);
    arr.sort((a,b)=>b.score-a.score||(b.G+b.cs)-(a.G+a.cs));
    out.push({month:k,games:gl.length,win:arr[0],runners:arr.slice(1,3)});
  });
  return out.reverse();
}

/* summary for any season — used by League history, Hall of Fame and season comparison.
   NOTE: keep this near the top of the view layer; it is referenced from several places. */
function seasonSummary(s){

/* ============ BRACKET ============ */
function seedOrder(size){let a=[1,2];while(a.length<size){const m=a.length*2+1,o=[];a.forEach(x=>{o.push(x,m-x)});a=o}return a}
function buildBracket(ids){
  const n=ids.length;if(n<2)return null;
  let size=1;while(size<n)size*=2;
  const seeds=[...ids];while(seeds.length<size)seeds.push(null);
  const ord=seedOrder(size),slots=ord.map(i=>seeds[i-1]||null);
  const rounds=[];let first=[];
  for(let i=0;i<size;i+=2)first.push({id:uid(),a:slots[i],b:slots[i+1],sa:null,sb:null,done:false});
  rounds.push(first);let c=size/2;
  while(c>1){c/=2;rounds.push(Array.from({length:c},()=>({id:uid(),a:null,b:null,sa:null,sb:null,done:false})))}
  const bk={rounds};resolveByes(bk);return bk;
}
function resolveByes(bk){
  // Byes only exist in the seeding round (odd team counts). A later match with one
  // slot filled is simply awaiting its opponent — never auto-complete it.
  const rd=bk.rounds[0];
  rd.forEach((m,mi)=>{
    if(m.done)return;
    if(m.a&&!m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.a)}
    else if(!m.a&&m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.b)}
  });
}
function advance(bk,ri,mi,winner){
  const nr=bk.rounds[ri+1];if(!nr)return;
  const t=nr[Math.floor(mi/2)];if(!t)return;
  if(mi%2===0)t.a=winner;else t.b=winner;
  resolveByes(bk);
}
function bracketRoundName(bk,ri){
  const left=bk.rounds.length-ri;
  return ['Final','Semi-finals','Quarter-finals','Round of 16','Round of 32','Round of 64'][left-1]||`Round ${ri+1}`;
}
function bracketWinner(bk){
  if(!bk?.rounds?.length)return null;
  const f=bk.rounds[bk.rounds.length-1][0];
  if(!f?.done)return null;
  return f.sa===f.sb?null:(f.sa>f.sb?f.a:f.b);
}

/* ============ GROUPS ============ */
function roundRobin(ids){
  const l=[...ids];if(l.length<2)return [];
  if(l.length%2)l.push(null);
  const n=l.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=l[i],b=l[n-1-i];
      if(a&&b)out.push({id:uid(),a,b,sa:null,sb:null,done:false,rd:r+1})}
    l.splice(1,0,l.pop());
  }
  return out;
}
function groupTable(c,gid){
  const ids=(c.groups?.[gid])||[];
  const m={};ids.forEach(t=>m[t]={id:t,P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0});
  (c.fixtures||[]).filter(f=>f.g===gid&&f.done).forEach(f=>{
    const A=m[f.a],B=m[f.b];if(!A||!B)return;
    A.P++;B.P++;A.GF+=f.sa;A.GA+=f.sb;B.GF+=f.sb;B.GA+=f.sa;
    if(f.sa>f.sb){A.W++;A.pts+=3;B.L++}else if(f.sb>f.sa){B.W++;B.pts+=3;A.L++}else{A.D++;B.D++;A.pts++;B.pts++}
  });
  return Object.values(m).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.pts-a.pts||b.GD-a.GD||b.GF-a.GF);
}

/* ============ PLAYER STATS (league + overall) ============ */
function statsFor(games,upto){
  const S=season(),list=upto==null?games:games.slice(0,upto+1),m={};
  S.players.forEach(p=>m[p.id]={...p,P:0,W:0,D:0,L:0,G:0,GF:0,GA:0,pts:0,seq:[]});
  list.forEach(g=>{const a=g.scoreA??0,b=g.scoreB??0;
    [['A',g.teamA,a,b],['B',g.teamB,b,a]].forEach(([sd,tm,gf,ga])=>(tm||[]).forEach(pid=>{
      const x=m[pid];if(!x)return;x.P++;x.GF+=gf;x.GA+=ga;x.G+=(g.goals&&g.goals[pid])||0;
      let r;if(g.result==='D'){x.D++;x.pts++;r='D'}else if(g.result===sd){x.W++;x.pts+=3;r='W'}else{x.L++;r='L'}
      x.seq.push({r,gf,ga,goals:(g.goals&&g.goals[pid])||0,gid:g.id,date:g.date})}))});
  const arr=Object.values(m);
  arr.forEach(x=>{x.GD=x.GF-x.GA;x.ppg=x.P?x.pts/x.P:0;x.gpg=x.P?x.G/x.P:0;x.cpg=x.P?x.GA/x.P:0;
    x.wr=x.P?x.W/x.P:0;x.app=list.length?x.P/list.length:0;x.cs=x.seq.filter(s=>s.ga===0).length;
    const l5=x.seq.slice(-5);x.last5=l5.map(v=>v.r);
    x.form=l5.length?l5.reduce((s,v)=>s+(v.r==='W'?3:v.r==='D'?1:0),0)/l5.length:0;
    let n=0,t=null;for(let i=x.seq.length-1;i>=0;i--){const r=x.seq[i].r;if(t===null){t=r;n=1}else if(r===t)n++;else break}
    x.streak={type:t,n}});
  const pl=arr.filter(x=>x.P>0);
  if(pl.length){const nm=(k,inv)=>{const v=pl.map(x=>x[k]),lo=Math.min(...v,0),hi=Math.max(...v,0);
    pl.forEach(x=>{const t=hi===lo?0:(x[k]-lo)/(hi-lo);x['_'+k]=inv?1-t:t})};
    ['pts','ppg','wr','G','gpg'].forEach(k=>nm(k));nm('cpg',true);
    pl.forEach(x=>x.index=Math.round((x._pts+x._ppg+x._wr+x._G+x._gpg+x._cpg)/6*100))}
  arr.forEach(x=>{if(x.index===undefined)x.index=0});
  return arr;
}

function careerOf(pid){const m=statsAll().find(x=>x.id===pid);if(!m)return null;
  const base=xpOf(m),ch=chalFor(m),bonus=ch.filter(c=>c.done).reduce((s,c)=>s+c.x,0),xp=base+bonus;

/* ============ MILESTONE FEED ============ */
function feed(){const gl=allGames(),ap={},go_={},ev=[],T=[1,5,10,25,50,100];
  gl.forEach((g,i)=>[...(g.teamA||[]),...(g.teamB||[])].forEach(pid=>{
    ap[pid]=(ap[pid]||0)+1;
    if(T.includes(ap[pid]))ev.push({i,pid,e:'🎖️',t:ap[pid]===1?'Debut':`${ap[pid]} appearances`,date:g.date});
    const n=(g.goals&&g.goals[pid])||0;
    if(n>=3)ev.push({i,pid,e:'🎩',t:`Hat-trick · ${n} goals`,date:g.date});
    if(n>0){const b=go_[pid]||0,a=b+n;T.forEach(t=>{if(b<t&&a>=t)ev.push({i,pid,e:'⚽',t:t===1?'First goal':`${t} career goals`,date:g.date})});go_[pid]=a}
  }));
  return ev.reverse()}

/* ============ SMOOTH REPAINTS ============
   Rebuilding innerHTML throws away the focused input, which is what makes the
   keyboard flicker shut mid-typing and the scroll jump. This keeps both. */
function keepFocus(fn){
  const a=document.activeElement;
  const id=a&&a.id, tag=a&&a.tagName;
  const isField = tag==='INPUT'||tag==='TEXTAREA';
  const selS = isField?a.selectionStart:null, selE = isField?a.selectionEnd:null;
  // remember where each scrollable area was
  const body=document.querySelector('.sbody');
  const bodyTop=body?body.scrollTop:0;
  const winTop=window.scrollY;

  fn();

  if(id){
    const el=document.getElementById(id);
    if(el&&el!==document.activeElement){
      try{
        el.focus({preventScroll:true});
        if(isField&&selS!=null&&el.setSelectionRange)el.setSelectionRange(selS,selE);
      }catch(e){}
    }
  }
  liftFormbar();
  const nb=document.querySelector('.sbody');
  if(nb&&bodyTop)nb.scrollTop=bodyTop;
  if(winTop&&!body)window.scrollTo(0,winTop);
}
/* keep the page behind a sheet from scrolling underneath it */
function lockScroll(on){
  try{
    if(on){ document.body.dataset.sy=String(window.scrollY); document.body.classList.add('sheet-open');
            document.body.style.top=`-${window.scrollY}px`; }
    else { const y=+(document.body.dataset.sy||0);
           document.body.classList.remove('sheet-open'); document.body.style.top='';
           window.scrollTo(0,y); }
  }catch(e){}
}

/* ---- what's within reach next Sunday ---- */
function closingIn(){
  const st=lgStats().filter(x=>x.P>0);
  if(!st.length)return '';
  const out=[];
  st.forEach(x=>{
    const car=careerOf(x.id); if(!car)return;
    // next level
    if(car.lvl.next){
      const need=car.lvl.next.xp-car.xp;
      if(need>0&&need<=180)out.push({id:x.id,name:x.name,e:car.lvl.next.e,
        t:`${need} XP from ${car.lvl.next.t}`,v:need,k:'lvl'});
    }
    // next unfinished challenge that's close
    car.ch.filter(c=>!c.done).forEach(c=>{
      const [cur,tot]=c.f(x); const left=tot-cur;
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:c.e,t:`${left} from “${c.n}”`,v:left,k:'ch'});
    });
  });
  if(!out.length)return '';
  out.sort((a,b)=>a.v-b.v);
  const seen=new Set(),list=[];
  out.forEach(o=>{if(list.length<5&&!seen.has(o.id+o.t)){seen.add(o.id+o.t);list.push(o)}});
  return `<div class="sechead">⏳ Almost there</div>\n    <div class="note" style="padding:0 4px 8px;font-size:12px">A few games or goals away from the next milestone</div>
    <div class="card">${list.map(o=>`<div class="row tap" onclick="openCareer('${o.id}')">
      <div style="font-size:21px;flex:0 0 26px">${o.e}</div>
      <div class="rt"><div class="r1" style="font-size:15px">${esc(o.name)}</div>
        <div class="r2">${esc(o.t)}</div></div>${chev}</div>`).join('')}</div>
    <div class="note">Within touching distance next Sunday.</div>`;
}

  const c=comps().find(x=>x.id===g.compId);

/* ============ FIXTURES ============ */
let FF='all';
let FSORT='new', FPLAYER='all', FRESULT='all', FSEARCH='';
function vFixtures(){ LMODE='fixtures'; go('league'); }
function fixturesBody(){
  let g=allGames();
  if(FF!=='all')g=g.filter(x=>x.compId===FF);
  if(FPLAYER!=='all')g=g.filter(x=>(x.teamA||[]).includes(FPLAYER)||(x.teamB||[]).includes(FPLAYER));
  if(FRESULT!=='all'){
    g=g.filter(x=>{
      if(FRESULT==='draw')return x.result==='D';
      if(FPLAYER==='all')return FRESULT==='big'?Math.abs((x.scoreA||0)-(x.scoreB||0))>=3:true;
      const onA=(x.teamA||[]).includes(FPLAYER),sd=onA?'A':'B';
      if(FRESULT==='win')return x.result===sd;
      if(FRESULT==='loss')return x.result!=='D'&&x.result!==sd;
      return true;
    });
  }
  const q=FSEARCH.trim().toLowerCase();
  if(q)g=g.filter(x=>{
    const names=[...(x.teamA||[]),...(x.teamB||[])].map(p=>player(p)?.name||'').concat(x.fillA||[],x.fillB||[]);
    return names.join(' ').toLowerCase().includes(q)||String(x.round||'').toLowerCase().includes(q);
  });
  const sorted=[...g];
  if(FSORT==='new')sorted.reverse();
  else if(FSORT==='old'){/* already oldest-first */}
  else if(FSORT==='goals')sorted.sort((a,b)=>((b.scoreA||0)+(b.scoreB||0))-((a.scoreA||0)+(a.scoreB||0)));
  else if(FSORT==='margin')sorted.sort((a,b)=>Math.abs((b.scoreA||0)-(b.scoreB||0))-Math.abs((a.scoreA||0)-(a.scoreB||0)));

  const grouped=(FSORT==='new'||FSORT==='old');
  const by={};if(grouped)sorted.forEach(x=>{const k=x.date||'—';(by[k]=by[k]||[]).push(x)});
  const roster=[...season().players].filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const active=(FF!=='all')+(FPLAYER!=='all')+(FRESULT!=='all')+(q?1:0);
  const tot=allGames().length;
  return `
      <button class="btn pri full" data-admin style="margin-bottom:14px" onclick="newGame()">Log a game</button>
      <input class="search" placeholder="Search a player or round…" value="${esc(FSEARCH)}" id="fxq"
        oninput="FSEARCH=this.value;render()" style="margin-bottom:10px">
      <div class="filterbar">
        <select class="fsel" onchange="FF=this.value;render()">
          <option value="all" ${FF==='all'?'selected':''}>All comps</option>
          ${comps().map(c=>`<option value="${c.id}" ${FF===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FPLAYER=this.value;render()">
          <option value="all" ${FPLAYER==='all'?'selected':''}>👥 Everyone</option>
          ${roster.map(p=>`<option value="${p.id}" ${FPLAYER===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FRESULT=this.value;render()">
          <option value="all" ${FRESULT==='all'?'selected':''}>Any result</option>
          ${FPLAYER!=='all'?`<option value="win" ${FRESULT==='win'?'selected':''}>✅ Wins</option>
            <option value="loss" ${FRESULT==='loss'?'selected':''}>❌ Losses</option>`:''}
          <option value="draw" ${FRESULT==='draw'?'selected':''}>🤝 Draws</option>
          ${FPLAYER==='all'?`<option value="big" ${FRESULT==='big'?'selected':''}>💥 Big wins</option>`:''}
        </select>
        <select class="fsel" onchange="FSORT=this.value;render()">
          ${[['new','⏱ Newest'],['old','📜 Oldest'],['goals','⚽ Most goals'],['margin','📊 Biggest margin']]
            .map(([k,l])=>`<option value="${k}" ${FSORT===k?'selected':''}>${l}</option>`).join('')}
        </select>
        ${active?`<button class="fclear" onclick="clearFilters()">✕ Clear ${active}</button>`:''}
      </div>
      ${sorted.length?(grouped

/* ============ iOS-STYLE GESTURES ============ */
/* ============ HISTORY ============
   We snapshot the ACTUAL state you are leaving (which view, which player,
   which tab, where you were scrolled) rather than a fixed destination — so
   Denis's profile → his Career → back lands you on Denis's profile again. */
let BACKSTACK=[];
const NAV_LABEL={home:'Home',league:'League',fixtures:'Fixtures',squad:'Squad',tactics:'Tactics',
  career:'Career',fpl:'Sunday FPL',sky:'Sky Sports',bets:'Betting',shop:'Shop',stats:'Stats',compare:'Compare',history:'Hall of Fame',
  comps:'Competitions',admin:'Admin',player:'Player',pcareer:'Career',match:'Match',seasonView:'Season'};
function viewSnap(){
  return {v:VIEW, pid:app()._pid, gid:app()._gid, sid:app()._sid,
    y:window.scrollY||0,
    t:{FTAB,HMODE,SMODE,CMODE,TAC,SCOMP,PF,SMIN,LADOPEN,POTMOPEN,LVLOPEN}};
}
const trimLabel=t=>{t=String(t||'Back'); return t.length>14?t.slice(0,13).trim()+'…':t};
function labelFor(snap){
  if(!snap)return 'Back';
  if(snap.v==='player'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Player')}
  if(snap.v==='pcareer'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Career')}
  return trimLabel(NAV_LABEL[snap.v]||'Back');
}
function backLabel(){ return labelFor(BACKSTACK[BACKSTACK.length-1]) }
function pushBack(){
  const snap=viewSnap();
  const top=BACKSTACK[BACKSTACK.length-1];
  /* don't stack the same place twice */
  if(top&&top.v===snap.v&&top.pid===snap.pid&&top.gid===snap.gid&&top.sid===snap.sid)return;
  BACKSTACK.push(snap);
  if(BACKSTACK.length>20)BACKSTACK.shift();
}
function goBack(){
  const s=BACKSTACK.pop();
  if(!s){ go('squad'); return; }
  haptic('light');
  VIEW=s.v;
  if(s.pid!=null)app()._pid=s.pid;
  if(s.gid!=null)app()._gid=s.gid;
  if(s.sid!=null)app()._sid=s.sid;
  const t=s.t||{};
  if(t.FTAB!=null)FTAB=t.FTAB; if(t.HMODE!=null)HMODE=t.HMODE; if(t.SMODE!=null)SMODE=t.SMODE;
  if(t.CMODE!=null)CMODE=t.CMODE; if(t.TAC!=null)TAC=t.TAC; if(t.SCOMP!=null)SCOMP=t.SCOMP;
  if(t.PF!=null)PF=t.PF; if(t.SMIN!=null)SMIN=t.SMIN; if(t.LADOPEN!=null)LADOPEN=t.LADOPEN;
  if(t.POTMOPEN!=null)POTMOPEN=t.POTMOPEN; if(t.LVLOPEN!=null)LVLOPEN=t.LVLOPEN;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===VIEW));
  render();
  requestAnimationFrame(()=>window.scrollTo(0,s.y||0));
}

function initGestures(){
  const main=document.querySelector('.main')||document.body;

  /* ---- swipe from left edge to go back ---- */
  let sx=0,sy=0,tracking=false,moved=0;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    tracking=(t.clientX<32);           // only from the left edge, like iOS
    sx=t.clientX;sy=t.clientY;moved=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!tracking||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if(dy>44){tracking=false;main.style.transform='';return}
    if(dx>0){moved=dx; main.style.transform=`translateX(${Math.min(dx*.35,60)}px)`; main.style.opacity=String(1-Math.min(dx/700,.2))}
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!tracking)return; tracking=false;
    main.style.transition='transform .26s cubic-bezier(.32,.72,0,1),opacity .26s';
    main.style.transform='';main.style.opacity='';
    setTimeout(()=>{main.style.transition=''},280);
    if(moved>90){ if(BACKSTACK.length){goBack()} }
    moved=0;
  },{passive:true});

  /* ---- pull to refresh (iOS style: arrow rotates, then becomes a spinner) ---- */
  const ind=document.createElement('div');
  ind.className='ptr';
  ind.innerHTML='<svg class="ptr-a" viewBox="0 0 24 24"><path d="M12 5v14M12 19l-5-5M12 19l5-5"/></svg><div class="ptr-s"></div>';
  document.body.appendChild(ind);
  const TRIG=72;
  let py=0,pulling=false,dist=0,armed=false,busy=false;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||busy)return;
    pulling=(window.scrollY<=0); py=e.touches[0].clientY; dist=0; armed=false;
    ind.style.transition='';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling||e.touches.length!==1)return;
    if($('#sbg').classList.contains('open')||$('#vbg').classList.contains('open')){pulling=false;return}
    dist=e.touches[0].clientY-py;
    if(dist>0&&window.scrollY<=0){
      const d=Math.min(dist*0.55,96);                 // rubber-band
      const p=Math.min(d/TRIG,1);
      ind.style.transform=`translateY(${d}px)`;
      ind.style.opacity=String(Math.min(p*1.2,1));
      ind.querySelector('.ptr-a').style.transform=`rotate(${p>=1?180:p*180}deg)`;
      if(p>=1&&!armed){armed=true;haptic('light');ind.classList.add('armed')}
      if(p<1&&armed){armed=false;ind.classList.remove('armed')}
    }
  },{passive:true});
  document.addEventListener('touchend',async()=>{
    if(!pulling)return; pulling=false;
    ind.style.transition='transform .34s cubic-bezier(.32,.72,0,1),opacity .3s';
    if(armed){
      busy=true;
      ind.classList.add('spin');
      ind.style.transform='translateY(58px)'; ind.style.opacity='1';
      haptic('success');
      try{
        if(supa){
          const fresh=await Store.get(MAIN_KEY);
          if(fresh&&fresh.seasons&&fresh.seasons.length){
            DB=fresh; CUR=DB.current||DB.seasons[0].id;
            if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
          }
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,420));        // let the spinner be seen
      render();
      toast(CLOUD_FAIL?'⚠️ Could not reach the database':'↻ Up to date');
      busy=false;
    }
    ind.style.transform=''; ind.style.opacity='0';
    setTimeout(()=>{ind.style.transition='';ind.classList.remove('spin','armed');
      ind.querySelector('.ptr-a').style.transform='';},360);
    dist=0; armed=false;
  },{passive:true});

  /* ---- large title shrinks into the nav bar on scroll ---- */
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return; ticking=true;
    requestAnimationFrame(()=>{
      const lt=document.querySelector('.largetitle'), nb=document.querySelector('.navbar');
      if(lt&&nb){
        const y=window.scrollY, r=lt.getBoundingClientRect();
        const hidden=r.bottom<58;
        nb.classList.toggle('shrunk',hidden);
        if(hidden&&!nb.querySelector('.nb-title')){
          const t=document.createElement('div');t.className='nb-title';t.textContent=lt.textContent.trim();
          nb.appendChild(t);
        } else if(!hidden){ const t=nb.querySelector('.nb-title'); if(t)t.remove(); }
        lt.style.opacity=String(Math.max(0,1-Math.max(0,y)/70));
      }
      ticking=false;
    });
  },{passive:true});
}

/* diamond as raw svg children (for embedding in the card svg) */
function psDiamondRaw(id,size){
  const ps=PS_BY[id]; if(!ps)return '';
  const col=PS_CAT[ps.cat].col,k=size/100;
  return `<g transform="scale(${k})">
    <rect x="18" y="18" width="64" height="64" rx="14" transform="rotate(45 50 50)"

      stroke-linecap="round" stroke-linejoin="round">${psGlyph(ps.g)}</g></g>`;
}
/* Turn an SVG string into a PNG blob at 2x for crisp phone screens */
async function svgToPng(svg,w,h,scale){
  const sc=scale||2;
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('render'));img.src=url});
    const cv=document.createElement('canvas');
    cv.width=w*sc; cv.height=h*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0,w,h);
    return await new Promise(r=>cv.toBlob(r,'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
/* iOS-friendly: open the native share sheet (which offers "Save Image"),
   falling back to a plain download on desktop browsers. */
async function shareOrSave(blob,filename,title){
  if(!blob){toast('Could not create the image');return}
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    try{ await navigator.share({files:[file],title}); toast('📤 Shared'); return; }
    catch(e){ if(e&&e.name==='AbortError')return; }
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast('📸 Saved to your downloads');
}
async function downloadCardPNG(pid){
  const svg=playerCardSVG(pid); if(!svg){toast('No data for this player');return}
  const p=player(pid);

  try{
    const blob=await svgToPng(svg,680,1020,2);
    await shareOrSave(blob,`${p.name.replace(/\s+/g,'-').toLowerCase()}-card.png`,`${p.name} — Sunday Season`);
  }catch(e){ toast('Could not make the image'); }
}

   card. The card instead uses a curated deep tone per position. */
const CARD_TONE={ATT:'#8E2140', MID:'#1B5E7A', DEF:'#1D4E7C', GK:'#7A5A14'};
/* The card takes the player's club colour so each one feels like their team.
   Very light club colours (Real Madrid, Spurs) are swapped for their accent so
   the card never washes out. */
/* the frame and background a player has equipped, as CSS classes */

function cosmClass(pid){
  const c=equipped(pid,'card');
  if(!c)return '';
  const st=c.replace('s_','');
