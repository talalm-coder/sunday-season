/* ---- matching backgrounds ---- */
.fut.cb-base{background-image:linear-gradient(160deg,#2b2b30,#141416)}
.fut.cb-chrome{background-image:linear-gradient(120deg,rgba(245,247,250,.25),rgba(143,155,165,.35)),linear-gradient(160deg,#2b2f36,#12151a)}
.fut.cb-refract{background-image:linear-gradient(115deg,rgba(255,154,158,.42),rgba(161,196,253,.4),rgba(194,255,216,.4),rgba(251,194,235,.42)),linear-gradient(168deg,#22242C,#0D0E12)}
.fut.cb-emerald{background-image:linear-gradient(160deg,rgba(29,185,84,.4),rgba(11,61,38,.85))}
.fut.cb-ruby{background-image:linear-gradient(160deg,rgba(230,57,70,.4),rgba(74,10,18,.9))}
.fut.cb-gold{background-image:linear-gradient(160deg,rgba(244,192,72,.45),rgba(138,110,19,.85))}
.fut.cb-obsid{background-image:linear-gradient(160deg,rgba(43,30,61,.85),rgba(10,7,16,.95))}
.fut.cb-logo{background-image:conic-gradient(from 210deg at 70% 20%,rgba(0,198,255,.4),rgba(123,47,247,.35),rgba(0,255,163,.35),rgba(255,60,172,.4),rgba(0,198,255,.4)),linear-gradient(168deg,#22242C,#0D0E12)}
.fut.cb-atomic{background-image:repeating-conic-gradient(from 0deg at 60% 10%,rgba(0,198,255,.3) 0 12deg,rgba(123,47,247,.28) 12deg 24deg,rgba(0,255,163,.28) 24deg 36deg),linear-gradient(168deg,#1d1f27,#0b0c10)}
.fut.cb-super{background-image:linear-gradient(115deg,rgba(255,246,216,.5),rgba(244,192,72,.5),rgba(251,194,235,.45),rgba(161,196,253,.45)),linear-gradient(168deg,#2a2410,#0D0E12)}
/* ---- purchased app themes ---- */
body[data-shop="midnight"]{--bg:#050A14;--card:#0E1626;--label:#EAF0FA;--label2:#B7C4D8;--label3:#7A8AA3;--sep:rgba(255,255,255,.12);--fill:#ffffff12;--fill2:#ffffff1f}
body[data-shop="terrace"]{--bg:#EFE6DA;--card:#FFFBF5;--label:#2A2118;--label2:#5A4B3B;--label3:#8D7B67;--sep:rgba(90,75,59,.18);--fill:#8d7b6714;--fill2:#8d7b6722}
body[data-shop="news"]{--bg:#F4F2EC;--card:#FFFFFF;--label:#111;--label2:#333;--label3:#777;--sep:rgba(0,0,0,.22);--fill:#00000010;--fill2:#0000001c}
body[data-shop="news"] .largetitle,body[data-shop="news"] .sechead{font-family:Georgia,'Times New Roman',serif}
body[data-shop="teletext"]{--bg:#000;--card:#000080;--label:#fff;--label2:#0f0;--label3:#ff0;--sep:rgba(255,255,255,.3);--fill:#ffffff14;--fill2:#ffffff26}
body[data-shop="teletext"] *{font-family:'Courier New',monospace!important;letter-spacing:0}
body[data-shop="arcade"]{--bg:#0B0620;--card:#170F35;--label:#FFD60A;--label2:#FF6BD6;--label3:#8B7FD1;--sep:rgba(255,214,10,.25);--fill:#ffd60a14;--fill2:#ffd60a24}

.sw-s_base{background:linear-gradient(150deg,#3A3A3C,#1C1C1E)}
.sw-s_chrome{background:linear-gradient(120deg,#f5f7fa,#b8c6d0 45%,#e9eef3 60%,#8f9ba5)}
.sw-s_refract{background:linear-gradient(115deg,#ff9a9e,#a1c4fd,#c2ffd8,#fbc2eb)}
.sw-s_emerald{background:linear-gradient(150deg,#0f5132,#1DB954 55%,#0b3d26)}
.sw-s_ruby{background:linear-gradient(150deg,#6b0f1a,#E63946 55%,#4a0a12)}
.sw-s_gold{background:linear-gradient(150deg,#FFF6D8,#F4C048 55%,#C9A227)}
.sw-s_obsid{background:linear-gradient(150deg,#14101c,#2b1e3d 55%,#0a0710)}
.sw-s_logo{background:conic-gradient(from 210deg,#00c6ff,#7b2ff7,#00ffa3,#ff3cac,#00c6ff)}
.sw-s_atomic{background:repeating-conic-gradient(from 0deg,#00c6ff 0 12deg,#7b2ff7 12deg 24deg,#00ffa3 24deg 36deg)}
.sw-s_super{background:linear-gradient(115deg,#FFF6D8,#F4C048,#fbc2eb,#a1c4fd,#F4C048)}

/* ---- event banner ---- */
.evb{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin-bottom:14px;color:#fff}
.evb-e{font-size:26px}
.evb-t b{display:block;font-size:15px;font-weight:800}
.evb-t span{display:block;font-size:12.5px;opacity:.78;margin-top:1px}
.evb-halloween{background:linear-gradient(110deg,#FF6B00,#4A1D6E)}
.evb-xmas{background:linear-gradient(110deg,#C8102E,#0B6E3F)}
.evb-newyear{background:linear-gradient(110deg,#1c1c1e,#5E5CE6)}
.evb-finale{background:linear-gradient(110deg,#F4C048,#8A6E13);color:#3B2D04}
.evb-retro{background:repeating-linear-gradient(90deg,#000 0 10px,#008 10px 20px)}
body[data-event="halloween"]{--tint:#FF6B00}
body[data-event="xmas"]{--tint:#C8102E}
body[data-event="finale"]{--tint:#C9A227}
body[data-event="retro"]{--bg:#000;--card:#000080;--label:#fff;--label2:#0f0;--label3:#ff0;--sep:rgba(255,255,255,.3)}
body[data-event="retro"] *{font-family:'Courier New',monospace!important}
/* ---- awards night ---- */
.awn{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 0,#2a1c00,#0b0b0d 72%);
  display:flex;align-items:center;justify-content:center;padding:24px;animation:in .3s ease;cursor:pointer}
.awn-in{text-align:center;color:#fff;max-width:420px}
.awn-k{font-size:10px;font-weight:900;letter-spacing:.2em;color:#F4C048}
.awn-e{font-size:64px;margin:18px 0 4px;animation:spPop .5s cubic-bezier(.34,1.56,.64,1)}
.awn-a{font-size:14px;color:rgba(255,255,255,.6)}
.awn-w{font-size:38px;font-weight:900;letter-spacing:-.035em;margin-top:4px;line-height:1.05}
.awn-d{font-size:14px;color:rgba(255,255,255,.7);margin-top:7px}
.awn-dots{display:flex;gap:6px;justify-content:center;margin-top:24px}
.awn-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.awn-dots i.on{background:#F4C048}
.awn-tap{font-size:12px;color:rgba(255,255,255,.4);margin-top:18px}

.moment[class*="cb-"]{background-image:none}
.moment.cb-chrome{background:linear-gradient(120deg,#2b2f36,#12151a)}
.moment.cb-refract{background:linear-gradient(115deg,rgba(255,154,158,.35),rgba(161,196,253,.35),rgba(194,255,216,.32)),linear-gradient(168deg,#22242C,#0D0E12)}
.moment.cb-emerald{background:linear-gradient(160deg,#0f5132,#08301d)}
.moment.cb-ruby{background:linear-gradient(160deg,#6b0f1a,#380810)}
.moment.cb-gold{background:linear-gradient(160deg,#5c4a10,#241c04)}
.moment.cb-obsid{background:linear-gradient(160deg,#2b1e3d,#0a0710)}
.moment.cb-logo{background:conic-gradient(from 210deg at 70% 20%,rgba(0,198,255,.3),rgba(123,47,247,.3),rgba(0,255,163,.28),rgba(255,60,172,.3)),linear-gradient(168deg,#22242C,#0D0E12)}
.moment.cb-atomic{background:repeating-conic-gradient(from 0deg at 60% 10%,rgba(0,198,255,.24) 0 12deg,rgba(123,47,247,.22) 12deg 24deg,rgba(0,255,163,.22) 24deg 36deg),linear-gradient(168deg,#1d1f27,#0b0c10)}
.moment.cb-super{background:linear-gradient(115deg,rgba(244,192,72,.4),rgba(251,194,235,.35),rgba(161,196,253,.35)),linear-gradient(168deg,#2a2410,#0D0E12)}
.moment.cb-base{background:linear-gradient(160deg,#2b2b30,#141416)}

.boot-chip{display:inline-flex;align-items:center;gap:5px;background:var(--fill2);border-radius:20px;
  padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--label2);margin-top:9px}
.wage-chip{display:inline-flex;align-items:center;background:color-mix(in srgb,var(--green) 14%,transparent);
  border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--green);margin:9px 0 0 6px}
.fut-boot{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.22);border-radius:20px;
  padding:3px 10px;font-size:11px;font-weight:800;color:#fff;margin-top:6px}

.sw-r_neon{background:linear-gradient(150deg,#00E5FF,#7B2FF7)}
.sw-r_gold{background:linear-gradient(150deg,#FFF6D8,#C9A227)}
.sw-n_clean{background:linear-gradient(150deg,#3A3A3C,#1C1C1E)}
.sw-n_bar{background:linear-gradient(90deg,#0A84FF 0 33%,#fff 33% 66%,#E63946 66%)}
.sw-n_stripe{background:repeating-linear-gradient(45deg,#2b2f3a 0 6px,#464c5c 6px 12px)}
.sw-n_carbon{background:repeating-linear-gradient(45deg,#1c1c1e 0 4px,#2c2c2e 4px 8px)}
.sw-n_gold{background:linear-gradient(150deg,#FFF6D8,#F4C048 55%,#C9A227)}
.sw-p_classic{background:linear-gradient(160deg,#2E9E4F,#186B33)}
.sw-p_night{background:linear-gradient(160deg,#123A22,#061A0E)}
.sw-p_stripe{background:repeating-linear-gradient(0deg,#2E9E4F 0 8px,#279046 8px 16px)}
.sw-p_astro{background:repeating-linear-gradient(90deg,#3FA860 0 3px,#359453 3px 6px)}
.sw-p_blue{background:linear-gradient(160deg,#0B3B8C,#05204F);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 10px),linear-gradient(160deg,#0B3B8C,#05204F)}
.sw-t_mono{background:linear-gradient(150deg,#fff,#111);color:#fff}
body[data-shop="mono"]{--bg:#F5F5F5;--card:#fff;--label:#000;--label2:#333;--label3:#888;--tint:#000;--sep:rgba(0,0,0,.2);--fill:#00000010;--fill2:#0000001c}
.fut{position:relative}

/* ---- gameweek history ---- */
.gwbar{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
.gwbar::-webkit-scrollbar{display:none}
.gwbar button{flex:0 0 auto;border:none;background:var(--fill2);color:var(--label2);border-radius:20px;
  padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.gwbar button.on{background:var(--tint);color:var(--tint-ink)}
.bdown{background:var(--fill);padding:8px 14px 10px;border-bottom:.5px solid var(--sep)}
.bd-r{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;color:var(--label2)}
.bd-r b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--label)}
.bd-r b.dn{color:var(--red)}
.bd-r.tot{border-top:.5px solid var(--sep);margin-top:5px;padding-top:6px;font-weight:800;color:var(--label)}
.bd-r.tot b{font-size:15px}

.revbar{display:flex;align-items:center;gap:11px;background:linear-gradient(120deg,#FF9500,#FF6B00);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;color:#fff}
.rev-e{font-size:22px}
.rev-t{flex:1;min-width:0}
.rev-t b{display:block;font-size:14.5px;font-weight:800}
.rev-t span{display:block;font-size:12px;opacity:.9;margin-top:2px;line-height:1.4}
.revbar button{flex:0 0 auto;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
.mc-a{margin-left:3px;font-size:11px;opacity:.9}

.gwpager{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.16)}
.gwpager button{flex:0 0 auto;width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.18);
  color:#fff;font-size:19px;font-weight:800;cursor:pointer;line-height:1}
.gwpager button:disabled{opacity:.28}
.gwp-mid{flex:1;text-align:center;color:#fff}
.gwp-mid b{display:block;font-size:14px;font-weight:800}
.gwp-mid span{display:block;font-size:11.5px;opacity:.72;margin-top:1px}

/* ---- log a game: one-tap A/B ---- */
.pgrow{display:inline-flex;align-items:center;gap:0;background:var(--fill2);border-radius:20px;
  margin:0 6px 7px 0;overflow:hidden;vertical-align:top}
.pgrow.sel{background:color-mix(in srgb,var(--tint) 16%,transparent);box-shadow:inset 0 0 0 1.5px var(--tint)}
.pgname{display:inline-flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer;
  padding:6px 4px 6px 8px;font-size:13.5px;font-weight:600;color:var(--label);max-width:9.5rem}
.pgname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgname .tick{font-style:normal;color:var(--tint);font-weight:800;font-size:12px;margin-left:1px}
.pgab{border:none;cursor:pointer;width:30px;align-self:stretch;font-size:12.5px;font-weight:800;color:#fff}
.pgab.a{background:var(--tint)}
.pgab.b{background:var(--blue)}
.pgab:active{filter:brightness(.88)}

.findbox{width:100%;border:none;background:var(--fill2);border-radius:12px;padding:12px 14px;
  font-size:15px;color:var(--label);margin-bottom:12px;-webkit-appearance:none}
.findbox::placeholder{color:var(--label3)}
.findbox:focus{outline:2px solid var(--tint);outline-offset:-2px}
.findnone{padding:14px 4px;font-size:13.5px;color:var(--label3);text-align:center}
.sb-pick .findbox{margin-bottom:10px}

table.anal{width:100%;border-collapse:collapse;font-size:13px}
table.anal thead td{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:var(--label3);padding:10px 6px;border-bottom:.5px solid var(--sep);white-space:nowrap}
table.anal tbody td{padding:10px 6px;border-bottom:.5px solid var(--sep);vertical-align:middle}
table.anal tbody tr:last-child td{border-bottom:none}
table.anal .nm{font-weight:700;white-space:nowrap}
table.anal .c{text-align:center;font-variant-numeric:tabular-nums}
.acca{font-style:normal;font-size:10.5px;font-weight:800;color:var(--green);margin-left:4px}

/* ---- stats: grouped views + a legend you can actually read ---- */
.statseg{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.statseg::-webkit-scrollbar{display:none}
.statseg button{flex:0 0 auto;border:none;background:var(--fill2);color:var(--label2);border-radius:18px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.statseg button.on{background:var(--tint);color:var(--tint-ink)}
.legend{margin-top:12px;background:var(--fill);border-radius:14px;padding:14px 16px}
.legend-h{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--label3);margin-bottom:10px}
.legend-r{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:.5px solid var(--sep)}
.legend-r:first-of-type{border-top:none}
.legend-r b{flex:0 0 8.5rem;font-size:13px;font-weight:700;color:var(--label)}
.legend-r span{flex:1;font-size:12.5px;line-height:1.45;color:var(--label2)}
@media(max-width:400px){.legend-r{flex-direction:column;gap:2px}.legend-r b{flex:none}}

/* the Home banner is the Sky one, unchanged — just needs spacing below it */
#app .view .wrap > .sky-hero{margin-bottom:14px}

/* 360px phones: the Form view has 7 columns and the Hall of Fame cards are
   wide — tighten both rather than letting the page scroll sideways. */
@media(max-width:380px){
  table.sticky thead td, table.sticky tbody td{padding-left:4px;padding-right:4px;font-size:12px}
  table.sticky .nm{max-width:5.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cab{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reccard,.cab-i{min-width:0}
  .form{gap:2px}
  .fd{width:14px;height:14px;font-size:8px}
}

/* ---- the week's slips ---- */
.bw{border-bottom:.5px solid var(--sep);padding:12px 14px}
.bw:last-child{border-bottom:none}
.bw-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bw-h b{font-size:14.5px;font-weight:800}
.bw-meta{flex:1;min-width:0;font-size:11.5px;color:var(--label3)}
.bw-tag{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bw-won .bw-tag{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.bw-lost .bw-tag{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.bw-void .bw-tag{background:var(--fill2);color:var(--label2)}
.bw-open .bw-tag{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.bw-legs{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.bw-leg{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--label2)}
.bw-leg i{font-style:normal;font-weight:700;color:var(--label3);font-variant-numeric:tabular-nums}

.chiprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chiptag{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:20px;
  background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.chiprow-gw{font-size:10.5px;font-weight:800;color:var(--label3);letter-spacing:.04em}
.fh .chiprow{margin:10px 0 0}
.fh .chiptag{background:rgba(255,255,255,.2);color:#fff}
.fh .chiprow-gw{color:rgba(255,255,255,.65)}

.predcard{background:linear-gradient(140deg,color-mix(in srgb,var(--tint) 10%,var(--card)),var(--card))}
.predrow{display:flex;align-items:center;justify-content:center;gap:18px}
.predside{display:flex;flex-direction:column;align-items:center;gap:5px}
.predside b{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;min-width:2ch;text-align:center}
.predside span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--label3)}
.predside button{width:38px;height:32px;border:none;border-radius:10px;background:var(--fill2);
  color:var(--label);font-size:19px;font-weight:800;cursor:pointer;line-height:1}
.predside button:active{background:var(--tint);color:var(--tint-ink)}
.preddash{font-size:28px;font-weight:800;color:var(--label3);align-self:center}

/* ---- MOMENTS ----
   These classes had no styling at all, which is why the card looked like
   stacked plain text. */
.moment{position:relative;border-radius:18px;padding:18px 18px 16px;overflow:hidden;color:#fff;
  background:linear-gradient(158deg,#123A6B,#0B1F3C 62%,#081428);
  box-shadow:0 14px 34px -18px rgba(0,0,0,.6)}
.moment::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 12% 0%,rgba(255,255,255,.16),transparent 58%)}
.moment>*{position:relative;z-index:1}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.mtag{font-size:9.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.24);border-radius:20px;padding:4px 10px}
.moment .serial{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:rgba(255,255,255,.5);
  font-variant-numeric:tabular-nums}
.mtitle{font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.mline{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.76);margin-top:7px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.mchip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;
  background:rgba(255,255,255,.13);color:rgba(255,255,255,.92);white-space:nowrap}
.mrow{display:flex;gap:12px;align-items:baseline;margin-top:11px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.13);font-size:12.5px;line-height:1.5}
.mrow b{flex:0 0 5.6rem;font-weight:800;color:rgba(255,255,255,.55);
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.mrow span{flex:1;color:rgba(255,255,255,.9)}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;
  font-size:12px;color:rgba(255,255,255,.6)}
@media(max-width:380px){.mtitle{font-size:20px}.mrow{flex-direction:column;gap:3px}.mrow b{flex:none}}

/* ---- insights ---- */
.hm{display:flex;flex-direction:column;gap:3px}
.hm-row{display:flex;gap:3px;align-items:center}
.hm-c{flex:1;aspect-ratio:1;min-width:0;border-radius:5px;background:var(--fill2);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--label)}
.hm-c.off{background:transparent}
.hm-ax{flex:0 0 16px;text-align:center;font-size:10.5px;font-weight:800;color:var(--label3)}
.hm-ax.b{flex:1;min-width:0}
.legend-dots{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.legend-dots span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--label2)}
.legend-dots i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.legend-dots b{color:var(--label);font-weight:800}

/* Points vs Pick team — the two jobs My Team does */
.tmode{display:flex;gap:8px;margin:0 0 14px}
.tmode button{flex:1;border:none;border-radius:14px;padding:11px 8px;cursor:pointer;
  background:var(--fill2);color:var(--label2);font-size:14.5px;font-weight:800;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tmode button i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--label3)}
.tmode button.on{background:var(--tint);color:var(--tint-ink)}
.tmode button.on i{color:rgba(255,255,255,.75)}

/* collapsible sections */
details.drop{margin-bottom:12px}
details.drop>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  background:var(--fill2);border-radius:14px;padding:13px 15px;font-size:14.5px;font-weight:700;color:var(--label)}
details.drop>summary::-webkit-details-marker{display:none}
details.drop>summary span{flex:1}
details.drop>summary i{font-style:normal;font-size:12.5px;font-weight:800;color:var(--label3)}
details.drop>summary::after{content:"⌄";font-size:16px;color:var(--label3);transition:transform .18s}
details.drop[open]>summary::after{transform:rotate(180deg)}
details.drop[open]>summary{border-radius:14px 14px 0 0}
details.drop .card{margin-top:0;border-radius:0 0 14px 14px}

.wagegrp{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--label3);padding:12px 4px 7px}
details.drop .wagegrp:first-of-type{padding-top:4px}
details.drop>.card{border-radius:14px}
details.drop>.card:last-child{border-radius:14px 14px 14px 14px}
.carhead{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;
  padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 18px -12px rgba(0,0,0,.3)}
.carhead-n{flex:1;min-width:0}
.carhead-n b{display:block;font-size:18px;font-weight:900;letter-spacing:-.01em}
.carhead-n span{font-size:12.5px;color:var(--label3)}
.carhead-lv{text-align:right}
.carhead-lv b{display:block;font-size:22px;font-weight:900;color:var(--tint);line-height:1}
.carhead-lv span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--label3)}

/* the career strip carries the player's own background */
.carhead.carhead-skin{color:#fff;background-image:none}
.carhead.carhead-skin .carhead-n span{color:rgba(255,255,255,.72)}
.carhead.carhead-skin .carhead-lv b{color:#fff}
.carhead.carhead-skin .carhead-lv span{color:rgba(255,255,255,.62)}
.carhead.carhead-skin.cb-night{background-image:radial-gradient(70% 45% at 50% 0,rgba(120,180,255,.3),transparent 60%),linear-gradient(160deg,#0B1B33,#132B4D)}
.carhead.carhead-skin.cb-stands{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 3px,transparent 3px 8px),linear-gradient(160deg,#2b2b30,#16161a)}
.carhead.carhead-skin.cb-retro{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 3px,transparent 3px 6px),linear-gradient(160deg,#1a2b1a,#0d160d)}
.carhead.carhead-skin.cb-smoke{background-image:radial-gradient(60% 70% at 30% 30%,rgba(255,255,255,.22),transparent 62%),linear-gradient(160deg,#3a3a40,#141416)}
.carhead.carhead-skin.cb-sunset{background-image:linear-gradient(160deg,rgba(255,149,0,.55),rgba(255,55,95,.4) 55%,rgba(0,0,0,.9))}
.carhead.carhead-skin.cb-base{background-image:linear-gradient(160deg,#2b2b30,#141416)}
.carhead.carhead-skin.cb-chrome{background-image:linear-gradient(120deg,rgba(245,247,250,.25),rgba(143,155,165,.35)),linear-gradient(160deg,#2b2f36,#12151a)}
.carhead.carhead-skin.cb-refract{background-image:linear-gradient(115deg,rgba(255,154,158,.42),rgba(161,196,253,.4),rgba(194,255,216,.4),rgba(251,194,235,.42)),linear-gradient(168deg,#22242C,#0D0E12)}
.carhead.carhead-skin.cb-emerald{background-image:linear-gradient(160deg,rgba(29,185,84,.4),rgba(11,61,38,.85))}
.carhead.carhead-skin.cb-ruby{background-image:linear-gradient(160deg,rgba(230,57,70,.4),rgba(74,10,18,.9))}
.carhead.carhead-skin.cb-gold{background-image:linear-gradient(160deg,rgba(244,192,72,.45),rgba(138,110,19,.85))}
.carhead.carhead-skin.cb-obsid{background-image:linear-gradient(160deg,rgba(43,30,61,.85),rgba(10,7,16,.95))}
.carhead.carhead-skin.cb-logo{background-image:conic-gradient(from 210deg at 70% 20%,rgba(0,198,255,.4),rgba(123,47,247,.35),rgba(0,255,163,.35),rgba(255,60,172,.4),rgba(0,198,255,.4)),linear-gradient(168deg,#22242C,#0D0E12)}
.carhead.carhead-skin.cb-atomic{background-image:repeating-conic-gradient(from 0deg at 60% 10%,rgba(0,198,255,.3) 0 12deg,rgba(123,47,247,.28) 12deg 24deg,rgba(0,255,163,.28) 24deg 36deg),linear-gradient(168deg,#1d1f27,#0b0c10)}
.carhead.carhead-skin.cb-super{background-image:linear-gradient(115deg,rgba(255,246,216,.5),rgba(244,192,72,.5),rgba(251,194,235,.45),rgba(161,196,253,.45)),linear-gradient(168deg,#2a2410,#0D0E12)}

/* a signed deal reads as active, not as an empty grey row */
details.drop>summary i.sig{color:var(--label);font-weight:800}
details.drop.on>summary{background:var(--tint-soft);color:var(--tint-ink,var(--label))}
details.drop.on>summary i.sig{color:var(--tint);font-weight:900}
details.drop.on>summary span{font-weight:800}
details.drop+details.drop{margin-top:-4px}

/* a finished gameweek is for reading, not editing */
.sh.sh-view .sh-top{cursor:pointer;border:none;background:transparent;padding:0;width:100%}
.sh.sh-view .sh-pts{font-weight:900}
.sh.sh-view .sh-pts.out{opacity:.4}
.sh-sub{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--label3);margin-top:2px}

.tp-r{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--hair)}
.tp-r:first-child{border-top:none}
.tp-e{font-size:19px;flex:0 0 24px;text-align:center}
.tp-r b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
.tp-r i{display:block;font-style:normal;font-size:12.5px;line-height:1.5;color:var(--label2);margin-top:2px}

/* ============================================================
   DESIGN PASS — background, type scale, and a hero per screen.
   Mobile first: everything below is tuned for a ~390px viewport
   and only relaxes upward.
   ============================================================ */

/* 1 ── The page is white, not grey.
   Cards used to float on #F2F2F7, which reads dated. Now the page is white,
   cards sit flush with a hairline, and depth comes from spacing rather than
   drop shadows. Dark mode keeps its near-black. */
:root[data-theme="light"]{
  --bg:#FFFFFF;
  --card:#FFFFFF;
  --cardline:#00000012;
  --shadow:none;
  --inset:#F6F6F8;
}
:root[data-theme="dark"]{
  --cardline:#FFFFFF14;
  --inset:#16161A;
}
.card{
  background:var(--card);
  border:1px solid var(--cardline);
  border-radius:14px;
  box-shadow:none;
  margin-bottom:18px;
}
.card.pad{background:var(--inset);border-color:transparent}
.tiles > div,.wal{border:1px solid var(--cardline);box-shadow:none}

/* 2 ── Typography.
   One confident title per screen, then quiet labels. The old section headers
   were the same weight as everything else, so nothing led the eye. */
.largetitle{
  font-size:32px;
  font-weight:800;
  letter-spacing:-.028em;
  line-height:1.06;
  padding:10px 16px 2px;
}
.subtitle{
  font-size:14px;
  color:var(--label3);
  padding:2px 16px 14px;
  letter-spacing:-.005em;
}
.sechead{
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  color:var(--label3);
  text-transform:uppercase;
  padding:22px 4px 8px;
}
.r1{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.r2{font-size:12.5px;color:var(--label3);letter-spacing:-.002em}
.rv{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.note{font-size:12.5px;line-height:1.55;color:var(--label3);padding:8px 4px 2px}

/* 3 ── A hero on every screen.
   The first thing under the title is a single statement — the number that
   matters — instead of an undifferentiated stack of cards. */
.hero{
  padding:2px 0 18px;
}
.hero-v{
  font-size:44px;
  font-weight:800;
  letter-spacing:-.045em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.hero-l{
  font-size:12.5px;
  font-weight:600;
  color:var(--label3);
  letter-spacing:.02em;
  margin-top:6px;
}
.hero-row{display:flex;gap:26px;align-items:flex-end}
.hero-row .hero-v{font-size:30px}
.hero-sub{font-size:13px;color:var(--label2);margin-top:10px;line-height:1.5}
@media(max-width:370px){
  .largetitle{font-size:28px}
  .hero-v{font-size:38px}
  .hero-row{gap:18px}
}

/* index + archetype header */
.pindex{display:flex;gap:12px;margin:4px 0 4px}
.pindex-l{flex:0 0 40%;background:var(--inset);border-radius:14px;padding:16px 14px;text-align:center}
.pindex-v{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.pindex-k{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--label3);margin-top:6px}
.pindex-r{flex:1;background:var(--inset);border-radius:14px;padding:16px 14px;display:flex;
  flex-direction:column;justify-content:center}
.pindex-a{font-size:17px;font-weight:800;letter-spacing:-.015em}
.pindex-d{font-size:12.5px;color:var(--label3);margin-top:4px;line-height:1.4}
/* attribute list under the radar */
.axgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px}
.axrow{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;
  border-bottom:1px solid var(--sep)}
.axrow span{color:var(--label3)}
.axrow b{font-weight:800;font-variant-numeric:tabular-nums}
/* donut */
.dn{display:flex;gap:16px;align-items:center}
.dn-k{flex:1;font-size:13px}
.dn-k > div{display:flex;align-items:center;gap:8px;padding:4px 0}
.dn-k i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.dn-k b{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.dn-x{color:var(--label3);font-size:12px;padding-top:6px!important}
tr.lifetime td{font-weight:800;border-top:1.5px solid var(--sep)}

/* bought pitches, applied to the tactics board and the FPL pitch alike */
.sk-p_classic{background:linear-gradient(160deg,#2E9E4F,#1E7038)!important}
.sk-p_night{background:linear-gradient(160deg,#123A22,#061A0E)!important}
.sk-p_stripe{background:repeating-linear-gradient(0deg,#2E9E4F 0 22px,#279046 22px 44px)!important}
.sk-p_astro{background:linear-gradient(160deg,#1F8E63,#126B49)!important}
.sk-p_blue{background:linear-gradient(160deg,#1E5FA8,#0E3A6B)!important}

/* usage, kept deliberately small in Admin */
.telw{display:flex;flex-direction:column;gap:6px}
.tel-r{display:flex;align-items:center;gap:8px;font-size:12px}
.tel-n{flex:0 0 42%;color:var(--label2);text-transform:capitalize;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tel-b{flex:1;height:6px;border-radius:3px;background:var(--sep);overflow:hidden}
.tel-b i{display:block;height:100%;background:var(--tint);border-radius:3px}
.tel-r b{flex:0 0 28px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* 4px spacing scale — the old values (6/10/11/13/14) were close but not
   systematic, which is what reads subtly off. Everything snaps to 4 now. */
.sechead{padding:24px 4px 8px}
.card{margin-bottom:16px}
.note{padding:8px 4px 4px}
.hero{padding:0 0 20px}
.hero-l{margin-top:4px}
.hero-sub{margin-top:8px}
.pindex{gap:12px;margin:4px 0}
.pindex-l,.pindex-r{padding:16px 12px}
.axgrid{gap:4px 16px;margin-top:12px}
.axrow{padding:4px 0}
.dn{gap:16px}
.tp-r{padding:12px 16px}

/* the banner carries its own live figures on the right, the way a broadcast
   score bug does, instead of a separate block of text underneath */
.sky-hero-row{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.sky-hero-r{position:relative;text-align:right;flex:0 0 auto;padding-bottom:3px}
.sky-hero-rv{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums}
.sky-hero-rl{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.7);margin-top:5px}
.sky-hero-meta{position:relative;font-size:11px;font-weight:700;letter-spacing:.08em;
  color:rgba(255,255,255,.72);margin-top:9px;text-transform:uppercase;line-height:1.5}
@media(max-width:370px){
  .sky-hero-b{font-size:34px}
  .sky-hero-rv{font-size:22px}
}
/* Hall of Fame wears gold */
.sky-hero.gold{background:linear-gradient(115deg,#E0B33C 0%,#C6952A 42%,#3A2A08 42%,#241A05 100%);
  box-shadow:0 10px 26px rgba(58,42,8,.4)}
.sky-hero.gold .sky-hero-t{color:rgba(255,255,255,.85)}

/* the shop keeps its breakdown, without repeating the wallet the banner shows */
.walslim{display:flex;gap:10px;margin-bottom:16px}
.walslim > div{flex:1;background:var(--inset);border-radius:12px;padding:11px 12px;text-align:center}
.walslim b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.walslim b.up{color:var(--green)} .walslim b.dn{color:var(--red)}
.walslim span{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--label3);margin-top:4px}

/* The zone key was five full-width rows of 13.5px text under the table — most
   of a phone screen to explain colours the table already shows. It is a single
   tight strip now: colour, name, range, wrapping to two lines at most. */
.lgkey{display:flex;flex-direction:row;flex-wrap:wrap;gap:4px 10px;padding:8px 10px;margin-top:8px;
  background:var(--inset);border:1px solid var(--cardline);border-radius:10px;box-shadow:none}
.lgkey-i{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.5;padding:0}
.lgkey-i+.lgkey-i{border-top:none}
.lgkey-d{width:3px;height:11px;border-radius:2px;flex:0 0 3px}
.lgkey-l{color:var(--label2);font-weight:600;letter-spacing:-.005em;flex:0 0 auto}
.lgkey-i{flex:0 0 auto;white-space:nowrap}
.lgkey-r{color:var(--label3);font-weight:700;font-variant-numeric:tabular-nums;
  background:none;border-radius:0;padding:0;font-size:10.5px}
@media(max-width:370px){.lgkey{gap:4px 8px}.lgkey-i{font-size:10px}}

/* Sky's title spans the wedge: the first half sits on the red, the second on
   the navy, both at the same size so it reads as one line. */
/* one line: the first half lands on the red wedge, the second on the navy,
   both the same size so it reads as a single title */
.sky-hero-b.sky-split{display:flex;flex-wrap:nowrap;gap:0 9px;align-items:baseline;
  font-size:23px;letter-spacing:-.028em;white-space:nowrap}
.sky-split .ss-a,.sky-split .ss-b{font-size:inherit;font-weight:inherit;letter-spacing:inherit}
@media(max-width:390px){.sky-hero-b.sky-split{font-size:21px;gap:0 7px}}
@media(max-width:365px){.sky-hero-b.sky-split{font-size:19.5px;gap:0 6px}}

/* every eyebrow reads the same: small, spaced, capitals — so a season name
   never sits in mixed case beside LIVE · MATCHDAY */
.sky-hero-t{text-transform:uppercase}

/* the home leader blocks sit side by side, so their rows must be exactly the
   same height — the form dots were making one column a pixel taller */
#app .grid.g2 .card .row{min-height:62px;box-sizing:border-box}
#app .grid.g2 .card .r2{line-height:1.35;min-height:17px;display:flex;align-items:center;gap:4px}

/* a section header with a See all button was 2px taller than one without,
   which threw the block below it out of line */
.sechead{min-height:46px;box-sizing:border-box;align-items:flex-end}
.sechead .act{line-height:1;padding:0}

/* a list value is always the same weight — rows that set nothing inline were
   falling back to regular text, which is what made lists look mismatched */
.rv{font-weight:800}

/* ---- the rating header: one number, what it means, and where it ranks ---- */
.idxcard{background:var(--inset);border:1px solid var(--cardline);border-radius:16px;
  padding:16px 16px 14px;margin:4px 0 4px}
.idxcard-top{display:flex;gap:16px;align-items:flex-start}
.idxcard-n{flex:0 0 auto;text-align:center;min-width:76px}
.idxcard-v{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:.92;
  font-variant-numeric:tabular-nums}
.idxcard-k{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--label3);margin-top:6px}
.idxcard-m{flex:1;min-width:0;padding-top:2px}
.idxcard-arc{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.idxcard-sub{font-size:12.5px;color:var(--label3);margin-top:3px;line-height:1.4}
.idxcard-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.ichip{font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:20px;
  background:var(--card);border:1px solid var(--cardline);color:var(--label2);white-space:nowrap}
.idxbar{height:6px;border-radius:3px;background:var(--sep);overflow:hidden;margin-top:14px}
.idxbar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#F59E0B,var(--tint))}

/* ---- attributes as bars under the wheel ---- */
.axbars{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.axb{display:flex;align-items:center;gap:9px}
.axb-k{flex:0 0 84px;font-size:12px;font-weight:600;color:var(--label2)}
.axb-t{flex:1;height:7px;border-radius:4px;background:var(--sep);overflow:hidden}
.axb-t i{display:block;height:100%;border-radius:4px;transition:width .4s cubic-bezier(.32,.72,0,1)}
.axb b{flex:0 0 26px;text-align:right;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.axnote{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--sep);font-size:12px;color:var(--label3)}
.axnote b{color:var(--label);font-weight:700}

/* ---- contribution ---- */
.dnstat{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.dnstat > div{flex:1;text-align:center}
.dnstat b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.dnstat span{display:block;font-size:10px;color:var(--label3);margin-top:3px;line-height:1.3}
@media(max-width:370px){
  .idxcard-v{font-size:44px}
  .idxcard-arc{font-size:17px}
  .axb-k{flex:0 0 72px;font-size:11.5px}
}

/* physical stats from a wearable */
.phys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.phys > div{background:var(--card);border:1px solid var(--cardline);border-radius:12px;padding:12px 6px;text-align:center}
.phys b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.phys span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label3);margin-top:4px}
@media(max-width:370px){.phys{grid-template-columns:repeat(2,1fr)}}

/* strava mark in the squad list */
.stmark{color:var(--tint);font-weight:700}
/* physical trends */
.phhead{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--label3);margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.trd{font-size:10px;font-weight:800;letter-spacing:0;text-transform:none;
  padding:2px 6px;border-radius:20px;background:var(--sep);color:var(--label2)}
.trd.up{background:rgba(18,183,106,.15);color:var(--green)}
.trd.dn{background:rgba(239,68,68,.15);color:var(--red)}
/* average-to-max heart rate bands */
.hrband{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.hrb{flex:1;position:relative;height:100%;background:var(--sep);border-radius:5px;opacity:.35}
.hrb i{position:absolute;left:0;right:0;border-radius:5px;
  background:linear-gradient(180deg,#EF4444,var(--tint))}
.hrb{opacity:1;background:transparent}

/* the alerts bell, beside the theme toggle */
.bellbtn{position:relative;color:var(--label2)}
.bellbtn svg{width:18px;height:18px}
.bellbtn.on{color:var(--tint)}
.bell-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg)}

/* beta tag beside a section heading */
.betatag{font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:20px;
  background:var(--tint);color:#fff;margin-left:6px;vertical-align:middle;text-transform:none}
/* the per-game physical list */
.physlist{margin-top:14px;padding-top:12px;border-top:1px solid var(--sep);
  display:flex;flex-direction:column-reverse;gap:2px}
.physrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
.physrow+.physrow{border-top:1px solid var(--sep)}
.pr-g{flex:1;color:var(--label2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-v{flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.psrc{flex:0 0 50px;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.06em;
  padding:2px 0;border-radius:20px;background:var(--fill);color:var(--label3)}
.psrc.sy{background:rgba(18,183,106,.15);color:var(--green)}
.pr-x{flex:0 0 20px;text-align:center;background:none;border:none;color:var(--label3);
  font-size:16px;line-height:1;padding:0}
.physhead{border-top:none!important;padding-bottom:2px}
.physhead .pr-v{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--label3)}

/* weather: one quiet line, never a heading */
.wx{color:var(--label3);font-weight:500}

.venseg button{font-size:13px}

/* The rank header must sit on exactly the same left edge as the numbers below
   it. td.pos is 13px; the generic thead padding was 16px, so the # sat 3px to
   the right of every number in its column. */
/* Only tables WITH a rank column need the 13px header inset. Stats leads with
   the name column, which sits at 16px, so forcing 13px there broke it instead. */
table:has(td.pos) thead td:first-child{padding-left:13px!important}
</style>

/* ============================================================
   CREST GENERATOR v2 — original stylized crests (not official logos).
   Composition: shield/circle outline + colour pattern + emblem + code.
   ============================================================ */
function crest(club,size){
  const s=size||40,id='c'+Math.random().toString(36).slice(2,8);
  const c1=club.c1||'#888',c2=club.c2||'#fff',ac=club.acc||'#fff';
  const key=club.crest||'solid';
  const round=['circle','ship','snake','wolfc'].includes(key);
  /* a proper crest silhouette: straight shoulders, tapered waist, pointed base */
  const SHIELD="M20 1.8 C26 3.4 32 4.4 37 4.6 V19 C37 28.4 29.8 35.8 20 38.6 C10.2 35.8 3 28.4 3 19 V4.6 C8 4.4 14 3.4 20 1.8 Z";
  const clip=round?`<circle cx="20" cy="20" r="18"/>`:`<path d="${SHIELD}"/>`;
  /* white outer rim + coloured keyline, the way real badges are built */
  const edge=round
    ? `<circle cx="20" cy="20" r="18" fill="none" stroke="url(#${id}rim)" stroke-width="2.2"/>
       <circle cx="20" cy="20" r="15.6" fill="none" stroke="${ac}" stroke-width="1" opacity=".85"/>`
    : `<path d="${SHIELD}" fill="none" stroke="url(#${id}rim)" stroke-width="2.2" stroke-linejoin="round"/>
       <path d="${SHIELD}" fill="none" stroke="${ac}" stroke-width="0.9" opacity=".8"
         transform="translate(20,20) scale(0.88) translate(-20,-20)" stroke-linejoin="round"/>`;

  /* ---- colour patterns ---- */
  const P={
    solid:  `<rect width="40" height="40" fill="${c1}"/>`,
    vstripe:`<rect width="40" height="40" fill="${c2}"/>`+
            [0,1,2,3,4].map(i=>`<rect x="${1.5+i*7.8}" width="4.2" height="40" fill="${c1}"/>`).join(''),
    halves: `<rect width="40" height="40" fill="${c2}"/><rect width="20" height="40" fill="${c1}"/>`,
    hoops:  `<rect width="40" height="40" fill="${c2}"/>`+
            [0,1,2,3,4].map(i=>`<rect y="${1.5+i*7.8}" width="40" height="4.2" fill="${c1}"/>`).join(''),
    sash:   `<rect width="40" height="40" fill="${c2}"/><path d="M-6 28 L28 -6 L40 2 L6 36 Z" fill="${c1}"/>`,
    quarter:`<rect width="40" height="40" fill="${c2}"/><rect width="20" height="20" fill="${c1}"/><rect x="20" y="20" width="20" height="20" fill="${c1}"/>`,
    chevron:`<rect width="40" height="40" fill="${c2}"/><path d="M0 8 L20 20 L40 8 V18 L20 30 L0 18 Z" fill="${c1}"/>`,
    circle: `<rect width="40" height="40" fill="${c1}"/><circle cx="20" cy="20" r="12.5" fill="${c2}"/>`
  };
  const patternFor={stripes:'vstripe',vstripe:'vstripe',split:'halves',halves:'halves',hoops:'hoops',
    sash:'sash',quarter:'quarter',chevron:'chevron',circle:'circle'};
  const pat=P[patternFor[key]||'solid'];

  /* ---- emblems (drawn in accent, sitting on the pattern) ---- */
  const E={
    crown:`<path d="M12 22 L13.5 13 L17 17.5 L20 11.5 L23 17.5 L26.5 13 L28 22 Z" fill="${ac}"/><rect x="12" y="23" width="16" height="2.6" fill="${ac}"/>`,
    eagle:`<path d="M20 10.5 L28.5 17 L24 18 L28.5 23 L21.6 21.8 L20 29 L18.4 21.8 L11.5 23 L16 18 L11.5 17 Z" fill="${ac}"/>`,
    lion:`<circle cx="20" cy="18.5" r="7.4" fill="${ac}"/><circle cx="20" cy="18.5" r="4.1" fill="${c1}"/><path d="M16.6 24 L20 28.5 L23.4 24 Z" fill="${ac}"/>`,
    bird:`<path d="M13 23.5 C13 16.6 19.6 12.4 26.4 14.6 C22 15 20 19 24 21 C19.8 22 17.6 25 19.8 28 C15.6 28 13 26.4 13 23.5 Z" fill="${ac}"/>`,
    cannon:`<rect x="8.5" y="17.5" width="21" height="5" rx="1.6" fill="${ac}"/><circle cx="10.5" cy="20" r="4.2" fill="${ac}"/><rect x="27" y="15.6" width="4" height="8.8" rx="1.2" fill="${ac}"/>`,
    devil:`<path d="M13.5 14 L17 18.4 L20 12.6 L23 18.4 L26.5 14 L25 25 H15 Z" fill="${ac}"/><rect x="18.6" y="25" width="2.8" height="5" fill="${ac}"/>`,
    tower:`<path d="M20 8.5 L23.6 29 H16.4 Z" fill="${ac}"/><rect x="9" y="29" width="22" height="3.4" fill="${ac}"/><rect x="15.4" y="19" width="9.2" height="2" fill="${c1}"/>`,
    dragon:`<path d="M11 21 Q16 12 20 18 Q24 12 29 21 Q24 27 20 23 Q16 27 11 21 Z" fill="${ac}"/>`,
    clover:`<circle cx="16" cy="16.5" r="5.2" fill="${ac}"/><circle cx="24" cy="16.5" r="5.2" fill="${ac}"/><circle cx="20" cy="23" r="5.2" fill="${ac}"/><rect x="19.2" y="24" width="1.6" height="7" fill="${ac}"/>`,
    star:`<path d="M20 10 L23.1 17.4 L31 18 L25 23.1 L26.9 30.8 L20 26.6 L13.1 30.8 L15 23.1 L9 18 L16.9 17.4 Z" fill="${ac}"/>`,
    ship:`<path d="M9 24 H31 L27.5 30 H12.5 Z" fill="${ac}"/><rect x="19.2" y="10" width="1.6" height="13" fill="${ac}"/><path d="M21 11.5 L28 16 L21 19 Z" fill="${ac}"/>`,
    cockerel:`<circle cx="20" cy="17" r="6.2" fill="${ac}"/><path d="M20 23 L20 30" stroke="${ac}" stroke-width="2.4"/><path d="M20 10.8 L17.5 7.5 L20.6 8.4 L22.6 6 L23 9.4 Z" fill="${ac}"/>`,
    wolf:`<path d="M12 14 L15.6 19 L12.6 26 H27.4 L24.4 19 L28 14 L24.6 16 L20 13.4 L15.4 16 Z" fill="${ac}"/><circle cx="16.8" cy="20.6" r="1.7" fill="${c1}"/><circle cx="23.2" cy="20.6" r="1.7" fill="${c1}"/>`,
    snake:`<circle cx="20" cy="20" r="12" fill="none" stroke="${ac}" stroke-width="2.6"/><circle cx="20" cy="20" r="6.6" fill="none" stroke="${ac}" stroke-width="2"/>`,
    diamond:`<rect x="9.5" y="9.5" width="21" height="21" fill="${ac}" transform="rotate(45 20 20)"/><rect x="14.5" y="14.5" width="11" height="11" fill="${c1}" transform="rotate(45 20 20)"/>`,
    cross:`<rect x="17" y="8" width="6" height="24" fill="${ac}"/><rect x="8" y="17" width="24" height="6" fill="${ac}"/>`,
    /* Bayern: white roundel carrying the blue-and-white Bavarian lozenges */
    bavaria:`<circle cx="20" cy="20" r="10.8" fill="#FFFFFF"/>
      <clipPath id="bv"><circle cx="20" cy="20" r="10.8"/></clipPath>
      <g clip-path="url(#bv)" transform="rotate(45 20 20)">
        ${[6,11,16,21,26,31].map(x=>`<rect x="${x}" y="4" width="2.5" height="32" fill="#0066B2"/>`).join('')}
        ${[6,11,16,21,26,31].map(y=>`<rect x="4" y="${y}" width="32" height="2.5" fill="#0066B2"/>`).join('')}
      </g>
      <circle cx="20" cy="20" r="10.8" fill="none" stroke="${ac}" stroke-width="2.2"/>`,
    /* Monaco: the shield split on the diagonal, red over white */
    monaco:`<clipPath id="mc"><path d="M20 8 L30 11.6 V21 C30 26 25.4 29.6 20 31.2 C14.6 29.6 10 26 10 21 V11.6 Z"/></clipPath>
      <g clip-path="url(#mc)">
        <rect x="6" y="6" width="28" height="28" fill="#FFFFFF"/>
        <path d="M6 6 L34 6 L6 34 Z" fill="#E31B23"/>
        <path d="M34 6 L34 34 L6 34 Z" fill="#FFFFFF"/>
      </g>
      <path d="M20 8 L30 11.6 V21 C30 26 25.4 29.6 20 31.2 C14.6 29.6 10 26 10 21 V11.6 Z"
        fill="none" stroke="${ac}" stroke-width="1.6"/>`,
    lily:`<path d="M20 8.5 C15.8 15 15.8 21.5 20 28 C24.2 21.5 24.2 15 20 8.5 Z" fill="${ac}"/><path d="M13.4 16.5 Q19.4 21 13.4 27 M26.6 16.5 Q20.6 21 26.6 27" stroke="${ac}" stroke-width="2.2" fill="none"/>`,
    submarine:`<ellipse cx="20" cy="21" rx="13" ry="6.4" fill="${ac}"/><rect x="17" y="12.6" width="6" height="5" rx="1.4" fill="${ac}"/><circle cx="20" cy="21" r="2.6" fill="${c1}"/>`,
    bull:`<path d="M10.5 15 Q20 8.6 29.5 15 Q25 22.6 20 20 Q15 22.6 10.5 15 Z" fill="${ac}"/><path d="M14 25 Q20 30 26 25" stroke="${ac}" stroke-width="2.4" fill="none"/>`,
    wall:`<rect x="6" y="20" width="28" height="13" fill="${ac}"/><rect x="6" y="20" width="28" height="2.6" fill="${c1}"/><rect x="14.6" y="23" width="2" height="10" fill="${c1}"/><rect x="23.4" y="23" width="2" height="10" fill="${c1}"/>`,
    shield:`<path d="M20 9 L29.5 12.4 V21 C29.5 26 25 29.4 20 31 C15 29.4 10.5 26 10.5 21 V12.4 Z" fill="${ac}"/>`
  };
  const emblemFor={crown:'crown',eagle:'eagle',lion:'lion',bird:'bird',cannon:'cannon',devil:'devil',
    tower:'tower',dragon:'dragon',clover:'clover',star:'star',ship:'ship',cockerel:'cockerel',wolf:'wolf',
    snake:'snake',diamond:'diamond',cross:'cross',lily:'lily',submarine:'submarine',bull:'bull',
    bavaria:'bavaria',monaco:'monaco',
    wall:'wall',shield:'shield'};
  const em=E[emblemFor[key]]||'';

  /* name band shaped to the crest, with a hairline above it like real badges */
  const bandY = round?27.5:26.5;
  const band=`<rect x="0" y="${bandY}" width="40" height="10" fill="rgba(8,10,14,.62)"/>
    <rect x="0" y="${bandY}" width="40" height="0.7" fill="${ac}" opacity=".75"/>`;
  const code=String(club.short||'').slice(0,4);
  const tSize=code.length>=4?7.4:code.length===3?8.8:10.2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="${id}">${clip}</clipPath>
      <linearGradient id="${id}gl" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
        <stop offset=".42" stop-color="#fff" stop-opacity=".05"/>
        <stop offset=".62" stop-color="#000" stop-opacity=".06"/>
        <stop offset="1" stop-color="#000" stop-opacity=".22"/>
      </linearGradient>
      <linearGradient id="${id}rim" x1=".15" y1="0" x2=".85" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".28" stop-color="#f2f4f7"/>
        <stop offset=".52" stop-color="#c9ced6"/>
        <stop offset=".74" stop-color="#eef1f5"/>
        <stop offset="1" stop-color="#a8aeb8"/>
      </linearGradient>
      <radialGradient id="${id}sp" cx=".32" cy=".22" r=".7">
        <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <filter id="${id}sh" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#000" flood-opacity=".45"/>
      </filter>
    </defs>
    <g clip-path="url(#${id})">
      ${pat}
      <g transform="translate(0,-3.6)" filter="url(#${id}sh)">${em}</g>
      ${band}
      <text x="20" y="${bandY+7.2}" font-family="-apple-system,'SF Pro Text',Inter,sans-serif" font-size="${tSize}"
        font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0.3">${code}</text>
      <rect width="40" height="40" fill="url(#${id}gl)"/>
      <rect width="40" height="40" fill="url(#${id}sp)"/>
    </g>
    ${edge}</svg>`;

}

/* ============================================================
   SAFETY NET — a local mirror of the last known-good data.
   Written on every successful load and save. If the cloud ever comes
   back empty or unreachable, this is what stops a wipe.
   ============================================================ */
const MIRROR_KEY='ss_mirror_v1', MIRROR_HIST='ss_mirror_hist_v1';
function dbSize(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.games||[]).length),0)}catch(e){return 0} }
function dbPlayers(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.players||[]).length),0)}catch(e){return 0} }
function saveMirror(d){
  /* never let an accidental emptying overwrite the good local copy */
  if(!WIPE_OK && !writeIsSafe(d)) return;
  try{
    const rec={t:Date.now(),games:dbSize(d),players:dbPlayers(d),db:d};
    localStorage.setItem(MIRROR_KEY,JSON.stringify(rec));
    /* keep a rolling set of older snapshots too, in case the newest is already bad */
    let hist=[];try{hist=JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){}
    const last=hist[hist.length-1];
    if(!last||last.games!==rec.games||Date.now()-last.t>6*3600*1000){
      hist.push({t:rec.t,games:rec.games,players:rec.players,db:d});
      while(hist.length>5)hist.shift();
      try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(e){
        hist=hist.slice(-2);try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(_){}
      }
    }
  }catch(e){}
}
function readMirror(){ try{return JSON.parse(localStorage.getItem(MIRROR_KEY)||'null')}catch(e){return null} }
function mirrorHistory(){ try{return JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){return []} }
/* Guard: refuse a write that would destroy far more than it should. */
function writeIsSafe(next){
  const m=readMirror(); if(!m)return true;
  const now=dbSize(next), was=m.games;
  if(was>=3 && now===0) return false;              // everything vanished
  if(was>=10 && now < was*0.5) return false;       // more than half gone at once
  return true;
}

const Store={
  mem:{},
  hasWS:(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'),
  hasLS:(function(){try{localStorage.setItem('__p','1');localStorage.removeItem('__p');return true}catch(e){return false}})(),
  tier(){return supaConfigured?'cloud':this.hasWS?'app':this.hasLS?'browser':'memory'},
  async get(k){
    if(supaConfigured&&supa&&k===MAIN_KEY){
      try{const {data,error}=await supa.from('tracker_kv').select('value,updated_at').eq('key',k).maybeSingle();
        if(error){CLOUD_FAIL='The database did not respond ('+(error.message||'error')+')';hbPush(false);return null}
        CLOUD_FAIL=null; markSync(); hbPush(true);
        if(data){ REMOTE_STAMP=data.updated_at||null; return data.value; }
        /* genuinely empty: a brand-new project with no row yet */
        CLOUD_EMPTY=true; return null;
      }catch(e){ CLOUD_FAIL='Could not reach the database'; return null; }
    }
    if(this.hasWS){try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch(e){}}
    if(this.hasLS){try{const v=localStorage.getItem('st_'+k);if(v!==null)return JSON.parse(v)}catch(e){}}
    return (k in this.mem)?JSON.parse(this.mem[k]):null},
  async set(k,v){const s=JSON.stringify(v);this.mem[k]=s;
    if(supaConfigured&&supa&&k===MAIN_KEY){
      if(CLOUD_FAIL){ toast('⛔️ Not saved — the database is unreachable, so your data is protected'); return; }
      if(!writeIsSafe(v)&&!WIPE_OK){
        toast('🛑 Blocked: that would erase most of your season. Use Admin → Restore if this was intended.');
        return;
      }
      try{
        /* concurrency guard: if someone else saved after we loaded, don't clobber it */
        if(REMOTE_STAMP){
          const chk=await supa.from('tracker_kv').select('updated_at').eq('key',k).maybeSingle();
          if(!chk.error&&chk.data&&chk.data.updated_at&&chk.data.updated_at>REMOTE_STAMP){
            CONFLICT=chk.data.updated_at;
            toast('⚠️ Someone else saved a change — reload before editing so nothing is lost');
            return;
          }
        }
        const stamp=new Date().toISOString();
        const {error}=await supa.from('tracker_kv').upsert({key:k,value:v,updated_at:stamp});
        if(!error){ REMOTE_STAMP=stamp; CONFLICT=null; saveMirror(v); markSync(); return; }
        toast('⚠️ Could not save to the cloud — check your connection'); return;
      }catch(e){ toast('⚠️ Cloud save failed — check your connection'); return; }
    }
    if(k===MAIN_KEY)saveMirror(v);
    if(this.hasWS){try{await window.storage.set(k,s)}catch(e){}}
    if(this.hasLS){try{localStorage.setItem('st_'+k,s)}catch(e){}}}
};

function monitors(){

  const sd=daysSince(sync), bd=daysSince(bk);

  if(!supaConfigured) M.push(S('info','Database','LOCAL ONLY','Not hosted — data lives on this device only'));
  else if(CLOUD_FAIL) M.push(S('crit','Database','UNREACHABLE',CLOUD_FAIL));
  else M.push(S('ok','Database','CONNECTED',sync?`Last successful call ${fmtWhen(sync)}`:'Responding normally'));

  if(supaConfigured){

      :d>=4?S('warn','Pause watch',`${d} DAYS IDLE`,'Getting close to the 7-day pause window')
      :S('ok','Pause watch',`${d} DAY${d===1?'':'S'} IDLE`,'Comfortably inside the 7-day window'));
  }

  M.push(CLOUD_FAIL?S('warn','Write protection','ENGAGED','Saving is blocked so nothing can overwrite your data')
    :S('ok','Write protection','ARMED','Blocks any save that would erase the season'));

    ? S('ok','Local mirror',`${mir.games} GAME${mir.games===1?'':'S'}`,`Mirrored ${fmtWhen(mir.t)}`)
    : S('warn','Local mirror','EMPTY','Will populate the next time data loads'));

  M.push(snaps.length>=1?S('ok','Snapshots',`${snaps.length} KEPT`,snaps.length>1?'Restorable from Admin → Safety net':'More build up as you log games')
    :S('warn','Snapshots','NONE YET','They start saving the first time data loads'));

  M.push(bd===null?S('crit','Offsite backup','NEVER','Download one and email it to yourself')
    :bd>45?S('warn','Offsite backup',`${bd} DAYS OLD`,'Worth downloading a fresh copy')
    :S('ok','Offsite backup',`${bd} DAY${bd===1?'':'S'} OLD`,'Recent enough'));

/* Player of the Month — goals and clean sheets weighted equally so
   keepers and defenders can win it too. */
function potm(){
  const g=allGames().filter(x=>x.date);
  const months={};
  g.forEach(x=>{const k=(x.date||'').slice(0,7); if(!k)return; (months[k]=months[k]||[]).push(x)});
  const out=[];
  Object.keys(months).sort().forEach(k=>{
    const gl=months[k], m={};
    gl.forEach(x=>{
      [['A',x.teamA,x.scoreA,x.scoreB],['B',x.teamB,x.scoreB,x.scoreA]].forEach(([sd,team,gf,ga])=>{
        (team||[]).forEach(pid=>{
          const p=player(pid); if(!p)return;
          const e=m[pid]=m[pid]||{id:pid,name:p.name,pos:p.pos,P:0,W:0,D:0,L:0,G:0,cs:0,pts:0};
          e.P++; e.G+=(x.goals&&x.goals[pid])||0;
          if((ga??0)===0)e.cs++;
          if(x.result==='D'){e.D++;e.pts++} else if(x.result===sd){e.W++;e.pts+=3} else e.L++;
        })});
    });
    const arr=Object.values(m).filter(x=>x.P>=2);
    if(!arr.length)return;
    arr.forEach(x=>x.score=x.pts + x.G*1.5 + x.cs*1.5 + x.P*0.25);
    arr.sort((a,b)=>b.score-a.score||(b.G+b.cs)-(a.G+a.cs));
    out.push({month:k,games:gl.length,win:arr[0],runners:arr.slice(1,3)});
  });
  return out.reverse();
}

/* ============ BRACKET ============ */
function seedOrder(size){let a=[1,2];while(a.length<size){const m=a.length*2+1,o=[];a.forEach(x=>{o.push(x,m-x)});a=o}return a}
function buildBracket(ids){
  const n=ids.length;if(n<2)return null;
  let size=1;while(size<n)size*=2;
  const seeds=[...ids];while(seeds.length<size)seeds.push(null);
  const ord=seedOrder(size),slots=ord.map(i=>seeds[i-1]||null);
  const rounds=[];let first=[];
  for(let i=0;i<size;i+=2)first.push({id:uid(),a:slots[i],b:slots[i+1],sa:null,sb:null,done:false});
  rounds.push(first);let c=size/2;
  while(c>1){c/=2;rounds.push(Array.from({length:c},()=>({id:uid(),a:null,b:null,sa:null,sb:null,done:false})))}
  const bk={rounds};resolveByes(bk);return bk;
}
function resolveByes(bk){
  // Byes only exist in the seeding round (odd team counts). A later match with one
  // slot filled is simply awaiting its opponent — never auto-complete it.
  const rd=bk.rounds[0];
  rd.forEach((m,mi)=>{
    if(m.done)return;
    if(m.a&&!m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.a)}
    else if(!m.a&&m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.b)}
  });
}
function advance(bk,ri,mi,winner){
  const nr=bk.rounds[ri+1];if(!nr)return;
  const t=nr[Math.floor(mi/2)];if(!t)return;
  if(mi%2===0)t.a=winner;else t.b=winner;
  resolveByes(bk);
}
function bracketRoundName(bk,ri){
  const left=bk.rounds.length-ri;
  return ['Final','Semi-finals','Quarter-finals','Round of 16','Round of 32','Round of 64'][left-1]||`Round ${ri+1}`;
}
function bracketWinner(bk){
  if(!bk?.rounds?.length)return null;
  const f=bk.rounds[bk.rounds.length-1][0];
  if(!f?.done)return null;
  return f.sa===f.sb?null:(f.sa>f.sb?f.a:f.b);
}

/* ============ GROUPS ============ */
function roundRobin(ids){
  const l=[...ids];if(l.length<2)return [];
  if(l.length%2)l.push(null);
  const n=l.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=l[i],b=l[n-1-i];
      if(a&&b)out.push({id:uid(),a,b,sa:null,sb:null,done:false,rd:r+1})}
    l.splice(1,0,l.pop());
  }
  return out;
}
function groupTable(c,gid){
  const ids=(c.groups?.[gid])||[];
  const m={};ids.forEach(t=>m[t]={id:t,P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0});
  (c.fixtures||[]).filter(f=>f.g===gid&&f.done).forEach(f=>{
    const A=m[f.a],B=m[f.b];if(!A||!B)return;
    A.P++;B.P++;A.GF+=f.sa;A.GA+=f.sb;B.GF+=f.sb;B.GA+=f.sa;
    if(f.sa>f.sb){A.W++;A.pts+=3;B.L++}else if(f.sb>f.sa){B.W++;B.pts+=3;A.L++}else{A.D++;B.D++;A.pts++;B.pts++}
  });
  return Object.values(m).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.pts-a.pts||b.GD-a.GD||b.GF-a.GF);
}

/* ============ PLAYER STATS (league + overall) ============ */
function statsFor(games,upto){
  const S=season(),list=upto==null?games:games.slice(0,upto+1),m={};
  S.players.forEach(p=>m[p.id]={...p,P:0,W:0,D:0,L:0,G:0,A:0,GF:0,GA:0,pts:0,seq:[]});
  list.forEach(g=>{const a=g.scoreA??0,b=g.scoreB??0;
    [['A',g.teamA,a,b],['B',g.teamB,b,a]].forEach(([sd,tm,gf,ga])=>(tm||[]).forEach(pid=>{
      const x=m[pid];if(!x)return;x.P++;x.GF+=gf;x.GA+=ga;x.G+=(g.goals&&g.goals[pid])||0;
      x.A+=(g.assists&&g.assists[pid])||0;
      let r;if(g.result==='D'){x.D++;x.pts++;r='D'}else if(g.result===sd){x.W++;x.pts+=3;r='W'}else{x.L++;r='L'}
      x.seq.push({r,gf,ga,goals:(g.goals&&g.goals[pid])||0,assists:(g.assists&&g.assists[pid])||0,gid:g.id,date:g.date})}))});
  const arr=Object.values(m);
  arr.forEach(x=>{x.GD=x.GF-x.GA;x.ppg=x.P?x.pts/x.P:0;x.gpg=x.P?x.G/x.P:0;x.cpg=x.P?x.GA/x.P:0;
    x.apg=x.P?x.A/x.P:0;x.GA_=x.G+x.A;
    x.wr=x.P?x.W/x.P:0;x.app=list.length?x.P/list.length:0;x.cs=x.seq.filter(s=>s.ga===0).length;
    const l5=x.seq.slice(-5);x.last5=l5.map(v=>v.r);
    x.form=l5.length?l5.reduce((s,v)=>s+(v.r==='W'?3:v.r==='D'?1:0),0)/l5.length:0;
    let n=0,t=null;for(let i=x.seq.length-1;i>=0;i--){const r=x.seq[i].r;if(t===null){t=r;n=1}else if(r===t)n++;else break}
    x.streak={type:t,n}});
  /* Player rating, out of 100. The old version was three-sixths goals, which
     meant a striker won it every year. Now it is four equal parts — attacking,
     winning, defending and turning up — and the attacking part is scored
     against players in the SAME position, so a defender is compared with
     defenders rather than with the top scorer. */
  const pl=arr.filter(x=>x.P>0);
  if(pl.length){
    const nm=(list,k,inv,out)=>{
      const v=list.map(x=>x[k]),lo=Math.min(...v,0),hi=Math.max(...v,0);
      list.forEach(x=>{const t=hi===lo?0.5:(x[k]-lo)/(hi-lo);x[out]=inv?1-t:t});
    };
    pl.forEach(x=>x._ga=(x.G+(x.A||0))/Math.max(1,x.P));      /* involvements a game */
    ['ATT','MID','DEF','GK'].forEach(pos=>{
      const grp=pl.filter(x=>((player(x.id)||{}).pos||'MID')===pos);
      if(grp.length)nm(grp,'_ga',false,'_att');
    });
    pl.forEach(x=>{ if(x._att===undefined)x._att=0.5 });
    /* Defending is scored within position too. How many your team lets in
       depends enormously on where you play, so ranking a midfielder against
       defenders quietly handed the award to the same positions every year.
       Winning and turning up stay global — those mean the same wherever
       you play. */
    ['ATT','MID','DEF','GK'].forEach(pos=>{
      const grp=pl.filter(x=>((player(x.id)||{}).pos||'MID')===pos);
      if(grp.length)nm(grp,'cpg',true,'_def');
    });
    pl.forEach(x=>{ if(x._def===undefined)x._def=0.5 });
    nm(pl,'ppg',false,'_win1'); nm(pl,'wr',false,'_win2');
    nm(pl,'P',false,'_app');
    pl.forEach(x=>{
      const win=(x._win1+x._win2)/2;
      x.index=Math.round((x._att*0.34 + win*0.28 + x._def*0.24 + x._app*0.14)*100);

/* Points first, then win rate — but only for people who have actually turned
   out enough for it to mean anything. Someone who played once, won, and
   vanished should not sit above a regular on 100%. The bar moves with the
   season: half the games played so far, never fewer than three. A flat 20
   would leave the tie-break dead until spring. */
function wrThreshold(){
  const n=allGames().length;
  return Math.max(3,Math.ceil(n*0.5));
}
const tableSort=(a,b)=>{
  if(b.pts!==a.pts)return b.pts-a.pts;
  const q=wrThreshold(), aq=a.P>=q, bq=b.P>=q;
  /* win rate only settles it when BOTH have played enough */
  if(aq&&bq&&b.wr!==a.wr)return b.wr-a.wr;
  if(b.index!==a.index)return (b.index||0)-(a.index||0);
  if(b.G!==a.G)return b.G-a.G;
  return a.GA-b.GA;                       /* fewer conceded wins it */
};
const ranks=st=>[...st].filter(x=>x.P>0).sort(tableSort).map((x,i)=>({id:x.id,rank:i+1}));
function movement(cid){const g=compGames(cid);if(g.length<2)return{};
  const now=ranks(statsFor(g)),pv=ranks(statsFor(g,g.length-2)),pm={};
  pv.forEach(x=>pm[x.id]=x.rank);const o={};now.forEach(x=>o[x.id]=pm[x.id]===undefined?0:pm[x.id]-x.rank);return o}

function feed(){const gl=allGames(),ap={},go_={},ev=[],T=[1,5,10,25,50,100];
  gl.forEach((g,i)=>[...(g.teamA||[]),...(g.teamB||[])].forEach(pid=>{
    ap[pid]=(ap[pid]||0)+1;
    if(T.includes(ap[pid]))ev.push({i,pid,e:'🎖️',t:ap[pid]===1?'Debut':`${ap[pid]} appearances`,date:g.date});
    const n=(g.goals&&g.goals[pid])||0;
    if(n>=3)ev.push({i,pid,e:'🎩',t:`Hat-trick · ${n} goals`,date:g.date});
    if(n>0){const b=go_[pid]||0,a=b+n;T.forEach(t=>{if(b<t&&a>=t)ev.push({i,pid,e:'⚽',t:t===1?'First goal':`${t} career goals`,date:g.date})});go_[pid]=a}
  }));
  return ev.reverse()}

/* The bell sits next to the theme toggle. It only appears once you have
   signed in with your code, because there is nobody to notify otherwise. */
function bellIcon(){
  if(!fplMine())return '';
  const on = PUSH_ON==='on';
  const off = !!pushBlockedReason();
  return `<button class="iconbtn bellbtn${on?' on':''}" title="${on?'Alerts are on':'Turn on match alerts'}"
    onclick="bellTap()" aria-label="${on?'Alerts are on':'Turn on match alerts'}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      ${off?'<path d="M3 3l18 18" stroke-width="2.1"/>':''}
    </svg>
    ${on?'<i class="bell-dot"></i>':''}
  </button>`;
}
/* The bell only ever turns alerts ON. There is no off switch here on purpose —
   matchday messages are the point of it, and an off button next to the theme
   toggle invites idle tapping. Anyone who genuinely wants them gone can do it
   in their phone's own notification settings, which no web app can override. */
async function bellTap(){
  const why=pushBlockedReason();
  if(why){ toast(why); return }
  const st=await pushStatus();
  if(st==='on'){ toast('🔔 Alerts are on for this device'); return }
  await pushEnable();
}

/* The action bar is written inside the scrolling body by each sheet, so lift it
   out to sit alongside it — that makes it a genuine footer instead of a sticky
   element that drifts a few pixels as you scroll. */
/* Pin the Cancel/Save row to the bottom of the sheet. This runs after every
   repaint, and a repaint builds a fresh bar inside the body — so any bar lifted
   on a previous pass has to be thrown away first, or they stack up one per
   keystroke and swallow the screen. */
function liftFormbar(){
  try{
    const sheet=document.querySelector('#sheet');
    if(!sheet)return;
    const body=sheet.querySelector('.sbody');
    if(!body)return;
    /* drop any bar left over from a previous repaint */
    [...sheet.children].forEach(el=>{ if(el.classList&&el.classList.contains('formbar'))el.remove() });
    const bars=[...body.querySelectorAll('.formbar')];
    if(!bars.length)return;
    bars.slice(0,-1).forEach(b=>b.remove());     /* belt and braces */
    sheet.appendChild(bars[bars.length-1]);
  }catch(e){}
}

/* ============ SMOOTH REPAINTS ============
   Rebuilding innerHTML throws away the focused input, which is what makes the
   keyboard flicker shut mid-typing and the scroll jump. This keeps both. */
function keepFocus(fn){
  const a=document.activeElement;
  const id=a&&a.id, tag=a&&a.tagName;
  const isField = tag==='INPUT'||tag==='TEXTAREA';
  const selS = isField?a.selectionStart:null, selE = isField?a.selectionEnd:null;
  // remember where each scrollable area was
  const body=document.querySelector('.sbody');
  const bodyTop=body?body.scrollTop:0;
  const winTop=window.scrollY;

  fn();

  if(id){
    const el=document.getElementById(id);
    if(el&&el!==document.activeElement){
      try{
        el.focus({preventScroll:true});
        if(isField&&selS!=null&&el.setSelectionRange)el.setSelectionRange(selS,selE);
      }catch(e){}
    }
  }
  liftFormbar();
  const nb=document.querySelector('.sbody');
  if(nb&&bodyTop)nb.scrollTop=bodyTop;
  if(winTop&&!body)window.scrollTo(0,winTop);
}
/* keep the page behind a sheet from scrolling underneath it */
function lockScroll(on){
  try{
    if(on){ document.body.dataset.sy=String(window.scrollY); document.body.classList.add('sheet-open');
            document.body.style.top=`-${window.scrollY}px`; }
    else { const y=+(document.body.dataset.sy||0);
           document.body.classList.remove('sheet-open'); document.body.style.top='';
           window.scrollTo(0,y); }
  }catch(e){}
}

/* ---- what's within reach next Sunday ---- */
/* the rows only, so Home can fold them into its Milestones block */
function closingInRows(){
  const st=lgStats().filter(x=>x.P>0);
  if(!st.length)return [];
  const out=[];
  st.forEach(x=>{
    const car=careerOf(x.id); if(!car)return;
    // next level
    if(car.lvl.next){
      const need=car.lvl.next.xp-car.xp;
      if(need>0&&need<=180)out.push({id:x.id,name:x.name,e:car.lvl.next.e,
        t:`${need} XP from ${car.lvl.next.t}`,v:need,k:'lvl'});
    }
    // next unfinished challenge that's close
    car.ch.filter(c=>!c.done).forEach(c=>{
      const [cur,tot]=c.f(x); const left=tot-cur;
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:c.e,t:`${left} from “${c.n}”`,v:left,k:'ch'});
    });
  });
  if(!out.length)return [];
  out.sort((a,b)=>a.v-b.v);
  const seen=new Set(),list=[];
  out.forEach(o=>{if(list.length<5&&!seen.has(o.id+o.t)){seen.add(o.id+o.t);list.push(o)}});
  return list;
}
function closingIn(){
  const list=closingInRows();
  if(!list.length)return '';
  return `<div class="sechead">⏳ Almost there</div>\n    <div class="note" style="padding:0 4px 8px;font-size:12px">A few games or goals away from the next milestone</div>
    <div class="card">${list.map(o=>`<div class="row tap" onclick="openCareer('${o.id}')">
      <div style="font-size:21px;flex:0 0 26px">${o.e}</div>
      <div class="rt"><div class="r1">${esc(o.name)}</div>
        <div class="r2">${esc(o.t)}</div></div>${chev}</div>`).join('')}</div>
    <div class="note">Within touching distance next Sunday.</div>`;
}

/* ============ FIXTURES ============ */
let FF='all';
let FSORT='new', FPLAYER='all', FRESULT='all', FSEARCH='';
function vFixtures(){ LMODE='fixtures'; go('league'); }
function fixturesBody(){
  let g=allGames();
  if(FF!=='all')g=g.filter(x=>x.compId===FF);
  if(FPLAYER!=='all')g=g.filter(x=>(x.teamA||[]).includes(FPLAYER)||(x.teamB||[]).includes(FPLAYER));
  if(FRESULT!=='all'){
    g=g.filter(x=>{
      if(FRESULT==='draw')return x.result==='D';
      if(FPLAYER==='all')return FRESULT==='big'?Math.abs((x.scoreA||0)-(x.scoreB||0))>=3:true;
      const onA=(x.teamA||[]).includes(FPLAYER),sd=onA?'A':'B';
      if(FRESULT==='win')return x.result===sd;
      if(FRESULT==='loss')return x.result!=='D'&&x.result!==sd;
      return true;
    });
  }
  const q=FSEARCH.trim().toLowerCase();
  if(q)g=g.filter(x=>{
    const names=[...(x.teamA||[]),...(x.teamB||[])].map(p=>player(p)?.name||'').concat(x.fillA||[],x.fillB||[]);
    return names.join(' ').toLowerCase().includes(q)||String(x.round||'').toLowerCase().includes(q);
  });
  const sorted=[...g];
  if(FSORT==='new')sorted.reverse();
  else if(FSORT==='old'){/* already oldest-first */}
  else if(FSORT==='goals')sorted.sort((a,b)=>((b.scoreA||0)+(b.scoreB||0))-((a.scoreA||0)+(a.scoreB||0)));
  else if(FSORT==='margin')sorted.sort((a,b)=>Math.abs((b.scoreA||0)-(b.scoreB||0))-Math.abs((a.scoreA||0)-(a.scoreB||0)));

  const grouped=(FSORT==='new'||FSORT==='old');
  const by={};if(grouped)sorted.forEach(x=>{const k=x.date||'—';(by[k]=by[k]||[]).push(x)});
  const roster=[...season().players].filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const active=(FF!=='all')+(FPLAYER!=='all')+(FRESULT!=='all')+(q?1:0);
  const tot=allGames().length;
  return `
      <button class="btn pri full" data-admin style="margin-bottom:14px" onclick="newGame()">Log a game</button>
      <input class="search" placeholder="Search a player or round…" value="${esc(FSEARCH)}" id="fxq"
        oninput="FSEARCH=this.value;render()" style="margin-bottom:10px">
      <div class="filterbar">
        <select class="fsel" onchange="FF=this.value;render()">
          <option value="all" ${FF==='all'?'selected':''}>All comps</option>
          ${comps().map(c=>`<option value="${c.id}" ${FF===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FPLAYER=this.value;render()">
          <option value="all" ${FPLAYER==='all'?'selected':''}>👥 Everyone</option>
          ${roster.map(p=>`<option value="${p.id}" ${FPLAYER===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FRESULT=this.value;render()">
          <option value="all" ${FRESULT==='all'?'selected':''}>Any result</option>
          ${FPLAYER!=='all'?`<option value="win" ${FRESULT==='win'?'selected':''}>✅ Wins</option>
            <option value="loss" ${FRESULT==='loss'?'selected':''}>❌ Losses</option>`:''}
          <option value="draw" ${FRESULT==='draw'?'selected':''}>🤝 Draws</option>
          ${FPLAYER==='all'?`<option value="big" ${FRESULT==='big'?'selected':''}>💥 Big wins</option>`:''}
        </select>
        <select class="fsel" onchange="FSORT=this.value;render()">
          ${[['new','⏱ Newest'],['old','📜 Oldest'],['goals','⚽ Most goals'],['margin','📊 Biggest margin']]
            .map(([k,l])=>`<option value="${k}" ${FSORT===k?'selected':''}>${l}</option>`).join('')}
        </select>
        ${active?`<button class="fclear" onclick="clearFilters()">✕ Clear ${active}</button>`:''}
      </div>
      ${sorted.length?(grouped
        ? Object.keys(by).map(d=>`<div class="sechead">${d==='—'?'Undated':fdate(d)}</div>
            <div class="card">${by[d].map(gameRow).join('')}</div>`).join('')
        : `<div class="card">${sorted.map(gameRow).join('')}</div>`)
      :`<div class="empty"><div class="ee">🔍</div><h3>${tot?'No games match':'No fixtures yet'}</h3>
        <p>${tot?'Try clearing a filter or searching something else.':'Every game you log appears here, newest first.'}</p>
        ${tot?'<button class="btn pri" onclick="clearFilters()">Clear filters</button>':''}</div>`}
    `;
}

  const el=$('#fxq');if(el&&FSEARCH){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
function clearFilters(){FF='all';FPLAYER='all';FRESULT='all';FSEARCH='';FSORT='new';render()}

let SQQ='';
/* Every screen opens with the same broadcast-style banner instead of a plain
   black heading, then one line of live context underneath. The eyebrow carries
   whatever is current — the matchday, the season, the count. */
