.crosslink{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--fill);
  border:none;border-radius:22px;padding:6px 12px 6px 7px;font-size:13.5px;font-weight:600;
  color:var(--tint);cursor:pointer}
.crosslink svg{width:14px;height:14px;stroke:var(--tint);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.crosslink .av{width:22px;height:22px;font-size:9px}

/* ================= FPL MARKET ================= */
.mk-banner{display:flex;align-items:center;gap:8px;background:var(--tint-soft);border-radius:12px;
  padding:10px 12px;margin-bottom:10px;font-size:13.5px;color:var(--label)}
.mk-banner.swap{background:color-mix(in srgb,var(--orange) 15%,transparent)}
.mk-banner button{margin-left:auto;background:none;border:none;color:var(--tint);font-weight:700;
  font-size:13px;cursor:pointer;flex:0 0 auto}
.mk-bud{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.mk-bud>div{padding:10px 6px;text-align:center;border-right:1px solid var(--sep)}
.mk-bud>div:last-child{border-right:none}
.mk-bud b{display:block;font-size:17px;font-weight:800;color:var(--tint)}
.mk-bud span{font-size:9.5px;font-weight:700;color:var(--label3);letter-spacing:.06em;text-transform:uppercase}
.mk-list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mk-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:none;
  border-bottom:.5px solid var(--sep);cursor:pointer;text-align:left}
.mk-row:last-child{border-bottom:none}
.mk-row:active{background:var(--fill)}
.mk-row.own{background:color-mix(in srgb,var(--tint) 8%,transparent)}
.mk-row.poor{opacity:.42}
.mk-pos{flex:0 0 34px;font-size:9.5px;font-weight:900;letter-spacing:.04em;text-align:center;
  color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);border-radius:6px;padding:3px 0}
.mk-kit{flex:0 0 auto;display:flex}
.mk-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mk-n{font-size:14.5px;font-weight:700;color:var(--label);display:flex;align-items:center;gap:6px}
.mk-in{font-style:normal;font-size:8.5px;font-weight:900;background:var(--tint);color:#fff;
  padding:2px 6px;border-radius:20px}
.mk-sub{font-size:11.5px;color:var(--label3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-r{flex:0 0 auto;text-align:right}
.mk-price{display:block;font-size:14.5px;font-weight:800;color:var(--label)}
.mk-pts{display:block;font-size:11px;color:var(--label3)}
/* remove-× on a pitch shirt */
.sh{position:relative}
.sh-x{position:absolute;top:-6px;right:2px;width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;z-index:2}
.sh-name.empty{background:rgba(255,255,255,.22);color:#fff}

.sh-c{white-space:nowrap;padding:3px 9px;font-size:9px}
.sh-top.empty.req{border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.24)}
.sh-line.flexline{opacity:.96}
.sh-line.flexline .sh-name.empty{background:rgba(255,255,255,.16);letter-spacing:.08em;font-size:9.5px}

.row.chip-armed{background:color-mix(in srgb,var(--orange) 10%,transparent)}
.chip-state.armed{background:color-mix(in srgb,var(--orange) 20%,transparent);color:#B36F00}
[data-theme="dark"] .chip-state.armed{color:#FBBF24}
.row.chip-blocked{opacity:.5}
</style>

/* ---- Admin = whoever has entered the password. When NOT hosted (no Supabase),
   the app is fully local and you're always the admin. When hosted, the password
   both unlocks editing AND is what lets writes reach the shared database. ---- */
/* The password is stored as a hash so it isn't sitting in the page source as
   plain text. This raises the bar against casual snooping — it is NOT real
   security, because the check still happens in the browser. */
const ADMIN_PIN_HASH='9642e13c';
function pinHash(v){
  let h=0x811c9dc5;
  const t=String(v||'').trim().toUpperCase();
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return h.toString(16).padStart(8,'0');
}
function pinSaved(){
  /* localStorage survives closing the browser; sessionStorage is a fallback for
     locked-down browsers that block it. */
  try{ if(localStorage.getItem('ss_pin')==='1')return true }catch(e){}
  try{ if(sessionStorage.getItem('ss_pin')==='1')return true }catch(e){}
  return false;
}

  if(pinHash(v)===ADMIN_PIN_HASH){

    try{sessionStorage.setItem('ss_pin','1')}catch(e){}
    applyAdminClass(); render(); toast('🔓 Admin unlocked');
  } else { toast('Incorrect password'); }
}

async function initSupa(){
  if(!supa)return;
  applyAdminClass();
  /* ---- in-app keep-alive ----
     Any visit pings the database, which resets Supabase's 7-day pause timer.
     This covers the season well (someone opens the link most weeks) but it can
     only run while a page is open — the GitHub Action covers the quiet gaps. */
  const ping=()=>{ try{ supa.from('tracker_kv').select('key').limit(1)
      .then(({error})=>{ if(!error)markSync(); }); }catch(e){} };
  ping();                                            // on load
  setInterval(ping, 25*60*1000);                     // every 25 min while open
  document.addEventListener('visibilitychange',()=>{ // when you come back to the tab
    if(document.visibilityState==='visible')ping();
  });
  supa.channel('kv-sync').on('postgres_changes',{event:'*',schema:'public',table:'tracker_kv',filter:`key=eq.${MAIN_KEY}`},
    payload=>{ if(payload.new&&payload.new.value){
      const incoming=payload.new.value;
      if(!incoming.seasons||!incoming.seasons.length)return;           // malformed — ignore
      if(!writeIsSafe(incoming)&&dbSize(DB)>dbSize(incoming)){          // a wipe arriving from elsewhere
        toast('⚠️ Ignored an update that would have emptied the season'); return;
      }
      const sheetOpen=$('#sbg')&&$('#sbg').classList.contains('open');
      DB=incoming; if(!DB.current||!DB.seasons?.some(s=>s.id===DB.current))DB.current=DB.seasons?.[0]?.id;
      CUR=DB.current; if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
      if(payload.new.updated_at)REMOTE_STAMP=payload.new.updated_at;
      saveMirror(DB);
      if(!sheetOpen)render();
    }}).subscribe();
}

/* ============================================================
   SAFETY NET — a local mirror of the last known-good data.
   Written on every successful load and save. If the cloud ever comes
   back empty or unreachable, this is what stops a wipe.
   ============================================================ */
const MIRROR_KEY='ss_mirror_v1', MIRROR_HIST='ss_mirror_hist_v1';
function dbSize(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.games||[]).length),0)}catch(e){return 0} }
function dbPlayers(d){ try{return (d&&d.seasons||[]).reduce((t,s)=>t+((s.players||[]).length),0)}catch(e){return 0} }
function saveMirror(d){
  /* never let an accidental emptying overwrite the good local copy */
  if(!WIPE_OK && !writeIsSafe(d)) return;
  try{
    const rec={t:Date.now(),games:dbSize(d),players:dbPlayers(d),db:d};
    localStorage.setItem(MIRROR_KEY,JSON.stringify(rec));
    /* keep a rolling set of older snapshots too, in case the newest is already bad */
    let hist=[];try{hist=JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){}
    const last=hist[hist.length-1];
    if(!last||last.games!==rec.games||Date.now()-last.t>6*3600*1000){
      hist.push({t:rec.t,games:rec.games,players:rec.players,db:d});
      while(hist.length>5)hist.shift();
      try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(e){
        hist=hist.slice(-2);try{localStorage.setItem(MIRROR_HIST,JSON.stringify(hist))}catch(_){}
      }
    }
  }catch(e){}
}
function readMirror(){ try{return JSON.parse(localStorage.getItem(MIRROR_KEY)||'null')}catch(e){return null} }
function mirrorHistory(){ try{return JSON.parse(localStorage.getItem(MIRROR_HIST)||'[]')}catch(e){return []} }
/* Guard: refuse a write that would destroy far more than it should. */
function writeIsSafe(next){
  const m=readMirror(); if(!m)return true;
  const now=dbSize(next), was=m.games;
  if(was>=3 && now===0) return false;              // everything vanished
  if(was>=10 && now < was*0.5) return false;       // more than half gone at once
  return true;
}

const Store={
  mem:{},
  hasWS:(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'),
  hasLS:(function(){try{localStorage.setItem('__p','1');localStorage.removeItem('__p');return true}catch(e){return false}})(),
  tier(){return supaConfigured?'cloud':this.hasWS?'app':this.hasLS?'browser':'memory'},
  async get(k){
    if(supaConfigured&&supa&&k===MAIN_KEY){
      try{const {data,error}=await supa.from('tracker_kv').select('value,updated_at').eq('key',k).maybeSingle();
        if(error){CLOUD_FAIL='The database did not respond ('+(error.message||'error')+')';hbPush(false);return null}
        CLOUD_FAIL=null; markSync(); hbPush(true);
        if(data){ REMOTE_STAMP=data.updated_at||null; return data.value; }
        /* genuinely empty: a brand-new project with no row yet */
        CLOUD_EMPTY=true; return null;
      }catch(e){ CLOUD_FAIL='Could not reach the database'; return null; }
    }
    if(this.hasWS){try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch(e){}}
    if(this.hasLS){try{const v=localStorage.getItem('st_'+k);if(v!==null)return JSON.parse(v)}catch(e){}}
    return (k in this.mem)?JSON.parse(this.mem[k]):null},
  async set(k,v){const s=JSON.stringify(v);this.mem[k]=s;
    if(supaConfigured&&supa&&k===MAIN_KEY){
      if(CLOUD_FAIL){ toast('⛔️ Not saved — the database is unreachable, so your data is protected'); return; }
      if(!writeIsSafe(v)&&!WIPE_OK){
        toast('🛑 Blocked: that would erase most of your season. Use Admin → Restore if this was intended.');
        return;
      }
      try{
        /* concurrency guard: if someone else saved after we loaded, don't clobber it */
        if(REMOTE_STAMP){
          const chk=await supa.from('tracker_kv').select('updated_at').eq('key',k).maybeSingle();
          if(!chk.error&&chk.data&&chk.data.updated_at&&chk.data.updated_at>REMOTE_STAMP){
            CONFLICT=chk.data.updated_at;
            toast('⚠️ Someone else saved a change — reload before editing so nothing is lost');
            return;
          }
        }
        const stamp=new Date().toISOString();
        const {error}=await supa.from('tracker_kv').upsert({key:k,value:v,updated_at:stamp});
        if(!error){ REMOTE_STAMP=stamp; CONFLICT=null; saveMirror(v); markSync(); return; }
        toast('⚠️ Could not save to the cloud — check your connection'); return;
      }catch(e){ toast('⚠️ Cloud save failed — check your connection'); return; }
    }
    if(k===MAIN_KEY)saveMirror(v);
    if(this.hasWS){try{await window.storage.set(k,s)}catch(e){}}
    if(this.hasLS){try{localStorage.setItem('st_'+k,s)}catch(e){}}}
};

const SYNC_KEY='ss_last_sync';
function markSync(){ try{localStorage.setItem(SYNC_KEY,String(Date.now()))}catch(e){} }

const daysSince=t=>t?Math.floor((Date.now()-t)/86400000):null;
/* ---- monitoring dashboard (Datadog-style) ---- */
const HB_KEY='ss_hb_v1';               // rolling record of connection checks
function hbPush(ok){
  try{
    let h=[];try{h=JSON.parse(localStorage.getItem(HB_KEY)||'[]')}catch(e){}
    h.push({t:Date.now(),ok:!!ok});
    while(h.length>40)h.shift();
    localStorage.setItem(HB_KEY,JSON.stringify(h));
  }catch(e){}
}
function hbList(){ try{return JSON.parse(localStorage.getItem(HB_KEY)||'[]')}catch(e){return []} }
function monitors(){
  const sync=lastSync(), bk=lastBackup(), mir=readMirror(), snaps=mirrorHistory();
  const sd=daysSince(sync), bd=daysSince(bk);
  const M=[];
  const S=(level,label,value,detail)=>({level,label,value,detail});
  // 1. database
  if(!supaConfigured) M.push(S('info','Database','LOCAL ONLY','Not hosted — data lives on this device only'));
  else if(CLOUD_FAIL) M.push(S('crit','Database','UNREACHABLE',CLOUD_FAIL));
  else M.push(S('ok','Database','CONNECTED',sync?`Last successful call ${fmtWhen(sync)}`:'Responding normally'));
  // 2. pause watch
  if(supaConfigured){
    const d=sd===null?99:sd;
    M.push(d>=6?S('crit','Pause watch',`${d} DAYS IDLE`,'Supabase pauses free projects around 7 days — open the app or check the keep-alive')
      :d>=4?S('warn','Pause watch',`${d} DAYS IDLE`,'Getting close to the 7-day pause window')
      :S('ok','Pause watch',`${d} DAY${d===1?'':'S'} IDLE`,'Comfortably inside the 7-day window'));
  }
  // 3. write protection
  M.push(CLOUD_FAIL?S('warn','Write protection','ENGAGED','Saving is blocked so nothing can overwrite your data')
    :S('ok','Write protection','ARMED','Blocks any save that would erase the season'));
  // 4. local mirror
  M.push(mir&&mir.games!=null
    ? S('ok','Local mirror',`${mir.games} GAME${mir.games===1?'':'S'}`,`Mirrored ${fmtWhen(mir.t)}`)
    : S('warn','Local mirror','EMPTY','Will populate the next time data loads'));
  // 5. snapshots
  M.push(snaps.length>=1?S('ok','Snapshots',`${snaps.length} KEPT`,snaps.length>1?'Restorable from Admin → Safety net':'More build up as you log games')
    :S('warn','Snapshots','NONE YET','They start saving the first time data loads'));
  // 6. offsite backup
  M.push(bd===null?S('crit','Offsite backup','NEVER','Download one and email it to yourself')
    :bd>45?S('warn','Offsite backup',`${bd} DAYS OLD`,'Worth downloading a fresh copy')
    :S('ok','Offsite backup',`${bd} DAY${bd===1?'':'S'} OLD`,'Recent enough'));
  // 7. conflicts
  if(CONFLICT)M.push(S('warn','Sync conflict','DETECTED','Another device saved after you loaded — reload before editing'));
  return M;
}

async function restoreSnapshot(i){
  if(!requireAdmin())return;
  const h=mirrorHistory(),x=h[i]; if(!x){toast('Snapshot not found');return}
  if(!await askConfirm('Restore this snapshot?',
     `${x.games} games and ${x.players} players from ${fmtWhen(x.t)}. This replaces what's there now.`,
     'Restore',true))return;
  snapshot('restoring a snapshot');
  WIPE_OK=true; DB=x.db; CUR=DB.current||DB.seasons[0].id;
  if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
  await save(); WIPE_OK=false; render(); toast('✅ Snapshot restored');
}
async function pushMirrorToCloud(){
  if(!requireAdmin())return;
  const rec=RECOVERED||readMirror(); if(!rec){toast('No local copy found');return}
  if(!await askConfirm('Restore to the cloud?',
     `This will write your local copy (${rec.games} games, ${rec.players} players) back to the database, replacing whatever is there now.`,
     'Restore',false))return;
  CLOUD_FAIL=null; WIPE_OK=true;
  DB=rec.db; CUR=DB.current||DB.seasons[0].id;
  if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
  await save(); WIPE_OK=false;
  if(CLOUD_FAIL){toast('Still cannot reach the database');render();return}
  RECOVERED=null; render(); toast('✅ Your data is back in the cloud');
}
async function retryCloud(){
  CLOUD_FAIL=null; toast('Reconnecting…');
  const fresh=await Store.get(MAIN_KEY);
  if(CLOUD_FAIL){ render(); toast('Still cannot reach the database'); return; }
  if(fresh&&fresh.seasons&&fresh.seasons.length){
    DB=fresh; CUR=DB.current||DB.seasons[0].id;
    if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
    render(); toast('✅ Reconnected — your data is back');
  } else { render(); toast('Connected, but the database is empty'); }
}

/* Player of the Month — goals and clean sheets weighted equally so
   keepers and defenders can win it too. */
function potm(){
  const g=allGames().filter(x=>x.date);
  const months={};
  g.forEach(x=>{const k=(x.date||'').slice(0,7); if(!k)return; (months[k]=months[k]||[]).push(x)});
  const out=[];
  Object.keys(months).sort().forEach(k=>{
    const gl=months[k], m={};
    gl.forEach(x=>{
      [['A',x.teamA,x.scoreA,x.scoreB],['B',x.teamB,x.scoreB,x.scoreA]].forEach(([sd,team,gf,ga])=>{
        (team||[]).forEach(pid=>{
          const p=player(pid); if(!p)return;
          const e=m[pid]=m[pid]||{id:pid,name:p.name,pos:p.pos,P:0,W:0,D:0,L:0,G:0,cs:0,pts:0};
          e.P++; e.G+=(x.goals&&x.goals[pid])||0;
          if((ga??0)===0)e.cs++;
          if(x.result==='D'){e.D++;e.pts++} else if(x.result===sd){e.W++;e.pts+=3} else e.L++;
        })});
    });
    const arr=Object.values(m).filter(x=>x.P>=2);
    if(!arr.length)return;
    arr.forEach(x=>x.score=x.pts + x.G*1.5 + x.cs*1.5 + x.P*0.25);
    arr.sort((a,b)=>b.score-a.score||(b.G+b.cs)-(a.G+a.cs));
    out.push({month:k,games:gl.length,win:arr[0],runners:arr.slice(1,3)});
  });
  return out.reverse();
}

/* summary for any season — used by League history, Hall of Fame and season comparison.
   NOTE: keep this near the top of the view layer; it is referenced from several places. */
function seasonSummary(s){

      if(g.result==='D'){x.D++;x.pts++}else if(g.result===sd){x.W++;x.pts+=3}else x.L++}))});

  return {games:games.length,goals,table:arr,champ:arr[0]||null,boot:(boot&&boot.G)?boot:null,players:arr.length};

/* ============ BRACKET ============ */
function seedOrder(size){let a=[1,2];while(a.length<size){const m=a.length*2+1,o=[];a.forEach(x=>{o.push(x,m-x)});a=o}return a}
function buildBracket(ids){
  const n=ids.length;if(n<2)return null;
  let size=1;while(size<n)size*=2;
  const seeds=[...ids];while(seeds.length<size)seeds.push(null);
  const ord=seedOrder(size),slots=ord.map(i=>seeds[i-1]||null);
  const rounds=[];let first=[];
  for(let i=0;i<size;i+=2)first.push({id:uid(),a:slots[i],b:slots[i+1],sa:null,sb:null,done:false});
  rounds.push(first);let c=size/2;
  while(c>1){c/=2;rounds.push(Array.from({length:c},()=>({id:uid(),a:null,b:null,sa:null,sb:null,done:false})))}
  const bk={rounds};resolveByes(bk);return bk;
}
function resolveByes(bk){
  // Byes only exist in the seeding round (odd team counts). A later match with one
  // slot filled is simply awaiting its opponent — never auto-complete it.
  const rd=bk.rounds[0];
  rd.forEach((m,mi)=>{
    if(m.done)return;
    if(m.a&&!m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.a)}
    else if(!m.a&&m.b){m.done=true;m.bye=true;advance(bk,0,mi,m.b)}
  });
}
function advance(bk,ri,mi,winner){
  const nr=bk.rounds[ri+1];if(!nr)return;
  const t=nr[Math.floor(mi/2)];if(!t)return;
  if(mi%2===0)t.a=winner;else t.b=winner;
  resolveByes(bk);
}
function bracketRoundName(bk,ri){
  const left=bk.rounds.length-ri;
  return ['Final','Semi-finals','Quarter-finals','Round of 16','Round of 32','Round of 64'][left-1]||`Round ${ri+1}`;
}
function bracketWinner(bk){
  if(!bk?.rounds?.length)return null;
  const f=bk.rounds[bk.rounds.length-1][0];
  if(!f?.done)return null;
  return f.sa===f.sb?null:(f.sa>f.sb?f.a:f.b);
}

/* ============ GROUPS ============ */
function roundRobin(ids){
  const l=[...ids];if(l.length<2)return [];
  if(l.length%2)l.push(null);
  const n=l.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=l[i],b=l[n-1-i];
      if(a&&b)out.push({id:uid(),a,b,sa:null,sb:null,done:false,rd:r+1})}
    l.splice(1,0,l.pop());
  }
  return out;
}
function groupTable(c,gid){
  const ids=(c.groups?.[gid])||[];
  const m={};ids.forEach(t=>m[t]={id:t,P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0});
  (c.fixtures||[]).filter(f=>f.g===gid&&f.done).forEach(f=>{
    const A=m[f.a],B=m[f.b];if(!A||!B)return;
    A.P++;B.P++;A.GF+=f.sa;A.GA+=f.sb;B.GF+=f.sb;B.GA+=f.sa;
    if(f.sa>f.sb){A.W++;A.pts+=3;B.L++}else if(f.sb>f.sa){B.W++;B.pts+=3;A.L++}else{A.D++;B.D++;A.pts++;B.pts++}
  });
  return Object.values(m).map(x=>({...x,GD:x.GF-x.GA}))
    .sort((a,b)=>b.pts-a.pts||b.GD-a.GD||b.GF-a.GF);
}

/* ============ PLAYER STATS (league + overall) ============ */
function statsFor(games,upto){
  const S=season(),list=upto==null?games:games.slice(0,upto+1),m={};
  S.players.forEach(p=>m[p.id]={...p,P:0,W:0,D:0,L:0,G:0,GF:0,GA:0,pts:0,seq:[]});
  list.forEach(g=>{const a=g.scoreA??0,b=g.scoreB??0;
    [['A',g.teamA,a,b],['B',g.teamB,b,a]].forEach(([sd,tm,gf,ga])=>(tm||[]).forEach(pid=>{
      const x=m[pid];if(!x)return;x.P++;x.GF+=gf;x.GA+=ga;x.G+=(g.goals&&g.goals[pid])||0;
      let r;if(g.result==='D'){x.D++;x.pts++;r='D'}else if(g.result===sd){x.W++;x.pts+=3;r='W'}else{x.L++;r='L'}
      x.seq.push({r,gf,ga,goals:(g.goals&&g.goals[pid])||0,gid:g.id,date:g.date})}))});
  const arr=Object.values(m);
  arr.forEach(x=>{x.GD=x.GF-x.GA;x.ppg=x.P?x.pts/x.P:0;x.gpg=x.P?x.G/x.P:0;x.cpg=x.P?x.GA/x.P:0;
    x.wr=x.P?x.W/x.P:0;x.app=list.length?x.P/list.length:0;x.cs=x.seq.filter(s=>s.ga===0).length;
    const l5=x.seq.slice(-5);x.last5=l5.map(v=>v.r);
    x.form=l5.length?l5.reduce((s,v)=>s+(v.r==='W'?3:v.r==='D'?1:0),0)/l5.length:0;
    let n=0,t=null;for(let i=x.seq.length-1;i>=0;i--){const r=x.seq[i].r;if(t===null){t=r;n=1}else if(r===t)n++;else break}
    x.streak={type:t,n}});
  const pl=arr.filter(x=>x.P>0);
  if(pl.length){const nm=(k,inv)=>{const v=pl.map(x=>x[k]),lo=Math.min(...v,0),hi=Math.max(...v,0);
    pl.forEach(x=>{const t=hi===lo?0:(x[k]-lo)/(hi-lo);x['_'+k]=inv?1-t:t})};
    ['pts','ppg','wr','G','gpg'].forEach(k=>nm(k));nm('cpg',true);
    pl.forEach(x=>x.index=Math.round((x._pts+x._ppg+x._wr+x._G+x._gpg+x._cpg)/6*100))}
  arr.forEach(x=>{if(x.index===undefined)x.index=0});
  return arr;
}

function feed(){const gl=allGames(),ap={},go_={},ev=[],T=[1,5,10,25,50,100];

    if(n>=3)ev.push({i,pid,e:'🎩',t:`Hat-trick · ${n} goals`,date:g.date});
    if(n>0){const b=go_[pid]||0,a=b+n;T.forEach(t=>{if(b<t&&a>=t)ev.push({i,pid,e:'⚽',t:t===1?'First goal':`${t} career goals`,date:g.date})});go_[pid]=a}
  }));
  return ev.reverse()}

/* ---- what's within reach next Sunday ---- */
function closingIn(){
  const st=lgStats().filter(x=>x.P>0);
  if(!st.length)return '';
  const out=[];
  st.forEach(x=>{
    const car=careerOf(x.id); if(!car)return;
    // next level
    if(car.lvl.next){
      const need=car.lvl.next.xp-car.xp;
      if(need>0&&need<=180)out.push({id:x.id,name:x.name,e:car.lvl.next.e,
        t:`${need} XP from ${car.lvl.next.t}`,v:need,k:'lvl'});
    }
    // next unfinished challenge that's close
    car.ch.filter(c=>!c.done).forEach(c=>{
      const [cur,tot]=c.f(x); const left=tot-cur;
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:c.e,t:`${left} from “${c.n}”`,v:left,k:'ch'});
    });
  });
  if(!out.length)return '';
  out.sort((a,b)=>a.v-b.v);
  const seen=new Set(),list=[];
  out.forEach(o=>{if(list.length<5&&!seen.has(o.id+o.t)){seen.add(o.id+o.t);list.push(o)}});
  return `<div class="sechead">🎯 Closing in</div>
    <div class="card">${list.map(o=>`<div class="row tap" onclick="openCareer('${o.id}')">
      <div style="font-size:21px;flex:0 0 26px">${o.e}</div>
      <div class="rt"><div class="r1" style="font-size:15px">${esc(o.name)}</div>
        <div class="r2">${esc(o.t)}</div></div>${chev}</div>`).join('')}</div>
    <div class="note">Within touching distance next Sunday.</div>`;
}

/* ============ FIXTURES ============ */
let FF='all';
let FSORT='new', FPLAYER='all', FRESULT='all', FSEARCH='';
function vFixtures(){
  let g=allGames();
  if(FF!=='all')g=g.filter(x=>x.compId===FF);
  if(FPLAYER!=='all')g=g.filter(x=>(x.teamA||[]).includes(FPLAYER)||(x.teamB||[]).includes(FPLAYER));
  if(FRESULT!=='all'){
    g=g.filter(x=>{
      if(FRESULT==='draw')return x.result==='D';
      if(FPLAYER==='all')return FRESULT==='big'?Math.abs((x.scoreA||0)-(x.scoreB||0))>=3:true;
      const onA=(x.teamA||[]).includes(FPLAYER),sd=onA?'A':'B';
      if(FRESULT==='win')return x.result===sd;
      if(FRESULT==='loss')return x.result!=='D'&&x.result!==sd;
      return true;
    });
  }
  const q=FSEARCH.trim().toLowerCase();
  if(q)g=g.filter(x=>{
    const names=[...(x.teamA||[]),...(x.teamB||[])].map(p=>player(p)?.name||'').concat(x.fillA||[],x.fillB||[]);
    return names.join(' ').toLowerCase().includes(q)||String(x.round||'').toLowerCase().includes(q);
  });
  const sorted=[...g];
  if(FSORT==='new')sorted.reverse();
  else if(FSORT==='old'){/* already oldest-first */}
  else if(FSORT==='goals')sorted.sort((a,b)=>((b.scoreA||0)+(b.scoreB||0))-((a.scoreA||0)+(a.scoreB||0)));
  else if(FSORT==='margin')sorted.sort((a,b)=>Math.abs((b.scoreA||0)-(b.scoreB||0))-Math.abs((a.scoreA||0)-(a.scoreB||0)));

  const grouped=(FSORT==='new'||FSORT==='old');
  const by={};if(grouped)sorted.forEach(x=>{const k=x.date||'—';(by[k]=by[k]||[]).push(x)});
  const roster=[...season().players].filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const active=(FF!=='all')+(FPLAYER!=='all')+(FRESULT!=='all')+(q?1:0);
  const tot=allGames().length;
  $('#navMount').innerHTML=navbar();
  app().innerHTML=`<div class="view active">
    <div class="largetitle">Fixtures</div>
    <div class="subtitle">${g.length===tot?`${tot} games logged`:`${g.length} of ${tot} games`}</div>
    <div class="wrap">${cloudBanner()}
      <button class="btn pri full" data-admin style="margin-bottom:14px" onclick="newGame()">Log a game</button>
      <input class="search" placeholder="Search a player or round…" value="${esc(FSEARCH)}" id="fxq"
        oninput="FSEARCH=this.value;render()" style="margin-bottom:10px">
      <div class="filterbar">
        <select class="fsel" onchange="FF=this.value;render()">
          <option value="all" ${FF==='all'?'selected':''}>All comps</option>
          ${comps().map(c=>`<option value="${c.id}" ${FF===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FPLAYER=this.value;render()">
          <option value="all" ${FPLAYER==='all'?'selected':''}>👥 Everyone</option>
          ${roster.map(p=>`<option value="${p.id}" ${FPLAYER===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <select class="fsel" onchange="FRESULT=this.value;render()">
          <option value="all" ${FRESULT==='all'?'selected':''}>Any result</option>
          ${FPLAYER!=='all'?`<option value="win" ${FRESULT==='win'?'selected':''}>✅ Wins</option>
            <option value="loss" ${FRESULT==='loss'?'selected':''}>❌ Losses</option>`:''}
          <option value="draw" ${FRESULT==='draw'?'selected':''}>🤝 Draws</option>
          ${FPLAYER==='all'?`<option value="big" ${FRESULT==='big'?'selected':''}>💥 Big wins</option>`:''}
        </select>
        <select class="fsel" onchange="FSORT=this.value;render()">
          ${[['new','⏱ Newest'],['old','📜 Oldest'],['goals','⚽ Most goals'],['margin','📊 Biggest margin']]
            .map(([k,l])=>`<option value="${k}" ${FSORT===k?'selected':''}>${l}</option>`).join('')}
        </select>
        ${active?`<button class="fclear" onclick="clearFilters()">✕ Clear ${active}</button>`:''}
      </div>
      ${sorted.length?(grouped
        ? Object.keys(by).map(d=>`<div class="sechead">${d==='—'?'Undated':fdate(d)}</div>
            <div class="card">${by[d].map(gameRow).join('')}</div>`).join('')
        : `<div class="card">${sorted.map(gameRow).join('')}</div>`)
      :`<div class="empty"><div class="ee">🔍</div><h3>${tot?'No games match':'No fixtures yet'}</h3>
        <p>${tot?'Try clearing a filter or searching something else.':'Every game you log appears here, newest first.'}</p>
        ${tot?'<button class="btn pri" onclick="clearFilters()">Clear filters</button>':''}</div>`}
    </div></div>`;
  const el=$('#fxq');if(el&&FSEARCH){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}

/* ============ iOS-STYLE GESTURES ============ */
/* ============ HISTORY ============
   We snapshot the ACTUAL state you are leaving (which view, which player,
   which tab, where you were scrolled) rather than a fixed destination — so
   Denis's profile → his Career → back lands you on Denis's profile again. */
let BACKSTACK=[];
const NAV_LABEL={home:'Home',league:'League',fixtures:'Fixtures',squad:'Squad',tactics:'Tactics',
  career:'Career',fpl:'Sunday FPL',stats:'Stats',compare:'Compare',history:'Hall of Fame',
  comps:'Competitions',admin:'Admin',player:'Player',pcareer:'Career',match:'Match',seasonView:'Season'};
function viewSnap(){
  return {v:VIEW, pid:app()._pid, gid:app()._gid, sid:app()._sid,
    y:window.scrollY||0,
    t:{FTAB,HMODE,SMODE,CMODE,TAC,SCOMP,PF,SMIN,LADOPEN,POTMOPEN,LVLOPEN}};
}
const trimLabel=t=>{t=String(t||'Back'); return t.length>14?t.slice(0,13).trim()+'…':t};
function labelFor(snap){
  if(!snap)return 'Back';
  if(snap.v==='player'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Player')}
  if(snap.v==='pcareer'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Career')}
  return trimLabel(NAV_LABEL[snap.v]||'Back');
}
function backLabel(){ return labelFor(BACKSTACK[BACKSTACK.length-1]) }
function pushBack(){
  const snap=viewSnap();
  const top=BACKSTACK[BACKSTACK.length-1];
  /* don't stack the same place twice */
  if(top&&top.v===snap.v&&top.pid===snap.pid&&top.gid===snap.gid&&top.sid===snap.sid)return;
  BACKSTACK.push(snap);
  if(BACKSTACK.length>20)BACKSTACK.shift();
}
function goBack(){
  const s=BACKSTACK.pop();
  if(!s){ go('squad'); return; }
  haptic('light');
  VIEW=s.v;
  if(s.pid!=null)app()._pid=s.pid;
  if(s.gid!=null)app()._gid=s.gid;
  if(s.sid!=null)app()._sid=s.sid;
  const t=s.t||{};
  if(t.FTAB!=null)FTAB=t.FTAB; if(t.HMODE!=null)HMODE=t.HMODE; if(t.SMODE!=null)SMODE=t.SMODE;
  if(t.CMODE!=null)CMODE=t.CMODE; if(t.TAC!=null)TAC=t.TAC; if(t.SCOMP!=null)SCOMP=t.SCOMP;
  if(t.PF!=null)PF=t.PF; if(t.SMIN!=null)SMIN=t.SMIN; if(t.LADOPEN!=null)LADOPEN=t.LADOPEN;
  if(t.POTMOPEN!=null)POTMOPEN=t.POTMOPEN; if(t.LVLOPEN!=null)LVLOPEN=t.LVLOPEN;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===VIEW));
  render();
  requestAnimationFrame(()=>window.scrollTo(0,s.y||0));
}

function initGestures(){
  const main=document.querySelector('.main')||document.body;

  /* ---- swipe from left edge to go back ---- */
  let sx=0,sy=0,tracking=false,moved=0;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    tracking=(t.clientX<32);           // only from the left edge, like iOS
    sx=t.clientX;sy=t.clientY;moved=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!tracking||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if(dy>44){tracking=false;main.style.transform='';return}
    if(dx>0){moved=dx; main.style.transform=`translateX(${Math.min(dx*.35,60)}px)`; main.style.opacity=String(1-Math.min(dx/700,.2))}
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!tracking)return; tracking=false;
    main.style.transition='transform .26s cubic-bezier(.32,.72,0,1),opacity .26s';
    main.style.transform='';main.style.opacity='';
    setTimeout(()=>{main.style.transition=''},280);
    if(moved>90){ if(BACKSTACK.length){goBack()} }
    moved=0;
  },{passive:true});

  /* ---- pull to refresh (iOS style: arrow rotates, then becomes a spinner) ---- */
  const ind=document.createElement('div');
  ind.className='ptr';
  ind.innerHTML='<svg class="ptr-a" viewBox="0 0 24 24"><path d="M12 5v14M12 19l-5-5M12 19l5-5"/></svg><div class="ptr-s"></div>';
  document.body.appendChild(ind);
  const TRIG=72;
  let py=0,pulling=false,dist=0,armed=false,busy=false;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||busy)return;
    pulling=(window.scrollY<=0); py=e.touches[0].clientY; dist=0; armed=false;
    ind.style.transition='';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling||e.touches.length!==1)return;
    if($('#sbg').classList.contains('open')||$('#vbg').classList.contains('open')){pulling=false;return}
    dist=e.touches[0].clientY-py;
    if(dist>0&&window.scrollY<=0){
      const d=Math.min(dist*0.55,96);                 // rubber-band
      const p=Math.min(d/TRIG,1);
      ind.style.transform=`translateY(${d}px)`;
      ind.style.opacity=String(Math.min(p*1.2,1));
      ind.querySelector('.ptr-a').style.transform=`rotate(${p>=1?180:p*180}deg)`;
      if(p>=1&&!armed){armed=true;haptic('light');ind.classList.add('armed')}
      if(p<1&&armed){armed=false;ind.classList.remove('armed')}
    }
  },{passive:true});
  document.addEventListener('touchend',async()=>{
    if(!pulling)return; pulling=false;
    ind.style.transition='transform .34s cubic-bezier(.32,.72,0,1),opacity .3s';
    if(armed){
      busy=true;
      ind.classList.add('spin');
      ind.style.transform='translateY(58px)'; ind.style.opacity='1';
      haptic('success');
      try{
        if(supa){
          const fresh=await Store.get(MAIN_KEY);
          if(fresh&&fresh.seasons&&fresh.seasons.length){
            DB=fresh; CUR=DB.current||DB.seasons[0].id;
            if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
          }
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,420));        // let the spinner be seen
      render();
      toast(CLOUD_FAIL?'⚠️ Could not reach the database':'↻ Up to date');
      busy=false;
    }
    ind.style.transform=''; ind.style.opacity='0';
    setTimeout(()=>{ind.style.transition='';ind.classList.remove('spin','armed');
      ind.querySelector('.ptr-a').style.transform='';},360);
    dist=0; armed=false;
  },{passive:true});

  /* ---- large title shrinks into the nav bar on scroll ---- */
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return; ticking=true;
    requestAnimationFrame(()=>{
      const lt=document.querySelector('.largetitle'), nb=document.querySelector('.navbar');
      if(lt&&nb){
        const y=window.scrollY, r=lt.getBoundingClientRect();
        const hidden=r.bottom<58;
        nb.classList.toggle('shrunk',hidden);
        if(hidden&&!nb.querySelector('.nb-title')){
          const t=document.createElement('div');t.className='nb-title';t.textContent=lt.textContent.trim();
          nb.appendChild(t);
        } else if(!hidden){ const t=nb.querySelector('.nb-title'); if(t)t.remove(); }
        lt.style.opacity=String(Math.max(0,1-Math.max(0,y)/70));
      }
      ticking=false;
    });
  },{passive:true});
}

/* Turn an SVG string into a PNG blob at 2x for crisp phone screens */
async function svgToPng(svg,w,h,scale){
  const sc=scale||2;
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('render'));img.src=url});
    const cv=document.createElement('canvas');
    cv.width=w*sc; cv.height=h*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0,w,h);
    return await new Promise(r=>cv.toBlob(r,'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
/* iOS-friendly: open the native share sheet (which offers "Save Image"),
   falling back to a plain download on desktop browsers. */
async function shareOrSave(blob,filename,title){
  if(!blob){toast('Could not create the image');return}
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    try{ await navigator.share({files:[file],title}); toast('📤 Shared'); return; }
    catch(e){ if(e&&e.name==='AbortError')return; }
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast('📸 Saved to your downloads');
}

/* The PlayStyle colours are neon by design, which looks harsh across a whole
   card. The card instead uses a curated deep tone per position. */
const CARD_TONE={ATT:'#8E2140', MID:'#1B5E7A', DEF:'#1D4E7C', GK:'#7A5A14'};
/* The card takes the player's club colour so each one feels like their team.
   Very light club colours (Real Madrid, Spurs) are swapped for their accent so
   the card never washes out. */
function cardTone(p){
  const c=clubOf(p);
  if(!c)return CARD_TONE[(p&&p.pos)||'MID']||'#2B3A55';
  const lum=hex=>{const h=String(hex||'').replace('#','');
    if(h.length<6)return 0;
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return (r*299+g*587+b*114)/1000};
  let t=c.c1||'#2B3A55';
  if(lum(t)>170)t=(lum(c.acc)<=170&&c.acc)||(lum(c.c2)<=170&&c.c2)||'#2B3A55';
  return t;
}
/* ============ OVR (FC-style overall rating) ============
   Level 1 = 80, level 30 = 90. Everyone starts gold; 90 is the special card. */
function ovrOf(pid){
  const car=careerOf(pid); if(!car)return null;
  return Math.round(80+(car.lvl.n-1)*(10/29));
}
function ovrTier(o){
  if(o>=90)return {k:'ballon',label:"Ballon d'Or"};
  if(o>=85)return {k:'rare',  label:'Gold Rare'};
  return {k:'gold', label:'Gold'};
}
/* movement since the previous game — shown as a small arrow, FC-style */
function ovrDelta(pid){
  const S=season(); if(!S.ovrLog)return 0;
  const h=S.ovrLog[pid]; if(!h||h.length<2)return 0;
  return h[h.length-1]-h[h.length-2];
}
function recordOvr(){
  const S=season(); if(!S.ovrLog)S.ovrLog={};
  S.players.forEach(p=>{
    const o=ovrOf(p.id); if(o==null)return;
    const h=S.ovrLog[p.id]=S.ovrLog[p.id]||[];
    if(h[h.length-1]!==o)h.push(o);
    while(h.length>30)h.shift();
  });
}
function ovrBadge(pid,size){
  const o=ovrOf(pid); if(o==null)return '';
  const d=ovrDelta(pid), t=ovrTier(o), s=size||34;
  return `<span class="ovr ${t.k}" style="--os:${s}px" title="${t.label}">
    <b>${o}</b>${d?`<i class="ovr-d ${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d)}</i>`:''}</span>`;
}

/* ============================================================
   SUNDAY FPL — a small fantasy game running off the real season.
   Squad of 3: one DEF, one MID, one ATT. Everyone starts at £10m.
   Teams lock the moment the first game of a gameweek is logged.
   ============================================================ */
const FPL_RULES={
  played:2, win:3, draw:1,
  goal:{GK:6,DEF:6,MID:5,ATT:4},
  cleanSheet:{GK:3,DEF:3,MID:2,ATT:1},
  hatTrick:3,
  budget:52, startPrice:10, minPrice:6, maxPrice:16, chips:3,
  transfersPerWeek:3, squadSize:5,
  slots:['DEF','MID','ATT'],        // at least one of each, five in total
  eligible:['DEF','MID','ATT']      // outfield only — no keepers
};
function fpl(){
  const S=season();
  if(!S.fpl)S.fpl={managers:[],gw:1,locked:false,prices:{},ticker:[],league:'Sunday FPL Mini League'};
  const f=S.fpl;
  if(!f.managers)f.managers=[];
  if(!f.prices)f.prices={};
  if(!f.ticker)f.ticker=[];
  if(!f.league)f.league='Sunday FPL Mini League';
  if(f.gw==null)f.gw=1;
  syncManagers();
  return f;
}
/* every squad player automatically gets a manager slot + private code */
function fplCode(name,id){
  const base=String(name||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)||'MGR';
  let h=0; const t=String(id||name);
  for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0}
  return base+'-'+h.toString(36).toUpperCase().slice(0,4).padEnd(4,'X');
}
function syncManagers(){
  const S=season(),f=S.fpl;
  const live=S.players.filter(p=>p.active!==false);
  live.forEach(p=>{
    if(!f.managers.some(m=>m.pid===p.id)){
      f.managers.push({pid:p.id,name:p.name,code:fplCode(p.name,p.id),
        teamName:null,squad:[],captain:null,transfers:{},wildcards:0,tripleCaps:0,tcGws:[],doublePts:0,dpGws:[],history:[],joined:Date.now()});
    }
  });
  f.managers.forEach(m=>{
    const p=player(m.pid); if(p)m.name=p.name;
    /* migrate the old single-use chip fields */
    if(m.wildcards==null)m.wildcards=m.wildcard?1:0;
    if(m.tripleCaps==null)m.tripleCaps=m.tripleCap?1:0;
    if(!m.tcGws)m.tcGws=m.tcGw?[m.tcGw]:[];
    if(m.doublePts==null)m.doublePts=0;
    if(!m.dpGws)m.dpGws=[];
  });
}
const fplManager=code=>fpl().managers.find(m=>m.code===String(code||'').trim().toUpperCase());
function fplRemember(code){
  try{localStorage.setItem('ss_fpl_code',code)}catch(e){}
  try{sessionStorage.setItem('ss_fpl_code',code)}catch(e){}
}
function fplForget(){

  try{sessionStorage.removeItem('ss_fpl_code')}catch(e){}

/* Personal links: opening  <site>/#c=CODE  signs that person in automatically.
   Phones sometimes clear stored data after a week of not opening a site, so a
   saved personal link means nobody ever has to retype their code. */
function fplAutoLogin(){

    }
  }catch(e){}
}

/* ---------- prices ---------- */
function fplPrice(pid){
  const f=fpl();
  if(f.prices[pid]==null)f.prices[pid]=FPL_RULES.startPrice;
  return f.prices[pid];
}
/* Prices are RECOMPUTED from scratch off the games that actually exist, rather
   than drifting incrementally. That makes them deterministic and self-healing:
   delete a game and the prices correct themselves instead of staying stuck. */
function recalcPrices(){
  const f=fpl(), S=season(), gws=playedGws();
  const live=S.players.filter(p=>p.active!==false);
  const price={}; live.forEach(p=>price[p.id]=FPL_RULES.startPrice);
  const moves=[];
  gws.forEach((gw,idx)=>{
    const win=gws.slice(Math.max(0,idx-2),idx+1);          // rolling 3-gameweek form
    const pts={}; live.forEach(p=>pts[p.id]=win.reduce((t,g)=>t+fplPlayerGw(p.id,g),0));
    const vals=live.map(p=>pts[p.id]);
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    live.forEach(p=>{
      const diff=pts[p.id]-avg;
      let d=0;
      if(diff>=12)d=0.5; else if(diff>=7)d=0.3; else if(diff>=3)d=0.2;
      else if(diff<=-12)d=-0.5; else if(diff<=-7)d=-0.3; else if(diff<=-3)d=-0.2;
      if(!d)return;
      const was=price[p.id];
      const now=Math.max(FPL_RULES.minPrice,Math.min(FPL_RULES.maxPrice,Math.round((was+d)*10)/10));
      if(now!==was){ price[p.id]=now; if(idx===gws.length-1)moves.push({pid:p.id,name:p.name,from:was,to:now}); }
    });
  });
  f.prices=price;
  f.ticker=moves.slice(0,20);
  return moves;
}
const updatePrices=recalcPrices;    // keep the old name working

/* ---------- scoring ---------- */
/* points a player earned in one specific game */
function fplGamePoints(pid,g){
  const p=player(pid); if(!p||!g)return 0;
  const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
  if(!onA&&!onB)return 0;                       // didn't play
  /* use the position the player had ON THE DAY, so changing someone's position
     later never rewrites points they already earned */
  const pos=(g.pos&&g.pos[pid])||p.pos||'MID';
  const sd=onA?'A':'B';
  const ga=onA?(g.scoreB??0):(g.scoreA??0);
  const goals=(g.goals&&g.goals[pid])||0;
  let pts=FPL_RULES.played;
  if(g.result==='D')pts+=FPL_RULES.draw; else if(g.result===sd)pts+=FPL_RULES.win;
  pts+=goals*(FPL_RULES.goal[pos]||FPL_RULES.goal.MID);
  if(ga===0&&FPL_RULES.cleanSheet[pos])pts+=FPL_RULES.cleanSheet[pos];
  if(goals>=3)pts+=FPL_RULES.hatTrick;
  return pts;
}
const gamesInGw=gw=>allGames().filter(g=>gwOf(g)===gw);
const gwOf=g=>{
  const r=String(g.round||'').match(/(\d+)/);
  return r?+r[1]:null;
};
/* a player's points across a gameweek (can be more than one game) */
function fplPlayerGw(pid,gw){
  return gamesInGw(gw).reduce((t,g)=>t+fplGamePoints(pid,g),0);
}
function fplRecentPoints(pid,n){
  const gws=playedGws().slice(-(n||3));
  return gws.reduce((t,gw)=>t+fplPlayerGw(pid,gw),0);
}
function playedGws(){
  const set=new Set();
  allGames().forEach(g=>{const n=gwOf(g); if(n)set.add(n)});
  return [...set].sort((a,b)=>a-b);
}
/* a manager's points for one gameweek, using the squad they had locked in */
function fplManagerGw(m,gw){
  const snap=(m.history||[]).find(h=>h.gw===gw);
  const squad=snap?snap.squad:m.squad, cap=snap?snap.captain:m.captain;
  if(!squad||!squad.length)return 0;
  const mult=((m.tcGws||[]).includes(gw))?3:2;   // triple captain applies only to the gameweeks it was played on
  let total=squad.reduce((t,pid)=>{
    let p=fplPlayerGw(pid,gw);
    if(pid===cap)p*=mult;
    return t+p;
  },0);
  if((m.dpGws||[]).includes(gw))total*=2;       // double points doubles the whole week
  return total;
}
function fplManagerTotal(m){
  return playedGws().reduce((t,gw)=>t+fplManagerGw(m,gw),0);
}
function fplTable(){
  const f=fpl(), gws=playedGws(), last=gws[gws.length-1];
  const rows=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize).map(m=>({
    m, total:fplManagerTotal(m), gw:last?fplManagerGw(m,last):0
  })).sort((a,b)=>b.total-a.total||b.gw-a.gw);
  // movement vs previous gameweek
  const prevGws=gws.slice(0,-1);
  const prev=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize)
    .map(m=>({id:m.pid,t:prevGws.reduce((s,gw)=>s+fplManagerGw(m,gw),0)}))
    .sort((a,b)=>b.t-a.t).map((x,i)=>({id:x.id,r:i+1}));
  rows.forEach((r,i)=>{
    const was=prev.find(p=>p.id===r.m.pid);
    r.move = was ? was.r-(i+1) : 0;
  });
  return rows;
}

/* ---------- player market stats ---------- */
function fplStats(){
  const f=fpl(), gws=playedGws();
  const managers=f.managers.filter(m=>m.squad&&m.squad.length===FPL_RULES.squadSize);
  const owners=managers.length||1;
  const totalGoals=allGames().reduce((t,g)=>t+Object.values(g.goals||{}).reduce((a,b)=>a+b,0),0)||1;
  return season().players.filter(p=>p.active!==false&&FPL_RULES.eligible.includes(p.pos||'MID')).map(p=>{
    const total=gws.reduce((t,gw)=>t+fplPlayerGw(p.id,gw),0);
    const form=gws.length?fplRecentPoints(p.id,3)/Math.min(3,gws.length):0;
    const owned=managers.filter(m=>m.squad.includes(p.id)).length;
    const st=statsAll().find(x=>x.id===p.id)||{G:0,P:0,cs:0};
    return {
      id:p.id,name:p.name,pos:p.pos||'MID',price:fplPrice(p.id),
      total, form:Math.round(form*10)/10,
      ownedPct:Math.round(owned/owners*100),
      threat:Math.round((st.G/totalGoals)*100),         // share of all goals scored
      ppg: st.P?Math.round(total/st.P*10)/10:0,
      value: total? Math.round(total/fplPrice(p.id)*10)/10 : 0,
      G:st.G, cs:st.cs, P:st.P,
      captainPct:Math.round(managers.filter(m=>m.captain===p.id).length/owners*100)
    };
  });
}

/* keep FPL consistent when games are removed */
function fplResync(){
  try{
    const f=fpl(), gws=new Set(playedGws());
    f.managers.forEach(m=>{ if(m.history)m.history=m.history.filter(h=>gws.has(h.gw)); });
    if(!gws.size){ f.gw=1; f.ticker=[]; }
    else f.gw=Math.max(...gws);
    recalcPrices();
  }catch(e){}
}

/* ---------- how scoring is fixed in time ----------
   There is no lock and no deadline. You can change your team whenever you like.
   The moment the admin logs a game, a snapshot of every team is taken, and that
   snapshot is what scores for that gameweek. Later edits only affect future
   gameweeks, so nobody can react to a result — and nobody gets shut out either. */
function fplLocked(){ return false; }
function fplNextGw(){
  const played=playedGws();
  return played.length?Math.max(...played)+1:1;
}
/* called after a game is saved: rolls the gameweek forward and repricing */
async function fplAfterGame(){
  const f=fpl();
  const played=playedGws();
  if(!played.length)return;
  const latest=Math.max(...played);
  /* freeze each manager's team for the gameweek that was just logged */
  f.managers.forEach(m=>{
    if(!m.squad||m.squad.length!==FPL_RULES.squadSize)return;
    if(!m.history)m.history=[];
    if(!m.history.some(h=>h.gw===latest))
      m.history.push({gw:latest,squad:[...m.squad],captain:m.captain,at:Date.now()});
  });
  if(f.gw!==latest){ f.gw=latest; }
  updatePrices();
}
/* open the next gameweek: unlocks teams for everyone */
async function fplOpenNextGw(){
  if(!requireAdmin())return;
  const f=fpl();
  const next=fplNextGw();
  if(!await askConfirm('Open the next gameweek?',
     `Teams unlock so managers can make transfers for GW${next}. They lock again the moment you log the first GW${next} game.`,
     'Open GW'+next,false))return;
  f.gw=next; await save(); render(); toast(`✅ GW${next} open — teams unlocked`);
}
/* transfers remaining this calendar month */
/* transfers reset every week (Monday-based ISO week) */
function weekKey(d){
  const t=new Date(d||Date.now());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate()+4-(t.getDay()||7));          // nearest Thursday
  const y0=new Date(t.getFullYear(),0,1);
  const wk=Math.ceil((((t-y0)/86400000)+1)/7);
  return t.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
const preSeason=()=>playedGws().length===0;   // nothing logged yet = free rein
function transfersLeft(m){
  if(preSeason())return Infinity;
  const k=weekKey();
  const used=(m.transfers&&m.transfers[k])||0;
  return Math.max(0,FPL_RULES.transfersPerWeek-used);
}
function useTransfer(m,n){
  if(preSeason())return;
  const k=weekKey();
  if(!m.transfers)m.transfers={};
  m.transfers[k]=((m.transfers[k])||0)+(n||1);
}

/* if two of a manager's picks now share a position, name the culprit */
/* Positions may now repeat (2 attackers is fine), so the only structural
   problem is someone in your squad becoming a keeper. */
function squadClash(squad){
  for(const id of (squad||[])){
    const p=player(id); if(!p)continue;
    if(!FPL_RULES.eligible.includes(p.pos||'MID'))return p.name;
  }
  return null;
}

/* ---------- picking: changes go into a draft you must confirm ---------- */
let FDRAFT=null;     // {squad:[], captain:null}
function draftOf(m){
  if(!FDRAFT)FDRAFT={squad:[...(m.squad||[])],captain:m.captain||null};
  return FDRAFT;
}
function draftDirty(m){
  const d=draftOf(m);
  const a=[...d.squad].sort().join(','), b=[...(m.squad||[])].sort().join(',');
  return a!==b || d.captain!==m.captain;
}
function draftSpend(m){ return draftOf(m).squad.reduce((t,x)=>t+fplPrice(x),0) }
function draftChanges(m){
  const d=draftOf(m), out=(m.squad||[]).filter(x=>!d.squad.includes(x));
  const inn=d.squad.filter(x=>!(m.squad||[]).includes(x));
  return {out,inn,count:Math.max(out.length,inn.length)};
}
/* everything wrong with the current draft, in plain English */
function squadShape(squad){
  const c={DEF:0,MID:0,ATT:0};
  (squad||[]).forEach(id=>{const p=player(id); if(p&&c[p.pos]!=null)c[p.pos]++});
  return c;
}
function draftProblems(m){
  const d=draftOf(m), p=[], n=d.squad.length, need=FPL_RULES.squadSize;
  if(n<need)p.push(`Pick ${need-n} more player${need-n===1?'':'s'} (${n} of ${need})`);
  if(n>need)p.push(`You have ${n} players — only ${need} allowed`);
  const sh=squadShape(d.squad);
  FPL_RULES.slots.forEach(pos=>{ if(!sh[pos])p.push(`You need at least one ${pos}`) });
  const spend=draftSpend(m);
  if(spend>FPL_RULES.budget)p.push(`You're £${(spend-FPL_RULES.budget).toFixed(1)}m over budget`);
  if(!d.captain&&n===need)p.push('Choose a captain');
  const ch=draftChanges(m);
  const firstTeam=!(m.squad&&m.squad.length===FPL_RULES.squadSize);
  if(!firstTeam&&!m.wildcardActive&&!preSeason()&&ch.count>transfersLeft(m))
    p.push(`That's ${ch.count} transfer${ch.count===1?'':'s'} but you only have ${transfersLeft(m)} left this week`);
  return p;
}

/* The triple captain can be taken back off as long as the gameweek it is armed
   for has not been played yet — once a game is logged it is locked in. */
/* Only one chip may be armed for any given gameweek — stacking Triple Captain
   with Double Points turned a normal week into a runaway score. */
function chipArmedFor(m,gw){
  if((m.tcGws||[]).includes(gw))return 'Triple Captain';
  if((m.dpGws||[]).includes(gw))return 'Double Points';
  if(m.wildcardActive)return 'Wildcard';
  return null;
}
const tcArmed=m=>(m.tcGws||[]).includes(fplNextGw());
async function playTripleCaptain(){
  const m=fplMine(); if(!m)return;

  if(tcArmed(m)){
    if(!await askConfirm('Remove triple captain?',
       `It will no longer apply to GW${next} and you get the chip back.`,'Remove',false))return;
    m.tcGws=(m.tcGws||[]).filter(g=>g!==next);
    m.tripleCaps=Math.max(0,(m.tripleCaps||0)-1);
    await fplSave(); render(); toast('Triple captain removed');
    return;
  }
  const clash=chipArmedFor(m,next);
  if(clash){toast(`${clash} is already on for GW${next} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.tripleCaps||0);
  if(left<=0){toast('You have used all your triple captains');return}
  if(!m.captain){toast('Pick a captain first');return}
  if(!await askConfirm('Play a triple captain?',
     `${player(m.captain)?.name} scores ×3 in GW${next} instead of ×2. You can take it off again any time before that game is logged. ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.tripleCaps=(m.tripleCaps||0)+1;

}

/* ============ QR CODE (self-contained, no network) ============
   Byte mode, error-correction level M, auto version 1-10.
   Enough for any Vercel URL. */
const QR_ECB={ // [total codewords, ec codewords per block, blocks] for level M
  1:[26,10,1],2:[44,16,1],3:[70,26,1],4:[100,18,2],5:[134,24,2],
  6:[172,16,4],7:[196,18,4],8:[242,22,4],9:[292,22,5],10:[346,26,5]
};
const QR_CAP={1:14,2:26,3:42,4:62,5:84,6:106,7:122,8:152,9:180,10:213}; // byte-mode capacity, level M
const QR_ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
  7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};

function qrGF(){
  const exp=new Array(512),log=new Array(256);
  let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&0x100)x^=0x11d}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  return {exp,log};
}
const QRGF=qrGF();
function qrPoly(ec){
  let p=[1];
  for(let i=0;i<ec;i++){
    const q=[1,QRGF.exp[i]],r=new Array(p.length+1).fill(0);
    for(let a=0;a<p.length;a++)for(let b=0;b<2;b++){
      if(p[a]===0||q[b]===0)continue;
      r[a+b]^=QRGF.exp[(QRGF.log[p[a]]+QRGF.log[q[b]])%255];
    }
    p=r;
  }
  return p;
}
function qrEC(data,ec){
  const gen=qrPoly(ec), res=data.concat(new Array(ec).fill(0));
  for(let i=0;i<data.length;i++){
    const c=res[i]; if(c===0)continue;
    for(let j=0;j<gen.length;j++)
      res[i+j]^=QRGF.exp[(QRGF.log[gen[j]]+QRGF.log[c])%255];
  }
  return res.slice(data.length);
}
function qrEncode(text){
  const bytes=[];
  for(const ch of unescape(encodeURIComponent(text)))bytes.push(ch.charCodeAt(0));
  let ver=1; while(ver<=10 && bytes.length>QR_CAP[ver])ver++;
  if(ver>10)return null;
  const [total,ecPer,blocks]=QR_ECB[ver];
  const dataCw=total-ecPer*blocks;
  // bit stream
  const bits=[];
  const push=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>i)&1)};
  push(4,4);                                   // byte mode
  push(bytes.length, ver<10?8:16);
  bytes.forEach(b=>push(b,8));
  const cap=dataCw*8;
  for(let i=0;i<4&&bits.length<cap;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  const cw=[]; for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];cw.push(v)}
  const pad=[0xEC,0x11]; let pi=0;
  while(cw.length<dataCw)cw.push(pad[pi++%2]);
  // split into blocks
  const short=Math.floor(dataCw/blocks), extra=dataCw%blocks;
  const dBlocks=[],eBlocks=[]; let p=0;
  for(let i=0;i<blocks;i++){
    const len=short+(i>=blocks-extra?1:0);
    const d=cw.slice(p,p+len); p+=len;
    dBlocks.push(d); eBlocks.push(qrEC(d,ecPer));
  }
  const out=[];
  const maxD=Math.max(...dBlocks.map(b=>b.length));
  for(let i=0;i<maxD;i++)dBlocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecPer;i++)eBlocks.forEach(b=>out.push(b[i]));
  // matrix
  const size=17+ver*4;
  const m=Array.from({length:size},()=>new Array(size).fill(null));
  const setF=(r,c,v)=>{if(r>=0&&r<size&&c>=0&&c<size)m[r][c]=v};
  const finder=(r,c)=>{
    for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){
      const rr=r+i,cc=c+j; if(rr<0||cc<0||rr>=size||cc>=size)continue;
      const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
      setF(rr,cc,on?1:0);
    }};
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0}
  const al=QR_ALIGN[ver];
  al.forEach(r=>al.forEach(c=>{
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))return;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
      setF(r+i,c+j,(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0))?1:0);
  }));
  m[size-8][8]=1;
  // reserve format areas
  const fmt=[];
  for(let i=0;i<=5;i++)fmt.push([8,i],[i,8]);
  fmt.push([8,7],[8,8],[7,8]);
  for(let i=0;i<8;i++)fmt.push([size-1-i,8]);
  for(let i=0;i<8;i++)fmt.push([8,size-1-i]);
  fmt.forEach(([r,c])=>{if(m[r][c]===null)m[r][c]=0});
  // place data with mask 0
  let bi=0, up=true;
  const bitAt=i=>i<out.length*8 ? (out[i>>3]>>(7-(i&7)))&1 : 0;
  for(let col=size-1;col>0;col-=2){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const row=up?size-1-k:k;
      for(let c=0;c<2;c++){
        const cc=col-c;
        if(m[row][cc]!==null)continue;
        let v=bitAt(bi++);
        if((row+cc)%2===0)v^=1;                 // mask pattern 0
        m[row][cc]=v;
      }
    }
    up=!up;
  }
  // format info: level M (00) + mask 0 -> 101010000010010
  const fbits='101010000010010'.split('').map(Number);
  for(let i=0;i<=5;i++)m[8][i]=fbits[i];
  m[8][7]=fbits[6];m[8][8]=fbits[7];m[7][8]=fbits[8];
  for(let i=9;i<15;i++)m[14-i][8]=fbits[i];
  for(let i=0;i<8;i++)m[size-1-i][8]=fbits[i];
  for(let i=8;i<15;i++)m[8][size-15+i]=fbits[i];
  return m;
}
function qrSVG(text,px){
  const m=qrEncode(text);
  if(!m)return '<div class="note">Link is too long for a QR code.</div>';
  const n=m.length, q=4, size=n+q*2, s=px||220;
  let path='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)
    if(m[r][c])path+=`M${c+q} ${r+q}h1v1h-1z`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"
    xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#fff"/>
    <path d="${path}" fill="#000"/></svg>`;
}

   Android fires beforeinstallprompt, which we can turn into a real one-tap
   install button. Either way it is shown once and dismissible. */
let INSTALL_EVT=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL_EVT=e; });
const isStandalone=()=>{
  try{ return window.navigator.standalone===true ||
    window.matchMedia('(display-mode: standalone)').matches; }catch(e){ return false }
};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||'');
function a2hsDismissed(){ try{return localStorage.getItem('ss_a2hs')==='1'}catch(e){return false} }
function dismissA2HS(){ try{localStorage.setItem('ss_a2hs','1')}catch(e){} render(); }
async function doInstall(){
  if(INSTALL_EVT){
    INSTALL_EVT.prompt();
    try{ await INSTALL_EVT.userChoice }catch(e){}
    INSTALL_EVT=null; dismissA2HS(); return;
  }
  dismissA2HS();
}
const isMac=()=>/Macintosh|Mac OS X/.test(navigator.userAgent||'')&&!('ontouchend' in document);
function a2hsBanner(){
  if(isStandalone()||a2hsDismissed())return '';
  const canPrompt=!!INSTALL_EVT;

  /* laptops get a bookmark tip instead — there is no home screen to add to */
  const body = desktop
    ? `Press <kbd>${isMac()?'⌘':'Ctrl'}</kbd> + <kbd>D</kbd> to bookmark it, so it is one click away each week.`
    : canPrompt

        : 'Open your browser menu and choose <b>Add to Home screen</b>.';

function levelUps(before){
  const out=[];
  season().players.forEach(p=>{
    const c=careerOf(p.id); if(!c)return;
    const was=before[p.id];
    if(was!=null&&c.lvl.n>was)out.push({p,from:was,to:c.lvl.n,lvl:c.lvl});
  });
  return out.sort((a,b)=>b.to-a.to);
}

/* ============ HAPTICS ============
   Android exposes the Vibration API. iOS Safari does not — but since 17.4 a
   <input type="checkbox" switch> fires a real haptic when toggled by a label
   click, so we use that as the iOS path. Falls back to nothing elsewhere. */
let HAPTIC_OK=true;
try{ HAPTIC_OK = localStorage.getItem('ss_haptics')!=='0' }catch(e){}
let _hapEl=null;
function initHaptics(){
  if(_hapEl)return;
  const wrap=document.createElement('label');
  wrap.setAttribute('aria-hidden','true');
  wrap.style.cssText='position:absolute;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden';
  const cb=document.createElement('input');
  cb.type='checkbox'; cb.setAttribute('switch',''); cb.id='_hapt';
  wrap.htmlFor='_hapt'; wrap.appendChild(cb);
  document.body.appendChild(wrap);
  _hapEl=wrap;
}
function haptic(kind){
  if(!HAPTIC_OK)return;
  try{
    if(navigator.vibrate){                       // Android
      navigator.vibrate(kind==='heavy'?18:kind==='success'?[8,30,8]:7);
      return;
    }
    if(_hapEl)_hapEl.click();                    // iOS 17.4+
  }catch(e){}
}
function setHaptics(on){
  HAPTIC_OK=!!on;
  try{localStorage.setItem('ss_haptics',on?'1':'0')}catch(e){}
  if(on)haptic('light');
  render();
}

/* ============ TEAM OF THE WEEK ============ */
function totw(){
  const gws=playedGws(); if(!gws.length)return null;
  const gw=gws[gws.length-1];
  const pool=season().players.filter(p=>p.active!==false)
    .map(p=>({p,pts:fplPlayerGw(p.id,gw)})).filter(x=>x.pts>0);
  if(pool.length<3)return null;
  const pick=pos=>pool.filter(x=>(x.p.pos||'MID')===pos).sort((a,b)=>b.pts-a.pts)[0];
  const gk=pick('GK'), def=pool.filter(x=>x.p.pos==='DEF').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const mid=pool.filter(x=>x.p.pos==='MID').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const att=pool.filter(x=>x.p.pos==='ATT').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const star=[...pool].sort((a,b)=>b.pts-a.pts)[0];
  return {gw,gk,def,mid,att,star};
}

/* ============ RADAR CHART (Compare) ============ */
function radarChart(a,b){
  const axes=[
    ['Points','pts'],['Goals','G'],['Win %','wr'],
    ['Clean sheets','cs'],['Form','form'],['Games','P']
  ];
  const all=statsAll().filter(x=>x.P>0);
  const max=k=>Math.max(...all.map(x=>x[k]||0),0.001);
  const N=axes.length, R=78, CX=100, CY=95;
  const pt=(i,v)=>{
    const ang=(Math.PI*2*i)/N-Math.PI/2, r=Math.max(4,v*R);
    return [CX+Math.cos(ang)*r, CY+Math.sin(ang)*r];
  };
  const poly=(m,col)=>{
    const pts=axes.map(([,k],i)=>pt(i,(m[k]||0)/max(k)).join(',')).join(' ');
    return `<polygon points="${pts}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  };
  const grid=[0.25,0.5,0.75,1].map(f=>{
    const pts=axes.map((_,i)=>pt(i,f).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--sep)" stroke-width="1"/>`;
  }).join('');
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,1);
    return `<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="var(--sep)" stroke-width="1"/>`}).join('');
  const labels=axes.map(([l],i)=>{const [x,y]=pt(i,1.24);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="9.5" font-weight="700" fill="var(--label3)">${l}</text>`}).join('');
  return `<div class="sechead">Radar</div>
    <div class="card pad">
      <svg viewBox="0 0 200 200" style="width:100%;max-width:340px;display:block;margin:0 auto">
        ${grid}${spokes}${poly(a,'var(--tint)')}${poly(b,'var(--blue)')}${labels}
      </svg>
      <div class="potsleg" style="justify-content:center">
        <span><i style="background:var(--tint)"></i>${esc(a.name)}</span>
        <span><i style="background:var(--blue)"></i>${esc(b.name)}</span></div>
      <div class="note" style="padding:8px 0 0">Each axis is scaled against the best in the squad.</div>
    </div>`;
}

/* ============ AUTO MATCH REPORTS ============ */
function matchReport(g){
  if(!g)return '';
  const a=g.scoreA??0,b=g.scoreB??0,marg=Math.abs(a-b),tot=a+b;
  const nm=(l,f)=>{const n=(l||[]).map(p=>player(p)?.name).filter(Boolean).concat(f||[]);return n};
  const A=nm(g.teamA,g.fillA), B=nm(g.teamB,g.fillB);
  const winners=a>b?A:B, losers=a>b?B:A;
  const scorers=Object.entries(g.goals||{}).filter(([,n])=>n>0)
    .map(([pid,n])=>({name:player(pid)?.name,n})).filter(x=>x.name).sort((x,y)=>y.n-x.n);
  const top=scorers[0];
  const list=arr=>arr.length<=1?(arr[0]||'—'):arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  let open;
  if(a===b) open = tot===0 ? `A goalless stalemate.` : `Honours even in a ${a}–${b} draw.`;
  else if(marg>=4) open = `A ${Math.max(a,b)}–${Math.min(a,b)} demolition.`;
  else if(marg===1) open = `Settled by a single goal, ${Math.max(a,b)}–${Math.min(a,b)}.`;
  else open = `${Math.max(a,b)}–${Math.min(a,b)} in the end.`;
  const bits=[open];
  if(a!==b) bits.push(`${list(winners)} came out on top against ${list(losers)}.`);
  else bits.push(`${list(A)} and ${list(B)} couldn't be separated.`);
  if(top){
    if(top.n>=3) bits.push(`${top.name} helped himself to a hat-trick.`);
    else if(top.n===2) bits.push(`${top.name} grabbed a brace.`);
    else if(scorers.length) bits.push(`${list(scorers.map(x=>x.name))} got on the scoresheet.`);
  }
  if(Math.min(a,b)===0&&tot>0) bits.push(`A clean sheet for the winners.`);
  if(tot>=8) bits.push(`${tot} goals in one game — chaos.`);
  return bits.join(' ');
}

/* ============ PLAYER OF THE SEASON RACE ============ */
function potsRace(){
  const g=allGames().filter(x=>x.date).sort((p,q)=>(p.date||'').localeCompare(q.date||'')||(p.created||0)-(q.created||0));
  if(g.length<4)return '';
  const st=lgStats().filter(x=>x.P>0).sort(tableSort).slice(0,5);
  if(st.length<2)return '';
  const ids=st.map(x=>x.id);
  const run={};ids.forEach(i=>run[i]=0);
  const series={};ids.forEach(i=>series[i]=[0]);
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,t])=>(t||[]).forEach(pid=>{
      if(!(pid in run))return;
      if(x.result==='D')run[pid]+=1; else if(x.result===sd)run[pid]+=3;
    }));
    ids.forEach(i=>series[i].push(run[i]));
  });
  const max=Math.max(...ids.map(i=>run[i]),1);
  const W=300,H=110,n=g.length;
  const cols=['var(--tint)','var(--green)','var(--orange)','var(--purple)','var(--teal)'];
  const line=(i,ix)=>{
    const pts=series[i].map((v,k)=>`${(k/n)*W},${H-(v/max)*(H-8)-4}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${cols[ix%5]}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  return `<div class="sechead">🏁 Player of the Season race</div>
    <div class="card pad">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:118px;display:block">
        ${[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${H-(H-8)*f-4}" x2="${W}" y2="${H-(H-8)*f-4}"
          stroke="var(--sep)" stroke-width="1"/>`).join('')}
        ${ids.map(line).join('')}
      </svg>
      <div class="potsleg">${st.map((x,ix)=>`<span onclick="openPlayer('${x.id}')">
        <i style="background:${cols[ix%5]}"></i>${esc(x.name)} <b>${x.pts}</b></span>`).join('')}</div>
      <div class="note" style="padding:8px 0 0">Points accumulated across the season — the top five, gameweek by gameweek.</div>
    </div>`;
}

/* ============ LIFETIME BLOCK FOR A PLAYER ============ */
function lifetimeBlock(pid){
  const p=player(pid); if(!p)return '';
  if((DB.seasons||[]).length<2)return '';
  const life=lifetime().find(l=>l.name.trim().toLowerCase()===p.name.trim().toLowerCase());
  if(!life||life.seasons<2)return '';

}

/* ============ CHANGE LOG + UNDO ============ */
function logEntry(action,detail){
  const S=season(); if(!S.log)S.log=[];
  S.log.push({t:Date.now(),a:action,d:detail});
  if(S.log.length>200)S.log=S.log.slice(-200);
}
/* one-step undo: we stash a snapshot before each destructive change */
let UNDO=null;
function snapshot(label){
  try{ UNDO={label,t:Date.now(),data:JSON.parse(JSON.stringify(DB)),cur:CUR}; }catch(e){ UNDO=null; }
}
function canUndo(){ return !!UNDO && (Date.now()-UNDO.t)<1000*60*30 }
async function undoLast(){
  if(!requireAdmin())return;
  if(!canUndo()){toast('Nothing to undo');return}
  const label=UNDO.label;
  if(!await askConfirm('Undo?',`This will reverse: ${label}`,'Undo',false))return;
  DB=UNDO.data; CUR=UNDO.cur;
  if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
  UNDO=null; await save(); render(); toast('↩︎ Undone');
}
const fmtWhen=t=>{const d=new Date(t),n=new Date();
  const sameDay=d.toDateString()===n.toDateString();
  return sameDay?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})
    :d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
function changeLog(){
  const L=[...(season().log||[])].reverse().slice(0,40);
  if(!L.length)return `<div class="note">Nothing logged yet. Edits you make from now on appear here.</div>`;
  return `<div class="card">${L.map(e=>`<div class="row">
    <div style="font-size:17px;flex:0 0 24px">${e.a==='delete'?'🗑️':e.a==='edit'?'✏️':e.a==='add'?'➕':'•'}</div>
    <div class="rt"><div class="r1" style="font-size:14.5px">${esc(e.d)}</div>
      <div class="r2">${fmtWhen(e.t)}</div></div></div>`).join('')}</div>`;
}
/* ---- storage usage estimate (Supabase free tier is 500MB) ---- */
function storageInfo(){
  let bytes=0;
  try{ bytes=new Blob([JSON.stringify(DB)]).size }catch(e){ try{bytes=JSON.stringify(DB).length}catch(_){} }
  const mb=bytes/1048576, limit=500, pct=Math.min(100,(mb/limit)*100);
  const kb=bytes/1024;
  const nice=mb>=1?mb.toFixed(1)+' MB':kb.toFixed(0)+' KB';
  const level=pct>80?'var(--red)':pct>50?'var(--orange)':'var(--green)';
  return {bytes,nice,pct,level,limit,
    msg: pct>80 ? 'Getting close to the free limit — consider archiving an old season.'
       : pct>50 ? 'Comfortable, but worth keeping an eye on.'
       : 'Plenty of room. A full season is typically well under 1 MB.'};
}

/* ============ PERSONAL BESTS / SEASON SUMMARY / COUNTDOWNS ============ */
function personalBests(pid){
  const m=statsAll().find(x=>x.id===pid); if(!m||!m.P)return null;
  const seq=m.seq||[];
  const bestGoals=Math.max(0,...seq.map(s=>s.goals||0));
  const winRun=(function(){let b=0,c=0;seq.forEach(s=>{c=s.r==='W'?c+1:0;if(c>b)b=c});return b})();
  const unbeaten=(function(){let b=0,c=0;seq.forEach(s=>{c=s.r!=='L'?c+1:0;if(c>b)b=c});return b})();
  const csRun=(function(){let b=0,c=0;seq.forEach(s=>{c=s.ga===0?c+1:0;if(c>b)b=c});return b})();
  const scoreRun=(function(){let b=0,c=0;seq.forEach(s=>{c=(s.goals||0)>0?c+1:0;if(c>b)b=c});return b})();
  // best month
  const g=allGames().filter(x=>(x.teamA||[]).includes(pid)||(x.teamB||[]).includes(pid));
  const months={};
  g.forEach(x=>{const k=(x.date||'').slice(0,7);if(!k)return;
    const onA=(x.teamA||[]).includes(pid),sd=onA?'A':'B';
    const e=months[k]=months[k]||{P:0,pts:0,G:0};
    e.P++;e.G+=(x.goals&&x.goals[pid])||0;
    if(x.result==='D')e.pts++;else if(x.result===sd)e.pts+=3;});
  let bestMonth=null;
  Object.keys(months).forEach(k=>{const e=months[k];
    if(e.P>=2&&(!bestMonth||e.pts/e.P>bestMonth.ppg))bestMonth={k,ppg:e.pts/e.P,...e}});
  return {bestGoals,winRun,unbeaten,csRun,scoreRun,bestMonth};
}
function pbBlock(pid){
  const pb=personalBests(pid); if(!pb)return '';
  const gm=n=>n?n+(n===1?' game':' games'):'—';
  const items=[
    ['⚽','Most in a game',pb.bestGoals?pb.bestGoals+(pb.bestGoals===1?' goal':' goals'):'—'],
    ['🔥','Longest win run',gm(pb.winRun)],
    ['🛡️','Longest unbeaten',gm(pb.unbeaten)],
    ['🎯','Scored in a row',gm(pb.scoreRun)],
    ['🧤','Clean sheets in a row',gm(pb.csRun)],
    ['📅','Best month',pb.bestMonth?MONTHNAME(pb.bestMonth.k).split(' ')[0]:'—']
  ];
  return `<div class="sechead">Personal bests</div>
    <div class="pbgrid">${items.map(([e,l,v])=>`<div class="pbcard">
      <div class="pb-e">${e}</div><div class="pb-l">${l}</div><div class="pb-v">${esc(String(v))}</div></div>`).join('')}</div>`;
}
/* plain-English season summary */
function seasonLine(pid){
  const p=player(pid),m=statsAll().find(x=>x.id===pid);
  if(!m||!m.P)return '';
  const pb=personalBests(pid);
  const bits=[`You played ${m.P}`];
  if(m.W)bits.push(`won ${m.W}`);
  if(m.G)bits.push(`scored ${m.G}`);
  let txt=bits.join(', ')+'.';
  const extra=[];
  if(pb&&pb.scoreRun>=3)extra.push(`You scored in ${pb.scoreRun} straight games`);
  else if(pb&&pb.winRun>=3)extra.push(`You won ${pb.winRun} in a row at one point`);
  else if(pb&&pb.unbeaten>=4)extra.push(`You went ${pb.unbeaten} games unbeaten`);
  if(m.cs>=3)extra.push(`kept ${m.cs} clean sheets`);
  if(pb&&pb.bestMonth&&pb.bestMonth.P>=2)extra.push(`and ${MONTHNAME(pb.bestMonth.k).split(' ')[0]} was your best month`);
  if(extra.length)txt+=' '+extra.join(', ').replace(/^(\w)/,c=>c.toUpperCase())+'.';
  const rank=ranks(lgStats()).find(x=>x.id===pid);
  if(rank)txt+=` You're sitting ${ordinal(rank.rank)} in the table.`;
  return `<div class="sechead">Your season</div>
    <div class="card pad seasonline">${esc(txt)}</div>`;
}
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

/* ---- milestone countdowns: who is close to a round number ---- */
function countdowns(){
  const st=lgStats().filter(x=>x.P>0), out=[];
  const marks=[10,25,50,75,100,150,200];
  st.forEach(x=>{
    const life=lifetime().find(l=>l.name.trim().toLowerCase()===x.name.trim().toLowerCase());
    const apps=life?life.P:x.P;
    marks.forEach(mk=>{const left=mk-apps;
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:'🎖️',t:`${left} game${left===1?'':'s'} from ${mk} appearances`,v:left})});
    [10,25,50,100].forEach(mk=>{const left=mk-(life?life.G:x.G);
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:'⚽',t:`${left} goal${left===1?'':'s'} from ${mk} career goals`,v:left})});
  });
  return out.sort((a,b)=>a.v-b.v).slice(0,4);
}

/* ---- rotation fairness: are the same people always together? ---- */
function rotationWatch(){
  const g=allGames().slice(-6);
  if(g.length<4)return '';
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, m={};
  g.forEach(x=>{[x.teamA,x.teamB].forEach(t=>{
    const arr=(t||[]).filter(id=>player(id));
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const k=key(arr[i],arr[j]); m[k]=(m[k]||0)+1;
    }})});
  const stuck=Object.entries(m).filter(([,n])=>n>=Math.min(5,g.length))
    .map(([k,n])=>{const [a,b]=k.split('|');return {a,b,n}})
    .filter(x=>player(x.a)&&player(x.b))
    .sort((p,q)=>q.n-p.n).slice(0,3);
  if(!stuck.length)return '';
  return `<div class="sechead">🔄 Rotation watch</div>
    <div class="card">${stuck.map(x=>`<div class="row">
      <div style="font-size:20px;flex:0 0 26px">🔗</div>
      <div class="rt"><div class="r1" style="font-size:15px">${esc(player(x.a).name)} &amp; ${esc(player(x.b).name)}</div>
        <div class="r2">Same team ${x.n} of the last ${g.length} games</div></div></div>`).join('')}</div>
    <div class="note">Worth splitting these up to keep games even.</div>`;
}

/* ============ HISTORY (all-time, hall of fame, rivalries) ============ */
let HMODE='records';

/* every game across every season, with the season it came from */
function allTimeGames(){
  const out=[];
  (DB.seasons||[]).forEach(s=>{
    (s.games||[]).forEach(g=>out.push({g,s}));
  });
  return out;
}
/* lifetime totals keyed by player NAME (ids differ between seasons) */
function lifetime(){
  const m={};
  (DB.seasons||[]).forEach(s=>{
    const byId={};(s.players||[]).forEach(p=>byId[p.id]=p);
    (s.games||[]).forEach(g=>{
      [['A',g.teamA,g.scoreA,g.scoreB],['B',g.teamB,g.scoreB,g.scoreA]].forEach(([sd,team,gf,ga])=>{
        (team||[]).forEach(pid=>{
          const p=byId[pid]; if(!p)return;
          const k=p.name.trim().toLowerCase();
          const e=m[k]=m[k]||{name:p.name,P:0,W:0,D:0,L:0,G:0,GF:0,GA:0,cs:0,pts:0,seasons:new Set(),seq:[]};
          e.P++; e.GF+=gf??0; e.GA+=ga??0; e.G+=(g.goals&&g.goals[pid])||0;
          if((ga??0)===0)e.cs++;
          e.seasons.add(s.id);
          if(g.result==='D'){e.D++;e.pts++;e.seq.push('D')}
          else if(g.result===sd){e.W++;e.pts+=3;e.seq.push('W')}
          else {e.L++;e.seq.push('L')}
        })});
    });
  });
  return Object.values(m).map(x=>({...x,seasons:x.seasons.size,
    wr:x.P?x.W/x.P:0, gpg:x.P?x.G/x.P:0, GD:x.GF-x.GA})).sort((a,b)=>b.P-a.P);
}
function longestRun(seq,ok){let b=0,c=0;seq.forEach(r=>{c=ok(r)?c+1:0;if(c>b)b=c});return b}

/* ---------- RIVALRIES ---------- */
function rivalries(minGames){
  const min=minGames||3;
  const ids=season().players.map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, m={};
  allGames().forEach(g=>{
    const A=(g.teamA||[]).filter(x=>ids.includes(x)), B=(g.teamB||[]).filter(x=>ids.includes(x));
    A.forEach(a=>B.forEach(b=>{
      const k=key(a,b); if(!m[k])m[k]={a:a<b?a:b,b:a<b?b:a,aw:0,bw:0,d:0,P:0};
      const e=m[k]; e.P++;
      if(g.result==='D')e.d++;
      else{
        const winnerOnA=g.result==='A';
        const aOnA=A.includes(e.a);
        const aWon=(winnerOnA&&aOnA)||(!winnerOnA&&!aOnA);
        aWon?e.aw++:e.bw++;
      }
    }));
  });
  return Object.values(m).filter(x=>x.P>=min)
    .map(x=>({...x,gap:Math.abs(x.aw-x.bw),
      heat:Math.round((1-Math.abs(x.aw-x.bw)/Math.max(x.aw+x.bw,1))*100)}))
    .sort((p,q)=>q.P-p.P).sort((p,q)=>p.gap-q.gap||q.P-p.P);
}
function histRivals(){
  const rv=rivalries(3);
  if(!rv.length)return `<div class="empty"><div class="ee">⚔️</div><h3>No rivalries yet</h3>
    <p>Once two players have faced each other three times, the closest match-ups show up here.</p></div>`;
  const top=rv.slice(0,10);
  return `<div class="note" style="padding:0 4px 12px">The tightest head-to-heads in the group — closest record first.</div>
    ${top.map((x,i)=>{
      const a=player(x.a),b=player(x.b); if(!a||!b)return '';
      const tot=Math.max(x.aw+x.bw,1);
      return `<div class="card rival" style="margin-bottom:10px">
