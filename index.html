let GTYPED='', GSOLVED=0, GTRIES=0;
function startGuess(){
  const pool=CAREERS.filter(c=>!GSEENP.includes(c.n));
  const use=pool.length?pool:(GSEENP=[],CAREERS);
  const pick=use[Math.floor(Math.random()*use.length)];
  GSEENP=[...GSEENP,pick.n];
  GUESS={n:pick.n,clubs:pick.c,hint:pick.h};
  GREVEAL=0; GUESSDONE=null; GTYPED=''; haptic('light'); render();
}
let GSEENP=[];
function revealMore(){ if(!GUESS)return; GREVEAL=1; haptic('light'); render(); }
/* forgiving matching — surnames, accents and spacing all count */
function normName(x){
  return String(x||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}
function guessMatches(typed,answer){
  const t=normName(typed), a=normName(answer);
  if(!t)return false;
  if(t===a)return true;
  const parts=a.split(' ');
  const surname=parts[parts.length-1];
  if(t===surname)return true;
  if(parts.length>2&&t===parts.slice(1).join(' '))return true;   // "van dijk"
  return false;
}
async function submitTyped(){
  if(!GUESS||GUESSDONE)return;
  const right=guessMatches(GTYPED,GUESS.n);
  GTRIES++;
  if(right){
    GSTREAK++; GSOLVED++; haptic('success');
    GUESSDONE={right:true};
    await postScore('whoami',GSTREAK,`best streak · ${GSOLVED} solved`);
  } else {
    GSTREAK=0; haptic('heavy'); GUESSDONE={right:false};
  }
  render();
}
function giveUpGuess(){ if(!GUESS)return; GSTREAK=0; GUESSDONE={right:false,gave:true}; render(); }

let BTAB='markets', BSLIP=[], BSTAKE=100, BPLAYER=null;
const BET_MAXLEGS=4;
/* An accumulator multiplies, and every extra leg earns a bonus on top — the
   more you stack, the better the price, which is what makes a four-fold worth
   attempting instead of four singles. */
const ACCA_BONUS={1:1, 2:1.05, 3:1.12, 4:1.22};
const accaBonus=n=>ACCA_BONUS[Math.min(n,BET_MAXLEGS)]||1;
const slipOdds=()=>BSLIP.reduce((t,x)=>t*x.odds,1)*accaBonus(BSLIP.length);
function inSlip(pid,k){ return BSLIP.some(x=>x.pid===pid&&x.k===k) }
function clearSlip(){ BSLIP=[]; render() }
async function customStake(){
  const me=fplMine(); if(!me)return;
  const v=await askText('Stake',`Between ${usd(BET_RULES.min)} and ${usd(Math.min(BET_RULES.max,wallet(me.pid)))}`,String(BSTAKE),'Set');
  if(v===null)return;
  const n=Math.round(Number(String(v).replace(/[^0-9]/g,'')));
  if(!n||n<BET_RULES.min){toast(`Minimum stake is ${usd(BET_RULES.min)}`);return}
  BSTAKE=Math.min(n,BET_RULES.max,wallet(me.pid)); render();
}
function maxStake(){
  const me=fplMine(); if(!me)return;
  BSTAKE=Math.max(BET_RULES.min,Math.min(BET_RULES.max,wallet(me.pid)));
  haptic('light'); render();
}
function pickBet(pid,k){
  const at=BSLIP.findIndex(x=>x.pid===pid&&x.k===k);
  if(at>=0){ BSLIP.splice(at,1); haptic('light'); render(); return }
  /* one market per player per slip — you cannot back both sides of the same thing */
  if(BSLIP.some(x=>x.pid===pid)){ toast('One pick per player on a slip'); return }
  if(BSLIP.length>=BET_MAXLEGS){ toast(`Up to ${BET_MAXLEGS} selections`); return }
  const m=playerMarkets(pid).find(x=>x.k===k);
  if(!m)return;
  BSLIP.push({pid,k,odds:m.odds,l:m.l});
  haptic('light'); render();
}

        <button class="sb-clear" onclick="clearSlip()">Clear</button>

          <b>${x.odds.toFixed(2)}</b>

      <div class="sb-stake">
        ${[50,100,250,500].map(v=>`<button class="${BSTAKE===v?'on':''}" onclick="BSTAKE=${v};render()">${usd(v)}</button>`).join('')}
        <button onclick="customStake()">Custom</button>
        <button onclick="maxStake()">Max</button>
      </div>
      <div class="sb-slip-b">

        <button class="btn pri" onclick="placeBet()">Place ${usd(BSTAKE)}</button>
      </div>
      ${BSLIP.length<BET_MAXLEGS?`<div class="sb-tip">Add up to ${BET_MAXLEGS} selections — the odds multiply.</div>`:''}
    </div>`;
}

function histFirsts(){
  const gs=allTimeGames?allTimeGames():allGames();
  if(!gs.length)return '';
  const rows=[];
  const g0=gs[0];
  rows.push(['🌅','First ever game',`${fdate(g0.date)} · ${g0.scoreA}–${g0.scoreB}`]);
  const fg=gs.find(g=>Object.keys(g.goals||{}).length);
  if(fg){const pid=Object.keys(fg.goals)[0];
    rows.push(['⚽','First ever goal',`${(player(pid)||{}).name||'—'} · ${fdate(fg.date)}`])}
  const fh=gs.find(g=>Object.values(g.goals||{}).some(n=>n>=3));
  if(fh){const pid=Object.entries(fh.goals).find(([,n])=>n>=3)[0];
    rows.push(['⚡','First hat-trick',`${(player(pid)||{}).name||'—'} · ${fdate(fh.date)}`])}
  const fc=gs.find(g=>g.scoreA===0||g.scoreB===0);
  if(fc)rows.push(['🧤','First shut-out',`${fdate(fc.date)} · ${fc.scoreA}–${fc.scoreB}`]);
  const fd=gs.find(g=>g.result==='D');
  if(fd)rows.push(['🤝','First draw',`${fdate(fd.date)} · ${fd.scoreA}–${fd.scoreB}`]);
  return `<div class="sechead">Firsts</div>
    <div class="card">${rows.map(([e,t,d])=>`
      <div class="row"><div style="font-size:20px;flex:0 0 26px">${e}</div>
        <div class="rt"><div class="r1">${t}</div><div class="r2">${esc(d)}</div></div></div>`).join('')}</div>`;
}

/* ============ PRICE MIGRATION ============
   Everyone picked when all 29 players were the same price. With bespoke prices
   most squads no longer fit the budget, so each team keeps its two dearest
   players and the rest is auto-filled with the cheapest legal combination.
   Runs once, and flags every team so people know to review it. */
const MIGRATION_KEY='prices_v3';
function autoFill(keep){
  const pool=season().players.filter(p=>p.active!==false&&FPL_RULES.eligible.includes(p.pos||'MID'))
    .map(p=>({id:p.id,pos:p.pos||'MID',price:fplPrice(p.id)}))
    .filter(p=>!keep.includes(p.id))
    .sort((a,b)=>a.price-b.price);
  const squad=[...keep];
  const have=()=>new Set(squad.map(x=>(player(x)||{}).pos||'MID'));
  /* cover the required positions first, cheapest available */
  FPL_RULES.slots.forEach(pos=>{
    if(squad.length>=FPL_RULES.squadSize)return;
    if(have().has(pos))return;
    const pick=pool.find(p=>p.pos===pos&&!squad.includes(p.id));
    if(pick)squad.push(pick.id);
  });
  /* then fill up with whatever is cheapest */
  for(const p of pool){
    if(squad.length>=FPL_RULES.squadSize)break;
    if(!squad.includes(p.id))squad.push(p.id);
  }
  return squad.slice(0,FPL_RULES.squadSize);
}
/* Repairs any squad that costs more than the budget. This runs on EVERY load,
   not just once — a one-shot flag is fragile, because a half-finished earlier
   version can stamp it and lock the real fix out forever. Only touches teams
   that are actually broken, so it costs nothing once everyone is legal. */
/* Puts any broken squad right: players who no longer exist, squads that are the
   wrong size, squads missing a position, and squads over budget. Runs on EVERY
   load — a one-shot flag is fragile, because a half-finished earlier version can
   stamp it and lock the real fix out. Costs nothing once everyone is legal. */
async function repairOverBudget(){
  const f=fpl(); let fixed=0;
  const alive=pid=>{ const p=player(pid); return !!p && p.active!==false && FPL_RULES.eligible.includes(p.pos||'MID') };
  (f.managers||[]).forEach(m=>{
    if(!m.teamName||!(m.squad||[]).length)return;
    /* drop anyone who has left the squad list entirely */
    const before=(m.squad||[]).length;
    let sq=(m.squad||[]).filter(alive);
    const lostSomeone = sq.length!==before;
    const cost=sq.reduce((t,x)=>t+((m.bought||{})[x]??fplPrice(x)),0);
    const shape=squadShape(sq);
    const missing=FPL_RULES.slots.some(pos=>!shape[pos]);
    const wrongSize=sq.length!==FPL_RULES.squadSize;
    if(!lostSomeone && !missing && !wrongSize && cost<=FPL_RULES.budget)return;
    /* keep as much of their team as we can, cheapest-fill the rest */
    const keep=[...sq].sort((a,b)=>fplPrice(b)-fplPrice(a))
      .slice(0, cost>FPL_RULES.budget ? 2 : FPL_RULES.squadSize-1);
    let next=autoFill(keep);
    /* if that is still over budget, fall back to the two dearest and refill */
    if(next.reduce((t,x)=>t+fplPrice(x),0)>FPL_RULES.budget)
      next=autoFill([...sq].sort((a,b)=>fplPrice(b)-fplPrice(a)).slice(0,2));
    m.squad=next;
    if(!next.includes(m.captain))m.captain=next[0]||null;
    m.bought={}; next.forEach(pid=>m.bought[pid]=fplPrice(pid));
    /* past gameweeks keep whoever actually played, but drop ghosts so the
       history views can never hit a missing player */
    (m.history||[]).forEach(h=>{
      h.squad=(h.squad||[]).filter(x=>!!player(x));
      if(h.captain&&!player(h.captain))h.captain=h.squad[0]||null;
    });
    m.needsReview=true; m.wasAutoFilled=true;
    fixed++;
  });
  if(fixed){ FDRAFT=null; try{ if(!CLOUD_FAIL)await save() }catch(e){} }
  return fixed;
}
async function migratePrices(){
  const f=fpl();
  if(f.migrated===MIGRATION_KEY){
    /* already migrated — but still repair anything left over budget */
    return await repairOverBudget();
  }
  /* wipe any price map saved under the old rules and rebuild from the new list */
  f.prices={};
  try{ recalcPrices() }catch(e){}
  let touched=0;
  (f.managers||[]).forEach(m=>{
    if(!m.teamName||!(m.squad||[]).length)return;
    /* Everyone picked when all 29 cost the same, so no squad reflects a real
       choice under the new prices — even the ones that happen to still fit.
       Keep the two dearest and rebuild the rest for everybody. */
    const keep=[...m.squad].sort((a,b)=>fplPrice(b)-fplPrice(a)).slice(0,2);
    const next=autoFill(keep);
    m.squad=next;
    if(!next.includes(m.captain))m.captain=keep[0]||next[0];
    m.bought={}; next.forEach(pid=>m.bought[pid]=fplPrice(pid));
    m.needsReview=true;
    m.wasAutoFilled=true;
    touched++;
  });
  f.migrated=MIGRATION_KEY;
  try{ if(!CLOUD_FAIL)await save() }catch(e){}
  return touched;
}
function reviewBanner(){
  const me=fplMine();
  if(!me||!me.needsReview)return '';
  if(playedGws().length)return '';        /* once the season starts it is moot */
  return `<div class="revbar">
    <div class="rev-e">⚠️</div>
    <div class="rev-t"><b>${me.wasAutoFilled?'Your team was auto-filled':'Prices have changed'}</b>
      <span>${me.wasAutoFilled
        ? 'Every player now has their own price, so your old squad no longer fit the budget. We kept your two most expensive and filled the rest. Please review it before Sunday.'
        : 'Every player now has their own price. Your squad still fits the budget, but have a look before Sunday in case you would pick differently.'}</span></div>
    <button onclick="go('fpl');FTAB='team';render()">Review</button>
  </div>`;
}

/* ============ GAMEWEEK HISTORY ============
   Read-only. Everything is recomputed from the games and the squad snapshots,
   so it can never disagree with the league table. */
let HGW=null, HWHO=null, HOPEN=null;
function histGw(){ const g=playedGws(); return HGW&&g.includes(HGW)?HGW:(g[g.length-1]||null) }
/* Which gameweek a manager's fantasy team started counting from. Anyone who
   was here before a ball was kicked counts from GW1; someone who joins later
   counts from the gameweek after they confirm a team. */
function firstGwOf(m){ return m.firstGw||1 }
function inGw(m,gw){ return gw>=firstGwOf(m) }
/* the squad a manager actually had in a given gameweek */
function squadInGw(m,gw){
  if(!inGw(m,gw))return {squad:[],captain:null};
  const snap=(m.history||[]).find(h=>h.gw===gw);
  return snap?{squad:snap.squad||[],captain:snap.captain}:{squad:m.squad||[],captain:m.captain};
}
function gwLines(m,gw){
  if(!inGw(m,gw))return [];
  const {squad,captain}=squadInGw(m,gw);
  const mult=((m.tcGws||[]).includes(gw))?3:2;
  return squad.map(pid=>{
    const gs=gamesInGw(gw);
    const parts=gs.map(g=>fplBreakdown(pid,g)).filter(Boolean);
    const raw=parts.reduce((t,b)=>t+b.total,0);
    const isCap=pid===captain;
    return {pid,name:(player(pid)||{}).name||'—',pos:(player(pid)||{}).pos||'',
            played:parts.length>0,raw,isCap,mult:isCap?mult:1,
            total:isCap?raw*mult:raw,rows:parts.length?parts[0].rows:[],parts};
  });
}
function gwTotal(m,gw){ return gwLines(m,gw).reduce((t,l)=>t+l.total,0) }
function runningTo(m,gw){ return playedGws().filter(x=>x<=gw).reduce((t,x)=>t+gwTotal(m,x),0) }

const usdless=v=>`£${(+v).toFixed(1)}m`;
function managerGwCard(m,gw){
  const lines=gwLines(m,gw), tot=lines.reduce((t,l)=>t+l.total,0);
  return `<button class="crosslink" onclick="HWHO=null;HOPEN=null;render()">← everyone</button>
    <div class="sechead">${esc(m.teamName||m.name)} · GW${gw}</div>
    <div class="card">${lines.map(l=>`
      <div class="row tap" onclick="HOPEN=HOPEN==='${l.pid}'?null:'${l.pid}';render()">
        <div class="rt"><div class="r1">${esc(l.name)}${l.isCap?` <span class="pill" style="background:var(--tint-soft);color:var(--tint)">C${l.mult===3?'³':''}</span>`:''}
          ${l.pos?`<span class="pill ${l.pos}">${l.pos}</span>`:''}</div>
          <div class="r2">${l.played?(l.isCap?`${l.raw} × ${l.mult}`:'played'):'did not play'}</div></div>
        <div class="rv" style="font-weight:800;color:${l.total>0?'var(--label)':'var(--label3)'}">${l.total}</div></div>
      ${HOPEN===l.pid?`<div class="bdown">${l.rows.length?l.rows.map(r=>
          `<div class="bd-r"><span>${esc(r.k)}</span><b class="${r.v<0?'dn':''}">${r.v>0?'+':''}${r.v}</b></div>`).join('')
        :'<div class="bd-r"><span>Did not play</span><b>0</b></div>'}
        ${l.isCap?`<div class="bd-r"><span>Captain ×${l.mult}</span><b>+${l.total-l.raw}</b></div>`:''}
        <div class="bd-r tot"><span>Total</span><b>${l.total}</b></div></div>`:''}`).join('')}
      <div class="row"><div class="rt"><div class="r1" style="font-weight:800">Gameweek total</div>
        <div class="r2">${runningTo(m,gw)} for the season so far</div></div>
        <div class="rv" style="font-weight:900;font-size:18px">${tot}</div></div>
    </div>
    <div class="note">Tap any player to see where the points came from.</div>`;
}

/* Everyone's bets for a gameweek — who backed what, what landed, and what it
   paid. The point of a betting round is the arguing afterwards, and until now
   nobody could see anyone else's slip. */
let BWGW=null;
function betWeekGw(){
  const gws=playedGws();
  return BWGW&&gws.includes(BWGW)?BWGW:(gws[gws.length-1]||null);
}
function betWeek(){
  const b=bets(), gws=playedGws(), gw=betWeekGw();
  if(!gws.length)return `<div class="empty"><div class="ee">📅</div><h3>No gameweek yet</h3>
    <p>Once a game is logged the week's slips appear here.</p></div>`;
  const settled=b.settled.filter(x=>x.gw===gw);
  const open=b.open.filter(x=>x.gw===gw);
  const all=[...settled,...open];
  const legLabel=l=>`${esc((player(l.pid)||{}).name||'—')} ${esc(betLabel(l.k))}`;
  const byName=pid=>esc((player(pid)||{}).name||'—');
  const won=settled.filter(x=>x.res==='won');
  const paid=won.reduce((t,x)=>t+(x.ret||0),0);
  const staked=all.reduce((t,x)=>t+(x.stake||0),0);
  const best=won.slice().sort((x,y)=>(y.ret-y.stake)-(x.ret-x.stake))[0];
  return `<div class="gwbar">${gws.map(n=>`<button class="${n===gw?'on':''}"
      onclick="BWGW=${n};render()">GW${n}</button>`).join('')}</div>

    <div class="tiles" style="margin-bottom:14px">
      ${tile(all.length,'Slips')}
      ${tile(usd(staked),'Staked')}
      ${tile(usd(paid),'Paid out',won.length?`${won.length} winner${won.length===1?'':'s'}`:'nobody landed one','var(--green)')}
      ${best?tile(usdSigned(best.ret-best.stake),'Biggest win',byName(best.by),'var(--green)'):tile('—','Biggest win')}
    </div>

    ${all.length?`<div class="card">${all.map(x=>{
      const legs=x.legs||[{pid:x.pid,k:x.k,odds:x.odds}];
      const res=x.res||'open';
      const cls=res==='won'?'bw-won':res==='void'?'bw-void':res==='open'?'bw-open':'bw-lost';
      const tag=res==='won'?`+${usd(x.ret-x.stake)}`:res==='void'?'Void':res==='open'?'Riding':`−${usd(x.stake)}`;
      return `<div class="bw ${cls}">
        <div class="bw-h">
          <b>${byName(x.by)}</b>
          <span class="bw-meta">${legs.length===1?'Single':({2:'Double',3:'Treble',4:'Four-fold'}[legs.length]||legs.length+'-fold')}
            · ${usd(x.stake)} at ${(+x.odds).toFixed(2)}</span>
          <span class="bw-tag">${tag}</span>
        </div>
        <div class="bw-legs">${legs.map(l=>`<div class="bw-leg">${legLabel(l)}
          <i>${(+l.odds).toFixed(2)}</i></div>`).join('')}</div>
      </div>`}).join('')}</div>`
    : `<div class="note" style="padding:18px;text-align:center">Nobody had a bet on in GW${gw}.</div>`}
    <div class="note">Every slip from the whole group, so you can see who called it and who got it badly wrong.</div>`;
}

/* ============ FREE SCORE PREDICTION ============
   One free guess a gameweek, no stake. Call the exact scoreline and it pays a
   flat prize — the point is a bit of fun for people who don't want to risk
   their balance, so it never costs anything to enter. */
const PREDICT_PRIZE=2000;
function preds(){
  const b=bets();
  if(!b.preds)b.preds={};
  return b.preds;
}
function myPred(gw){
  const me=fplMine(); if(!me)return null;
  return (preds()[gw]||{})[me.pid]||null;
}
function predLocked(gw){ return playedGws().includes(gw) }
let PRA=null, PRB=null;
function setPred(side,d){
  const cur=side==='A'?(PRA??0):(PRB??0);
  const v=Math.max(0,Math.min(20,cur+d));
  if(side==='A')PRA=v; else PRB=v;
  render();
}
async function savePred(){
  const me=fplMine();
  if(!me){toast('Enter your code on the Sunday FPL tab first');return}
  const gw=fplNextGw();
  if(predLocked(gw)){toast('That gameweek has already been played');return}
  if(PRA==null||PRB==null){toast('Pick a score first');return}
  const p=preds();
  if(!p[gw])p[gw]={};
  p[gw][me.pid]={a:PRA,b:PRB,at:Date.now()};
  try{ if(!CLOUD_FAIL)await save() }catch(e){}
  haptic('success'); render();
  toast(`Prediction in: ${PRA}–${PRB} for GW${gw}`);
}
/* settle every prediction for a gameweek once its game is logged */
function settlePreds(){
  const p=preds(), gws=playedGws(), b=bets();
  let paid=0;
  gws.forEach(gw=>{
    const entries=p[gw]; if(!entries)return;
    const gs=gamesInGw(gw); if(!gs.length)return;
    const g=gs[0];
    Object.entries(entries).forEach(([pid,e])=>{
      if(e.done)return;
      e.done=true;
      e.actual={a:g.scoreA,b:g.scoreB};
      /* right either way round — the sides are arbitrary week to week */
      const hit=(e.a===g.scoreA&&e.b===g.scoreB)||(e.a===g.scoreB&&e.b===g.scoreA);
      e.won=hit;
      if(hit){ b.wallets[pid]=wallet(pid)+PREDICT_PRIZE; e.prize=PREDICT_PRIZE; paid++; }
    });
  });
  return paid;
}
function predBlock(){
  const gw=fplNextGw(), me=fplMine();
  const mine=myPred(gw);
  const all=preds();
  const past=playedGws().slice(-1)[0];
  const lastRound=past!=null?Object.entries(all[past]||{}) : [];
  if(mine&&PRA==null){PRA=mine.a;PRB=mine.b}
  const a=PRA??0, b2=PRB??0;
  /* A thin bar, not a billboard. The markets are what people come here for,
     so the predictor states its business in one line and folds away. */
  return `<details class="drop${mine?' on':''}"${PREDOPEN?' open':''} ontoggle="PREDOPEN=this.open">
      <summary><span>🎯 Score predictor · free</span>
        <i class="${mine?'sig':''}">${mine?`Your call ${mine.a}–${mine.b}`:`Win ${usd(PREDICT_PRIZE)}`}</i></summary>
      <div class="card pad predcard">
        <div class="note" style="padding:0 0 12px">Call the exact scoreline for GW${gw} and win <b>${usd(PREDICT_PRIZE)}</b>.
          One free guess a gameweek, either way round counts.</div>
        <div class="predrow">
          <div class="predside">
            <button onclick="setPred('A',1)">+</button>
            <b>${a}</b>
            <button onclick="setPred('A',-1)">−</button>
            <span>Team A</span>
          </div>
          <div class="preddash">–</div>
          <div class="predside">
            <button onclick="setPred('B',1)">+</button>
            <b>${b2}</b>
            <button onclick="setPred('B',-1)">−</button>
            <span>Team B</span>
          </div>
        </div>
        <button class="btn pri full" style="margin-top:12px" onclick="savePred()">
          ${mine?`Change my guess (${mine.a}–${mine.b})`:'Put my guess in'}</button>
      </div>
    </details>
    ${lastRound.length?`<details class="drop"${PREDPASTOPEN?' open':''} ontoggle="PREDPASTOPEN=this.open">
      <summary><span>GW${past} predictions</span><i>${lastRound.length} entered</i></summary>
      <div class="card">${lastRound.sort((x,y)=>(y[1].won?1:0)-(x[1].won?1:0)).map(([pid,e])=>`
        <div class="row"><div class="rt">
          <div class="r1">${esc((player(pid)||{}).name||'—')}</div>
          <div class="r2">Called ${e.a}–${e.b}${e.actual?` · it finished ${e.actual.a}–${e.actual.b}`:''}</div></div>
          <div class="rv" style="font-weight:800;color:${e.won?'var(--green)':'var(--label3)'}">
            ${e.won?usdSigned(PREDICT_PRIZE):'—'}</div></div>`).join('')}</div>
    </details>`:''}`;

/* ============ THE SEASON ============
   The year as one page. Live from the first few games, so it earns its place
   all season rather than appearing once in May — and when the season closes
   this is the review. Everything here is built from data already computed
   elsewhere; nothing new is invented. */
function seasonTeam(){
  const st=statsAll().filter(x=>x.P>0);
  if(st.length<3)return null;
  const of=pos=>st.filter(x=>((player(x.id)||{}).pos||'MID')===pos).sort((a,b)=>b.index-a.index);
  const att=of('ATT').slice(0,2), mid=of('MID').slice(0,2), def=of('DEF').slice(0,2);
  const gk=of('GK')[0]||null;
  const star=[...st].sort((a,b)=>b.index-a.index)[0]||null;
  return {gk,def,mid,att,star};
}
/* league position after each gameweek, for the top few */
function seasonArcs(n){
  const gws=playedGws(); if(gws.length<2)return {gws:[],rows:[]};
  const st=statsAll().filter(x=>x.P>0).sort(tableSort).slice(0,n||5);
  const rows=st.map(x=>({id:x.id,name:x.name,pos:[]}));
  gws.forEach((gw,i)=>{
    const upto=allGames().filter(g=>gwOf(g)<=gw);
    const tbl=statsFor(upto).filter(x=>x.P>0).sort(tableSort);
    rows.forEach(r=>{
      const k=tbl.findIndex(x=>x.id===r.id);
      r.pos.push(k<0?null:k+1);
    });
  });
  return {gws,rows,size:Math.max(2,statsAll().filter(x=>x.P>0).length)};
}

/* ---------- RIVALRIES ---------- */
function rivalries(minGames){
  const min=minGames||3;
  const ids=season().players.map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, m={};
  allGames().forEach(g=>{
    const A=(g.teamA||[]).filter(x=>ids.includes(x)), B=(g.teamB||[]).filter(x=>ids.includes(x));
    A.forEach(a=>B.forEach(b=>{
      const k=key(a,b); if(!m[k])m[k]={a:a<b?a:b,b:a<b?b:a,aw:0,bw:0,d:0,P:0};
      const e=m[k]; e.P++;
      if(g.result==='D')e.d++;
      else{
        const winnerOnA=g.result==='A';
        const aOnA=A.includes(e.a);
        const aWon=(winnerOnA&&aOnA)||(!winnerOnA&&!aOnA);
        aWon?e.aw++:e.bw++;
      }
    }));
  });
  return Object.values(m).filter(x=>x.P>=min)
    .map(x=>({...x,gap:Math.abs(x.aw-x.bw),
      heat:Math.round((1-Math.abs(x.aw-x.bw)/Math.max(x.aw+x.bw,1))*100)}))
    .sort((p,q)=>q.P-p.P).sort((p,q)=>p.gap-q.gap||q.P-p.P);
}
function histRivals(){
  const rv=rivalries(3);
  if(!rv.length)return `<div class="empty"><div class="ee">⚔️</div><h3>No rivalries yet</h3>

/* ---------- MOST IMPROVED ---------- */
function histImproved(){
  const g=allGames(); if(g.length<6)return `<div class="empty"><div class="ee">📈</div><h3>Not enough games</h3>
    <p>Once the season is a few weeks old you'll see who has kicked on.</p></div>`;
  const half=Math.floor(g.length/2);
  const calc=list=>{const m={};
    list.forEach(x=>{
      [['A',x.teamA],['B',x.teamB]].forEach(([sd,t])=>(t||[]).forEach(pid=>{
        const e=m[pid]=m[pid]||{P:0,pts:0,G:0};
        e.P++; e.G+=(x.goals&&x.goals[pid])||0;
        if(x.result==='D')e.pts++; else if(x.result===sd)e.pts+=3;
      }));
    });
    return m};
  const first=calc(g.slice(0,half)), second=calc(g.slice(half));
  const rows=[];
  season().players.forEach(p=>{
    const f=first[p.id],s2=second[p.id];
    if(!f||!s2||f.P<2||s2.P<2)return;
    const fp=f.pts/f.P, sp=s2.pts/s2.P;
    rows.push({id:p.id,name:p.name,before:fp,after:sp,diff:sp-fp,
      gBefore:f.G/f.P,gAfter:s2.G/s2.P});
  });
  if(!rows.length)return `<div class="empty"><div class="ee">📈</div><h3>Not enough data</h3>
    <p>Players need at least two games in each half of the season.</p></div>`;
  rows.sort((a,b)=>b.diff-a.diff);
  const up=rows.filter(r=>r.diff>0).slice(0,5), down=rows.filter(r=>r.diff<0).slice(-5).reverse();
  const row=r=>`<div class="row tap" onclick="openPlayer('${r.id}')">
    <div class="rt"><div class="r1">${esc(r.name)}</div>
      <div class="r2">${r.before.toFixed(2)} → ${r.after.toFixed(2)} points per game</div></div>
    <div class="rv" style="font-weight:800;color:${r.diff>0?'var(--green)':'var(--red)'}">
      ${r.diff>0?'▲':'▼'} ${Math.abs(r.diff).toFixed(2)}</div></div>`;
  return `<div class="note" style="padding:0 4px 12px">Comparing the first half of the season with the second — who has kicked on?</div>
    ${up.length?`<div class="sechead">📈 Kicked on</div><div class="card">${up.map(row).join('')}</div>`:''}
    ${down.length?`<div class="sechead">📉 Tailed off</div><div class="card">${down.map(row).join('')}</div>`:''}
    <div class="note">Minimum two games in each half.</div>`;
}

/* ============ CHEMISTRY ============ */
/* How often two players win when they're on the SAME team. */
function chemPairs(minGames){
  const min=minGames||2, g=allGames(), ids=season().players.filter(p=>p.active!==false).map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, map={};
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,team])=>{
      const t=(team||[]).filter(id=>ids.includes(id));
      for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
        const k=key(t[i],t[j]); if(!map[k])map[k]={a:t[i],b:t[j],P:0,W:0,D:0,L:0};
        map[k].P++;
        if(x.result==='D')map[k].D++; else if(x.result===sd)map[k].W++; else map[k].L++;
      }});
  });
  return Object.values(map).filter(p=>p.P>=min).map(p=>({...p,
    wr:p.W/p.P, pts:p.W*3+p.D, ppg:(p.W*3+p.D)/p.P,
    chem:Math.round(((p.W*3+p.D)/p.P)/3*100)   // 0-100 chemistry score
  })).sort((x,y)=>y.chem-x.chem||y.P-x.P);
}
function chemColor(v){
  if(v>=75)return '#30D158'; if(v>=60)return '#9ACD32'; if(v>=45)return '#FFD60A';
  if(v>=30)return '#FF9F0A'; return '#FF453A';
}
function statChem(){
  const pairs=chemPairs(CHEMMIN);
  if(!pairs.length)return `<div class="empty"><div class="ee">🔗</div><h3>Not enough data yet</h3>

let SORT={k:'pts',d:-1},PF='ALL',SMODE='table',SMIN=0,SCOMP='all',CHEMMIN=2;
function statsPool(){
  const games=SCOMP==='all'?allGames():compGames(SCOMP);
  let st=statsFor(games).filter(x=>x.P>0);
  if(PF!=='ALL')st=st.filter(x=>x.pos===PF);
  if(SMIN>0)st=st.filter(x=>x.P>=SMIN);
  const total=games.length;
  st.forEach(x=>{
    x.app=total?x.P/total:0;
    x.gi=x.G;                                   // goal involvement (goals recorded)
    x.ptsShare=0; x.csr=x.P?x.cs/x.P:0;
    x.gdpg=x.P?x.GD/x.P:0;
  });
  const totPts=st.reduce((t,x)=>t+x.pts,0)||1;
  st.forEach(x=>x.ptsShare=x.pts/totPts);
  return {st,total};
}

/* a rating shown as a coloured pill, used on Sky Sports and the match centre */
function ratingPill(r){
  if(r==null)return '<span class="rpill r-mid">—</span>';
  return `<span class="rpill ${ratingClass(r)}">${(+r).toFixed(1)}</span>`;
}
/* colour a match rating badge — green for a big score, red for a poor one */
function ratingClass(r){
  return r>=8.5?'r-elite' : r>=7.5?'r-good' : r>=6.5?'r-ok' : r>=5.5?'r-mid' : 'r-poor';
}

/* ============ INSIGHTS ============
   Three things the numbers can show that a table cannot: who you actually win
   with, what scorelines this league produces, and how form has moved. */

/* who you win most alongside — same side only, minimum games so one lucky
   afternoon does not top the list */
function partnerships(minGames){
  const min=minGames||3, gs=allGames(), pair={};
  gs.forEach(g=>{
    [['A',g.teamA],['B',g.teamB]].forEach(([sd,tm])=>{
      const ids=(tm||[]).filter(x=>player(x));
      for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
        const k=[ids[i],ids[j]].sort().join('|');
        if(!pair[k])pair[k]={a:ids[i],b:ids[j],P:0,W:0,D:0,L:0,GF:0,GA:0};
        const p=pair[k];p.P++;
        const gf=sd==='A'?(g.scoreA||0):(g.scoreB||0);
        const ga=sd==='A'?(g.scoreB||0):(g.scoreA||0);
        p.GF+=gf;p.GA+=ga;
        if(g.result==='D')p.D++; else if(g.result===sd)p.W++; else p.L++;
      }
    });
  });
  return Object.values(pair).filter(p=>p.P>=min)
    .map(p=>({...p,wr:p.W/p.P,gd:p.GF-p.GA}))
    .sort((x,y)=>y.wr-x.wr||y.P-x.P);
}
/* every scoreline this league has produced, as a grid */
function scoreGrid(){
  const gs=allGames(), grid={}; let max=0, top=6;
  gs.forEach(g=>{
    const hi=Math.max(g.scoreA||0,g.scoreB||0), lo=Math.min(g.scoreA||0,g.scoreB||0);
    top=Math.max(top,hi);
    const k=hi+'-'+lo;
    grid[k]=(grid[k]||0)+1;
    max=Math.max(max,grid[k]);
  });
  return {grid,max,top:Math.min(top,9),games:gs.length};
}
function insightsBody(){
  const gs=allGames();

  const sg=scoreGrid();

  /* form curve: cumulative points per game for the top few */
  const st=statsAll().filter(x=>x.P>=3).sort((a,b)=>b.pts-a.pts).slice(0,5);

      return run;
    })};
  });
  const hiPts=Math.max(1,...series.map(s2=>s2.pts[s2.pts.length-1]||0));
  const W=300,H=110,LINE=['#12B76A','#3B82F6','#F59E0B','#EF4444','#8B5CF6'];

  return `

        <div class="rv" style="font-weight:800;color:var(--green)">${Math.round(p.wr*100)}%</div></div>`).join('')
      :`<div class="note" style="padding:14px">Nobody has played three together yet.</div>`}</div>
    ${worst.length?`<div class="sechead">😬 Struggle together</div>
      <div class="card">${worst.map(p=>`
        <div class="row"><div class="rt">
          <div class="r1">${nm(p.a)} <span style="color:var(--label3)">&amp;</span> ${nm(p.b)}</div>
          <div class="r2">${p.P} together · ${p.W}W ${p.D}D ${p.L}L</div></div>
          <div class="rv" style="font-weight:800;color:var(--red)">${Math.round(p.wr*100)}%</div></div>`).join('')}</div>`:''}
    <div class="note">Only counts games played on the same side, with at least three together.</div>

    <div class="sechead">🔥 Scoreline heatmap</div>
    <div class="card pad">
      <div class="hm">${(function(){
        let out='';
        for(let hi=sg.top;hi>=0;hi--){
          out+=`<div class="hm-row"><span class="hm-ax">${hi}</span>`;
          for(let lo=0;lo<=sg.top;lo++){
            if(lo>hi){out+='<span class="hm-c off"></span>';continue}
            const n=sg.grid[hi+'-'+lo]||0;
            const a=n?(0.16+0.84*(n/sg.max)):0;
            out+=`<span class="hm-c" style="background:rgba(18,183,106,${a.toFixed(2)})"
              title="${hi}–${lo}: ${n}">${n||''}</span>`;
          }
          out+='</div>';
        }
        out+='<div class="hm-row"><span class="hm-ax"></span>';
        for(let lo=0;lo<=sg.top;lo++)out+=`<span class="hm-ax b">${lo}</span>`;
        out+='</div>';
        return out;
      })()}</div>
      <div class="note" style="padding:10px 0 0">Winning score down the side, losing score along the bottom.
        Darker means it has happened more often. ${sg.games} game${sg.games===1?'':'s'} counted.</div>
    </div>

    <div class="sechead">📈 Form curves</div>
    <div class="card pad">
      ${series.length?`<svg viewBox="-4 -8 ${W+8} ${H+16}" style="width:100%;height:150px;overflow:visible">
        ${series.map((s2,i)=>`<polyline points="${path(s2.pts)}" fill="none"
          stroke="${LINE[i%LINE.length]}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
      </svg>
      <div class="legend-dots">${series.map((s2,i)=>`<span><i style="background:${LINE[i%LINE.length]}"></i>
        ${esc(s2.name)} <b>${s2.pts[s2.pts.length-1]||0}</b></span>`).join('')}</div>`
      :`<div class="note">Not enough games to draw a curve.</div>`}

    </div>`;
}

let CA=null,CB=null,CMODE='overview';

function compareBody(){
  const st=statsAll().filter(x=>x.P>0).sort(tableSort);
  if(st.length<2){return `<div class="empty"><div class="ee">⚖️</div><h3>Need two players</h3>
    <p>Once two players have games logged you can put them head to head.</p></div>`}
  if(!CA||!st.some(x=>x.id===CA))CA=st[0].id;
  if(!CB||!st.some(x=>x.id===CB)||CB===CA)CB=(st.find(x=>x.id!==CA)||st[0]).id;
  const a=st.find(x=>x.id===CA),b=st.find(x=>x.id===CB);
  const t=togetherStat(a.id,b.id);
  const METS=[
    ['Points','pts',v=>v,false],['Games','P',v=>v,false],['Wins','W',v=>v,false],['Goals','G',v=>v,false],
    ['Clean sheets','cs',v=>v,false],['Win rate','wr',v=>Math.round(v*100)+'%',false],
    ['Points / game','ppg',v=>v.toFixed(2),false],['Goals / game','gpg',v=>v.toFixed(2),false],
    ['Conceded / game','cpg',v=>v.toFixed(1),true],['Goal difference','GD',v=>(v>0?'+':'')+v,false],
    ['Form (last 5)','form',v=>v.toFixed(1),false],['POTY index','index',v=>v,false]];
  let aw=0,bw=0;
  METS.forEach(([,k,,low])=>{const av=a[k],bv=b[k];if(av===bv)return;
    const aBetter=low?av<bv:av>bv; if(aBetter)aw++;else bw++});
  return `
      <div class="grid cmp2" style="margin-bottom:12px">
        ${[[a,'CA','var(--tint)'],[b,'CB','var(--blue)']].map(([x,v,col])=>`<div class="card pad" style="text-align:center">
          <div style="display:flex;justify-content:center;margin-bottom:9px">${avatar(x,48)}</div>
          <select onchange="${v}=this.value;render()" style="background:var(--fill);font-size:15px;text-align:center">
            ${st.map(o=>`<option value="${o.id}" ${o.id===x.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>
          <div style="margin-top:8px;font-size:12.5px;color:var(--label2)">${x.P} games · ${x.pts} pts</div></div>`).join('')}
      </div>
      <div class="card pad" style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px">
        <span class="winpill" style="background:var(--tint-soft);color:var(--tint)">${esc(a.name)} ${aw}</span>
        <span style="font-size:12px;color:var(--label2);font-weight:600">metrics won</span>
        <span class="winpill" style="background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)">${bw} ${esc(b.name)}</span>
      </div>
      <div class="seg" style="margin-bottom:12px">
        ${[['overview','Side by side'],['form','Form'],['together','Together']].map(([k,l])=>`<button class="${CMODE===k?'on':''}" onclick="CMODE='${k}';render()">${l}</button>`).join('')}
      </div>
      ${CMODE==='overview'?`<div class="card">${METS.map(([label,k,fmt,low])=>{
        const av=a[k],bv=b[k];const mx=Math.max(Math.abs(av),Math.abs(bv),0.0001);
        const aBetter=av!==bv&&(low?av<bv:av>bv), bBetter=av!==bv&&!aBetter;
        return `<div class="cmprow">
          <div class="cmphead">
            <span class="cv" style="color:${aBetter?'var(--tint)':'var(--label)'}">${fmt(av)}</span>
            <span class="cl">${label}</span>
            <span class="cv" style="color:${bBetter?'var(--blue)':'var(--label)'}">${fmt(bv)}</span></div>
          <div class="cmpbars">
            <span class="cb l"><i style="width:${Math.abs(av)/mx*100}%"></i></span>
            <span class="cb r"><i style="width:${Math.abs(bv)/mx*100}%"></i></span></div></div>`}).join('')}</div>
        ${METS.some(([,k,,low])=>low)?'<div class="note">For conceded per game, lower is better — the winner is highlighted accordingly.</div>':''}`
      :CMODE==='form'?cmpForm(a,b)+radarChart(a,b)
      :`<div class="card">
        <div class="row"><div class="rt"><div class="r1">Same team</div>
          <div class="r2">${t.tog?`${t.togW} of ${t.tog} won · ${Math.round(t.togW/t.tog*100)}%`:'Never on the same team'}</div>
          ${t.tog?`<div class="bar" style="margin-top:7px"><i style="width:${Math.round(t.togW/t.tog*100)}%"></i></div>`:''}</div>
          <div class="rv" style="font-weight:800">${t.tog}</div></div>
        <div class="row"><div class="rt"><div class="r1">Against each other</div>
          <div class="r2">${t.vs?`${esc(a.name)} ${t.aw} – ${t.bw} ${esc(b.name)}`:'Never faced off'}</div></div>
          <div class="rv" style="font-weight:800">${t.vs}</div></div>
        ${t.vs?`<div class="row"><div class="rt"><div class="r1">Head-to-head edge</div>
          <div class="r2">${t.aw===t.bw?'Dead even':`${esc(t.aw>t.bw?a.name:b.name)} leads by ${Math.abs(t.aw-t.bw)}`}</div></div></div>`:''}
      </div>
      <div class="note">“Same team” counts games where they played together; “against each other” counts games on opposite sides.</div>`}
    `;
}
function cmpForm(a,b){
  const spark=(m,col)=>{
    const seq=m.seq.slice(-12);
    if(seq.length<2)return `<div class="note" style="padding:10px 0">Not enough games yet.</div>`;
    let run=0;const pts=seq.map((s,i)=>{run+=s.r==='W'?3:s.r==='D'?1:0;return {i,v:run}});
    const max=Math.max(...pts.map(p=>p.v),1),W=280,H=34;
    const d=pts.map((p,i)=>`${(i/(pts.length-1))*W},${H-(p.v/max)*(H-4)-2}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  };
  const line=(m,col)=>`<div class="card pad" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:8px">${avatar(m,34)}
      <div style="flex:1"><div style="font-weight:700;font-size:15.5px">${esc(m.name)}</div>
        <div style="font-size:12.5px;color:var(--label2)">${m.form.toFixed(1)} pts/game over the last ${m.last5.length}</div></div>
      ${formDots(m.last5)}</div>
    ${spark(m,col)}
    <div class="note" style="padding:4px 0 0">Cumulative points across the last ${Math.min(m.seq.length,12)} games.</div></div>`;
  return line(a,'var(--tint)')+line(b,'var(--blue)');
}

function togetherStat(x,y){let tog=0,togW=0,vs=0,aw=0,bw=0;
  allGames().forEach(g=>{const A=g.teamA||[],B=g.teamB||[];
    const xa=A.includes(x),xb=B.includes(x),ya=A.includes(y),yb=B.includes(y);
    if(!(xa||xb)||!(ya||yb))return;
    if((xa&&ya)||(xb&&yb)){tog++;if(g.result===(xa?'A':'B'))togW++}
    else{vs++;if(g.result===(xa?'A':'B'))aw++;else if(g.result===(ya?'A':'B'))bw++}});
  return{tog,togW,vs,aw,bw}}

/* ---------- Admin: set a price by hand ----------
   For a new player joining mid-season, or to correct something quickly.
   An override is remembered on the player and becomes their opening price, so
   the weekly movement engine carries on from it as normal. */
async function setBasePrice(pid){
  if(!requireAdmin())return;
  const p=player(pid); if(!p)return;
  const cur=basePrice(pid);
  const v=await askText(`${p.name}'s price`,
    `Their opening price in Sunday FPL. Weekly movement still applies on top, within ${Math.round(FPL_RULES.floorPct*100)}%–${Math.round(FPL_RULES.ceilPct*100)}% of it.`,
    String(cur),'Save');
  if(v===null)return;
  const n=Math.round(parseFloat(v)*10)/10;
  if(!isFinite(n)||n<FPL_RULES.minPrice||n>FPL_RULES.maxPrice){
    toast(`Enter a number between £${FPL_RULES.minPrice}m and £${FPL_RULES.maxPrice}m`);return}
  snapshot(`price change for ${p.name}`);
  p.basePrice=n;
  try{ recalcPrices() }catch(e){}
  await save(); render();
  toast(`${p.name} is now £${n}m`);
}
async function clearBasePrice(pid){
  if(!requireAdmin())return;
  const p=player(pid); if(!p)return;
  delete p.basePrice;
  try{ recalcPrices() }catch(e){}
  await save(); render();
  toast(`${p.name} back to the default £${basePrice(pid)}m`);
}
function adminPrices(){
  const cheapest=cheapestLegalCost(), head=cheapest>FPL_RULES.budget
    ? `<div class="warn" style="margin-bottom:10px">⚠️ The cheapest legal team now costs £${cheapest}m, above the £${FPL_RULES.budget}m budget. Bring some prices down or raise the budget.</div>`
    : '';
  const ps=season().players.filter(x=>x.active!==false)
    .slice().sort((a,b)=>basePrice(b.id)-basePrice(a.id)||String(a.name).localeCompare(String(b.name)));
  if(!ps.length)return '';
  return `<div class="sechead">Sunday FPL prices</div>
    ${head}
    <div class="card">${ps.map(p=>{
      const base=basePrice(p.id), now=fplPrice(p.id), band=priceBand(p.id);
      const moved=Math.abs(now-base)>1e-9;
      return `<div class="row tap" onclick="setBasePrice('${p.id}')">
        <div class="rt"><div class="r1">${esc(p.name)}${p.pos?` <span class="pill ${p.pos}">${p.pos}</span>`:''}${p.basePrice!=null?' <span class="pill" style="background:var(--tint-soft);color:var(--tint)">SET</span>':''}</div>
          <div class="r2">opens £${base}m · can move £${band.lo}m–£${band.hi}m</div></div>
        <div class="rv" style="font-weight:800;color:${moved?(now>base?'var(--green)':'var(--red)'):'var(--label)'}">£${(+now).toFixed(1)}m</div>
        ${chev}</div>`}).join('')}</div>
    <div class="note">Cheapest legal five right now: <b>£${cheapest}m</b> of the £${FPL_RULES.budget}m budget.<br><br>Tap anyone to set their opening price — useful for a new player, or to correct something mid-season. Weekly movement carries on from whatever you set. Changing a price never affects a confirmed squad's budget, because teams are valued at what they paid.</div>`;
}

async function setBoardSide(s){board().side=s;TSEL=null;await saveBoard();paintTac()}
function pickTok(pid){TSEL=(TSEL===pid)?null:pid;paintTac()}
async function clearBoard(){const b=board();b[b.side||'A']={};if(b.pos)b.pos[b.side||'A']={};await saveBoard();paintTac()}
async function autoFillBoard(){
  const b=board(),side=b.side||'A',f=fmById(b.fid);
  const other=side==='A'?'B':'A';
  const taken=Object.values(b[other]||{}).filter(Boolean);
  const order={GK:0,DEF:1,MID:2,ATT:3};
  const pool=[...season().players].filter(p=>p.active!==false&&!taken.includes(p.id));
  const used=new Set(); const out={};
  f.slots.forEach((sl,i)=>{
    const want=sl[2];
    let pick=pool.find(p=>!used.has(p.id)&&p.pos===want);
    if(!pick)pick=pool.find(p=>!used.has(p.id)&&Math.abs((order[p.pos]??2)-(order[want]??2))===1);
    if(!pick)pick=pool.find(p=>!used.has(p.id));
    if(pick){used.add(pick.id);out[i]=pick.id}
  });
  b[side]=out; await saveBoard(); paintTac(); toast('Line-up filled by position');
}
function wireBoard(){
  const pitch=$('#pitch'); if(!pitch)return;
  const b=board(),side=b.side||'A';
  pitch.querySelectorAll('.tok').forEach(tok=>{
    const slot=+tok.dataset.slot;
    let dragging=false,moved=false,sx=0,sy=0,rect=null,raf=0,lastX=0,lastY=0;
    const put=(cx,cy)=>{
      const x=Math.max(5,Math.min(95,((cx-rect.left)/rect.width)*100));
      const y=Math.max(5,Math.min(95,((cy-rect.top)/rect.height)*100));
      return [x,y];
    };
    tok.addEventListener('pointerdown',e=>{
      dragging=true;moved=false;sx=e.clientX;sy=e.clientY;
      rect=pitch.getBoundingClientRect();          // measured once per drag, not per move
      tok.setPointerCapture(e.pointerId);
      tok.classList.add('drag');
      e.preventDefault();
    });
    tok.addEventListener('pointermove',e=>{
      if(!dragging)return;
      if(!moved&&Math.abs(e.clientX-sx)<5&&Math.abs(e.clientY-sy)<5)return;
      moved=true; lastX=e.clientX; lastY=e.clientY;
      if(raf)return;                                // coalesce to one update per frame
      raf=requestAnimationFrame(()=>{
        raf=0; const [x,y]=put(lastX,lastY);
        tok.style.left=x+'%'; tok.style.top=y+'%';
      });
    });
    const finish=async e=>{
      if(!dragging)return; dragging=false;
      if(raf){cancelAnimationFrame(raf);raf=0}
      tok.classList.remove('drag');
      try{tok.releasePointerCapture(e.pointerId)}catch(_){}
      if(moved){
        const [x,y]=put(e.clientX??lastX,e.clientY??lastY);
        if(!b.pos)b.pos={}; if(!b.pos[side])b.pos[side]={};
        b.pos[side][slot]=[Math.round(x),Math.round(y)];
        tok.style.left=Math.round(x)+'%'; tok.style.top=Math.round(y)+'%';
        await saveBoard();                          // no repaint — the token is already where it should be
      } else {
        if(TSEL){ b[side][slot]=TSEL; TSEL=null; await saveBoard(); paintTac(); }
        else if(b[side][slot]){ delete b[side][slot]; await saveBoard(); paintTac(); }
        else { toast('Pick a player from the list first'); }
      }
    };
    tok.addEventListener('pointerup',finish);
    tok.addEventListener('pointercancel',finish);
  });
}

function tacBalance(){
  const roster=[...season().players].filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const st=statsAll();
  const rate=p=>{const m=st.find(x=>x.id===p.id);if(!m||!m.P)return 1.0;
    return Math.max(.3,Math.min(3, m.ppg*0.55 + m.gpg*0.8 + (m.wr*1.2) ))};
  const r=BAL.done;
  return `<div class="card pad" style="margin-bottom:12px">
      <div class="note" style="padding:0 0 10px">Pick who turned up, then split them into two even sides. The balance uses points per game, goals and win rate — so it evens out ability, not just numbers.</div>

        <button class="btn sec sm" onclick="balNone()">Clear</button></div>
    </div>
    <div class="ppick">${roster.map(p=>`<button class="pp ${BAL.sel.has(p.id)?'sel':''}" onclick="balTog('${p.id}')">
      ${avatar(p,30)}<span class="ppn">${esc(p.name)}</span></button>`).join('')}</div>
    <button class="btn pri full" style="margin-top:14px" onclick="doBalance()">⚖️ Split ${BAL.sel.size} players into two teams</button>
    ${r?`<div class="sechead">Suggested teams</div>
      <div class="grid g2">${['A','B'].map((sd,ix)=>{const team=ix===0?r.A:r.B,strength=ix===0?r.sa:r.sb;
        return `<div class="card"><div style="padding:13px 15px 4px;font-weight:700;font-size:15px;color:${sd==='A'?'var(--tint)':'var(--blue)'}">
          Team ${sd} <span style="float:right;font-size:12px;color:var(--label2)">${strength.toFixed(1)}</span></div>
          ${team.map(p=>`<div class="row" style="padding:9px 15px">${avatar(p,28)}
            <div class="rt"><div class="r1">${esc(p.name)}${p.pos?` <span class="pill ${p.pos}">${p.pos}</span>`:''}</div></div></div>`).join('')}
        </div>`}).join('')}</div>
      <div class="note">Balance gap: <b>${Math.abs(r.sa-r.sb).toFixed(2)}</b> — the lower the number, the more even the sides. Shuffle again for a different split.</div>
      <button class="btn sec full sm" onclick="doBalance()">🔀 Shuffle again</button>`:''}`;
}
function balTog(id){BAL.sel.has(id)?BAL.sel.delete(id):BAL.sel.add(id);paintTac()}
function balAll(){season().players.filter(p=>p.active!==false).forEach(p=>BAL.sel.add(p.id));paintTac()}
function balNone(){BAL.sel.clear();BAL.done=null;paintTac()}
function doBalance(){
  const ids=[...BAL.sel]; if(ids.length<2){toast('Pick at least two players');return}
  const st=statsAll();
  const rate=id=>{const m=st.find(x=>x.id===id);if(!m||!m.P)return 1.0;
    return Math.max(.3,Math.min(3, m.ppg*0.55 + m.gpg*0.8 + m.wr*1.2))};
  let best=null;
  for(let attempt=0;attempt<400;attempt++){
    const sh=[...ids].sort(()=>Math.random()-.5);
    const A=[],B=[];let sa=0,sb=0;
    // greedy with jitter: strongest available to the weaker side
    sh.sort((x,y)=>rate(y)-rate(x));
    sh.forEach(id=>{ if(sa<=sb){A.push(id);sa+=rate(id)}else{B.push(id);sb+=rate(id)} });
    if(Math.abs(A.length-B.length)>1)continue;
    const gap=Math.abs(sa-sb);
    if(!best||gap<best.gap)best={A,B,sa,sb,gap};
    if(gap<0.05)break;
  }
  if(!best){toast('Could not split those players');return}
  BAL.done={A:best.A.map(player).filter(Boolean),B:best.B.map(player).filter(Boolean),sa:best.sa,sb:best.sb};
  paintTac(); toast('Teams balanced');
}

/* ============ LEAGUE (table + season history) ============ */
/* ---- league zones, Premier League style ----
   1 champion · 2-5 Champions League · 6-7 Europa · bottom 3 relegation.
   Zones scale down sensibly for small leagues so they never overlap. ---- */
function zoneOf(i,total){
  const z=zoneBands(total),pos=i+1;
  if(pos===1)return 'z-champ';
  if(z.rel&&pos>=z.rel)return 'z-rel';
  if(pos<=z.ucl)return 'z-ucl';
  if(z.eur&&pos<=z.eur)return 'z-eur';
  if(z.con&&pos<=z.con)return 'z-con';
  return '';
}
/* Premier League shape, scaled to however many players you have:
   1 champion · UCL · Europa · Conference · bottom 3 relegated. */
function zoneBands(total){
  const ucl=Math.min(5,Math.max(2,Math.floor(total*0.28)));
  const eur=total>=8?Math.min(7,ucl+2):0;
  const con=total>=10?Math.min(8,eur+1):0;
  const rel=total>=8?total-2:0;
  // never let the european places collide with the drop zone
  const cap=rel?rel-1:total;
  return {ucl:Math.min(ucl,cap), eur:eur?Math.min(eur,cap):0, con:con?Math.min(con,cap):0, rel};
}
function leagueKey(total){
  const z=zoneBands(total);
  const items=[['z-champ','Champion','1']];
  if(z.ucl>=2)items.push(['z-ucl','Champions League',`2–${z.ucl}`]);
  if(z.eur>z.ucl)items.push(['z-eur','Europa League',z.eur===z.ucl+1?`${z.eur}`:`${z.ucl+1}–${z.eur}`]);
  if(z.con>z.eur)items.push(['z-con','Conference League',z.con===z.eur+1?`${z.con}`:`${z.eur+1}–${z.con}`]);
  if(z.rel)items.push(['z-rel','Relegation',`${z.rel}–${total}`]);
  return `<div class="lgkey">${items.map(([c,l,r])=>`<div class="lgkey-i">
    <span class="lgkey-d ${c}"></span><span class="lgkey-l">${l}</span><span class="lgkey-r">${r}</span></div>`).join('')}</div>`;
}

function pgSelect(pid){
  // already on a team? tapping takes them off. Otherwise toggle them in the selection.
  if(G.A.has(pid)||G.B.has(pid)){setSide(pid,'');return}
  G.__sel.has(pid)?G.__sel.delete(pid):G.__sel.add(pid);paintGame()}
function pgPlace(sd){
  if(!G.__sel.size)return;
  const ids=[...G.__sel]; G.__sel.clear();
  ids.forEach(pid=>{G.A.delete(pid);G.B.delete(pid);G[sd].add(pid)});
  paintGame(); toast(`${ids.length} added to Team ${sd}`);}
function pgSelectAll(){
  const all=season().players.filter(p=>p.active!==false&&!G.A.has(p.id)&&!G.B.has(p.id));
  const q=(G.q||'').toLowerCase().trim();
  const pool=q?all.filter(p=>p.name.toLowerCase().includes(q)):all;
  const everyone=pool.every(p=>G.__sel.has(p.id));
  pool.forEach(p=>everyone?G.__sel.delete(p.id):G.__sel.add(p.id));
  paintGame()}
function pgClearSel(){G.__sel.clear();paintGame()}
/* One tap puts a player on a side — no select-then-place round trip. */
function pgQuick(pid,sd){
  G.A.delete(pid);G.B.delete(pid);G.__sel.delete(pid);
  if(sd)G[sd].add(pid); else delete G.goals[pid];
  paintGame();
}
/* Reuse the sides from the most recent game — most Sundays are close to it. */
function pgRepeatLast(){
  const gs=allGames();
  const last=gs[gs.length-1];
  if(!last){toast('No previous game to copy');return}
  const live=new Set(season().players.filter(p=>p.active!==false).map(p=>p.id));
  G.A=new Set((last.teamA||[]).filter(x=>live.has(x)));
  G.B=new Set((last.teamB||[]).filter(x=>live.has(x)));
  G.__sel.clear();
  haptic('light');paintGame();
  toast(`Copied last week's sides — ${G.A.size} v ${G.B.size}`);
}
/* Set the scoreline from the goals already entered. */
function pgScoreFromGoals(){
  const a=goalSum('A'), b=goalSum('B');
  if(!a&&!b){toast('Enter some scorers first');return}
  G.sa=a;G.sb=b;haptic('light');paintGame();
}
function pickComp(cid){G.compId=cid;if(!G.id)G.round=nextRound(cid);paintGame()}
function clearTeams(){G.A.clear();G.B.clear();G.fillA=[];G.fillB=[];G.goals={};paintGame()}
async function addFiller(sd){
  const n=await askText('Add a filler','Just for this game — they won\'t join the squad.','','Add');
  if(n===null)return;G['fill'+sd].push(n||'Filler');await 0;paintGame()}
function rmFiller(sd,i){G['fill'+sd].splice(i,1);paintGame()}
function autoSplit(){
  const ids=[...G.A,...G.B];
  if(ids.length<2){toast('Pick some players first');return}
  const st=statsAll(),r=ids.map(id=>({id,v:(st.find(x=>x.id===id)||{}).ppg||0})).sort((a,b)=>b.v-a.v);
  G.A.clear();G.B.clear();r.forEach((x,i)=>{(i%4===0||i%4===3?G.A:G.B).add(x.id)});paintGame();toast('Split by form')}
function setScore(sd,d){if(sd==='A')G.sa=Math.max(0,G.sa+d);else G.sb=Math.max(0,G.sb+d);paintGame()}
/* a team can't assist more than it scored — warn rather than block */
function assistSum(side){
  return [...(side==='A'?G.A:G.B)].reduce((t,pid)=>t+((G.assists||{})[pid]||0),0);
}
/* Only flags the impossible case — more assists than goals. Fewer is normal and
   never warned about, since plenty of goals are unassisted. */
function assistWarn(){
  const bad=[];
  if(assistSum('A')>G.sa)bad.push(`A has ${assistSum('A')} assists but only scored ${G.sa}`);
  if(assistSum('B')>G.sb)bad.push(`B has ${assistSum('B')} assists but only scored ${G.sb}`);
  return bad.length?`<div class="warn">⚠️ ${bad.join(' · ')}. Fix it or save anyway.</div>`:'';
}
function setAssist(pid,d){
  if(!G.assists)G.assists={};
  G.assists[pid]=Math.max(0,(G.assists[pid]||0)+d);
  if(!G.assists[pid])delete G.assists[pid];
  paintGame();
}
function setGoal(pid,d){G.goals[pid]=Math.max(0,(G.goals[pid]||0)+d);if(!G.goals[pid])delete G.goals[pid];
  const sd=G.A.has(pid)?'A':'B',t=goalSum(sd);
  if(sd==='A'&&t>G.sa)G.sa=t;if(sd==='B'&&t>G.sb)G.sb=t;paintGame()}
async function saveGame(){ track('game_completed');if(!requireAdmin())return;
  snapshot(G.id?'editing a game':'logging a game');
  const _lvlBefore=levelSnapshot();
  if(!teamCount('A')||!teamCount('B')){toast('Both teams need at least one player');return}
  const gA=goalSum('A'),gB=goalSum('B');
  if((gA>0||gB>0)&&(gA!==G.sa||gB!==G.sb)){
    const c=await askChoice('Goals don\'t match the score',
      `Score is ${G.sa}–${G.sb} but you've credited ${gA}–${gB} in goals.`,
      [{label:`Use the goals (${gA}–${gB})`,value:'goals'},{label:`Keep the score (${G.sa}–${G.sb})`,value:'score'}]);
    if(!c)return;
    if(c==='goals'){G.sa=gA;G.sb=gB}
  }
  const S=season();
  const posSnap={}; [...G.A,...G.B].forEach(pid=>{const pl=player(pid); if(pl)posSnap[pid]=pl.pos||'MID'});
  const g={id:G.id||uid(),compId:G.compId,created:G.id?(S.games.find(x=>x.id===G.id)?.created||Date.now()):Date.now(),
    date:G.date,round:(G.round||'').trim(),teamA:[...G.A],teamB:[...G.B],fillA:[...G.fillA],fillB:[...G.fillB],
    pos:posSnap,goals:{...G.goals},assists:{...(G.assists||{})},scoreA:G.sa,scoreB:G.sb,result:G.sa>G.sb?'A':G.sb>G.sa?'B':'D',
    venue:G.venue||'out'};
  S.lastVenue=g.venue;
  /* keep whatever weather was already fetched for this game */
  if(G.id){const old=S.games.find(x=>x.id===G.id); if(old&&old.wx)g.wx=old.wx}
  if(G.id)S.games[S.games.findIndex(x=>x.id===G.id)]=g;else S.games.push(g);
  await save();closeSheet();
  const i=allGames().findIndex(x=>x.id===g.id),ms=feed().filter(e=>e.i===i);
  render();
  recordOvr();
  try{await fplAfterGame()}catch(e){}
  try{ setTimeout(()=>wxBackfill(2),1200) }catch(e){}
  /* Wages, bet settlement, predictions and sponsor money all move real balances.
     They ran AFTER the save above, so none of it was ever written down — the
     payouts existed only until the next reload. Persist once they are done. */
  try{ payWages(); settleBets(); settlePreds();
    const sp=paySponsors();
    if(sp.length)setTimeout(()=>toast(`🤝 ${sp.map(x=>`${x.name} — ${usd(x.pay)} from ${x.n}`).join(' · ')}`),1400);
  }catch(e){}
  try{ await save() }catch(e){}
  const _ups=levelUps(_lvlBefore);
  logEntry(G.id?'edit':'add',`${G.id?'Edited':'Logged'} ${G.round||'a game'} \u2014 ${G.sa}\u2013${G.sb}`);
  if(_ups.length){ setTimeout(()=>celebrate(_ups),260); }
  else if(ms.length){const p=player(ms[0].pid);toast(`${ms[0].e} ${p?p.name:''} — ${ms[0].t}!`)}
  else toast(G.id?'Game saved':'Game logged');
  /* tell the group, but never the person who just did the saving */
  if(!G.id){
    const me=fplMine();
    pushSend(G.round?('⚽ Full time · '+G.round):'⚽ Full time',
      `${G.sa}\u2013${G.sb}. Ratings, points and prices are up.`,
      'result', {url:'/', except: me?me.pid:null});
  }}
async function deleteGame(){if(!requireAdmin())return;
  snapshot('deleting a game');if(!await askConfirm('Delete game?','This removes it and its stats permanently.','Delete',true))return;
  const S=season();S.games=S.games.filter(x=>x.id!==G.id);logEntry('delete',`Deleted ${G.round||'a game'}`);fplResync();await save();closeSheet();render();toast('Game deleted')}

  PE.num=PE.num||null;
  if(PE.id)Object.assign(player(PE.id),{name:n,pos:PE.pos,nation:PE.nation.trim(),club:PE.club,star:PE.star,ps:PE.ps,num:PE.num,avail:PE.avail,active:PE.active});
  else season().players.push({id:uid(),name:n,pos:PE.pos,nation:PE.nation.trim(),club:PE.club,star:PE.star,ps:PE.ps,num:PE.num,avail:PE.avail,active:true});
  logEntry(PE.id?'edit':'add',`${PE.id?'Edited':'Added'} player ${n}`);
  /* Wire the newcomer up BEFORE saving. syncManagers() runs inside fpl(), and
     previously nothing called it between pushing the player and saving — so
     their manager slot, private code and wallet were created locally but never
     written to the cloud, and nobody else ever saw them. */
  try{ joinSquad() }catch(e){}
  await save();closeSheet();render();toast(PE.id?'Saved':'Player added')}

/* Make sure every active player has a manager slot, a code, a wallet and a
   price. Safe to call any time — it only fills in what is missing. */
function joinSquad(){
  const f=fpl();                       /* this runs syncManagers() */
  const b=bets();
  season().players.filter(p=>p.active!==false).forEach(p=>{
    if(b.wallets[p.id]==null)b.wallets[p.id]=BET_RULES.start;
    if(f.prices[p.id]==null)f.prices[p.id]=basePrice(p.id);
  });
  return f.managers.length;
}

async function drawBracket(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  if(c.bracket&&!await askConfirm('Redraw bracket?','Existing results will be cleared.','Redraw',true))return;
  const sh=[...ids].sort(()=>Math.random()-.5);
  c.bracket=buildBracket(sh);await save();render();toast('⚔️ Bracket drawn')}
async function drawGroups(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  const n=await askChoice('How many groups?','',[{label:'2 groups',value:2},{label:'3 groups',value:3},{label:'4 groups',value:4}]);
  if(!n)return;
  const sh=[...ids].sort(()=>Math.random()-.5),gk='ABCDEFGH'.slice(0,n).split(''),gr={};
  gk.forEach(k=>gr[k]=[]);sh.forEach((id,i)=>gr[gk[i%n]].push(id));
  c.groups=gr;c.advance=2;
  c.fixtures=[];gk.forEach(k=>roundRobin(gr[k]).forEach(f=>c.fixtures.push({...f,g:k})));
  delete c.bracket;await save();render();toast(`🌍 ${n} groups drawn · ${c.fixtures.length} fixtures`)}
async function drawKOFromGroups(){if(!requireAdmin())return;
  const c=comp();if(!c.groups){toast('Draw the groups first');return}
  if(c.bracket&&!await askConfirm('Redraw knockout?','Existing knockout results will be cleared.','Redraw',true))return;
  const adv=c.advance||2,q=[];
  Object.keys(c.groups).sort().forEach(k=>groupTable(c,k).slice(0,adv).forEach((r,i)=>q.push({id:r.id,g:k,pos:i})));
  if(q.length<2){toast('Not enough qualified teams');return}
  const w=q.filter(x=>x.pos===0),r=q.filter(x=>x.pos>0).reverse();
  c.bracket=buildBracket([...w,...r].map(x=>x.id));await save();render();toast('⚔️ Knockout drawn')}

async function koResult(ri,mi){if(!requireAdmin())return;
  const c=comp(),m=c.bracket.rounds[ri][mi];
  if(!m.a||!m.b){toast('Waiting on earlier rounds');return}
  scoreSheet(teamName(c,m.a),teamName(c,m.b),m.done?m.sa:0,m.done?m.sb:0,true,async(sa,sb)=>{
    m.sa=sa;m.sb=sb;m.done=true;
    // clear downstream then advance
    for(let r=ri+1;r<c.bracket.rounds.length;r++)c.bracket.rounds[r].forEach(x=>{x.a=null;x.b=null;x.sa=null;x.sb=null;x.done=false;x.bye=false});
    for(let r=0;r<c.bracket.rounds.length-1;r++)c.bracket.rounds[r].forEach((x,i)=>{
      if(x.done&&x.sa!==null&&x.sb!==null&&x.sa!==x.sb)advance(c.bracket,r,i,x.sa>x.sb?x.a:x.b);
      else if(x.done&&x.bye)advance(c.bracket,r,i,x.a||x.b)});
    await save();closeSheet();render();
    const w=bracketWinner(c.bracket);
    toast(w?`🏆 ${teamName(c,w)} win the ${c.name}!`:'Result saved')})}

function scoreSheet(an,bn,sa,sb,noDraw,cb){
  window.__sc={sa,sb};
  openSheet('Enter result','<div id="scb"></div>','Save');
  const paint=()=>{const s=window.__sc;
    $('#scb').innerHTML=`<div class="grid g2" style="margin-top:6px">
      ${[['a',an,s.sa],['b',bn,s.sb]].map(([k,n,v])=>`<div class="card pad" style="text-align:center;margin:0">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>
        <div class="stepper"><button onclick="__scAdj('${k}',-1)">−</button><span class="sv">${v}</span>
          <button onclick="__scAdj('${k}',1)">+</button></div></div>`).join('')}</div>
      <div style="text-align:center;padding:16px 0 4px;font-size:15px;font-weight:600;color:var(--label2)">
        ${s.sa===s.sb?(noDraw?'⚠️ Knockout ties need a winner — decide on penalties':'Draw'):`${esc(s.sa>s.sb?an:bn)} win`}</div>`};
  window.__scAdj=(k,d)=>{const s=window.__sc;s[k==='a'?'sa':'sb']=Math.max(0,s[k==='a'?'sa':'sb']+d);paint()};
  window.__paint=paint;paint();
  $('#_sact').onclick=()=>{const s=window.__sc;
    if(noDraw&&s.sa===s.sb){toast('A knockout tie needs a winner');return}cb(s.sa,s.sb)}}

function exportWrapped(){ track('wrapped_shared');

   ${slide(`${eb('Final standings')}${h1('The table')}

   ${boot.length?slide(`${eb('Golden boot')}${h1(esc(boot[0].name)+' leads the line')}${bar(boot.map(m=>({n:m.name,v:m.G})),boot[0].G)}`):''}

/* ============ BOOT ============ */
/* The quick-add button only belongs on the screens where it does something:
   logging a game, or adding a player on the squad page. Everywhere else it was
   just floating over the content. */
const FAB_VIEWS=['home','league','squad'];
function paintFab(){
  const f=document.getElementById('fab'); if(!f)return;
  const show=FAB_VIEWS.includes(VIEW);
  f.classList.toggle('fab-off',!show);
  f.setAttribute('aria-hidden',show?'false':'true');
  f.title = VIEW==='squad' ? 'Add a player' : 'Log a game';
}
document.getElementById('fab').onclick=()=>{if(!requireAdmin())return; if(VIEW==='squad')editPlayer(null);else newGame()};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#sideAdmin').onclick=()=>go('admin');
$('#drawerBg').onclick=closeDrawer;
$('#drawerClose').onclick=closeDrawer;
if(wideScreen())openDrawer();   // roomy screens start with the menu showing
$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const m={'1':'home','2':'league','3':'fixtures','4':'squad','5':'tactics','6':'career','7':'stats','8':'compare','9':'comps','0':'admin'};
  if(m[e.key])go(m[e.key]);
  if(e.key==='n'&&isAdmin())newGame();
  if(e.key==='Escape'){closeSheet();closeViewer();closeDrawer();$('#abg').classList.remove('open')}});
(async function(){
  await loadDB();
  if(supa){ await initSupa(); } else { applyAdminClass(); }
  loadLocalBoard();
  /* Prices are fully derived from the games, so recompute once at boot. This
     self-heals any map saved under older rules and guarantees the stocks chart
     and the market always agree. */
  /* Always rebuild, even with no games yet — otherwise a price map saved under
     the old flat-£10m rules survives untouched until the first game is logged. */
  try{ if(season())recalcPrices(); }catch(e){}
  /* Catch-up settlement. Bets placed before the save-ordering fix are still
     sitting open even though their gameweek has been played, because the
     payout was only ever made in memory. Settle anything whose week is done,
     on every load, so nothing can get stranded again. */
  /* Wages are paid per gameweek and guarded by bets().paid, so calling this is
     safe and self-healing: anything owed from a week that was logged before the
     save-ordering fix lands now. */
  try{ await loadStrava(); stravaAfterRedirect(); }catch(e){}
  try{ setTimeout(()=>wxBackfill(8),2500) }catch(e){}
  try{ refreshPushState(); }catch(e){}
  try{
    if(playedGws().length){
      const owed=payWages();
      if(owed){
        if(!CLOUD_FAIL)save();
        setTimeout(()=>toast(`💰 ${usd(owed)} in back wages paid out`),1600);
      }
    }
  }catch(e){}
  try{
    const b=season()&&season().bets;
    if(b&&(b.open||[]).length&&playedGws().length){
      const stuck=b.open.filter(x=>playedGws().includes(x.gw)).length;
      if(stuck){
        settleBets(); settlePreds();
        if(!CLOUD_FAIL)save();
        setTimeout(()=>toast(`Settled ${stuck} bet${stuck===1?'':'s'} from an earlier gameweek`),1200);
      }
    }
  }catch(e){}
  /* anyone added before this fix has a player record but no manager slot —
     create it and persist, so their code shows up for everybody */
  try{
    const f=season()&&season().fpl;
    if(f){
      const missing=season().players.filter(p=>p.active!==false&&!f.managers.some(m=>m.pid===p.id)).length;
      joinSquad();
      if(missing&&!CLOUD_FAIL)save();
    }
  }catch(e){}
  /* one-off: move everyone onto the bespoke price list */
  try{ migratePrices().then(n=>{ if(n){ render();
        toast(`⚠️ ${n} team${n===1?' was':'s were'} auto-filled after the price update`) } }) }catch(e){}
  try{fplAutoLogin()}catch(e){}
  /* also handle a personal link tapped while the app is already open (a hash
     change alone does not reload the page) */
  window.addEventListener('hashchange',()=>{try{fplAutoLogin();render()}catch(e){}});
  initHaptics();
  buildNav();go('home');initGestures();
  applySeasonTint();
  /* the splash covers the first paint, then fades */
  setTimeout(()=>{
    const sp=$('#splash'); if(sp)sp.classList.add('gone');
    document.documentElement.classList.remove('booting');
    syncThemeColour();
  },420);
  setTimeout(()=>{const sp=$('#splash'); if(sp)sp.remove(); syncThemeColour()},900);
  if(!supaConfigured && Store.tier()==='memory')setTimeout(()=>toast('⚠️ This browser blocks saving — back up before closing'),1400);
  if(supaConfigured && !supa)setTimeout(()=>toast('⚠️ Could not reach the shared database — check your setup'),1400);
})();
