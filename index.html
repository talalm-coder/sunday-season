/* ================= MENU BUTTON + NAV SHEET ================= */
.menubtn{display:flex;align-items:center;gap:7px;background:var(--fill);border:none;border-radius:10px;
  padding:8px 12px;font-size:14px;font-weight:600;color:var(--label);cursor:pointer}
.menubtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.navtile{display:flex;align-items:center;gap:11px;padding:14px 13px;border-radius:14px;background:var(--card);
  box-shadow:var(--shadow);border:2px solid transparent;font-size:15px;font-weight:600;color:var(--label);cursor:pointer;text-align:left}
.navtile.on{border-color:var(--tint);background:var(--tint-soft);color:var(--tint)}
.navtile svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 21px}

/* ================= PRESS / SPRING ================= */
@media(hover:none){
  .row.tap:active,.card.tap:active,.navtile:active,.formcard:active,.psopt:active,.pgchip:active,
  .bench:active,.tile:active,.leadcard:active{transform:scale(.972);transition:transform .08s}
}
.row.tap,.card.tap,.navtile,.formcard,.psopt,.pgchip,.bench,.tile{transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s}
.btn:active{transform:scale(.965)}
.btn{transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .15s,opacity .15s}
@keyframes sheetSpring{0%{transform:translateY(100%)}70%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes cardPop{0%{opacity:0;transform:scale(.94) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.pop{animation:cardPop .34s cubic-bezier(.34,1.32,.5,1) both}

/* ================= CLUB PICKER ================= */
.clubgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:270px;overflow-y:auto;padding:2px;
  -webkit-overflow-scrolling:touch}
@media(min-width:641px){.clubgrid{grid-template-columns:1fr 1fr 1fr}}
.clubtile{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--card);
  border:2px solid transparent;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.clubtile.on{border-color:var(--tint);background:var(--tint-soft)}
.clubname{font-size:12.5px;font-weight:600;color:var(--label);line-height:1.2;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ================= CHEMISTRY GRID ================= */
.chemgrid td{padding:0;text-align:center}
.chemgrid .cg-h{font-size:10px;font-weight:800;color:var(--label3);padding:7px 3px;min-width:34px}
.chemgrid .cg-n{font-size:12px;font-weight:600;text-align:left;padding:6px 10px;white-space:nowrap;
  position:sticky;left:0;background:var(--card);z-index:2}
.chemgrid .cg-c{width:34px;height:34px;font-size:11px;font-weight:800;color:#0b0b0c;cursor:pointer}
.chemgrid .cg-e{width:34px;height:34px;color:var(--label3);font-size:11px;background:var(--fill)}
.chemgrid .cg-x{width:34px;height:34px;background:var(--fill2)}

/* ================= PLAYER OF THE MONTH ================= */
.potm{overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,#D4AF37 16%,var(--card)),var(--card))}
.potm-h{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--label3);padding:13px 15px 6px}
.potm-w{display:flex;align-items:center;gap:12px;padding:6px 15px 13px;cursor:pointer;position:relative}
.potm-medal{font-size:26px;flex:0 0 auto}
.potm-n{font-size:19px;font-weight:800;letter-spacing:-.02em}
.potm-s{font-size:13px;color:var(--label2);margin-top:2px}
.potm-t{flex:1;min-width:0}
.potm-r{display:flex;gap:14px;padding:0 15px 13px;font-size:12.5px;color:var(--label2);flex-wrap:wrap}
.potm-r span{cursor:pointer}

/* ================= PULL TO REFRESH ================= */
.ptr{position:fixed;top:-46px;left:50%;margin-left:-19px;width:38px;height:38px;border-radius:50%;
  background:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
  z-index:60;opacity:0;pointer-events:none}
.ptr-a{width:19px;height:19px;stroke:var(--label3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .18s ease,stroke .18s}
.ptr.armed .ptr-a{stroke:var(--tint)}
.ptr-s{position:absolute;width:19px;height:19px;border-radius:50%;
  border:2.2px solid var(--fill2);border-top-color:var(--tint);opacity:0}
.ptr.spin .ptr-a{opacity:0}
.ptr.spin .ptr-s{opacity:1;animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
@media(min-width:900px){.ptr{display:none}}

/* ---- spring-in for cards landing on the pitch ---- */
@keyframes springIn{
  0%{transform:scale(.4) translateY(14px);opacity:0}
  55%{transform:scale(1.12) translateY(-3px);opacity:1}
  75%{transform:scale(.96) translateY(1px)}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.sh{animation:springIn .46s cubic-bezier(.34,1.56,.64,1) backwards}
.sh:nth-child(1){animation-delay:.02s}
.sh:nth-child(2){animation-delay:.07s}
.sh:nth-child(3){animation-delay:.12s}
.sh:nth-child(4){animation-delay:.17s}
.sh:nth-child(5){animation-delay:.22s}
.sh-line:nth-child(2) .sh{animation-delay:.10s}
.sh-line:nth-child(3) .sh{animation-delay:.18s}
@media(prefers-reduced-motion:reduce){.sh{animation:none}}
/* the newest pick gets a little pop */
@keyframes popIn{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.sh-new .sh-top{animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
/* toggle switch used in Admin */
.sw{position:relative;display:inline-block;width:50px;height:30px;flex:0 0 50px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--fill2);border-radius:30px;transition:.25s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;
  border-radius:50%;transition:.25s cubic-bezier(.32,.72,0,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::before{transform:translateX(20px)}

/* ================= SHRINKING TITLE ================= */
.navbar{transition:box-shadow .2s,background .2s}
.navbar.shrunk{box-shadow:0 .5px 0 var(--sep)}
.nb-title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;
  letter-spacing:-.01em;color:var(--label);pointer-events:none;
  animation:nbIn .22s cubic-bezier(.32,.72,0,1) both}
@keyframes nbIn{from{opacity:0;transform:translateX(-50%) translateY(7px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.largetitle{transition:opacity .15s}
.main{will-change:transform}

/* nav menu list */
.navlist .row.navon{background:var(--tint-soft)}
.navlist .row.navon .r1{color:var(--tint);font-weight:700}
.navdot{width:8px;height:8px;border-radius:50%;background:var(--tint);flex:0 0 8px}

/* ---- home table: fits an iPhone without sideways scrolling ---- */
.hometbl{width:100%;table-layout:auto}
.hometbl td.nm{max-width:none}
.hometbl td.nm span span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%}
@media(max-width:820px){ .hometbl .opt2{display:none} }
@media(max-width:640px){
  .hometbl .opt{display:none}
  .hometbl tbody td{padding:11px 3px;font-size:14px}
  .hometbl thead td{padding:10px 3px;font-size:11px}
  .hometbl td.pos{padding-left:13px}
  .hometbl td.nm{padding-right:4px}
  .hometbl td.nm .av{display:none}          /* drop the crest so names never truncate */
  .hometbl td.c{width:26px}
  .hometbl td.pts{width:34px}
}
.lnk{background:none;border:none;color:var(--tint);font-weight:600;font-size:inherit;cursor:pointer;padding:0}

.avpill{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:2px 7px;
  border-radius:20px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);margin-left:6px;vertical-align:middle}
.avpill.big{font-size:12px;padding:5px 12px;margin:0;background:color-mix(in srgb,var(--ac) 22%,transparent)}

/* ================= HISTORY ================= */
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}
@media(min-width:641px){.recgrid{grid-template-columns:repeat(3,1fr)}}
.reccard{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.rec-i{font-size:22px;flex:0 0 auto}
.rec-t{min-width:0}
.rec-l{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--label3);text-transform:uppercase}
.rec-v{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.rec-s{font-size:11.5px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fame{overflow:hidden}
.fame.live{border:1.5px solid var(--tint)}
.fame-h{padding:13px 15px 8px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.fame-now{font-size:9.5px;font-weight:900;background:var(--tint);color:#fff;padding:2px 7px;border-radius:20px}
.fame-b{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:0 15px 12px}
@media(max-width:380px){.fame-b{grid-template-columns:1fr}}
.fame-w{display:flex;gap:9px;align-items:flex-start}
.fame-tr{font-size:24px}
.fame-lbl{font-size:10px;font-weight:700;color:var(--label3);text-transform:uppercase;letter-spacing:.04em}
.fame-nm{font-size:15px;font-weight:700;margin-top:1px}
.fame-sub{font-size:11.5px;color:var(--label2)}
.fame-f{padding:9px 15px;border-top:.5px solid var(--sep);font-size:12px;color:var(--label2);display:flex;justify-content:space-between;gap:8px}
.rival{overflow:hidden}
.rv-h{padding:11px 15px 4px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--label3);text-transform:uppercase}
.rv-b{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:2px 15px 10px}
.rv-p{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.rv-p span{font-size:13px;font-weight:600;text-align:center}
.rv-s{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:800;position:relative}
.rv-s span{color:var(--label3);font-size:18px}
.rv-d{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--label3);font-weight:600;white-space:nowrap}
.rv-bar{height:6px;background:var(--blue);margin:8px 15px 0;border-radius:4px;overflow:hidden}
.rv-bar i{display:block;height:100%;background:var(--tint)}
.rv-f{padding:8px 15px 12px;font-size:12px;color:var(--label2)}

.pbgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:400px){.pbgrid{grid-template-columns:1fr 1fr}}
.pbcard{background:var(--card);border-radius:13px;padding:12px 9px;box-shadow:var(--shadow);text-align:center}
.pb-e{font-size:20px}
.pb-l{font-size:10px;font-weight:700;color:var(--label3);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;line-height:1.25}
.pb-v{font-size:15px;font-weight:800;margin-top:3px}
.seasonline{font-size:15.5px;line-height:1.55;color:var(--label)}

/* ================= HALL OF FAME — vintage / gold ================= */
.hof{--gold:#C9A227;--gold-lt:#E8CE7A;--gold-dk:#8A6D14;--sepia:#F3EBDA;--ink:#3B2F16}
.hof .largetitle{
  background:linear-gradient(140deg,#E8CE7A,#C9A227 45%,#8A6D14);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.02em}
.hof .subtitle{color:color-mix(in srgb,var(--gold) 70%,var(--label2))}
.hof .sechead{color:var(--gold-dk)}
[data-theme="dark"] .hof .sechead{color:var(--gold-lt)}
.hof .seg{background:color-mix(in srgb,var(--gold) 12%,var(--fill))}
.hof .seg button.on{background:linear-gradient(150deg,#E8CE7A,#C9A227);color:#3B2F16}
/* aged parchment cards */
.hof .card,.hof .reccard{
  background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 7%,var(--card)),var(--card));
  border:1px solid color-mix(in srgb,var(--gold) 26%,transparent)}
[data-theme="dark"] .hof .card,[data-theme="dark"] .hof .reccard{
  background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 11%,var(--card)),var(--card))}
.hof .rec-l{color:color-mix(in srgb,var(--gold-dk) 75%,var(--label3))}
[data-theme="dark"] .hof .rec-l{color:color-mix(in srgb,var(--gold-lt) 60%,var(--label3))}
.hof .rec-v{background:linear-gradient(140deg,#E8CE7A,#C9A227 55%,#8A6D14);
  -webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="dark"] .hof .rec-v{background:linear-gradient(140deg,#F5E2A0,#D8B441);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hof .rec-i{filter:sepia(.45) saturate(1.3)}
/* champions plaques */
.hof .fame{border:1.5px solid color-mix(in srgb,var(--gold) 40%,transparent);
  box-shadow:0 4px 18px color-mix(in srgb,var(--gold) 16%,transparent)}
.hof .fame.live{border-color:var(--gold)}
.hof .fame-h{border-bottom:1px solid color-mix(in srgb,var(--gold) 22%,transparent);
  letter-spacing:.01em}
.hof .fame-now{background:linear-gradient(150deg,#E8CE7A,#C9A227);color:#3B2F16}
.hof .fame-nm{background:linear-gradient(140deg,#B98F1E,#8A6D14);
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
[data-theme="dark"] .hof .fame-nm{background:linear-gradient(140deg,#F5E2A0,#D8B441);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hof .fame-tr{filter:drop-shadow(0 2px 4px rgba(201,162,39,.4))}
.hof .fame-f{border-top:1px solid color-mix(in srgb,var(--gold) 18%,transparent)}
/* laurel divider under the title */
.hof .wrap::before{content:"⸻  ⚜  ⸻";display:block;text-align:center;color:var(--gold);
  opacity:.55;font-size:13px;letter-spacing:.3em;margin:0 0 14px}
/* rivalry plaques */
.hof .rival{border:1px solid color-mix(in srgb,var(--gold) 26%,transparent)}
.hof .rv-h{color:var(--gold-dk);letter-spacing:.09em}
[data-theme="dark"] .hof .rv-h{color:var(--gold-lt)}
.hof .rv-bar{background:color-mix(in srgb,var(--gold-dk) 30%,var(--fill2))}
.hof .rv-bar i{background:linear-gradient(90deg,#E8CE7A,#C9A227)}
.hof .posn{background:linear-gradient(150deg,#E8CE7A,#C9A227)!important;color:#3B2F16!important}
.hof .bar i{background:linear-gradient(90deg,#E8CE7A,#C9A227)}
.hof .lnk{color:var(--gold-dk);font-weight:700}
[data-theme="dark"] .hof .lnk{color:var(--gold-lt)}

.potsleg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.potsleg span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--label2);cursor:pointer}
.potsleg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.potsleg b{color:var(--label);font-weight:700}
.report{font-size:14.5px;line-height:1.55;color:var(--label2);font-style:italic}

.cloudwarn{display:flex;gap:11px;align-items:flex-start;background:color-mix(in srgb,var(--red) 12%,var(--card));
  border:1.5px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:15px;padding:14px;margin-bottom:14px}
.cw-i{font-size:22px;flex:0 0 auto}
.cw-t{flex:1;min-width:0;font-size:13px;line-height:1.45;color:var(--label2)}
.cw-t b{display:block;font-size:15px;color:var(--red);margin-bottom:3px}
.cw-b{flex:0 0 auto;background:var(--red);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}

.cw-b2{margin-top:9px;background:var(--tint);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer}

/* ================= MONITORING (Datadog-style) ================= */
.monwrap{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);
  border:1px solid var(--sep)}
.mon-head{display:flex;align-items:center;gap:12px;padding:15px;color:#fff}
.mon-head.ok{background:linear-gradient(135deg,#1E8E4E,#146B39)}
.mon-head.warn{background:linear-gradient(135deg,#D98A00,#A76A00)}
.mon-head.crit{background:linear-gradient(135deg,#D0342C,#9B241E)}
.mon-pulse{position:relative;width:14px;height:14px;flex:0 0 14px}
.mon-h-t{flex:1;min-width:0}
.mon-h-1{font-size:15px;font-weight:800;letter-spacing:.04em}
.mon-h-2{font-size:12px;opacity:.85;margin-top:1px}
.mon-refresh{background:rgba(255,255,255,.18);border:none;color:#fff;width:32px;height:32px;
  border-radius:9px;font-size:16px;cursor:pointer;flex:0 0 32px}
.mon-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;display:block;position:relative}
.mon-dot.ok{background:#30D158}.mon-dot.warn{background:#FF9F0A}
.mon-dot.crit{background:#FF453A}.mon-dot.info{background:#8E8E93}
.mon-head .mon-dot{background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:monpulse 2s infinite}
@keyframes monpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 11px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.mon-uptime{padding:13px 15px;border-bottom:1px solid var(--sep)}
.mon-u-l{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--label3);margin-bottom:8px}
.mon-u-l span{color:var(--label2);letter-spacing:0;text-transform:none;font-weight:600}
.mon-bars{display:flex;gap:2px;height:26px;align-items:stretch}
.mon-bars i{flex:1;border-radius:2px;min-width:3px}
.mon-bars i.ok{background:#30D158}.mon-bars i.bad{background:#FF453A}
.mon-bars i.none{background:var(--fill2)}
.mon-list{padding:2px 0}
.mon-row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--sep)}
.mon-row:last-child{border-bottom:none}
.mon-r-t{flex:1;min-width:0}
.mon-r-1{font-size:14px;font-weight:700}
.mon-r-2{font-size:11.5px;color:var(--label2);margin-top:1px;line-height:1.35}
.mon-r-v{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.mon-r-v.ok{background:color-mix(in srgb,#30D158 16%,transparent);color:#1E8E4E}
.mon-r-v.warn{background:color-mix(in srgb,#FF9F0A 18%,transparent);color:#B36F00}
.mon-r-v.crit{background:color-mix(in srgb,#FF453A 16%,transparent);color:#C22B22}
.mon-r-v.info{background:var(--fill2);color:var(--label2)}
[data-theme="dark"] .mon-r-v.ok{color:#4ADE80}
[data-theme="dark"] .mon-r-v.warn{color:#FBBF24}
[data-theme="dark"] .mon-r-v.crit{color:#FF6B6B}
.mon-metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--sep)}
@media(max-width:520px){.mon-metrics{grid-template-columns:1fr 1fr}}
.mon-m{padding:11px 10px;text-align:center;border-right:1px solid var(--sep)}
.mon-m:last-child{border-right:none}
@media(max-width:520px){.mon-m:nth-child(2){border-right:none}.mon-m:nth-child(-n+2){border-bottom:1px solid var(--sep)}}
.mon-m-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label3)}
.mon-m-v{font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.mon-m-s{font-size:10.5px;color:var(--label3);margin-top:1px}

@media(min-width:641px){.filterbar .fsel{flex:1 1 calc(33.333% - 6px)}}

/* ================= OVR BADGE ================= */
.ovr{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:var(--os);height:var(--os);border-radius:9px;flex:0 0 var(--os)}
.ovr b{font-size:calc(var(--os)*.42);font-weight:900;letter-spacing:-.03em;line-height:1}
.ovr.gold{background:linear-gradient(150deg,#F3D77E,#C9A227);color:#4A3A08}
.ovr.rare{background:linear-gradient(150deg,#FFE9A8,#B8860B 60%,#7A5A0C);color:#3B2D04;
  box-shadow:0 2px 8px rgba(184,134,11,.45)}
.ovr.ballon{background:linear-gradient(150deg,#FFF6D8,#F4C048 40%,#8A6D14);color:#3B2D04;
  box-shadow:0 0 0 2px rgba(255,246,216,.85),0 3px 12px rgba(244,192,72,.6)}
.ovr.ballon::after{content:"★";position:absolute;top:-6px;right:-5px;font-size:11px;color:#F4C048;
  text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ovr-d{position:absolute;bottom:-7px;right:-7px;font-size:9px;font-weight:900;font-style:normal;
  padding:1px 4px;border-radius:20px;line-height:1.35}
.ovr-d.up{background:#30D158;color:#06340f}
.ovr-d.dn{background:#FF453A;color:#3a0603}

/* ================= SUNDAY FPL ================= */
.fpl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border-radius:15px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px}
.fpl-tn{font-size:18px;font-weight:800;letter-spacing:-.02em}
.fpl-mn{font-size:12.5px;color:var(--label2)}
.fpl-bud{text-align:right}
.fpl-bud b{display:block;font-size:19px;font-weight:800;color:var(--tint)}
.fpl-bud span{font-size:10.5px;color:var(--label3);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.fpl-pitch{position:relative;border-radius:16px;overflow:hidden;padding:14px 8px;
  background:linear-gradient(170deg,#2E9E5B,#1F7A44);box-shadow:var(--shadow)}
.fpl-pitch .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fpl-rows{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.fpl-slot{display:flex;flex-direction:column;align-items:center;gap:5px}
.fpl-card{width:104px;background:linear-gradient(160deg,#F3D77E,#C9A227);border-radius:13px;
  padding:9px 6px 7px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;position:relative}
.fpl-card.cap{box-shadow:0 0 0 2.5px #fff,0 4px 14px rgba(0,0,0,.35)}
.fpl-card.empty{background:rgba(255,255,255,.16);border:2px dashed rgba(255,255,255,.5)}
.fpl-crest{display:flex;justify-content:center;margin-bottom:4px}
.fpl-nm{font-size:12.5px;font-weight:800;color:#3B2D04;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpl-card.empty .fpl-nm{color:#fff}
.fpl-plus{font-size:30px;font-weight:300;color:#fff;line-height:1.1}
.fpl-meta{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#5A4708;margin-top:3px;padding:0 2px}
.fpl-capbadge{position:absolute;top:-6px;left:-6px;width:21px;height:21px;border-radius:50%;
  background:#fff;color:#111;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.3)}
.fpl-capbtn{background:rgba(255,255,255,.9);border:none;border-radius:20px;padding:4px 11px;
  font-size:10.5px;font-weight:800;color:#1F7A44;cursor:pointer}
.fpl-capbtn.on{background:#111;color:#fff}
.fpl-owned{font-size:9px;font-weight:900;background:var(--tint);color:#fff;padding:2px 6px;border-radius:20px;margin-left:5px}
.mini-bars{display:flex;gap:4px;margin-top:6px}
.mini-bars span{flex:1;height:4px;border-radius:3px;background:var(--fill2);overflow:hidden}
.mini-bars i{display:block;height:100%;border-radius:3px}
.ticker{display:flex;gap:10px;overflow-x:auto;padding:9px 12px;margin-bottom:10px;
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.ticker span{font-size:12px;font-weight:700;white-space:nowrap}
.ticker .up{color:var(--green)} .ticker .dn{color:var(--red)}

.fpl-card.fresh{box-shadow:0 0 0 2.5px var(--tint),0 4px 14px rgba(0,0,0,.3)}
.fpl-new{position:absolute;top:-6px;right:-6px;font-size:8.5px;font-weight:900;background:var(--tint);
  color:#fff;padding:2px 6px;border-radius:20px}
.fpl-hint{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8)}
.fpl-todo{margin-top:12px;background:color-mix(in srgb,var(--orange) 12%,var(--card));
  border:1px solid color-mix(in srgb,var(--orange) 35%,transparent);border-radius:13px;padding:11px 13px}
.fpl-todo-i{font-size:13.5px;font-weight:600;color:var(--label);padding:3px 0}
.fpl-confirm{margin-top:12px;background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--shadow);
  border:1.5px solid var(--tint);position:sticky;bottom:14px;z-index:5}
.fpl-c-t{font-size:13.5px;font-weight:700;margin-bottom:9px;text-align:center;color:var(--tint)}
.fpl-saved{margin-top:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--green);
  background:color-mix(in srgb,var(--green) 12%,transparent);border-radius:12px;padding:11px}
.chip-state{font-size:9.5px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:20px;
  background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);flex:0 0 auto}
.chip-state.used{background:var(--fill2);color:var(--label3)}

/* ================= MATCH CENTRE ================= */
.mc-head{border-radius:18px;padding:18px 15px;text-align:center;margin-bottom:6px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 16%,var(--card)),var(--card));
  box-shadow:var(--shadow);border:1px solid var(--sep)}
.mc-comp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--label3)}
.mc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 8px}
.mc-t{font-size:13.5px;font-weight:700;color:var(--label2)}
.mc-t.w{color:var(--label)}
.mc-n{font-size:40px;font-weight:900;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.mc-n span{font-size:22px;color:var(--label3);font-weight:400}
.mc-date{font-size:12.5px;color:var(--label2)}
.mc-res{font-size:12px;font-weight:700;color:var(--tint);margin-top:3px}
.mc-teams{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mc-col{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mc-h{padding:9px 11px;font-size:12.5px;font-weight:800;color:#fff}
.mc-h.a{background:var(--tint)} .mc-h.b{background:var(--blue)}
.mc-side{padding:6px}
.mc-p{display:flex;align-items:center;gap:7px;padding:6px 5px;font-size:13px;cursor:pointer;border-radius:9px}
.mc-p span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-p b{font-size:11px}
.mc-p.guest{opacity:.7;cursor:default}
.mc-g{width:26px;height:26px;border-radius:50%;background:var(--fill2);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
/* ================= TEAM OF THE WEEK ================= */
.totw{position:relative;border-radius:16px;overflow:hidden;padding:14px 8px;
  background:linear-gradient(170deg,#2E9E5B,#1F7A44);box-shadow:var(--shadow)}
.totw .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.totw-rows{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.totw-row{display:flex;justify-content:center;gap:16px}
.totw-p{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-width:60px}
.totw-n{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
  max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.totw-pts{font-size:10.5px;font-weight:900;background:rgba(255,255,255,.92);color:#1F7A44;
  padding:1px 7px;border-radius:20px}
.totw-p.star .totw-pts{background:linear-gradient(150deg,#F5D76E,#C9A227);color:#3B2D04}
.totw-star{position:absolute;top:-8px;right:2px;font-size:14px;color:#F4C048;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ================= FPL RULES ================= */
.fr-steps{display:flex;flex-direction:column;gap:13px}
.fr-s{display:flex;gap:11px;font-size:14px;line-height:1.5;color:var(--label2)}
.fr-s b{color:var(--label)}
.fr-n{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:var(--tint);color:#fff;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fr-g{display:flex;flex-direction:column}
.fr-r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;color:var(--label2)}
.fr-r+.fr-r{border-top:.5px solid var(--sep)}
.fr-r b{color:var(--tint);font-weight:800;font-variant-numeric:tabular-nums}
/* ================= LEVEL LADDER ================= */
.ladder{overflow:hidden}
.lad-top{padding:14px 15px 10px;border-bottom:.5px solid var(--sep)}
.lad-t{font-size:15px;font-weight:700}
.lad-s{font-size:12.5px;color:var(--label2);margin-top:2px}
.lad-list{max-height:none}
.lad-r{display:flex;align-items:center;gap:11px;padding:9px 15px;border-bottom:.5px solid var(--sep)}
.lad-r.gold{background:color-mix(in srgb,#C9A227 12%,transparent)}
.lad-b{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--fill2);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.lad-r.gold .lad-b{background:linear-gradient(150deg,#F5D76E,#C9A227)}
.lad-i{flex:1;min-width:0}
.lad-n{font-size:14.5px;font-weight:700}
.lad-x{font-size:11.5px;color:var(--label3)}
.lad-c{font-size:11.5px;font-weight:700;color:var(--tint);white-space:nowrap}

.qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:14px}
.qrbox svg{display:block;border-radius:6px}

.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--fill2);display:block}
.pips i.on{background:var(--green)}

.codebtn{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;font-weight:700;
  background:var(--fill);border:none;border-radius:9px;padding:7px 10px;color:var(--tint);cursor:pointer;flex:0 0 auto}
.codebtn:active{background:var(--tint);color:#fff}

.fpl-line{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.fpl-rows .fpl-slot{min-width:0}
.fpl-card{width:88px;padding:8px 5px 6px}
.fpl-card .fpl-nm{font-size:11.5px}
.fpl-meta{font-size:9.5px}
@media(max-width:400px){.fpl-card{width:74px}.fpl-line{gap:6px}}
.fpl-capbtn{padding:3px 8px;font-size:9.5px}

/* ================= FPL — real-FPL styling ================= */
.fh{border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);
  background:linear-gradient(135deg,#37003C 0%,#2B0030 55%,#1E0022 100%)}
.fh-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px 12px}
.fh-tn{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.15}
.fh-mn{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:2px}
.fh-gw{text-align:center;background:#00FF87;border-radius:13px;padding:7px 14px;min-width:74px}
.fh-gw b{display:block;font-size:24px;font-weight:900;color:#37003C;line-height:1;letter-spacing:-.03em}
.fh-gw span{font-size:9.5px;font-weight:800;color:#37003C;opacity:.75;letter-spacing:.06em}
.fh-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.14)}
.fh-stats>div{padding:9px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
.fh-stats>div:last-child{border-right:none}
.fh-stats b{display:block;font-size:14.5px;font-weight:800;color:#fff}
.fh-stats b.neg{color:#FF5C5C}
.fh-stats span{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.05em;text-transform:uppercase}
/* pitch */
.fpitch{position:relative;border-radius:16px;overflow:hidden;padding:16px 8px 14px;
  background:linear-gradient(180deg,#0E9F52 0%,#0B8746 45%,#097038 100%);box-shadow:var(--shadow)}
.fp-lines{position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 34px,transparent 34px 68px),
    radial-gradient(circle at 50% 50%,transparent 52px,rgba(255,255,255,.22) 53px,transparent 54px);
  border:2px solid rgba(255,255,255,.22);border-radius:16px;margin:6px}
.fp-rows{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.sh-line{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sh{width:70px;display:flex;flex-direction:column;align-items:center}
.sh-top{position:relative;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;padding:0;
  background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,.28)}
.sh-top.empty{background:rgba(255,255,255,.16);border:2px dashed rgba(255,255,255,.55)}
.sh-plus{font-size:26px;color:#fff;font-weight:300;line-height:1}
.sh-new .sh-top{box-shadow:0 0 0 2.5px #00FF87,0 3px 8px rgba(0,0,0,.3)}
.sh-cap{position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:#37003C;
  color:#00FF87;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sh-badge{position:absolute;top:-5px;right:-8px;font-size:8px;font-weight:900;background:#00FF87;color:#37003C;
  padding:1px 5px;border-radius:20px}
.sh-name{width:100%;margin-top:5px;background:#fff;border-radius:5px 5px 0 0;
  font-size:10.5px;font-weight:700;color:#242424;text-align:center;padding:3px 2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-pts{width:100%;background:#37003C;color:#fff;border-radius:0 0 5px 5px;
  font-size:11px;font-weight:800;text-align:center;padding:2px}
.sh-pts.need{background:rgba(0,0,0,.3);font-size:9px;font-weight:700}
.sh-c{margin-top:5px;background:rgba(255,255,255,.9);border:none;border-radius:20px;
  padding:2px 9px;font-size:9.5px;font-weight:800;color:#37003C;cursor:pointer}
.sh-c.on{background:#00FF87;color:#37003C}
.fpl-chipbar{background:color-mix(in srgb,var(--purple) 16%,var(--card));border-radius:12px;
  padding:10px 13px;margin-bottom:10px;font-size:13.5px;color:var(--label)}
/* collapsible info */
.infonote{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
  border:1px solid var(--sep)}
.infonote-t{font-size:15px;font-weight:700;margin-bottom:4px}
.infonote-b{font-size:13.5px;color:var(--label2);line-height:1.5}
.infotag{background:var(--fill);border:none;border-radius:20px;padding:6px 13px;font-size:12.5px;
  font-weight:600;color:var(--label2);cursor:pointer;margin-bottom:12px}

/* keep the sticky confirm bar from covering the pitch, and get the FAB out of its way */
body.fpl-editing .main{padding-bottom:150px}
body.fpl-editing .fab{display:none}
.fpl-confirm{margin-top:14px}

/* ================= ADD TO HOME SCREEN ================= */
.a2hs{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border-radius:15px;padding:14px 38px 14px 14px;margin-bottom:14px;box-shadow:var(--shadow);
  border:1px solid var(--sep)}
.a2hs-i{font-size:26px;flex:0 0 auto;line-height:1.1}
.a2hs-t{font-size:13px;color:var(--label2);line-height:1.5}
.a2hs-t b{color:var(--label)}
.a2hs-t>b{display:block;font-size:15px;margin-bottom:2px}
.a2hs-s{display:inline-block;transform:translateY(1px);color:var(--tint);font-weight:700}
.a2hs-x{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--label3);
  font-size:15px;padding:5px 8px;cursor:pointer}
/* ================= LEVEL-UP CELEBRATION ================= */
.cele{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(7px);opacity:0;transition:opacity .28s;padding:24px}
.cele.in{opacity:1}
.cele.fade{opacity:0}
.cele-burst{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cele-burst i{position:absolute;top:-24px;border-radius:2px;opacity:.95;
  animation:confetti 2.6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes confetti{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.15}
}
.cele-card{position:relative;background:var(--card);border-radius:24px;padding:26px 22px 22px;
  text-align:center;max-width:320px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.4);
  transform:scale(.8);animation:celePop .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes celePop{to{transform:scale(1)}}
.cele-card.gold{background:linear-gradient(160deg,#FFF6D8,#F4C048 55%,#C9A227);color:#3B2D04}
.cele-lab{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--tint)}
.cele-card.gold .cele-lab{color:#7A5A0C}
.cele-em{font-size:60px;line-height:1.1;margin:6px 0 2px}
.cele-name{font-size:23px;font-weight:800;letter-spacing:-.02em}
.cele-title{font-size:16px;font-weight:700;color:var(--tint);margin-top:2px}
.cele-card.gold .cele-title{color:#6B4E08}
.cele-lv{font-size:13.5px;color:var(--label2);margin-top:8px}
.cele-card.gold .cele-lv{color:#5A4708}
.cele-lv b{font-size:17px;color:var(--label)}
.cele-card.gold .cele-lv b{color:#3B2D04}
.cele-max{margin-top:8px;font-size:12.5px;font-weight:700}
.cele-more{margin-top:8px;font-size:12.5px;color:var(--label3)}
@media(prefers-reduced-motion:reduce){
  .cele-burst{display:none}
  .cele-card{animation:none;transform:none}
}
kbd{display:inline-block;background:var(--fill2);border-radius:5px;padding:1px 6px;
  font:600 11.5px ui-monospace,SFMono-Regular,monospace;color:var(--label);border:1px solid var(--sep)}

.crosslink{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--fill);
  border:none;border-radius:22px;padding:6px 12px 6px 7px;font-size:13.5px;font-weight:600;
  color:var(--tint);cursor:pointer}
.crosslink svg{width:14px;height:14px;stroke:var(--tint);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.crosslink .av{width:22px;height:22px;font-size:9px}

/* ================= FPL MARKET ================= */
.mk-banner{display:flex;align-items:center;gap:8px;background:var(--tint-soft);border-radius:12px;
  padding:10px 12px;margin-bottom:10px;font-size:13.5px;color:var(--label)}
.mk-banner.swap{background:color-mix(in srgb,var(--orange) 15%,transparent)}
.mk-banner button{margin-left:auto;background:none;border:none;color:var(--tint);font-weight:700;
  font-size:13px;cursor:pointer;flex:0 0 auto}
.mk-bud{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.mk-bud>div{padding:10px 6px;text-align:center;border-right:1px solid var(--sep)}
.mk-bud>div:last-child{border-right:none}
.mk-bud b{display:block;font-size:17px;font-weight:800;color:var(--tint)}
.mk-bud span{font-size:9.5px;font-weight:700;color:var(--label3);letter-spacing:.06em;text-transform:uppercase}
.mk-list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mk-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:none;
  border-bottom:.5px solid var(--sep);cursor:pointer;text-align:left}
.mk-row:last-child{border-bottom:none}
.mk-row:active{background:var(--fill)}
.mk-row.own{background:color-mix(in srgb,var(--tint) 8%,transparent)}
.mk-row.poor{opacity:.42}
.mk-pos{flex:0 0 34px;font-size:9.5px;font-weight:900;letter-spacing:.04em;text-align:center;
  color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent);border-radius:6px;padding:3px 0}
.mk-kit{flex:0 0 auto;display:flex}
.mk-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mk-n{font-size:14.5px;font-weight:700;color:var(--label);display:flex;align-items:center;gap:6px}
.mk-in{font-style:normal;font-size:8.5px;font-weight:900;background:var(--tint);color:#fff;
  padding:2px 6px;border-radius:20px}
.mk-sub{font-size:11.5px;color:var(--label3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-r{flex:0 0 auto;text-align:right}
.mk-price{display:block;font-size:14.5px;font-weight:800;color:var(--label)}
.mk-pts{display:block;font-size:11px;color:var(--label3)}
/* remove-× on a pitch shirt */
.sh{position:relative}
.sh-x{position:absolute;top:-6px;right:2px;width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:800;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;z-index:2}
.sh-name.empty{background:rgba(255,255,255,.22);color:#fff}

.sh-c{white-space:nowrap;padding:3px 9px;font-size:9px}
.sh-top.empty.req{border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.24)}
.sh-line.flexline{opacity:.96}
.sh-line.flexline .sh-name.empty{background:rgba(255,255,255,.16);letter-spacing:.08em;font-size:9.5px}

.row.chip-armed{background:color-mix(in srgb,var(--orange) 10%,transparent)}
.chip-state.armed{background:color-mix(in srgb,var(--orange) 20%,transparent);color:#B36F00}
[data-theme="dark"] .chip-state.armed{color:#FBBF24}
.row.chip-blocked{opacity:.5}

/* ---- drawer proportions across phone sizes ---- */
.side{width:min(84vw,290px);flex-basis:min(84vw,290px)}
@media(min-width:900px){ .side{width:252px;flex-basis:252px} body.drawer .main{padding-left:252px} }
.side .brand{padding:6px 12px 14px;min-height:34px}
.side .brand span{font-size:clamp(17px,4.6vw,22px);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side nav{-webkit-overflow-scrolling:touch}
.side nav button{padding:11px 12px;font-size:clamp(14.5px,3.9vw,15.5px)}
/* very short screens (SE, mini in landscape): tighten so every item reaches */
@media(max-height:700px){
  .side .brand{padding-bottom:8px}
  .side nav button{padding:8.5px 12px}
}
/* the navbar itself must clear the notch too */
.navbar{padding-top:env(safe-area-inset-top,0px)}
.largetitle{padding-top:2px}

/* ---- responsive taps: kill the 300ms delay and give instant feedback ---- */
button,a,.row.tap,[onclick],select,input,label{touch-action:manipulation}
.row.tap,button:not(:disabled){-webkit-user-select:none;user-select:none}
.row.tap:active{background:var(--fill);transition:none}
.btn:active{transform:scale(.975);transition:transform .06s}
.side nav button:active{background:var(--fill2)}
/* stop the page behind a sheet from scrolling with it */
body.sheet-open{overflow:hidden;position:fixed;width:100%}
/* inputs: 16px stops iOS zooming in on focus */
input,select,textarea{font-size:16px}

/* ================= SKY SPORTS ================= */
:root{--skyRed:#E4002B;--skyNavy:#0B1B33;--skyYellow:#FFE500;--beinPurple:#6A1B9A}
.sky-h{font-size:12px;font-weight:900;letter-spacing:.16em;color:#fff;text-transform:uppercase;
  background:linear-gradient(90deg,var(--skyRed),#B00020);padding:8px 14px;border-radius:8px;
  margin:18px 0 12px;display:inline-block;box-shadow:0 3px 10px rgba(228,0,43,.32)}
.sky-h.mnf{background:linear-gradient(90deg,var(--beinPurple),#3F0D5C);box-shadow:0 3px 10px rgba(106,27,154,.32)}
/* deadline-day ticker */
.ddl{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;margin-bottom:14px;
  background:var(--skyYellow);box-shadow:var(--shadow)}
.ddl-tag{background:#111;color:var(--skyYellow);font-size:9.5px;font-weight:900;letter-spacing:.1em;
  padding:9px 10px;display:flex;align-items:center;flex:0 0 auto}
.ddl-track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.ddl-run{display:flex;gap:22px;white-space:nowrap;padding-left:14px;
  animation:ddlrun 26s linear infinite;will-change:transform}
.ddl-run span{font-size:12.5px;font-weight:700;color:#111}
.ddl-run b{font-weight:800}
.ddl-run .up{color:#0A7D2C}.ddl-run .dn{color:#B3001B}
@keyframes ddlrun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ddl-run{animation:none}}
/* man of the match */
.sky-motm{border-radius:16px;overflow:hidden;margin-bottom:6px;box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--skyNavy),#132B4D 60%,#0B1B33)}
.sky-motm-tag{background:var(--skyRed);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.14em;
  padding:6px 14px;display:flex;align-items:center;gap:6px}
.sky-motm-tag span{font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.78);text-transform:none;font-size:10px}
.sky-motm-b{display:flex;align-items:center;gap:13px;padding:14px}
.sky-motm-av{flex:0 0 auto}
.sky-motm-t{flex:1;min-width:0}
.sky-motm-t b{display:block;color:#fff;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sky-motm-t span{display:block;color:rgba(255,255,255,.72);font-size:13px;margin-top:2px}
.sky-motm-t i{display:block;color:rgba(255,255,255,.45);font-size:11.5px;font-style:normal;margin-top:3px}
.sky-motm-go{flex:0 0 auto;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12px;
  font-weight:700;padding:8px 11px;border-radius:20px;cursor:pointer}
/* award race cards */
.sky-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.sky-cap{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep);
  background:linear-gradient(90deg,color-mix(in srgb,var(--skyRed) 10%,transparent),transparent)}
.sky-em{font-size:23px;flex:0 0 auto}
.sky-cap b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.sky-cap i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.sky-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--sep);cursor:pointer}
.sky-row:last-child{border-bottom:none}
.sky-row:active{background:var(--fill)}
.sky-row.lead{background:color-mix(in srgb,var(--skyRed) 7%,transparent)}
.sky-pos{flex:0 0 20px;font-size:12px;font-weight:800;color:var(--label3);text-align:center}
.sky-row.lead .sky-pos{color:var(--skyRed)}
.sky-av{flex:0 0 auto;display:flex}
.sky-nm{flex:1;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sky-row.lead .sky-nm{font-weight:800}
.sky-val{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--label2)}
.sky-val.up{color:var(--green)}
/* MNF analysis */
.mnf-wrap{display:grid;gap:11px}
.mnf-card{background:linear-gradient(150deg,#241033,#160A22 70%);border-radius:14px;padding:14px;
  border:1px solid rgba(168,85,247,.22);box-shadow:var(--shadow)}
.mnf-t{font-size:10.5px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#C084FC}
.mnf-b{font-size:18px;font-weight:800;color:#fff;margin:5px 0 5px;letter-spacing:-.02em}
.mnf-d{font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.55}

/* ================= FPL STOCKS ================= */
.idx{background:linear-gradient(150deg,#141821,#0C0F16);border-radius:15px;overflow:hidden;
  margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.07)}
.idx-h{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.idx-h b{font-size:10px;font-weight:900;letter-spacing:.16em;color:rgba(255,255,255,.85)}
.idx-h span{font-size:10.5px;color:rgba(255,255,255,.4)}
.idx-b{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px}
.idx-big{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}
.idx-big span{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.42);
  letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.idx-mv{text-align:right;font-size:12px;font-weight:700;line-height:1.7}
.idx-mv .up{color:#30D158}.idx-mv .dn{color:#FF6B6B}.idx-mv .flat{color:rgba(255,255,255,.35)}
.watch{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.watch::-webkit-scrollbar{display:none}
.watch button{flex:0 0 auto;background:var(--fill);border:none;border-radius:20px;padding:7px 13px;
  font-size:12.5px;font-weight:600;color:var(--label2);cursor:pointer}
.watch button.on{background:var(--label);color:var(--bg)}
.stk-list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.stk{border-bottom:.5px solid var(--sep);cursor:pointer}
.stk:last-child{border-bottom:none}
.stk.open{background:var(--fill)}
.stk-row{display:flex;align-items:center;gap:10px;padding:10px 13px}
.stk-kit{flex:0 0 auto;display:flex}
.stk-nm{flex:1;min-width:0}
.stk-nm b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk-nm i{display:block;font-style:normal;font-size:11px;color:var(--label3);margin-top:1px}
.stk-spark{flex:0 0 auto;display:flex;align-items:center}
.stk-px{flex:0 0 auto;text-align:right;min-width:76px}
.stk-px b{display:block;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.stk-px i{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:2px;
  padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.stk-px .up{color:#fff;background:#30D158}
.stk-px .dn{color:#fff;background:#FF453A}
.stk-px .flat{color:var(--label3);background:var(--fill2)}
.stk-open{padding:4px 13px 14px;animation:in .22s ease}
.stk-rangebar{display:flex;gap:5px;margin-bottom:8px}
.stk-rangebar button{flex:1;background:var(--fill2);border:none;border-radius:8px;padding:6px 0;
  font-size:11.5px;font-weight:700;color:var(--label2);cursor:pointer}
.stk-rangebar button.on{background:var(--tint);color:#fff}
.stk-chart{width:100%;height:170px;display:block;overflow:visible}
.stk-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stk-facts>div{background:var(--card);border-radius:9px;padding:8px 4px;text-align:center}
.stk-facts b{display:block;font-size:13.5px;font-weight:800}
.stk-facts span{font-size:8.5px;font-weight:700;color:var(--label3);letter-spacing:.05em;text-transform:uppercase}
.stk-sub{background:var(--card);border-radius:10px;overflow:hidden}
.stk-sub-r{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:.5px solid var(--sep);font-size:13px}
.stk-sub-r:last-child{border-bottom:none}
.stk-sub-r span{color:var(--label2)}
.stk-sub-r b{font-weight:700;font-variant-numeric:tabular-nums}
.stk-sub-r b.up{color:var(--green)}.stk-sub-r b.dn{color:var(--red)}

/* ============ SKY / beIN — stronger broadcast look ============ */
.sky-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(115deg,#E4002B 0%,#B00020 42%,#0B1B33 42%,#0B1B33 100%);
  padding:18px 16px 20px;box-shadow:0 10px 26px rgba(11,27,51,.34)}
.sky-hero:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
.sky-hero-t{position:relative;font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.8)}
.sky-hero-b{position:relative;font-size:40px;font-weight:900;color:#fff;letter-spacing:-.035em;margin-top:5px;line-height:1}
.sky-hero-s{position:relative;font-size:12.5px;color:rgba(255,255,255,.66);margin-top:5px}
.sky-h{position:relative;padding-left:14px}
.sky-h:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:5px;height:70%;background:#fff;border-radius:3px}

/* ---- squad numbers ---- */
.shirt-pick{display:flex;align-items:center;gap:12px;width:100%;background:var(--fill);border:none;
  border-radius:12px;padding:11px 13px;margin-bottom:14px;cursor:pointer;text-align:left;font-size:14.5px;color:var(--label)}
.shirt-big{flex:0 0 44px;height:44px;border-radius:11px;background:var(--label);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.shirt-pick .chev{margin-left:auto;color:var(--label3);font-size:19px}
.shirtno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;
  border-radius:5px;background:var(--fill2);color:var(--label2);font-size:10.5px;font-weight:800;
  font-variant-numeric:tabular-nums;margin-right:6px}
.shirtno.onCard{background:rgba(255,255,255,.18);color:#fff;font-size:12px;height:22px;min-width:24px}
/* ---- ratings ---- */
.rpill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:21px;padding:0 6px;
  border-radius:6px;font-size:12px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.rpill.lg{min-width:46px;height:30px;font-size:16px;border-radius:8px}
.r-elite{background:#0A7D2C}.r-great{background:#30A14E}.r-good{background:#6E9E3E}
.r-ok{background:#A0863C}.r-poor{background:#B3401B}
/* ---- trophy cabinet ---- */
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.cab-i{border-radius:13px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid transparent}
.cab-i.gold{background:linear-gradient(160deg,#FFF6D8,#F4C048 60%,#C9A227);border-color:#E0B53C;color:#3B2D04}
.cab-i.silver{background:linear-gradient(160deg,#FBFCFD,#D6DCE4 60%,#AEB6C0);border-color:#C6CDD6;color:#2A3038}
.cab-i.bronze{background:linear-gradient(160deg,#F7E2CE,#D69A62 60%,#A9713F);border-color:#C98F55;color:#3A2311}
.cab-e{font-size:26px;line-height:1}
.cab-t{font-size:12.5px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
.cab-s{font-size:10.5px;opacity:.78;margin-top:2px;line-height:1.3}
/* ---- press room ---- */
.press{display:grid;gap:10px}
.press-c{display:flex;gap:11px;background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--shadow);
  border-left:4px solid var(--pc)}
.press-av{flex:0 0 40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--pc) 18%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.press-b{flex:1;min-width:0}
.press-n{font-size:13px;font-weight:800;color:var(--pc)}
.press-r{font-size:10.5px;color:var(--label3);margin-bottom:5px}
.press-q{font-size:14px;line-height:1.55;color:var(--label)}
/* ---- build-up ---- */
.bu{background:linear-gradient(140deg,#10233F,#0A1526);border-radius:15px;padding:14px;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.08)}
.bu-t{font-size:10px;font-weight:900;letter-spacing:.16em;color:#7FB3FF}
.bu-h{font-size:19px;font-weight:800;color:#fff;margin:4px 0 10px}
.bu-r{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.bu-r:first-of-type{border-top:none}
.bu-lab{flex:0 0 76px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em}
.bu-v{flex:1;font-size:14px;color:#fff;font-weight:600}
.bu-form{display:flex;gap:3px}
.bu-form i{width:15px;height:15px;border-radius:4px;font-style:normal;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:#fff}
.bu-form i.W{background:#30D158}.bu-form i.D{background:#8D9BB5}.bu-form i.L{background:#FF453A}
.totw-r{position:absolute;top:-4px;left:-4px;min-width:24px;height:17px;border-radius:5px;
  font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.totw-p{position:relative}

/* ================= AWARDS ================= */
.aw-hero{background:linear-gradient(135deg,#F4C048,#C9A227 55%,#8A6E13);border-radius:16px;padding:14px;
  margin-bottom:14px;box-shadow:0 10px 26px rgba(201,162,39,.3)}
.aw-hero-t{font-size:10px;font-weight:900;letter-spacing:.14em;color:rgba(59,45,4,.72)}
.aw-hero-b{display:flex;align-items:center;gap:13px;margin-top:9px}
.aw-hero-b b{display:block;font-size:22px;font-weight:900;color:#3B2D04;letter-spacing:-.02em}
.aw-hero-b span{display:block;font-size:13px;color:rgba(59,45,4,.75);margin-top:2px}
.aw-card{background:var(--card);border-radius:15px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.aw-cap{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.aw-em{font-size:23px}
.aw-cap b{display:block;font-size:15.5px;font-weight:800}
.aw-cap i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.aw-pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;padding:14px 10px 16px}
.aw-slot{text-align:center;cursor:pointer;padding:8px 4px;border-radius:12px}
.aw-slot:active{background:var(--fill)}
.aw-slot.empty{visibility:hidden}
.aw-slot .av{margin:0 auto}
.aw-medal{font-size:20px;margin-bottom:4px}
.aw-slot.p1{background:color-mix(in srgb,#F4C048 14%,transparent);padding-top:12px;padding-bottom:20px}
.aw-n{font-size:13px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aw-slot.p1 .aw-n{font-size:14.5px;font-weight:800}
.aw-v{font-size:11px;color:var(--label3);margin-top:2px}
/* ================= GAMES ================= */
.g-hero{background:linear-gradient(140deg,#1B2A4A,#0D1524);border-radius:16px;padding:22px 16px;text-align:center;
  box-shadow:var(--shadow)}
.g-hero.alt{background:linear-gradient(140deg,#2B1240,#160A22)}
.g-hero-e{font-size:44px}
.g-hero-t{font-size:25px;font-weight:900;color:#fff;letter-spacing:-.03em;margin-top:6px}
.g-hero-s{font-size:13.5px;color:rgba(255,255,255,.62);margin-top:6px;line-height:1.5}
.g-bar{height:5px;border-radius:5px;background:var(--fill2);overflow:hidden;margin-bottom:9px}
.g-bar-f{height:100%;background:var(--tint);transition:width .3s cubic-bezier(.32,.72,0,1)}
.g-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--label3);margin-bottom:14px}
.g-q{font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-.02em;margin-bottom:16px}
.g-opts{display:grid;gap:9px}
.g-opt{background:var(--card);border:1.5px solid var(--sep);border-radius:13px;padding:14px;font-size:15.5px;
  font-weight:600;color:var(--label);text-align:left;cursor:pointer;transition:transform .1s,background .18s}
.g-opt:active{transform:scale(.985)}
.g-opt.right{background:color-mix(in srgb,var(--green) 18%,var(--card));border-color:var(--green);color:var(--green)}
.g-opt.wrong{background:color-mix(in srgb,var(--red) 16%,var(--card));border-color:var(--red);color:var(--red)}
.g-opt.dim{opacity:.45}
.g-result{text-align:center;padding:26px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.g-res-e{font-size:52px}
.g-res-b{font-size:40px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.g-res-s{font-size:14.5px;color:var(--label2);margin-top:4px}
.g-clues{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:4px}
.g-clue{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:.5px solid var(--sep);
  animation:in .25s ease}
.g-clue:last-child{border-bottom:none}
.g-clue span{color:var(--label2);font-size:14px}
.g-clue b{font-size:15px;font-weight:800}

/* ---- Who Am I ---- */
.wai{background:linear-gradient(150deg,#2B1240,#160A22);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow)}
.wai-t{font-size:11px;font-weight:900;letter-spacing:.16em;color:#C084FC;text-transform:uppercase}
.wai-clubs{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.wai-c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;
  border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600}
.wai-hint{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.5}
.wai-in{width:100%;margin-top:12px;background:var(--card);border:1.5px solid var(--sep);border-radius:13px;
  padding:14px;font-size:17px;font-weight:600;color:var(--label)}
.wai-in:focus{border-color:var(--tint);outline:none}
.wai-res{margin-top:12px;border-radius:13px;padding:15px;text-align:center;font-size:16px}
.wai-res.ok{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.wai-res.no{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:-1px;z-index:9999;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;justify-content:center;
  /* the same wedge as the banner: 42% red, the rest navy, at the same angle */
  background:linear-gradient(115deg,#E4002B 0%,#B00020 42%,#0B1B33 42%,#0B1B33 100%);
  transition:opacity .38s ease,visibility .38s}
/* and the same fine diagonal weave over the top */
#splash:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px)}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
/* the wedge cuts through the middle of the screen, so the lockup sits above it
   where it reads against the navy rather than straddling the join */
.sp-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;
  transform:translateY(-9%)}
.sp-badge{animation:spPop .5s cubic-bezier(.34,1.56,.64,1);margin-bottom:22px}
@keyframes spPop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
/* type matched to the banner exactly */
.sp-t{font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.8);
  animation:spFade .5s .1s both}
.sp-name{color:#fff;font-size:40px;font-weight:900;letter-spacing:-.035em;line-height:1;
  margin-top:5px;animation:spFade .5s .16s both}
@keyframes spFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp-dots{display:flex;gap:6px;margin-top:26px}
.sp-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);
  animation:spD 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s}
.sp-dots i:nth-child(3){animation-delay:.3s}
@media(max-width:370px){.sp-name{font-size:34px}.sp-badge svg{width:92px;height:92px}}
@keyframes spD{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.sp-badge,.sp-dots i{animation:none}}
/* ================= SKELETON ================= */
.skel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.skel-r{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.skel-r:last-child{border-bottom:none}
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 37%,var(--fill) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:6px}
.sk.circle{border-radius:50%;flex:0 0 auto}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
/* ================= SEASON TINT ================= */
body[data-season="1"]{--seasonA:#0A84FF;--seasonB:#5E5CE6}
body[data-season="2"]{--seasonA:#FF9500;--seasonB:#FF375F}
body[data-season="3"]{--seasonA:#30D158;--seasonB:#00C7BE}
body[data-season="4"]{--seasonA:#BF5AF2;--seasonB:#FF2D55}
body[data-season="5"]{--seasonA:#FFD60A;--seasonB:#FF9F0A}
/* the season tint now shows as a thin rule under the title, so the heading
   itself stays solid black and the emoji renders properly */
.largetitle{color:var(--label)}
.subtitle{position:relative}

/* ================= BETTING (Sky Bet look) ================= */
.sb-banner{display:flex;align-items:center;justify-content:space-between;background:#0B1B33;
  border-radius:11px;padding:9px 13px;margin-bottom:12px}
.sb-banner span{font-size:9.5px;font-weight:900;letter-spacing:.13em;color:#7FB3FF}
.sb-banner b{font-size:14px;font-weight:800;color:#fff}
.sb-pick{margin-bottom:12px}
.sb-lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--label3);
  text-transform:uppercase;margin-bottom:7px}
.sb-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.sb-scroll::-webkit-scrollbar{display:none}
.sb-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--sep);
  border-radius:22px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600;color:var(--label);cursor:pointer}
.sb-chip.on{border-color:#1B7A3E;background:color-mix(in srgb,#1B7A3E 12%,var(--card))}
.sb-head{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,#0B1B33,#12294A);
  border-radius:13px;padding:12px 14px;margin-bottom:10px}
.sb-h-t b{display:flex;align-items:center;color:#fff;font-size:18px;font-weight:800}
.sb-h-t span{display:block;color:rgba(255,255,255,.6);font-size:12.5px;margin-top:2px}
.sb-list{background:var(--card);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.sb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:12px 13px;background:none;border:none;border-bottom:.5px solid var(--sep);cursor:pointer;text-align:left}
.sb-row:last-child{border-bottom:none}
.sb-row:active{background:var(--fill)}
.sb-row.on{background:color-mix(in srgb,#1B7A3E 10%,transparent)}
.sb-m b{display:block;font-size:14.5px;font-weight:700;color:var(--label)}
.sb-m i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}
.sb-o{flex:0 0 auto;min-width:58px;text-align:center;background:#1B7A3E;color:#fff;border-radius:8px;
  padding:8px 6px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sb-row.on .sb-o{background:#0F5C2C;box-shadow:0 0 0 2px rgba(27,122,62,.35)}
.sb-wallet{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
.sb-wallet>div{padding:11px 6px;text-align:center;border-right:1px solid var(--sep)}
.sb-wallet>div:last-child{border-right:none}
.sb-wallet b{display:block;font-size:18px;font-weight:800;color:var(--tint)}
.sb-wallet span{font-size:9.5px;font-weight:700;color:var(--label3);letter-spacing:.05em;text-transform:uppercase}
.sb-x{background:var(--fill);border:none;border-radius:18px;padding:6px 11px;font-size:12px;
  font-weight:700;color:var(--red);cursor:pointer;flex:0 0 auto}
.sb-res{font-size:13px;font-weight:800;padding:3px 9px;border-radius:7px}
.sb-res.won{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.sb-res.lost{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.sb-res.void{background:var(--fill2);color:var(--label3)}
/* the slip that slides up when you pick a price */
.sb-slip{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:.5px solid var(--sep);box-shadow:0 -10px 26px rgba(0,0,0,.2);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.32,.72,0,1)}
.sb-slip-t{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--label2)}
.sb-slip-t b{color:var(--label)}
.sb-slip-t span{margin-left:auto;background:#1B7A3E;color:#fff;border-radius:7px;padding:4px 9px;
  font-weight:800;font-variant-numeric:tabular-nums}
.sb-stake{display:flex;gap:7px;margin:10px 0}
.sb-stake button{flex:1;background:var(--fill);border:none;border-radius:9px;padding:9px 0;
  font-size:14px;font-weight:700;color:var(--label2);cursor:pointer}
.sb-stake button.on{background:var(--label);color:var(--bg)}
.sb-slip-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sb-slip-b div{font-size:13.5px;color:var(--label2)}
.sb-slip-b b{font-size:17px;color:var(--label);font-weight:800}
@media(min-width:900px){.sb-slip{left:auto;right:24px;bottom:24px;width:380px;border-radius:16px;border:1px solid var(--sep)}}

/* ---- chemistry matrix ---- */
.cm-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;font-size:11.5px;color:var(--label3)}
.cm-sw{width:15px;height:15px;border-radius:4px;display:inline-block}
.cm-sw.cm-none{background:var(--fill2)}
.cm-legend i{font-style:normal;margin-right:8px}
.cm-wrap{padding:4px}
table.cm{border-collapse:separate;border-spacing:2px}
table.cm .cg-h{min-width:38px;text-align:center;font-size:9.5px;font-weight:800;color:var(--label3);padding:4px 2px}
table.cm .cg-h .cg-av{display:block;margin:0 auto 2px}
table.cm .cg-n{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:4px 8px 4px 4px;
  white-space:nowrap;display:flex;align-items:center;gap:6px}
table.cm .cg-n b{font-size:12.5px;font-weight:700}
table.cm .cg-n i{font-style:normal;font-size:10px;color:var(--label3);margin-left:auto;
  background:var(--fill);border-radius:5px;padding:1px 5px}
table.cm .cg-c{width:38px;height:34px;text-align:center;font-size:11.5px;font-weight:800;color:#fff;
  border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
table.cm .cg-c.hot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
table.cm .cg-x{background:var(--fill2);border-radius:6px}
table.cm .cg-e{background:var(--fill);border-radius:6px}
table.cm .cg-corner{position:sticky;left:0;background:var(--card);z-index:2}

.sb-grp{font-size:10.5px;font-weight:900;letter-spacing:.11em;color:var(--label3);
  text-transform:uppercase;margin:14px 2px 7px}
.sb-pnl{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:13px;
  box-shadow:var(--shadow);overflow:hidden;margin:6px 0 4px}
.sb-pnl>div{padding:10px 4px;text-align:center;border-right:1px solid var(--sep)}
.sb-pnl>div:last-child{border-right:none}
.sb-pnl b{display:block;font-size:15.5px;font-weight:800}
.sb-pnl span{font-size:9px;font-weight:700;color:var(--label3);letter-spacing:.04em;text-transform:uppercase}
.sb-wallet b.up{color:var(--green)} .sb-wallet b.dn{color:var(--red)}

.sb-slip-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sb-slip-h b{font-size:15px}
.sb-slip-odds{background:#1B7A3E;color:#fff;border-radius:7px;padding:4px 10px;font-weight:800;
  font-variant-numeric:tabular-nums;font-size:15px}
.sb-clear{margin-left:auto;background:none;border:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer}
.sb-picks{max-height:132px;overflow-y:auto;margin-bottom:9px}
.sb-pk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:13px}
.sb-pk:last-child{border-bottom:none}
.sb-pk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label2)}
.sb-pk b{font-variant-numeric:tabular-nums}
.sb-pk button{background:none;border:none;color:var(--label3);font-size:14px;cursor:pointer;padding:0 2px}
.sb-tip{font-size:11.5px;color:var(--label3);text-align:center;margin-top:8px}
.sb-legs{display:flex;flex-direction:column;gap:2px;margin:3px 0 2px}
.sb-legs span{font-size:11.5px;color:var(--label3)}
.sb-legs i{font-style:normal;font-weight:700;color:var(--label2)}

.sb-signin{background:var(--card);border-radius:16px;padding:26px 18px;text-align:center;box-shadow:var(--shadow)}
.sb-si-e{font-size:42px}
.sb-si-t{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.sb-si-s{font-size:13.5px;color:var(--label2);margin-top:7px;line-height:1.55}
.sb-bust{background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 32%,transparent);
  border-radius:14px;padding:14px;margin:10px 0}
.sb-bust b{display:block;font-size:15.5px}
.sb-bust span{display:block;font-size:13px;color:var(--label2);margin-top:3px;line-height:1.5}

/* fill the full screen including the safe areas */
#splash{height:100svh;min-height:100%}
@supports (height:100dvh){ #splash{height:100dvh} }
.side{min-height:100svh}
@supports (height:100dvh){ .side{min-height:100dvh} }
/* the drawer and page should paint behind the home indicator, not stop short */
.main{min-height:100svh;background:var(--bg)}
@supports (height:100dvh){ .main{min-height:100dvh} }
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);
  background:var(--bg);z-index:1;pointer-events:none}
body.drawer::after{background:var(--card)}

/* ================= SHOP ================= */
.wal{display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(120deg,#10233F,#0A1526);border-radius:14px;padding:13px 15px;margin-bottom:6px}
.wal-l{font-size:9.5px;font-weight:900;letter-spacing:.14em;color:#7FB3FF}
.wal-v{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.1}
.wal-r{display:flex;gap:16px;text-align:right}
.wal-r b{display:block;font-size:14px;font-weight:800;color:#fff}
.wal-r span{font-size:9.5px;color:rgba(255,255,255,.45);letter-spacing:.05em;text-transform:uppercase}
.wal-note{font-size:11.5px;color:var(--label3);padding:0 4px 10px;line-height:1.5}
.row.boot-on{background:color-mix(in srgb,var(--green) 9%,transparent)}
.sp-bar{height:7px;border-radius:5px;background:var(--fill2);overflow:hidden;margin-top:10px}
.sp-bar div{height:100%;border-radius:5px;transition:width .4s cubic-bezier(.32,.72,0,1)}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-item{background:var(--card);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;border:1.5px solid transparent}
.sh-item.on{border-color:var(--tint)}
.sh-sw{height:66px;position:relative}
.sh-eq{position:absolute;top:6px;left:6px;background:var(--tint);color:#fff;font-size:8.5px;
  font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:12px}
.sh-b{padding:9px 10px}
.sh-n{font-size:13.5px;font-weight:700}
.sh-d{font-size:11px;color:var(--label3);margin-top:1px;line-height:1.35;min-height:29px}
.sh-p{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.sh-price{font-size:13px;font-weight:800;color:var(--tint)}
.sh-price.no{color:var(--label3)}
.sh-owned{font-size:11px;font-weight:700;color:var(--green)}
.sh-buy{background:var(--tint);color:#fff;border:none;border-radius:16px;padding:5px 12px;
  font-size:11.5px;font-weight:800;cursor:pointer}
.sh-buy:disabled{background:var(--fill2);color:var(--label3)}
.sh-buy.sec{background:var(--fill2);color:var(--label2)}
