/* ---------- MOST IMPROVED ---------- */
function histImproved(){
  const g=allGames(); if(g.length<6)return `<div class="empty"><div class="ee">📈</div><h3>Not enough games</h3>
    <p>Once the season is a few weeks old you'll see who has kicked on.</p></div>`;
  const half=Math.floor(g.length/2);
  const calc=list=>{const m={};
    list.forEach(x=>{
      [['A',x.teamA],['B',x.teamB]].forEach(([sd,t])=>(t||[]).forEach(pid=>{
        const e=m[pid]=m[pid]||{P:0,pts:0,G:0};
        e.P++; e.G+=(x.goals&&x.goals[pid])||0;
        if(x.result==='D')e.pts++; else if(x.result===sd)e.pts+=3;
      }));
    });
    return m};
  const first=calc(g.slice(0,half)), second=calc(g.slice(half));
  const rows=[];
  season().players.forEach(p=>{
    const f=first[p.id],s2=second[p.id];
    if(!f||!s2||f.P<2||s2.P<2)return;
    const fp=f.pts/f.P, sp=s2.pts/s2.P;
    rows.push({id:p.id,name:p.name,before:fp,after:sp,diff:sp-fp,
      gBefore:f.G/f.P,gAfter:s2.G/s2.P});
  });
  if(!rows.length)return `<div class="empty"><div class="ee">📈</div><h3>Not enough data</h3>
    <p>Players need at least two games in each half of the season.</p></div>`;
  rows.sort((a,b)=>b.diff-a.diff);
  const up=rows.filter(r=>r.diff>0).slice(0,5), down=rows.filter(r=>r.diff<0).slice(-5).reverse();
  const row=r=>`<div class="row tap" onclick="openPlayer('${r.id}')">
    <div class="rt"><div class="r1" style="font-size:15px">${esc(r.name)}</div>
      <div class="r2">${r.before.toFixed(2)} → ${r.after.toFixed(2)} points per game</div></div>
    <div class="rv" style="font-weight:800;color:${r.diff>0?'var(--green)':'var(--red)'}">
      ${r.diff>0?'▲':'▼'} ${Math.abs(r.diff).toFixed(2)}</div></div>`;
  return `<div class="note" style="padding:0 4px 12px">Comparing the first half of the season with the second — who has kicked on?</div>
    ${up.length?`<div class="sechead">📈 Kicked on</div><div class="card">${up.map(row).join('')}</div>`:''}
    ${down.length?`<div class="sechead">📉 Tailed off</div><div class="card">${down.map(row).join('')}</div>`:''}
    <div class="note">Minimum two games in each half.</div>`;
}

/* ============ CHEMISTRY ============ */
/* How often two players win when they're on the SAME team. */
function chemPairs(minGames){
  const min=minGames||2, g=allGames(), ids=season().players.filter(p=>p.active!==false).map(p=>p.id);
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, map={};
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,team])=>{
      const t=(team||[]).filter(id=>ids.includes(id));
      for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
        const k=key(t[i],t[j]); if(!map[k])map[k]={a:t[i],b:t[j],P:0,W:0,D:0,L:0};
        map[k].P++;
        if(x.result==='D')map[k].D++; else if(x.result===sd)map[k].W++; else map[k].L++;
      }});
  });
  return Object.values(map).filter(p=>p.P>=min).map(p=>({...p,
    wr:p.W/p.P, pts:p.W*3+p.D, ppg:(p.W*3+p.D)/p.P,
    chem:Math.round(((p.W*3+p.D)/p.P)/3*100)   // 0-100 chemistry score
  })).sort((x,y)=>y.chem-x.chem||y.P-x.P);
}
function chemColor(v){
  if(v>=75)return '#30D158'; if(v>=60)return '#9ACD32'; if(v>=45)return '#FFD60A';
  if(v>=30)return '#FF9F0A'; return '#FF453A';
}
function statChem(){
  const pairs=chemPairs(CHEMMIN);
  if(!pairs.length)return `<div class="empty"><div class="ee">🔗</div><h3>Not enough data yet</h3>
    <p>Once players have shared a team a few times, their chemistry shows up here.</p></div>`;
  const best=pairs.slice(0,6), worst=pairs.slice(-6).reverse().filter(p=>!best.includes(p));
  const roster=season().players.filter(p=>p.active!==false)
    .filter(p=>pairs.some(x=>x.a===p.id||x.b===p.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const find=(a,b)=>pairs.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
  return `
    <div class="chips" style="margin-bottom:12px">
      ${[2,3,5].map(n=>`<button class="${CHEMMIN===n?'on':''}" onclick="CHEMMIN=${n};render()">${n}+ together</button>`).join('')}
    </div>
    <div class="grid g2">
      <div><div class="sechead">Best partnerships</div>
        <div class="card">${best.map(p=>chemRow(p)).join('')}</div></div>
      ${worst.length?`<div><div class="sechead">Struggle together</div>
        <div class="card">${worst.map(p=>chemRow(p)).join('')}</div></div>`:''}
    </div>
    <div class="sechead">Chemistry grid</div>
    <div class="card"><div class="tw"><table class="chemgrid">
      <thead><tr><td></td>${roster.map(p=>`<td class="cg-h">${esc(p.name.slice(0,3))}</td>`).join('')}</tr></thead>
      <tbody>${roster.map(r=>`<tr><td class="cg-n">${esc(r.name)}</td>
        ${roster.map(c=>{ if(r.id===c.id)return '<td class="cg-x"></td>';
          const pr=find(r.id,c.id);
          return pr?`<td class="cg-c" style="background:${chemColor(pr.chem)}"
            onclick="toast('${esc(r.name)} + ${esc(c.name)}: ${pr.W}W-${pr.D}D-${pr.L}L in ${pr.P} — chem ${pr.chem}')">${pr.chem}</td>`
            :'<td class="cg-e">–</td>'}).join('')}</tr>`).join('')}</tbody></table></div></div>
    <div class="scrollhint">← swipe the grid sideways →</div>
    <div class="note">Chemistry is points-per-game when two players are on the same team, scaled to 100. Tap a square for the record. Only pairs with ${CHEMMIN}+ games together are shown.</div>`;
}
function chemRow(p){
  const a=player(p.a),b=player(p.b); if(!a||!b)return '';
  return `<div class="row"><div class="rt">
    <div class="r1" style="font-size:15px">${esc(a.name)} <span style="color:var(--label3)">+</span> ${esc(b.name)}</div>
    <div class="r2">${p.W}W · ${p.D}D · ${p.L}L in ${p.P} together</div>
    <div class="bar" style="margin-top:6px"><i style="width:${p.chem}%;background:${chemColor(p.chem)}"></i></div></div>
    <div class="rv" style="font-weight:800;color:${chemColor(p.chem)}">${p.chem}</div></div>`;
}

  const games=SCOMP==='all'?allGames():compGames(SCOMP);

  if(PF!=='ALL')st=st.filter(x=>x.pos===PF);
  if(SMIN>0)st=st.filter(x=>x.P>=SMIN);
  const total=games.length;
  st.forEach(x=>{
    x.app=total?x.P/total:0;
    x.gi=x.G;                                   // goal involvement (goals recorded)
    x.ptsShare=0; x.csr=x.P?x.cs/x.P:0;
    x.gdpg=x.P?x.GD/x.P:0;
  });
  const totPts=st.reduce((t,x)=>t+x.pts,0)||1;
  st.forEach(x=>x.ptsShare=x.pts/totPts);
  return {st,total};
}

      :CMODE==='form'?cmpForm(a,b)+radarChart(a,b)
      :`<div class="card">
        <div class="row"><div class="rt"><div class="r1" style="font-size:15px">Same team</div>
          <div class="r2">${t.tog?`${t.togW} of ${t.tog} won · ${Math.round(t.togW/t.tog*100)}%`:'Never on the same team'}</div>
          ${t.tog?`<div class="bar" style="margin-top:7px"><i style="width:${Math.round(t.togW/t.tog*100)}%"></i></div>`:''}</div>
          <div class="rv" style="font-weight:700">${t.tog}</div></div>
        <div class="row"><div class="rt"><div class="r1" style="font-size:15px">Against each other</div>
          <div class="r2">${t.vs?`${esc(a.name)} ${t.aw} – ${t.bw} ${esc(b.name)}`:'Never faced off'}</div></div>
          <div class="rv" style="font-weight:700">${t.vs}</div></div>
        ${t.vs?`<div class="row"><div class="rt"><div class="r1" style="font-size:15px">Head-to-head edge</div>
          <div class="r2">${t.aw===t.bw?'Dead even':`${esc(t.aw>t.bw?a.name:b.name)} leads by ${Math.abs(t.aw-t.bw)}`}</div></div></div>`:''}
      </div>
      <div class="note">“Same team” counts games where they played together; “against each other” counts games on opposite sides.</div>`}

}
function cmpForm(a,b){
  const spark=(m,col)=>{
    const seq=m.seq.slice(-12);
    if(seq.length<2)return `<div class="note" style="padding:10px 0">Not enough games yet.</div>`;
    let run=0;const pts=seq.map((s,i)=>{run+=s.r==='W'?3:s.r==='D'?1:0;return {i,v:run}});
    const max=Math.max(...pts.map(p=>p.v),1),W=280,H=34;
    const d=pts.map((p,i)=>`${(i/(pts.length-1))*W},${H-(p.v/max)*(H-4)-2}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  };
  const line=(m,col)=>`<div class="card pad" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:8px">${avatar(m,34)}
      <div style="flex:1"><div style="font-weight:700;font-size:15.5px">${esc(m.name)}</div>
        <div style="font-size:12.5px;color:var(--label2)">${m.form.toFixed(1)} pts/game over the last ${m.last5.length}</div></div>
      ${formDots(m.last5)}</div>
    ${spark(m,col)}
    <div class="note" style="padding:4px 0 0">Cumulative points across the last ${Math.min(m.seq.length,12)} games.</div></div>`;
  return line(a,'var(--tint)')+line(b,'var(--blue)');
}

function togetherStat(x,y){let tog=0,togW=0,vs=0,aw=0,bw=0;
  allGames().forEach(g=>{const A=g.teamA||[],B=g.teamB||[];
    const xa=A.includes(x),xb=B.includes(x),ya=A.includes(y),yb=B.includes(y);
    if(!(xa||xb)||!(ya||yb))return;
    if((xa&&ya)||(xb&&yb)){tog++;if(g.result===(xa?'A':'B'))togW++}
    else{vs++;if(g.result===(xa?'A':'B'))aw++;else if(g.result===(ya?'A':'B'))bw++}});
  return{tog,togW,vs,aw,bw}}

async function clearBoard(){const b=board();b[b.side||'A']={};if(b.pos)b.pos[b.side||'A']={};await saveBoard();paintTac()}
async function autoFillBoard(){
  const b=board(),side=b.side||'A',f=fmById(b.fid);
  const other=side==='A'?'B':'A';
  const taken=Object.values(b[other]||{}).filter(Boolean);
  const order={GK:0,DEF:1,MID:2,ATT:3};
  const pool=[...season().players].filter(p=>p.active!==false&&!taken.includes(p.id));
  const used=new Set(); const out={};
  f.slots.forEach((sl,i)=>{
    const want=sl[2];
    let pick=pool.find(p=>!used.has(p.id)&&p.pos===want);
    if(!pick)pick=pool.find(p=>!used.has(p.id)&&Math.abs((order[p.pos]??2)-(order[want]??2))===1);
    if(!pick)pick=pool.find(p=>!used.has(p.id));
    if(pick){used.add(pick.id);out[i]=pick.id}
  });
  b[side]=out; await saveBoard(); paintTac(); toast('Line-up filled by position');
}
function wireBoard(){
  const pitch=$('#pitch'); if(!pitch)return;
  const b=board(),side=b.side||'A';
  pitch.querySelectorAll('.tok').forEach(tok=>{
    const slot=+tok.dataset.slot;
    let dragging=false,moved=false,sx=0,sy=0,rect=null,raf=0,lastX=0,lastY=0;
    const put=(cx,cy)=>{
      const x=Math.max(5,Math.min(95,((cx-rect.left)/rect.width)*100));
      const y=Math.max(5,Math.min(95,((cy-rect.top)/rect.height)*100));
      return [x,y];
    };
    tok.addEventListener('pointerdown',e=>{
      dragging=true;moved=false;sx=e.clientX;sy=e.clientY;
      rect=pitch.getBoundingClientRect();          // measured once per drag, not per move
      tok.setPointerCapture(e.pointerId);
      tok.classList.add('drag');
      e.preventDefault();
    });
    tok.addEventListener('pointermove',e=>{
      if(!dragging)return;
      if(!moved&&Math.abs(e.clientX-sx)<5&&Math.abs(e.clientY-sy)<5)return;
      moved=true; lastX=e.clientX; lastY=e.clientY;
      if(raf)return;                                // coalesce to one update per frame
      raf=requestAnimationFrame(()=>{
        raf=0; const [x,y]=put(lastX,lastY);
        tok.style.left=x+'%'; tok.style.top=y+'%';
      });
    });
    const finish=async e=>{
      if(!dragging)return; dragging=false;
      if(raf){cancelAnimationFrame(raf);raf=0}
      tok.classList.remove('drag');
      try{tok.releasePointerCapture(e.pointerId)}catch(_){}
      if(moved){
        const [x,y]=put(e.clientX??lastX,e.clientY??lastY);
        if(!b.pos)b.pos={}; if(!b.pos[side])b.pos[side]={};
        b.pos[side][slot]=[Math.round(x),Math.round(y)];
        tok.style.left=Math.round(x)+'%'; tok.style.top=Math.round(y)+'%';
        await saveBoard();                          // no repaint — the token is already where it should be
      } else {
        if(TSEL){ b[side][slot]=TSEL; TSEL=null; await saveBoard(); paintTac(); }
        else if(b[side][slot]){ delete b[side][slot]; await saveBoard(); paintTac(); }
        else { toast('Pick a player from the list first'); }
      }
    };
    tok.addEventListener('pointerup',finish);
    tok.addEventListener('pointercancel',finish);
  });
}

function balTog(id){BAL.sel.has(id)?BAL.sel.delete(id):BAL.sel.add(id);paintTac()}
function balAll(){season().players.filter(p=>p.active!==false).forEach(p=>BAL.sel.add(p.id));paintTac()}
function balNone(){BAL.sel.clear();BAL.done=null;paintTac()}
function doBalance(){
  const ids=[...BAL.sel]; if(ids.length<2){toast('Pick at least two players');return}
  const st=statsAll();
  const rate=id=>{const m=st.find(x=>x.id===id);if(!m||!m.P)return 1.0;
    return Math.max(.3,Math.min(3, m.ppg*0.55 + m.gpg*0.8 + m.wr*1.2))};
  let best=null;
  for(let attempt=0;attempt<400;attempt++){
    const sh=[...ids].sort(()=>Math.random()-.5);
    const A=[],B=[];let sa=0,sb=0;
    // greedy with jitter: strongest available to the weaker side
    sh.sort((x,y)=>rate(y)-rate(x));
    sh.forEach(id=>{ if(sa<=sb){A.push(id);sa+=rate(id)}else{B.push(id);sb+=rate(id)} });
    if(Math.abs(A.length-B.length)>1)continue;
    const gap=Math.abs(sa-sb);
    if(!best||gap<best.gap)best={A,B,sa,sb,gap};
    if(gap<0.05)break;
  }
  if(!best){toast('Could not split those players');return}
  BAL.done={A:best.A.map(player).filter(Boolean),B:best.B.map(player).filter(Boolean),sa:best.sa,sb:best.sb};
  paintTac(); toast('Teams balanced');
}

/* ---- league zones, Premier League style ----
   1 champion · 2-5 Champions League · 6-7 Europa · bottom 3 relegation.
   Zones scale down sensibly for small leagues so they never overlap. ---- */
function zoneOf(i,total){
  const z=zoneBands(total),pos=i+1;
  if(pos===1)return 'z-champ';
  if(z.rel&&pos>=z.rel)return 'z-rel';
  if(pos<=z.ucl)return 'z-ucl';
  if(z.eur&&pos<=z.eur)return 'z-eur';
  if(z.con&&pos<=z.con)return 'z-con';
  return '';
}
/* Premier League shape, scaled to however many players you have:
   1 champion · UCL · Europa · Conference · bottom 3 relegated. */
function zoneBands(total){
  const ucl=Math.min(5,Math.max(2,Math.floor(total*0.28)));
  const eur=total>=8?Math.min(7,ucl+2):0;
  const con=total>=10?Math.min(8,eur+1):0;
  const rel=total>=8?total-2:0;
  // never let the european places collide with the drop zone
  const cap=rel?rel-1:total;
  return {ucl:Math.min(ucl,cap), eur:eur?Math.min(eur,cap):0, con:con?Math.min(con,cap):0, rel};
}
function leagueKey(total){
  const z=zoneBands(total);
  const items=[['z-champ','Champion','1']];
  if(z.ucl>=2)items.push(['z-ucl','Champions League',`2–${z.ucl}`]);
  if(z.eur>z.ucl)items.push(['z-eur','Europa League',z.eur===z.ucl+1?`${z.eur}`:`${z.ucl+1}–${z.eur}`]);
  if(z.con>z.eur)items.push(['z-con','Conference League',z.con===z.eur+1?`${z.con}`:`${z.eur+1}–${z.con}`]);
  if(z.rel)items.push(['z-rel','Relegation',`${z.rel}–${total}`]);
  return `<div class="lgkey">${items.map(([c,l,r])=>`<div class="lgkey-i">
    <span class="lgkey-d ${c}"></span><span class="lgkey-l">${l}</span><span class="lgkey-r">${r}</span></div>`).join('')}</div>`;
}

function pgSelect(pid){

  if(G.A.has(pid)||G.B.has(pid)){setSide(pid,'');return}

function pgPlace(sd){
  if(!G.__sel.size)return;
  const ids=[...G.__sel]; G.__sel.clear();
  ids.forEach(pid=>{G.A.delete(pid);G.B.delete(pid);G[sd].add(pid)});
  paintGame(); toast(`${ids.length} added to Team ${sd}`);}
function pgSelectAll(){
  const all=season().players.filter(p=>p.active!==false&&!G.A.has(p.id)&&!G.B.has(p.id));

  const pool=q?all.filter(p=>p.name.toLowerCase().includes(q)):all;

async function addFiller(sd){

function autoSplit(){
  const ids=[...G.A,...G.B];

  const st=statsAll(),r=ids.map(id=>({id,v:(st.find(x=>x.id===id)||{}).ppg||0})).sort((a,b)=>b.v-a.v);

async function saveGame(){if(!requireAdmin())return;
  snapshot(G.id?'editing a game':'logging a game');
  const _lvlBefore=levelSnapshot();
  if(!teamCount('A')||!teamCount('B')){toast('Both teams need at least one player');return}
  const gA=goalSum('A'),gB=goalSum('B');
  if((gA>0||gB>0)&&(gA!==G.sa||gB!==G.sb)){
    const c=await askChoice('Goals don\'t match the score',
      `Score is ${G.sa}–${G.sb} but you've credited ${gA}–${gB} in goals.`,
      [{label:`Use the goals (${gA}–${gB})`,value:'goals'},{label:`Keep the score (${G.sa}–${G.sb})`,value:'score'}]);
    if(!c)return;
    if(c==='goals'){G.sa=gA;G.sb=gB}
  }
  const S=season();
  const posSnap={}; [...G.A,...G.B].forEach(pid=>{const pl=player(pid); if(pl)posSnap[pid]=pl.pos||'MID'});
  const g={id:G.id||uid(),compId:G.compId,created:G.id?(S.games.find(x=>x.id===G.id)?.created||Date.now()):Date.now(),
    date:G.date,round:(G.round||'').trim(),teamA:[...G.A],teamB:[...G.B],fillA:[...G.fillA],fillB:[...G.fillB],
    pos:posSnap,goals:{...G.goals},scoreA:G.sa,scoreB:G.sb,result:G.sa>G.sb?'A':G.sb>G.sa?'B':'D'};
  if(G.id)S.games[S.games.findIndex(x=>x.id===G.id)]=g;else S.games.push(g);

  if(_ups.length){ setTimeout(()=>celebrate(_ups),260); }
  else if(ms.length){const p=player(ms[0].pid);toast(`${ms[0].e} ${p?p.name:''} — ${ms[0].t}!`)}
  else toast(G.id?'Game saved':'Game logged')}

/* ============ DRAWS ============ */
async function drawBracket(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  if(c.bracket&&!await askConfirm('Redraw bracket?','Existing results will be cleared.','Redraw',true))return;
  const sh=[...ids].sort(()=>Math.random()-.5);
  c.bracket=buildBracket(sh);await save();render();toast('⚔️ Bracket drawn')}
async function drawGroups(){if(!requireAdmin())return;
  const c=comp(),ids=teams(c).map(t=>t.id);
  if(ids.length<2){toast('Need at least 2 teams');return}
  const n=await askChoice('How many groups?','',[{label:'2 groups',value:2},{label:'3 groups',value:3},{label:'4 groups',value:4}]);
  if(!n)return;
  const sh=[...ids].sort(()=>Math.random()-.5),gk='ABCDEFGH'.slice(0,n).split(''),gr={};
  gk.forEach(k=>gr[k]=[]);sh.forEach((id,i)=>gr[gk[i%n]].push(id));
  c.groups=gr;c.advance=2;
  c.fixtures=[];gk.forEach(k=>roundRobin(gr[k]).forEach(f=>c.fixtures.push({...f,g:k})));
  delete c.bracket;await save();render();toast(`🌍 ${n} groups drawn · ${c.fixtures.length} fixtures`)}
async function drawKOFromGroups(){if(!requireAdmin())return;
  const c=comp();if(!c.groups){toast('Draw the groups first');return}
  if(c.bracket&&!await askConfirm('Redraw knockout?','Existing knockout results will be cleared.','Redraw',true))return;
  const adv=c.advance||2,q=[];
  Object.keys(c.groups).sort().forEach(k=>groupTable(c,k).slice(0,adv).forEach((r,i)=>q.push({id:r.id,g:k,pos:i})));
  if(q.length<2){toast('Not enough qualified teams');return}
  const w=q.filter(x=>x.pos===0),r=q.filter(x=>x.pos>0).reverse();
  c.bracket=buildBracket([...w,...r].map(x=>x.id));await save();render();toast('⚔️ Knockout drawn')}
async function resetComp(){if(!requireAdmin())return;const c=comp();
  if(!await askConfirm('Reset draw and results?','Teams are kept. The bracket, groups and fixtures are cleared.','Reset',true))return;
  delete c.bracket;delete c.groups;delete c.fixtures;await save();render();toast('Competition reset')}

async function koResult(ri,mi){if(!requireAdmin())return;
  const c=comp(),m=c.bracket.rounds[ri][mi];
  if(!m.a||!m.b){toast('Waiting on earlier rounds');return}
  scoreSheet(teamName(c,m.a),teamName(c,m.b),m.done?m.sa:0,m.done?m.sb:0,true,async(sa,sb)=>{
    m.sa=sa;m.sb=sb;m.done=true;
    // clear downstream then advance
    for(let r=ri+1;r<c.bracket.rounds.length;r++)c.bracket.rounds[r].forEach(x=>{x.a=null;x.b=null;x.sa=null;x.sb=null;x.done=false;x.bye=false});
    for(let r=0;r<c.bracket.rounds.length-1;r++)c.bracket.rounds[r].forEach((x,i)=>{
      if(x.done&&x.sa!==null&&x.sb!==null&&x.sa!==x.sb)advance(c.bracket,r,i,x.sa>x.sb?x.a:x.b);
      else if(x.done&&x.bye)advance(c.bracket,r,i,x.a||x.b)});
    await save();closeSheet();render();
    const w=bracketWinner(c.bracket);
    toast(w?`🏆 ${teamName(c,w)} win the ${c.name}!`:'Result saved')})}
async function grResult(i){if(!requireAdmin())return;
  const c=comp(),f=c.fixtures[i];
  scoreSheet(teamName(c,f.a),teamName(c,f.b),f.done?f.sa:0,f.done?f.sb:0,false,async(sa,sb)=>{
    f.sa=sa;f.sb=sb;f.done=true;await save();closeSheet();render();toast('Result saved')})}
function scoreSheet(an,bn,sa,sb,noDraw,cb){
  window.__sc={sa,sb};
  openSheet('Enter result','<div id="scb"></div>','Save');
  const paint=()=>{const s=window.__sc;
    $('#scb').innerHTML=`<div class="grid g2" style="margin-top:6px">
      ${[['a',an,s.sa],['b',bn,s.sb]].map(([k,n,v])=>`<div class="card pad" style="text-align:center;margin:0">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</div>
        <div class="stepper"><button onclick="__scAdj('${k}',-1)">−</button><span class="sv">${v}</span>
          <button onclick="__scAdj('${k}',1)">+</button></div></div>`).join('')}</div>
      <div style="text-align:center;padding:16px 0 4px;font-size:15px;font-weight:600;color:var(--label2)">
        ${s.sa===s.sb?(noDraw?'⚠️ Knockout ties need a winner — decide on penalties':'Draw'):`${esc(s.sa>s.sb?an:bn)} win`}</div>`};
  window.__scAdj=(k,d)=>{const s=window.__sc;s[k==='a'?'sa':'sb']=Math.max(0,s[k==='a'?'sa':'sb']+d);paint()};
  window.__paint=paint;paint();
  $('#_sact').onclick=()=>{const s=window.__sc;
    if(noDraw&&s.sa===s.sb){toast('A knockout tie needs a winner');return}cb(s.sa,s.sb)}}

async function doRestore(text){if(!requireAdmin())return;
  try{
    const d=JSON.parse(text),inc=(d&&d.db&&d.db.seasons)?d.db:((d&&d.seasons)?d:null);
    if(!inc||!Array.isArray(inc.seasons)||!inc.seasons.length)throw 0;
    const ng=inc.seasons.reduce((t,s)=>t+((s.games||[]).length),0);
    if(!await askConfirm('Restore backup?',`Backup: ${inc.seasons.length} season(s), ${ng} game(s).\nThis replaces what's here now.`,'Restore',true))return;
    inc.seasons.forEach(s=>{s.players=s.players||[];s.games=s.games||[];
      if(!s.comps?.length){const lg={id:uid(),name:'League',type:'league',icon:'🏆',created:Date.now()};
        s.comps=[lg];s.games.forEach(g=>{if(!g.compId)g.compId=lg.id})}});
    DB=inc;CUR=(inc.current&&inc.seasons.some(s=>s.id===inc.current))?inc.current:inc.seasons[0].id;
    COMP=season().comps[0].id;WIPE_OK=true;await save();WIPE_OK=false;go('home');toast(`✅ Restored · ${ng} games`)}
  catch(e){toast("That doesn't look like a Sunday Season backup")}}

    .fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;
      padding:16px 0;border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13)}
    .c-st{text-align:center}
    .c-st b{display:block;font-size:23px;font-weight:800;color:#fff;letter-spacing:-.03em}
    .c-st span{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.5)}
    .fc-psbar{display:flex;align-items:center;gap:12px;margin-top:14px;padding:11px 13px;border-radius:14px;
      background:color-mix(in srgb,var(--fc) 16%,rgba(255,255,255,.04))}
    .fc-psn{font-size:16px;font-weight:800;color:#fff}
    .fc-psc{font-size:11px;font-weight:600;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
    .fc-lvl{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.05)}
    .fc-lvb{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:22px;background:linear-gradient(150deg,var(--fc),color-mix(in srgb,var(--fc) 50%,#000))}
    .fc-lvn{font-size:16px;font-weight:800;color:#fff}
    .fc-lvx{font-size:11.5px;color:rgba(255,255,255,.55)}
    .fc-foot{text-align:center;margin-top:16px;font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.4)}
    .psdia{position:relative;display:inline-flex}.psdia svg{display:block}
    .psplus-spark{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(135deg,#FFE9A8,#F4C048);color:#7a5713;font-size:11px;font-weight:900;
      display:flex;align-items:center;justify-content:center}
    .av,.avatar{border-radius:50%}
  `;
  const full=`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(p.name)} — Sunday Season</title><style>${css}</style></head>
    <body>${card}</body></html>`;
  openViewer(p.name,`<div style="background:radial-gradient(120% 100% at 50% 0%,#20242e,#0b0c10);padding:20px;border-radius:14px"><style>${css.replace(/body\{[^}]*\}/,'')}</style>${card}
    <button class="btn pri full" style="margin-top:16px" onclick="downloadCardPNG('${pid}')">📸 Save as image (PNG)</button></div>`,
    `${p.name.replace(/\s+/g,'-').toLowerCase()}-card.html`,full)}
function exportWrapped(){
  const st=statsAll().filter(x=>x.P>0).sort(tableSort);
  if(!st.length){toast('Play a game first');return}
  const g=allGames(),goals=g.reduce((t,x)=>t+(x.scoreA||0)+(x.scoreB||0),0);
  const boot=[...st].filter(x=>x.G>0).sort((a,b)=>b.G-a.G).slice(0,8);
  const idx=[...st].sort((a,b)=>b.index-a.index).slice(0,8);
  const car=st.map(m=>({m,c:careerOf(m.id)})).sort((a,b)=>b.c.xp-a.c.xp).slice(0,6);
  const fd=feed().slice(0,10);
  const bar=(rows,max)=>rows.map(r=>`<div style="display:flex;align-items:center;gap:11px;margin:8px 0">
    <span style="width:96px;font-size:12.5px;font-weight:600">${esc(r.n)}</span>
    <span style="flex:1;height:15px;background:#23232E;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(3,r.v/max*100)}%;background:linear-gradient(90deg,#8A6B14,#FFD60A)"></i></span>
    <span style="width:34px;text-align:right;font-size:12.5px;font-weight:700;color:#FFD60A">${r.v}</span></div>`).join('');
  const eb=t=>`<div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#FFD60A;margin-bottom:12px">${t}</div>`;
  const h1=t=>`<div style="font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin-bottom:16px">${t}</div>`;
  const slide=i=>`<div class="slide">${i}</div>`;
  const inner=`
   ${slide(`${eb(esc(season().name))}<div style="font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:.96">Season<br><span style="color:#FFD60A">Wrapped</span></div>
     <div style="display:flex;gap:30px;margin-top:26px">
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${goals}</div><div style="font-size:10.5px;color:#8A8A97">GOALS</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${g.length}</div><div style="font-size:10.5px;color:#8A8A97">GAMES</div></div>
       <div><div style="font-size:38px;font-weight:800;color:#FFD60A">${st.length}</div><div style="font-size:10.5px;color:#8A8A97">PLAYERS</div></div></div>`)}
   ${slide(`${eb('Final standings')}${h1('The table')}
     <table style="width:100%;border-collapse:collapse">${st.slice(0,12).map((m,i)=>`<tr>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:${i<3?'#FFD60A':'#8A8A97'};font-size:12px">${i+1}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;font-weight:600;font-size:13px">${esc(m.name)}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.W}-${m.D}-${m.L}</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;color:#A9A9B5;text-align:center;font-size:12px">${m.G}⚽</td>
       <td style="padding:7px 5px;border-bottom:1px solid #23232E;text-align:right;font-weight:800;font-size:15px;color:#FFD60A">${m.pts}</td></tr>`).join('')}</table>`)}
   ${boot.length?slide(`${eb('Golden boot')}${h1(esc(boot[0].name)+' leads the line')}${bar(boot.map(m=>({n:m.name,v:m.G})),boot[0].G)}`):''}
   ${slide(`${eb('Player of the season')}${h1('POTY index')}${bar(idx.map(m=>({n:m.name,v:m.index})),100)}`)}
   ${slide(`${eb('Career mode')}${h1('Levels reached')}
     ${car.map(({m,c})=>`<div style="display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid #23232E">
       <div style="font-size:25px">${c.lvl.e}</div><div style="flex:1"><div style="font-weight:700;font-size:14.5px">${esc(m.name)}</div>
       <div style="font-size:11.5px;color:#8A8A97">Lv${c.lvl.n} ${c.lvl.t} · ${c.xp.toLocaleString()} XP</div></div>
       <div style="font-size:12px;font-weight:700;color:#FFD60A">${c.ch.filter(x=>x.done).length}/${c.ch.length}</div></div>`).join('')}`)}
   ${fd.length?slide(`${eb('Milestones')}${h1('Moments that mattered')}
     ${fd.map(e=>{const p=player(e.pid);return `<div style="display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid #23232E">
       <span style="font-size:19px">${e.e}</span><b style="flex:1;font-size:13px">${esc(p?p.name:'')}</b>
       <span style="font-size:11px;color:#8A8A97">${esc(e.t)}</span></div>`}).join('')}`):''}`;
  const css=`<style>@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;letter-spacing:-.01em;background:#0B0B0F;color:#fff}
    .slide{background:#0B0B0F;color:#fff;padding:18mm 14mm;min-height:250mm;page-break-after:always}
    @media screen{.slide{min-height:auto;padding:26px 22px;border-bottom:1px solid #23232E}}</style>`;
  const full=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Season Wrapped</title>${css}</head><body>${inner}</body></html>`;
  openViewer('Season Wrapped',`<div style="background:#0B0B0F;color:#fff;border-radius:14px;overflow:hidden">${css}${inner}</div>`,'season-wrapped.html',full)}


/* ============ BOOT ============ */
document.getElementById('fab').onclick=()=>{if(!requireAdmin())return; if(VIEW==='squad')editPlayer(null);else newGame()};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
$('#sideAdmin').onclick=()=>go('admin');
$('#drawerBg').onclick=closeDrawer;
$('#drawerClose').onclick=closeDrawer;
if(wideScreen())openDrawer();   // roomy screens start with the menu showing
$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const m={'1':'home','2':'league','3':'fixtures','4':'squad','5':'tactics','6':'career','7':'stats','8':'compare','9':'comps','0':'admin'};
  if(m[e.key])go(m[e.key]);
  if(e.key==='n'&&isAdmin())newGame();
  if(e.key==='Escape'){closeSheet();closeViewer();closeDrawer();$('#abg').classList.remove('open')}});
(async function(){
  await loadDB();
  if(supa){ await initSupa(); } else { applyAdminClass(); }
  loadLocalBoard();
  try{fplAutoLogin()}catch(e){}
  /* also handle a personal link tapped while the app is already open (a hash
     change alone does not reload the page) */
  window.addEventListener('hashchange',()=>{try{fplAutoLogin();render()}catch(e){}});
  initHaptics();
  buildNav();go('home');initGestures();
  if(!supaConfigured && Store.tier()==='memory')setTimeout(()=>toast('⚠️ This browser blocks saving — back up before closing'),1400);
  if(supaConfigured && !supa)setTimeout(()=>toast('⚠️ Could not reach the shared database — check your setup'),1400);
})();

</script>
