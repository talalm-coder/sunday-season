}
function cardTone(p){
  const c=clubOf(p);
  if(!c)return CARD_TONE[(p&&p.pos)||'MID']||'#2B3A55';
  const lum=hex=>{const h=String(hex||'').replace('#','');
    if(h.length<6)return 0;
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    return (r*299+g*587+b*114)/1000};
  let t=c.c1||'#2B3A55';
  if(lum(t)>170)t=(lum(c.acc)<=170&&c.acc)||(lum(c.c2)<=170&&c.c2)||'#2B3A55';
  return t;
}
/* ============ OVR (FC-style overall rating) ============
   Level 1 = 80, level 30 = 90. Everyone starts gold; 90 is the special card. */
function ovrOf(pid){
  const car=careerOf(pid); if(!car)return null;
  /* 80 at the bottom, 90 once you reach Ballon d'Or, and it stays there */
  const bd=LEVELS.findIndex(l=>/Ballon/.test(l.t));
  const top=bd>0?bd+1:LEVELS.length;
  return Math.round(80+(Math.min(car.lvl.n,top)-1)*(10/(top-1)));
}
function ovrTier(o){
  if(o>=90)return {k:'ballon',label:"Ballon d'Or"};
  if(o>=85)return {k:'rare',  label:'Gold Rare'};
  return {k:'gold', label:'Gold'};
}
/* movement since the previous game — shown as a small arrow, FC-style */
function ovrDelta(pid){
  const S=season(); if(!S.ovrLog)return 0;
  const h=S.ovrLog[pid]; if(!h||h.length<2)return 0;
  return h[h.length-1]-h[h.length-2];
}
function recordOvr(){
  const S=season(); if(!S.ovrLog)S.ovrLog={};
  S.players.forEach(p=>{
    const o=ovrOf(p.id); if(o==null)return;
    const h=S.ovrLog[p.id]=S.ovrLog[p.id]||[];
    if(h[h.length-1]!==o)h.push(o);
    while(h.length>30)h.shift();
  });
}
function ovrBadge(pid,size){
  const o=ovrOf(pid); if(o==null)return '';
  const d=ovrDelta(pid), t=ovrTier(o), s=size||34;
  return `<span class="ovr ${t.k}" style="--os:${s}px" title="${t.label}">
    <b>${o}</b>${d?`<i class="ovr-d ${d>0?'up':'dn'}">${d>0?'▲':'▼'}${Math.abs(d)}</i>`:''}</span>`;
}

/* ============================================================
   SUNDAY FPL — a small fantasy game running off the real season.
   Squad of 3: one DEF, one MID, one ATT. Everyone starts at £10m.
   Teams lock the moment the first game of a gameweek is logged.
   ============================================================ */
const FPL_RULES={
  played:2, win:3, draw:1,
  goal:{GK:6,DEF:6,MID:5,ATT:4},
  /* Defenders are rewarded for how little the team conceded, not just for a
     clean sheet — [0,1,2,3,4,5+] goals against. */
  defence:{
    GK :[10,7,5,3,2,1,0],
    DEF:[10,7,5,3,2,1,0],
    MID:[ 4,3,2,1,0,0,0],
    ATT:[ 2,1,1,0,0,0,0]
  },
  hatTrick:3,
  budget:52, startPrice:10, minPrice:6, maxPrice:16, chips:3,
  transfersPerWeek:3, squadSize:5,
  slots:['DEF','MID','ATT'],        // at least one of each, five in total
  eligible:['DEF','MID','ATT']      // outfield only — no keepers
};
function fpl(){
  const S=season();
  if(!S.fpl)S.fpl={managers:[],gw:1,locked:false,prices:{},ticker:[],league:'Sunday FPL Mini League'};
  const f=S.fpl;
  if(!f.managers)f.managers=[];
  if(!f.prices)f.prices={};
  if(!f.ticker)f.ticker=[];
  if(!f.league)f.league='Sunday FPL Mini League';
  if(f.gw==null)f.gw=1;
  syncManagers();
  return f;
}
/* every squad player automatically gets a manager slot + private code */
function fplCode(name,id){
  const base=String(name||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)||'MGR';
  let h=0; const t=String(id||name);
  for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0}
  return base+'-'+h.toString(36).toUpperCase().slice(0,4).padEnd(4,'X');
}
function syncManagers(){
  const S=season(),f=S.fpl;
  const live=S.players.filter(p=>p.active!==false);
  live.forEach(p=>{
    if(!f.managers.some(m=>m.pid===p.id)){
      f.managers.push({pid:p.id,name:p.name,code:fplCode(p.name,p.id),
        teamName:null,squad:[],captain:null,transfers:{},wildcards:0,tripleCaps:0,tcGws:[],doublePts:0,dpGws:[],history:[],joined:Date.now()});
    }
  });
  f.managers.forEach(m=>{
    const p=player(m.pid); if(p)m.name=p.name;
    /* migrate the old single-use chip fields */
    if(m.wildcards==null)m.wildcards=m.wildcard?1:0;
    if(m.tripleCaps==null)m.tripleCaps=m.tripleCap?1:0;
    if(!m.tcGws)m.tcGws=m.tcGw?[m.tcGw]:[];
    if(m.doublePts==null)m.doublePts=0;
    if(!m.dpGws)m.dpGws=[];
  });
}
const fplManager=code=>fpl().managers.find(m=>m.code===String(code||'').trim().toUpperCase());
function fplRemember(code){
  try{localStorage.setItem('ss_fpl_code',code)}catch(e){}
  try{sessionStorage.setItem('ss_fpl_code',code)}catch(e){}
}
function fplForget(){
  try{localStorage.removeItem('ss_fpl_code')}catch(e){}
  try{sessionStorage.removeItem('ss_fpl_code')}catch(e){}
}
/* Personal links: opening  <site>/#c=CODE  signs that person in automatically.
   Phones sometimes clear stored data after a week of not opening a site, so a
   saved personal link means nobody ever has to retype their code. */
function fplAutoLogin(){
  try{
    const h=(location.hash||'').replace(/^#/,'');
    const m=h.match(/(?:^|&)c=([A-Za-z0-9\-]+)/);
    if(!m)return;
    const mgr=fplManager(decodeURIComponent(m[1]));
    if(mgr){
      fplRemember(mgr.code);
      try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}   // tidy the address bar
      setTimeout(()=>toast(`Welcome back, ${mgr.name}`),600);
    }
  }catch(e){}
}
function fplLinkFor(code){ return location.href.split('#')[0]+'#c='+encodeURIComponent(code) }

const fplMine=()=>{
  let c=null;
  try{c=localStorage.getItem('ss_fpl_code')}catch(e){}
  if(!c){try{c=sessionStorage.getItem('ss_fpl_code')}catch(e){}}
  return c?fplManager(c):null;
};

/* ---------- prices ---------- */
function fplPrice(pid){
  const f=fpl();
  if(f.prices[pid]==null)f.prices[pid]=FPL_RULES.startPrice;
  return f.prices[pid];
}
/* Prices are RECOMPUTED from scratch off the games that actually exist, rather
   than drifting incrementally. That makes them deterministic and self-healing:
   delete a game and the prices correct themselves instead of staying stuck. */
/* Single source of truth for prices. Returns the final price map, the moves
   made in the latest gameweek, and the full per-gameweek history — so the
   stocks chart can never drift from what the rest of the app shows. */
function walkPrices(){
  const S=season(), gws=playedGws();
  const live=S.players.filter(p=>p.active!==false);
  const price={}, hist={};
  live.forEach(p=>{ price[p.id]=FPL_RULES.startPrice; hist[p.id]=[{gw:0,v:FPL_RULES.startPrice}]; });
  let moves=[];
  gws.forEach((gw,idx)=>{
    const win=gws.slice(Math.max(0,idx-2),idx+1);
    const pts={}; live.forEach(p=>pts[p.id]=win.reduce((t,g)=>t+fplPlayerGw(p.id,g),0));
    const vals=live.map(p=>pts[p.id]);
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const stepMoves=[];
    live.forEach(p=>{
      const diff=pts[p.id]-avg;
      let d=0;
      if(diff>=12)d=0.5; else if(diff>=7)d=0.3; else if(diff>=3)d=0.2;
      else if(diff<=-12)d=-0.5; else if(diff<=-7)d=-0.3; else if(diff<=-3)d=-0.2;
      if(d){
        const was=price[p.id];
        const now=Math.max(FPL_RULES.minPrice,Math.min(FPL_RULES.maxPrice,Math.round((was+d)*10)/10));
        if(now!==was){ price[p.id]=now; stepMoves.push({pid:p.id,name:p.name,from:was,to:now}); }
      }
      hist[p.id].push({gw,v:price[p.id]});
    });
    if(idx===gws.length-1)moves=stepMoves;
  });
  return {price,moves,hist};
}
function recalcPrices(){
  const f=fpl(), r=walkPrices();
  f.prices=r.price;
  f.ticker=r.moves.slice(0,20);
  return r.moves;
}
const updatePrices=recalcPrices;    // keep the old name working

/* ---------- scoring ---------- */
/* points a player earned in one specific game */
function fplGamePoints(pid,g){
  const p=player(pid); if(!p||!g)return 0;
  const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
  if(!onA&&!onB)return 0;                       // didn't play
  /* use the position the player had ON THE DAY, so changing someone's position
     later never rewrites points they already earned */
  const pos=(g.pos&&g.pos[pid])||p.pos||'MID';
  const sd=onA?'A':'B';
  const ga=onA?(g.scoreB??0):(g.scoreA??0);
  const goals=(g.goals&&g.goals[pid])||0;
  let pts=FPL_RULES.played;
  if(g.result==='D')pts+=FPL_RULES.draw; else if(g.result===sd)pts+=FPL_RULES.win;
  pts+=goals*(FPL_RULES.goal[pos]||FPL_RULES.goal.MID);
  const dl=FPL_RULES.defence[pos]||FPL_RULES.defence.MID;
  pts+=dl[Math.min(ga??0,dl.length-1)];
  if(goals>=3)pts+=FPL_RULES.hatTrick;
  return pts;
}
const gamesInGw=gw=>allGames().filter(g=>gwOf(g)===gw);
const gwOf=g=>{
  const r=String(g.round||'').match(/(\d+)/);
  return r?+r[1]:null;
};
/* a player's points across a gameweek (can be more than one game) */
function fplPlayerGw(pid,gw){
  return gamesInGw(gw).reduce((t,g)=>t+fplGamePoints(pid,g),0);
}
function fplRecentPoints(pid,n){
  const gws=playedGws().slice(-(n||3));
  return gws.reduce((t,gw)=>t+fplPlayerGw(pid,gw),0);
}
function playedGws(){
  const set=new Set();
  allGames().forEach(g=>{const n=gwOf(g); if(n)set.add(n)});
  return [...set].sort((a,b)=>a-b);
}
/* a manager's points for one gameweek, using the squad they had locked in */
function fplManagerGw(m,gw){
  const snap=(m.history||[]).find(h=>h.gw===gw);
  const squad=snap?snap.squad:m.squad, cap=snap?snap.captain:m.captain;
  if(!squad||!squad.length)return 0;
  const mult=((m.tcGws||[]).includes(gw))?3:2;   // triple captain applies only to the gameweeks it was played on
  let total=squad.reduce((t,pid)=>{
    let p=fplPlayerGw(pid,gw);
    if(pid===cap)p*=mult;
    return t+p;
  },0);
  if((m.dpGws||[]).includes(gw))total*=2;       // double points doubles the whole week
  return total;
}
function fplManagerTotal(m){
  return playedGws().reduce((t,gw)=>t+fplManagerGw(m,gw),0);
}
function fplTable(){
  const f=fpl(), gws=playedGws(), last=gws[gws.length-1];
  const rows=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize).map(m=>({
    m, total:fplManagerTotal(m), gw:last?fplManagerGw(m,last):0
  })).sort((a,b)=>b.total-a.total||b.gw-a.gw);
  // movement vs previous gameweek
  const prevGws=gws.slice(0,-1);
  const prev=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize)
    .map(m=>({id:m.pid,t:prevGws.reduce((s,gw)=>s+fplManagerGw(m,gw),0)}))
    .sort((a,b)=>b.t-a.t).map((x,i)=>({id:x.id,r:i+1}));
  rows.forEach((r,i)=>{
    const was=prev.find(p=>p.id===r.m.pid);
    r.move = was ? was.r-(i+1) : 0;
  });
  return rows;
}

/* ---------- player market stats ---------- */
function fplStats(){
  const f=fpl(), gws=playedGws();
  const managers=f.managers.filter(m=>m.squad&&m.squad.length===FPL_RULES.squadSize);
  const owners=managers.length||1;
  const totalGoals=allGames().reduce((t,g)=>t+Object.values(g.goals||{}).reduce((a,b)=>a+b,0),0)||1;
  return season().players.filter(p=>p.active!==false&&FPL_RULES.eligible.includes(p.pos||'MID')).map(p=>{
    const total=gws.reduce((t,gw)=>t+fplPlayerGw(p.id,gw),0);
    const form=gws.length?fplRecentPoints(p.id,3)/Math.min(3,gws.length):0;
    const owned=managers.filter(m=>m.squad.includes(p.id)).length;
    const st=statsAll().find(x=>x.id===p.id)||{G:0,P:0,cs:0};
    return {
      id:p.id,name:p.name,pos:p.pos||'MID',price:fplPrice(p.id),
      total, form:Math.round(form*10)/10,
      ownedPct:Math.round(owned/owners*100),
      threat:Math.round((st.G/totalGoals)*100),         // share of all goals scored
      ppg: st.P?Math.round(total/st.P*10)/10:0,
      value: total? Math.round(total/fplPrice(p.id)*10)/10 : 0,
      G:st.G, cs:st.cs, P:st.P,
      captainPct:Math.round(managers.filter(m=>m.captain===p.id).length/owners*100)
    };
  });
}

/* keep FPL consistent when games are removed */
function fplResync(){
  try{
    const f=fpl(), gws=new Set(playedGws());
    f.managers.forEach(m=>{ if(m.history)m.history=m.history.filter(h=>gws.has(h.gw)); });
    if(!gws.size){ f.gw=1; f.ticker=[]; }
    else f.gw=Math.max(...gws);
    recalcPrices();
  }catch(e){}
}

/* ---------- how scoring is fixed in time ----------
   There is no lock and no deadline. You can change your team whenever you like.
   The moment the admin logs a game, a snapshot of every team is taken, and that
   snapshot is what scores for that gameweek. Later edits only affect future
   gameweeks, so nobody can react to a result — and nobody gets shut out either. */
function fplLocked(){ return false; }
function fplNextGw(){
  const played=playedGws();
  return played.length?Math.max(...played)+1:1;
}
/* called after a game is saved: rolls the gameweek forward and repricing */
async function fplAfterGame(){
  const f=fpl();
  const played=playedGws();
  if(!played.length)return;
  const latest=Math.max(...played);
  /* freeze each manager's team for the gameweek that was just logged */
  f.managers.forEach(m=>{
    if(!m.squad||m.squad.length!==FPL_RULES.squadSize)return;
    if(!m.history)m.history=[];
    if(!m.history.some(h=>h.gw===latest))
      m.history.push({gw:latest,squad:[...m.squad],captain:m.captain,at:Date.now()});
  });
  if(f.gw!==latest){ f.gw=latest; }
  updatePrices();
}
/* open the next gameweek: unlocks teams for everyone */
async function fplOpenNextGw(){
  if(!requireAdmin())return;
  const f=fpl();
  const next=fplNextGw();
  if(!await askConfirm('Open the next gameweek?',
     `Teams unlock so managers can make transfers for GW${next}. They lock again the moment you log the first GW${next} game.`,
     'Open GW'+next,false))return;
  f.gw=next; await save(); render(); toast(`✅ GW${next} open — teams unlocked`);
}
/* transfers remaining this calendar month */
/* transfers reset every week (Monday-based ISO week) */
function weekKey(d){
  const t=new Date(d||Date.now());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate()+4-(t.getDay()||7));          // nearest Thursday
  const y0=new Date(t.getFullYear(),0,1);
  const wk=Math.ceil((((t-y0)/86400000)+1)/7);
  return t.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
const preSeason=()=>playedGws().length===0;   // nothing logged yet = free rein
function transfersLeft(m){
  if(preSeason())return Infinity;
  const k=weekKey();
  const used=(m.transfers&&m.transfers[k])||0;
  return Math.max(0,FPL_RULES.transfersPerWeek-used);
}
function useTransfer(m,n){
  if(preSeason())return;
  const k=weekKey();
  if(!m.transfers)m.transfers={};
  m.transfers[k]=((m.transfers[k])||0)+(n||1);
}

      const tcOn=tcArmed(m), dpOn=dpArmed(m), wcOn=!!m.wildcardActive, next=fplNextGw();
      const tcPast=(m.tcGws||[]).filter(g=>g!==next);

    })()}

    <div class="card" style="margin-top:12px">
      <div class="row tap" onclick="renameTeam()"><div class="rt"><div class="r1">Rename team</div></div>${chev}</div>

/* if two of a manager's picks now share a position, name the culprit */
/* Positions may now repeat (2 attackers is fine), so the only structural
   problem is someone in your squad becoming a keeper. */
function squadClash(squad){
  for(const id of (squad||[])){
    const p=player(id); if(!p)continue;
    if(!FPL_RULES.eligible.includes(p.pos||'MID'))return p.name;
  }
  return null;
}

/* ---------- picking: changes go into a draft you must confirm ---------- */
let FDRAFT=null;     // {squad:[], captain:null}
function draftOf(m){
  if(!FDRAFT)FDRAFT={squad:[...(m.squad||[])],captain:m.captain||null};
  return FDRAFT;
}
function draftDirty(m){
  const d=draftOf(m);
  const a=[...d.squad].sort().join(','), b=[...(m.squad||[])].sort().join(',');
  return a!==b || d.captain!==m.captain;
}
function draftSpend(m){ return draftOf(m).squad.reduce((t,x)=>t+fplPrice(x),0) }
function draftChanges(m){
  const d=draftOf(m), out=(m.squad||[]).filter(x=>!d.squad.includes(x));
  const inn=d.squad.filter(x=>!(m.squad||[]).includes(x));
  return {out,inn,count:Math.max(out.length,inn.length)};
}
/* everything wrong with the current draft, in plain English */
function squadShape(squad){
  const c={DEF:0,MID:0,ATT:0};
  (squad||[]).forEach(id=>{const p=player(id); if(p&&c[p.pos]!=null)c[p.pos]++});
  return c;
}
function draftProblems(m){
  const d=draftOf(m), p=[], n=d.squad.length, need=FPL_RULES.squadSize;
  if(n<need)p.push(`Pick ${need-n} more player${need-n===1?'':'s'} (${n} of ${need})`);
  if(n>need)p.push(`You have ${n} players — only ${need} allowed`);
  /* Only enforce the shape while the team is being changed. A squad that was
     valid when confirmed stays valid even if the admin later moves someone to
     a different position. */
  const settled = (m.squad||[]).length===need && !draftDirty(m);
  if(!settled){
    const sh=squadShape(d.squad);
    FPL_RULES.slots.forEach(pos=>{ if(!sh[pos])p.push(`You need at least one ${pos}`) });
  }
  const spend=draftSpend(m);
  if(spend>FPL_RULES.budget)p.push(`You're £${(spend-FPL_RULES.budget).toFixed(1)}m over budget`);
  if(!d.captain&&n===need)p.push('Choose a captain');
  const ch=draftChanges(m);
  const firstTeam=!(m.squad&&m.squad.length===FPL_RULES.squadSize);
  if(!firstTeam&&!m.wildcardActive&&!preSeason()&&ch.count>transfersLeft(m))
    p.push(`That's ${ch.count} transfer${ch.count===1?'':'s'} but you only have ${transfersLeft(m)} left this week`);
  return p;
}
let FSWAP=null;   // the player being replaced, if any
function fplSwapOut(pid){
  const p=player(pid); if(!p)return;
  haptic('light');
  FSWAP=pid; FPICK=p.pos||'MID'; FTAB='market'; render();
  toast(`Pick a ${FPICK} to replace ${p.name.split(' ')[0]}`);
}
function fplDrop(pid){
  const m=fplMine(); if(!m)return;
  haptic('light');
  const d=draftOf(m);
  d.squad=d.squad.filter(x=>x!==pid);
  if(d.captain===pid)d.captain=null;
  render();
}
function fplSwap(pos){ FSWAP=null; FPICK=pos||null; FTAB='market'; render(); }
function fplPick(pid){
  haptic('light');
  const m=fplMine(); if(!m)return;
  const p=player(pid); if(!p)return;
  if(!FPL_RULES.eligible.includes(p.pos||'MID')){toast('Keepers aren\'t in the fantasy game');return}
  const d=draftOf(m);
  if(d.squad.includes(pid)){ toast('Already in your team'); return; }
  if(FSWAP){                                   // replacing someone specific
    const outName=player(FSWAP)?.name.split(' ')[0]||'them';
    d.squad=d.squad.map(x=>x===FSWAP?pid:x);
    if(d.captain===FSWAP)d.captain=null;
    FSWAP=null; FPICK=null; FTAB='team'; render();
    toast(`${p.name.split(' ')[0]} in for ${outName}`); return;
  }
  if(d.squad.length>=FPL_RULES.squadSize){
    toast(`You already have ${FPL_RULES.squadSize} — tap a player to replace them`); return;
  }
  d.squad.push(pid);
  if(d.squad.length===FPL_RULES.squadSize){ FPICK=null; FTAB='team'; }
  render();
}
function draftCaptain(pid){
  haptic('light');
  const m=fplMine(); if(!m)return;
  const d=draftOf(m);
  if(!d.squad.includes(pid)){toast('You can only captain someone in your team');return}
  d.captain=(d.captain===pid?null:pid); render();
}
function discardDraft(){ FDRAFT=null; render(); toast('Changes discarded'); }
async function confirmDraft(){
  const m=fplMine(); if(!m)return;
  const probs=draftProblems(m);
  if(probs.length){ toast('⚠️ '+probs[0]); render(); return; }
  const d=draftOf(m), ch=draftChanges(m);
  const firstTeam=!(m.squad&&m.squad.length===FPL_RULES.squadSize);
  if(!firstTeam&&ch.count>0&&!m.wildcardActive&&!preSeason()){
    const names=ch.out.map((x,i)=>`${player(x)?.name} → ${player(ch.inn[i])?.name}`).join('\n');
    if(!await askConfirm(`Confirm ${ch.count} transfer${ch.count===1?'':'s'}?`,
       `${names}\n\nYou'll have ${transfersLeft(m)-ch.count} left this month.`,'Confirm',false))return;
    useTransfer(m,ch.count);
  }
  m.squad=[...d.squad]; m.captain=d.captain;
  if(m.wildcardActive){ m.wildcardActive=false; m.wildcards=(m.wildcards||0)+1; }
  FDRAFT=null;
  await fplSave();
  render();
  haptic('success');
  toast(firstTeam?'✅ Team confirmed — you\'re in the league':'✅ Transfers confirmed');
}
async function fplSave(){
  if(CLOUD_FAIL){toast('⛔️ Not saved — database unreachable');return}
  await save();
}
async function playWildcard(){
  const m=fplMine(); if(!m)return;
  if(m.wildcardActive){
    if(!await askConfirm('Cancel your wildcard?','Your team goes back to how it was and you keep the chip.','Cancel it',false))return;
    m.wildcardActive=false; FDRAFT=null;
    await fplSave(); render(); toast('Wildcard cancelled');
    return;
  }
  const clash=chipArmedFor(m,fplNextGw());
  if(clash){toast(`${clash} is already on for GW${fplNextGw()} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.wildcards||0);
  if(left<=0){toast('You have used all your wildcards');return}
  if(!await askConfirm('Play a wildcard?',
     `Unlimited free transfers for one set of changes. You have ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.wildcardActive=true; FDRAFT={squad:[],captain:null};
  await fplSave(); render(); toast('🃏 Wildcard active — rebuild your three, then confirm');
}
/* The triple captain can be taken back off as long as the gameweek it is armed
   for has not been played yet — once a game is logged it is locked in. */
/* Only one chip may be armed for any given gameweek — stacking Triple Captain
   with Double Points turned a normal week into a runaway score. */
function chipArmedFor(m,gw){
  if((m.tcGws||[]).includes(gw))return 'Triple Captain';
  if((m.dpGws||[]).includes(gw))return 'Double Points';
  if(m.wildcardActive)return 'Wildcard';
  return null;
}
const tcArmed=m=>(m.tcGws||[]).includes(fplNextGw());
async function playTripleCaptain(){
  const m=fplMine(); if(!m)return;
  const next=fplNextGw();
  if(tcArmed(m)){
    if(!await askConfirm('Remove triple captain?',
       `It will no longer apply to GW${next} and you get the chip back.`,'Remove',false))return;
    m.tcGws=(m.tcGws||[]).filter(g=>g!==next);
    m.tripleCaps=Math.max(0,(m.tripleCaps||0)-1);
    await fplSave(); render(); toast('Triple captain removed');
    return;
  }
  const clash=chipArmedFor(m,next);
  if(clash){toast(`${clash} is already on for GW${next} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.tripleCaps||0);
  if(left<=0){toast('You have used all your triple captains');return}
  if(!m.captain){toast('Pick a captain first');return}
  if(!await askConfirm('Play a triple captain?',
     `${player(m.captain)?.name} scores ×3 in GW${next} instead of ×2. You can take it off again any time before that game is logged. ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.tripleCaps=(m.tripleCaps||0)+1;
  m.tcGws=[...(m.tcGws||[]),next];
  await fplSave(); render(); toast(`🔥 Triple captain armed for GW${next}`);
}

/* Double Points — doubles everything you score that gameweek. Like the others
   it can be taken back off right up until that gameweek's first game is logged. */
const dpArmed=m=>(m.dpGws||[]).includes(fplNextGw());
async function playDoublePoints(){
  const m=fplMine(); if(!m)return;
  const next=fplNextGw();
  if(dpArmed(m)){
    if(!await askConfirm('Remove double points?',
       `It will no longer apply to GW${next} and you get the chip back.`,'Remove',false))return;
    m.dpGws=(m.dpGws||[]).filter(g=>g!==next);
    m.doublePts=Math.max(0,(m.doublePts||0)-1);
    await fplSave(); render(); toast('Double points removed');
    return;
  }
  const clash=chipArmedFor(m,next);
  if(clash){toast(`${clash} is already on for GW${next} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.doublePts||0);
  if(left<=0){toast('You have used all your double points chips');return}
  if(!m.squad||m.squad.length!==FPL_RULES.squadSize){toast('Finish your team first');return}
  if(!await askConfirm('Play double points?',
     `Everything your five score in GW${next} counts twice. You can take it off again before that game is logged. ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.doublePts=(m.doublePts||0)+1;
  m.dpGws=[...(m.dpGws||[]),next];
  await fplSave(); render(); toast(`✨ Double points armed for GW${next}`);
}

/* ============ FPL STOCKS ============
   The price history is replayed with exactly the same maths recalcPrices uses,
   so every gameweek value is the real one. Between gameweeks we draw a small
   deterministic wobble so the chart looks alive — it is seeded from the player
   id and gameweek, so it never changes between renders, and it always lands
   exactly on the true price at each gameweek. */
function priceSeries(){ return walkPrices().hist; }

/* stable 0..1 from a string — no Math.random, so the chart never flickers */
function seedRand(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%100000)/100000;
}
/* a drawable curve: real anchors plus gentle in-between motion */
function priceCurve(pid,perStep){
  const ser=(priceSeries()[pid])||[];
  if(ser.length<2)return ser.map(x=>({...x,real:true}));
  const step=perStep||4, out=[];
  for(let i=0;i<ser.length-1;i++){
    const a=ser[i], b=ser[i+1];
    out.push({gw:a.gw,v:a.v,real:true});
    for(let k=1;k<step;k++){
      const t=k/step;
      const lin=a.v+(b.v-a.v)*t;
      // wobble is a fraction of the move, biggest mid-way, zero at both ends
      const amp=Math.max(0.05,Math.abs(b.v-a.v)*0.45)*Math.sin(Math.PI*t);
      const n=(seedRand(pid+'|'+a.gw+'|'+k)-0.5)*2;
      out.push({gw:a.gw+t,v:Math.max(FPL_RULES.minPrice,Math.min(FPL_RULES.maxPrice,lin+n*amp)),real:false});
    }
  }
  const last=ser[ser.length-1];
  out.push({gw:last.gw,v:last.v,real:true});
  return out;
}
function stockOf(pid){
  const ser=(priceSeries()[pid])||[];
  const now=ser.length?ser[ser.length-1].v:FPL_RULES.startPrice;
  const prev=ser.length>1?ser[ser.length-2].v:FPL_RULES.startPrice;
  const open=FPL_RULES.startPrice;
  const chg=now-prev, pct=prev?(chg/prev*100):0;
  const season=now-open, seasonPct=open?(season/open*100):0;
  const highs=ser.map(x=>x.v);
  return {pid,now,prev,chg,pct,season,seasonPct,
          hi:Math.max(...highs,now), lo:Math.min(...highs,now), n:ser.length};
}
/* sparkline: 8-10 gameweeks, coloured by direction */
function sparkline(pid,w,h){
  const c=priceCurve(pid,4);
  const keep=c.slice(Math.max(0,c.length-40));
  if(keep.length<2)return `<svg width="${w||72}" height="${h||26}"></svg>`;
  const W=w||72, H=h||26, pad=2;
  const vs=keep.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), rng=(hi-lo)||1;
  const x=i=>pad+(i/(keep.length-1))*(W-pad*2);
  const y=v=>H-pad-((v-lo)/rng)*(H-pad*2);
  const up=keep[keep.length-1].v>=keep[0].v;
  const col=up?'#30D158':'#FF453A';
  const d=keep.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=`${d}L${x(keep.length-1).toFixed(1)},${H-pad}L${x(0).toFixed(1)},${H-pad}Z`;
  const id='sp'+pid.replace(/\W/g,'');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
/* full chart for the expanded view */
function priceChart(pid,range){
  const all=priceCurve(pid,5);
  const gws=playedGws(), lastGw=gws[gws.length-1]||0;
  const spans={'3W':3,'1M':4,'3M':12,'ALL':9999};
  const back=spans[range]||9999;
  const from=Math.max(0,lastGw-back);
  const c=all.filter(p=>p.gw>=from);
  if(c.length<2)return `<div class="note" style="padding:22px;text-align:center">Not enough history yet — prices move once games are logged.</div>`;
  const W=340,H=170,padT=12,padB=26,padL=34,padR=10;
  const vs=c.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  const pad=Math.max(0.2,(hi-lo)*0.18); lo=Math.max(0,lo-pad); hi=hi+pad;   // breathing room
  const rng=(hi-lo)||1;
  const x=i=>padL+(i/(c.length-1))*(W-padL-padR);
  const y=v=>H-padB-((v-lo)/rng)*(H-padT-padB);
  const up=c[c.length-1].v>=c[0].v, col=up?'#30D158':'#FF453A';
  /* smooth the line so it reads like a chart, not a saw */
  const d=c.map((p,i)=>{
    const px=x(i),py=y(p.v);
    if(!i)return `M${px.toFixed(1)},${py.toFixed(1)}`;
    const qx=x(i-1),qy=y(c[i-1].v),mx=(qx+px)/2;
    return `C${mx.toFixed(1)},${qy.toFixed(1)} ${mx.toFixed(1)},${py.toFixed(1)} ${px.toFixed(1)},${py.toFixed(1)}`;
  }).join('');
  const area=`${d}L${x(c.length-1).toFixed(1)},${H-padB}L${x(0).toFixed(1)},${H-padB}Z`;
  const anchors=c.map((p,i)=>({...p,i})).filter(p=>p.real);
  const ticks=[0,.25,.5,.75,1].map(f=>lo+rng*f);
  const lastPt=c[c.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="stk-chart">
    <defs><linearGradient id="cg${pid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`
      <line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}"
        stroke="var(--sep)" stroke-width=".7" stroke-dasharray="2 3"/>
      <text x="${padL-5}" y="${(y(v)+3).toFixed(1)}" font-size="8.5" fill="var(--label3)" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    <path d="${area}" fill="url(#cg${pid})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${anchors.map(a2=>`<circle cx="${x(a2.i).toFixed(1)}" cy="${y(a2.v).toFixed(1)}" r="2" fill="var(--card)" stroke="${col}" stroke-width="1.4"/>`).join('')}
    <circle cx="${x(c.length-1).toFixed(1)}" cy="${y(lastPt.v).toFixed(1)}" r="4.5" fill="${col}"/>
    <circle cx="${x(c.length-1).toFixed(1)}" cy="${y(lastPt.v).toFixed(1)}" r="8" fill="${col}" opacity=".18"/>
    <text x="${padL}" y="${H-8}" font-size="9" fill="var(--label3)">GW${Math.max(1,Math.ceil(from))}</text>
    <text x="${W-padR}" y="${H-8}" font-size="9" fill="var(--label3)" text-anchor="end">GW${lastGw}</text>
  </svg>`;
}
function marketIndex(){
  const st=fplStats();
  const rows=st.map(x=>stockOf(x.id));
  const total=rows.reduce((t,r)=>t+r.now,0);
  const up=rows.slice().sort((a,b)=>b.chg-a.chg)[0];
  const dn=rows.slice().sort((a,b)=>a.chg-b.chg)[0];
  return {total,up,dn,n:rows.length};
}

      </div>
      <button class="btn sec full" style="margin-top:10px" onclick="event.stopPropagation();openPlayer('${r.id}')">Full profile ›</button>
    </div>`;

  return `
    <div class="idx">
      <div class="idx-h"><b>SUNDAY MARKET</b><span>${idx.n} listed</span></div>
      <div class="idx-b">
        <div class="idx-big">£${idx.total.toFixed(1)}m<span>total value</span></div>

          ${idx.dn&&idx.dn.chg<0?`<div class="dn">▼ ${esc((player(idx.dn.pid)||{}).name||'')} ${sign(idx.dn.chg)}</div>`:'<div class="flat">no fallers</div>'}

      .map(([k,l])=>`<button class="${SSORT===k?'on':''}" onclick="SSORT='${k}';render()">${l}</button>`).join('')}</div>

    <div class="stk-list">${rows.map(r=>`
      <div class="stk ${SOPEN===r.id?'open':''}" onclick="SOPEN=SOPEN==='${r.id}'?null:'${r.id}';render()">
        <div class="stk-row">
          <span class="stk-kit">${avatar(player(r.id),32)}</span>

          <span class="stk-px">
            <b>£${r.now.toFixed(1)}m</b>

/* ============ QR CODE (self-contained, no network) ============
   Byte mode, error-correction level M, auto version 1-10.
   Enough for any Vercel URL. */
const QR_ECB={ // [total codewords, ec codewords per block, blocks] for level M
  1:[26,10,1],2:[44,16,1],3:[70,26,1],4:[100,18,2],5:[134,24,2],
  6:[172,16,4],7:[196,18,4],8:[242,22,4],9:[292,22,5],10:[346,26,5]
};
const QR_CAP={1:14,2:26,3:42,4:62,5:84,6:106,7:122,8:152,9:180,10:213}; // byte-mode capacity, level M
const QR_ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],
  7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};

function qrGF(){
  const exp=new Array(512),log=new Array(256);
  let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&0x100)x^=0x11d}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  return {exp,log};
}
const QRGF=qrGF();
function qrPoly(ec){
  let p=[1];
  for(let i=0;i<ec;i++){
    const q=[1,QRGF.exp[i]],r=new Array(p.length+1).fill(0);
    for(let a=0;a<p.length;a++)for(let b=0;b<2;b++){
      if(p[a]===0||q[b]===0)continue;
      r[a+b]^=QRGF.exp[(QRGF.log[p[a]]+QRGF.log[q[b]])%255];
    }
    p=r;
  }
  return p;
}
function qrEC(data,ec){
  const gen=qrPoly(ec), res=data.concat(new Array(ec).fill(0));
  for(let i=0;i<data.length;i++){
    const c=res[i]; if(c===0)continue;
    for(let j=0;j<gen.length;j++)
      res[i+j]^=QRGF.exp[(QRGF.log[gen[j]]+QRGF.log[c])%255];
  }
  return res.slice(data.length);
}
function qrEncode(text){
  const bytes=[];
  for(const ch of unescape(encodeURIComponent(text)))bytes.push(ch.charCodeAt(0));
  let ver=1; while(ver<=10 && bytes.length>QR_CAP[ver])ver++;
  if(ver>10)return null;
  const [total,ecPer,blocks]=QR_ECB[ver];
  const dataCw=total-ecPer*blocks;
  // bit stream
  const bits=[];
  const push=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>i)&1)};
  push(4,4);                                   // byte mode
  push(bytes.length, ver<10?8:16);
  bytes.forEach(b=>push(b,8));
  const cap=dataCw*8;
  for(let i=0;i<4&&bits.length<cap;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  const cw=[]; for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];cw.push(v)}
  const pad=[0xEC,0x11]; let pi=0;
  while(cw.length<dataCw)cw.push(pad[pi++%2]);
  // split into blocks
  const short=Math.floor(dataCw/blocks), extra=dataCw%blocks;
  const dBlocks=[],eBlocks=[]; let p=0;
  for(let i=0;i<blocks;i++){
    const len=short+(i>=blocks-extra?1:0);
    const d=cw.slice(p,p+len); p+=len;
    dBlocks.push(d); eBlocks.push(qrEC(d,ecPer));
  }
  const out=[];
  const maxD=Math.max(...dBlocks.map(b=>b.length));
  for(let i=0;i<maxD;i++)dBlocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecPer;i++)eBlocks.forEach(b=>out.push(b[i]));
  // matrix
  const size=17+ver*4;
  const m=Array.from({length:size},()=>new Array(size).fill(null));
  const setF=(r,c,v)=>{if(r>=0&&r<size&&c>=0&&c<size)m[r][c]=v};
  const finder=(r,c)=>{
    for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){
      const rr=r+i,cc=c+j; if(rr<0||cc<0||rr>=size||cc>=size)continue;
      const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
      setF(rr,cc,on?1:0);
    }};
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0}
  const al=QR_ALIGN[ver];
  al.forEach(r=>al.forEach(c=>{
    if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8))return;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
      setF(r+i,c+j,(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0))?1:0);
  }));
  m[size-8][8]=1;
  // reserve format areas
  const fmt=[];
  for(let i=0;i<=5;i++)fmt.push([8,i],[i,8]);
  fmt.push([8,7],[8,8],[7,8]);
  for(let i=0;i<8;i++)fmt.push([size-1-i,8]);
  for(let i=0;i<8;i++)fmt.push([8,size-1-i]);
  fmt.forEach(([r,c])=>{if(m[r][c]===null)m[r][c]=0});
  // place data with mask 0
  let bi=0, up=true;
  const bitAt=i=>i<out.length*8 ? (out[i>>3]>>(7-(i&7)))&1 : 0;
  for(let col=size-1;col>0;col-=2){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const row=up?size-1-k:k;
      for(let c=0;c<2;c++){
        const cc=col-c;
        if(m[row][cc]!==null)continue;
        let v=bitAt(bi++);
        if((row+cc)%2===0)v^=1;                 // mask pattern 0
        m[row][cc]=v;
      }
    }
    up=!up;
  }
  // format info: level M (00) + mask 0 -> 101010000010010
  const fbits='101010000010010'.split('').map(Number);
  for(let i=0;i<=5;i++)m[8][i]=fbits[i];
  m[8][7]=fbits[6];m[8][8]=fbits[7];m[7][8]=fbits[8];
  for(let i=9;i<15;i++)m[14-i][8]=fbits[i];
  for(let i=0;i<8;i++)m[size-1-i][8]=fbits[i];
  for(let i=8;i<15;i++)m[8][size-15+i]=fbits[i];
  return m;
}
function qrSVG(text,px){
  const m=qrEncode(text);
  if(!m)return '<div class="note">Link is too long for a QR code.</div>';
  const n=m.length, q=4, size=n+q*2, s=px||220;
  let path='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)
    if(m[r][c])path+=`M${c+q} ${r+q}h1v1h-1z`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"
    xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#fff"/>
    <path d="${path}" fill="#000"/></svg>`;
}

   Android fires beforeinstallprompt, which we can turn into a real one-tap
   install button. Either way it is shown once and dismissible. */
let INSTALL_EVT=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL_EVT=e; });
const isStandalone=()=>{
  try{ return window.navigator.standalone===true ||
    window.matchMedia('(display-mode: standalone)').matches; }catch(e){ return false }
};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||'');
function a2hsDismissed(){ try{return localStorage.getItem('ss_a2hs')==='1'}catch(e){return false} }
function dismissA2HS(){ try{localStorage.setItem('ss_a2hs','1')}catch(e){} render(); }
async function doInstall(){
  if(INSTALL_EVT){
    INSTALL_EVT.prompt();
    try{ await INSTALL_EVT.userChoice }catch(e){}
    INSTALL_EVT=null; dismissA2HS(); return;
  }
  dismissA2HS();
}
const isMac=()=>/Macintosh|Mac OS X/.test(navigator.userAgent||'')&&!('ontouchend' in document);
function a2hsBanner(){
  if(isStandalone()||a2hsDismissed())return '';

    <button class="a2hs-x" onclick="dismissA2HS()">✕</button>
    <div class="a2hs-i">${desktop?'🔖':'⚽'}</div>
    <div class="a2hs-t"><b>${desktop?'Bookmark this page':'Add to your home screen'}</b>
      <div>${body}</div>
      ${(!desktop&&canPrompt)?`<button class="btn pri sm" style="margin-top:9px" onclick="doInstall()">Install</button>`:''}

/* ============ HAPTICS ============
   Android exposes the Vibration API. iOS Safari does not — but since 17.4 a
   <input type="checkbox" switch> fires a real haptic when toggled by a label
   click, so we use that as the iOS path. Falls back to nothing elsewhere. */
let HAPTIC_OK=true;
try{ HAPTIC_OK = localStorage.getItem('ss_haptics')!=='0' }catch(e){}
let _hapEl=null;
function initHaptics(){
  if(_hapEl)return;
  const wrap=document.createElement('label');
  wrap.setAttribute('aria-hidden','true');
  wrap.style.cssText='position:absolute;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden';
  const cb=document.createElement('input');
  cb.type='checkbox'; cb.setAttribute('switch',''); cb.id='_hapt';
  wrap.htmlFor='_hapt'; wrap.appendChild(cb);
  document.body.appendChild(wrap);
  _hapEl=wrap;
}
function haptic(kind){
  if(!HAPTIC_OK)return;
  try{
    if(navigator.vibrate){                       // Android
      navigator.vibrate(kind==='heavy'?18:kind==='success'?[8,30,8]:7);
      return;
    }
    if(_hapEl)_hapEl.click();                    // iOS 17.4+
  }catch(e){}
}
function setHaptics(on){
  HAPTIC_OK=!!on;
  try{localStorage.setItem('ss_haptics',on?'1':'0')}catch(e){}
  if(on)haptic('light');
  render();
}

/* ============ MATCH RATINGS (out of 10) ============
   Built from what we actually record: the result, the margin, goals, and how
   much the team let in. Deliberately generous at the top so a hat-trick in a
   win reads like a 9, and floored at 4.0 so nobody gets humiliated. */
function ratingFor(pid,g){
  if(!g)return null;
  const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
  if(!onA&&!onB)return null;
  const pos=(g.pos&&g.pos[pid])||(player(pid)||{}).pos||'MID';
  const goals=(g.goals||{})[pid]||0;
  const gf=onA?(g.scoreA||0):(g.scoreB||0);
  const ga=onA?(g.scoreB||0):(g.scoreA||0);
  const won=(onA&&g.result==='A')||(onB&&g.result==='B');
  const drew=g.result==='D';
  let r=6.0;
  r += won?1.2 : drew?0.3 : -0.7;
  const margin=gf-ga;
  r += Math.max(-1,Math.min(1,margin*0.18));
  const gw={ATT:0.85,MID:1.0,DEF:1.25,GK:1.4}[pos]||1.0;
  r += goals*gw;
  if(goals>=3)r+=0.4;
  const dw={GK:1,DEF:1,MID:0.6,ATT:0.3}[pos]??0.6;
  if(ga===0)r+=1.6*dw; else if(ga===1)r+=1.0*dw; else if(ga===2)r+=0.5*dw;
  else if(ga>=6)r-=0.9*dw; else if(ga>=5)r-=0.5*dw;
  if(gf===0&&(pos==='ATT'))r-=0.4;
  return Math.max(4.0,Math.min(10,Math.round(r*10)/10));
}
function ratingClass(r){ return r>=8.5?'r-elite':r>=7.5?'r-great':r>=6.5?'r-good':r>=5.5?'r-ok':'r-poor' }
function ratingPill(r,size){
  if(r==null)return '';
  return `<span class="rpill ${ratingClass(r)} ${size==='lg'?'lg':''}">${r.toFixed(1)}</span>`;
}
function seasonRating(pid){
  const rs=allGames().map(g=>ratingFor(pid,g)).filter(x=>x!=null);
  if(!rs.length)return null;
  return Math.round(rs.reduce((a,b)=>a+b,0)/rs.length*10)/10;
}
function matchRatings(g){
  const ids=[...(g.teamA||[]),...(g.teamB||[])];
  return ids.map(id=>({id,name:(player(id)||{}).name||'—',r:ratingFor(id,g)}))
            .filter(x=>x.r!=null).sort((a,b)=>b.r-a.r);
}

const shirtOf=p=>(p&&p.num)||null;
function shirtTaken(num,exceptId){

/* ============ PLAYER OF THE MONTH ============ */
function monthsPlayed(){
  const seen=new Set();
  allGames().forEach(g=>{ if(g.date)seen.add(String(g.date).slice(0,7)); });
  return [...seen].sort();
}
function potmFor(ym){
  const gs=allGames().filter(g=>String(g.date||'').slice(0,7)===ym);
  if(!gs.length)return null;
  const tally={};
  gs.forEach(g=>{
    [...(g.teamA||[]),...(g.teamB||[])].forEach(id=>{
      const r=ratingFor(id,g); if(r==null)return;
      if(!tally[id])tally[id]={id,P:0,sum:0,G:0,W:0};
      tally[id].P++; tally[id].sum+=r;
      tally[id].G+=(g.goals||{})[id]||0;
      const onA=(g.teamA||[]).includes(id);
      if((onA&&g.result==='A')||(!onA&&g.result==='B'))tally[id].W++;
    });
  });
  const rows=Object.values(tally).filter(x=>x.P>=2)
    .map(x=>({...x,avg:x.sum/x.P,score:x.sum/x.P + x.G*0.12 + x.W*0.1}))
    .sort((a,b)=>b.score-a.score);
  if(!rows.length)return null;
  const w=rows[0];
  return {ym,id:w.id,name:(player(w.id)||{}).name||'—',avg:Math.round(w.avg*10)/10,
          P:w.P,G:w.G,W:w.W,games:gs.length};
}
function potmHistory(){ return monthsPlayed().map(potmFor).filter(Boolean) }
function ymLabel(ym){
  const [y,m]=ym.split('-');
  return ['January','February','March','April','May','June','July','August',
          'September','October','November','December'][(+m)-1]+' '+y;
}

/* ============ TROPHY CABINET ============ */
function trophiesFor(pid){
  const out=[], st=statsAll(), me=st.find(x=>x.id===pid);
  if(!me)return out;
  const live=st.filter(x=>x.P>0);
  const top=(arr,f)=>arr.slice().sort(f)[0];
  // league leader
  const leader=top(live,(a,b)=>b.pts-a.pts||b.GD-a.GD);
  if(leader&&leader.id===pid&&me.P>2)out.push({e:'🏆',t:'Top of the league',s:'Leading on points right now',k:'gold'});
  // golden boot
  const boot=top(live,(a,b)=>b.G-a.G);
  if(boot&&boot.id===pid&&me.G>0)out.push({e:'👟',t:'Golden Boot',s:`${me.G} goal${me.G===1?'':'s'} this season`,k:'gold'});
  // golden defence
  const dfs=live.filter(x=>['DEF','GK'].includes(((player(x.id)||{}).pos))&&x.P>=3);
  const glove=top(dfs,(a,b)=>(a.GA/a.P)-(b.GA/b.P));
  if(glove&&glove.id===pid)out.push({e:'🧤',t:'Golden Defence',s:`${(me.GA/Math.max(me.P,1)).toFixed(1)} conceded a game`,k:'silver'});
  // player of the month wins
  const poms=potmHistory().filter(x=>x.id===pid);
  poms.forEach(x=>out.push({e:'⭐',t:'Player of the Month',s:ymLabel(x.ym)+` · ${x.avg} avg`,k:'gold'}));
  // appearance milestones
  const life=lifetime().find(x=>x.name===(player(pid)||{}).name);
  const totalP=life?life.P:me.P;
  [[100,'💯','Centurion','100 appearances'],[50,'🎽','Fifty Club','50 appearances']].forEach(([n,e,t,s])=>{
    if(totalP>=n)out.push({e,t,s,k:'bronze'});
  });
  // hall of fame: won a previous season
  (DB.seasons||[]).forEach(sn=>{
    if(sn.id===CUR)return;
    try{
      const sm=seasonSummary(sn);
      if(sm&&sm.champ&&sm.champ.name===(player(pid)||{}).name)

/* ============ PRESS ROOM ============
   Four original pundits rather than real broadcasters — same archetypes you
   know from the studio, but nobody real gets words put in their mouth. */
const PUNDITS=[
  {id:'carra', n:'Carragher',  r:'Never plays, watches every week', e:'🧱', c:'#E4002B'},
  {id:'nev',   n:'Neville',    r:'Runs the touchline analysis',      e:'📐', c:'#6A1B9A'},
  {id:'micah', n:'Sturridge',  r:'Turns up for the laughs',          e:'😄', c:'#FF9500'},
  {id:'henry', n:'Henry',      r:'Too classy to get his boots on',   e:'🎩', c:'#0A84FF'},
  {id:'klopp', n:'Klopp',      r:'Manages from the sideline',        e:'🤯', c:'#D62828'},
  {id:'pep',   n:'Pep',        r:'Has opinions about shape',         e:'🧠', c:'#00897B'},
];
function pressRoom(g){
  if(!g)return [];
  const rs=matchRatings(g);
  if(rs.length<2)return [];
  const nm=x=>esc(x&&x.name?String(x.name).split(' ')[0]:'—');
  const top=rs[0], second=rs[1], worst=rs[rs.length-1];
  const total=(g.scoreA||0)+(g.scoreB||0), margin=Math.abs((g.scoreA||0)-(g.scoreB||0));
  const drew=g.result==='D', conc=Math.max(g.scoreA||0,g.scoreB||0);
  const scorers=Object.entries(g.goals||{}).map(([id,n])=>({id,n,name:(player(id)||{}).name||'—'}))
    .sort((a,b)=>b.n-a.n);
  const hat=scorers.find(x=>x.n>=3);
  const sc1=scorers[0], sc2=scorers[1];
  const bestDef=rs.find(x=>['DEF','GK'].includes(((g.pos&&g.pos[x.id])||(player(x.id)||{}).pos)));

  /* every line names at least one player, most name two or three */
  const lines={
    carra: conc>=6
      ? `${nm(worst)} and the rest of that back line, I'd have had them in on Monday. ${nm(top)} was the only one who looked like he wanted it.`
      : bestDef
        ? `${nm(bestDef)} was outstanding. Him and ${nm(top)} between them dragged that team through it — that's what defending looks like.`
        : `${nm(top)} and ${nm(second)} did the ugly work. Nobody talks about it, but that's why they won.`,
    nev: sc2
      ? `Look at where ${nm(sc1)} and ${nm(sc2)} were picking it up. Both goals came from the same overload, and nobody adjusted.`
      : `${nm(top)} kept finding the spare man. ${nm(second)} read it every time, and that's the whole game in one movement.`,
    micah: hat
      ? `${nm(hat)} with three! And ${nm(second)} still thinks he was the best player out there. He's told me twice already.`
      : margin>=4
        ? `${nm(worst)} will not want to talk about that one. ${nm(top)} on the other hand will not stop talking about it.`
        : `${nm(top)} and ${nm(second)} were brilliant. ${nm(worst)}, mate, we've all had those days.`,
    henry: `${nm(top)}. A ${top.r.toFixed(1)} from me${second?`, ${nm(second)} just behind on ${second.r.toFixed(1)}`:''}. Quiet, efficient, always in the right place.`,
    klopp: margin>=4
      ? `Boys, this is information, not a disaster! ${nm(worst)} keeps his head up, ${nm(top)} shows him how — next Sunday we go again.`
      : drew
        ? `A draw I hate, but the effort! ${nm(top)} and ${nm(second)} ran until the end. That I love.`
        : `${nm(top)}! Full throttle, no passengers. ${nm(second)} the same. Fantastic.`,
    pep: total>=9
      ? `Nobody wants the ball. ${nm(top)} keeps it, everybody else runs. If ${nm(second)} holds it for ten seconds the whole team rests.`
      : `The shape was good while ${nm(top)} stayed central. Then ${nm(worst)} chases, the line breaks, and everything opens.`,
  };
  const key=[g.id,g.date,g.round,g.scoreA,g.scoreB,g.result].join('~');
  const order=PUNDITS.map((p,i)=>({p,k:seedRand(key+'#'+p.id+i)})).sort((a,b)=>a.k-b.k).map(x=>x.p);
  const howMany = seedRand(key+'|n')<0.45 ? 1 : 2;      // one or two on the panel
  return order.slice(0,howMany).map(p=>({p,q:lines[p.id]}));
}

function buildUp(){
  const st=statsAll().filter(x=>x.P>=2);
  if(st.length<4)return null;
  const form=st.map(x=>{
    const last=x.seq.slice(-4);
    return {id:x.id,name:(player(x.id)||{}).name||'—',
            pts:last.reduce((t,s)=>t+(s.r==='W'?3:s.r==='D'?1:0),0),
            n:last.length,seq:last.map(s=>s.r)};
  }).filter(x=>x.n>=2).sort((a,b)=>b.pts-a.pts);
  const hot=form.slice(0,3), cold=form.slice(-2).reverse();
  const rivals=(typeof rivalries==='function')?(rivalries()||[]).slice(0,2):[];
  const table=st.slice().sort((a,b)=>b.pts-a.pts||b.GD-a.GD);
  const gap=table.length>1?table[0].pts-table[1].pts:0;
  return {hot,cold,rivals,leader:table[0],second:table[1],gap};
}

/* biggest climb in points-per-game between the first half and the second */
function mostImproved(){
  const g=allGames(); if(g.length<6)return [];
  const half=Math.floor(g.length/2);
  const early=statsFor(g.slice(0,half)), late=statsFor(g.slice(half));
  const em={}; early.forEach(x=>em[x.id]=x);
  return late.filter(x=>x.P>=2).map(x=>{
    const e=em[x.id];
    if(!e||e.P<2)return null;
    const d=(x.pts/x.P)-(e.pts/e.P);
    return {id:x.id,name:(player(x.id)||{}).name||'—',delta:d,
            from:(e.pts/e.P),to:(x.pts/x.P),G:x.G-e.G};
  }).filter(Boolean).sort((a,b)=>b.delta-a.delta).slice(0,3);
}
/* man of the match for the most recent game */
function motm(g){
  if(!g)return null;
  const ids=[...(g.teamA||[]),...(g.teamB||[])];
  const won=sd=>g.result===sd;
  let best=null;
  ids.forEach(id=>{
    const onA=(g.teamA||[]).includes(id);
    const goals=(g.goals||{})[id]||0;
    const ga=onA?(g.scoreB||0):(g.scoreA||0);
    const w=won(onA?'A':'B'), d=g.result==='D';
    let sc=goals*4 + (w?4:d?1.5:0) + (ga===0?3:ga<=2?1.5:0);
    if(goals>=3)sc+=3;
    if(!best||sc>best.sc)best={id,sc,goals,w,d,ga};
  });
  if(!best)return null;
  return {...best,name:(player(best.id)||{}).name||'—'};
}
/* Monday-Night-Football style read on the season */
function mnfNotes(){
  const out=[], g=allGames();
  if(g.length<3)return out;
  const pairs=chemPairs(3);
  const p=id=>(player(id)||{}).name||'—';

  if(pairs.length){
    const top=pairs[0];
    out.push({t:'The partnership',e:'🤝',
      b:`${p(top.a)} and ${p(top.b)}`,
      d:`Together ${top.P} times and winning ${top.W} of them — a ${top.chem}% record. No pairing in the group has done better.`});
    const worst=pairs[pairs.length-1];
    if(pairs.length>2&&worst.chem<40)
      out.push({t:'It just does not click',e:'🧊',
        b:`${p(worst.a)} and ${p(worst.b)}`,
        d:`${worst.P} games together, only ${worst.W} won. Worth splitting them up next time you pick sides.`});
  }
  // tightest defensive pairing
  const dmap={};
  g.forEach(x=>{
    [['A',x.teamA,x.scoreB],['B',x.teamB,x.scoreA]].forEach(([sd,team,conceded])=>{
      const t=(team||[]);
      for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
        const pa=player(t[i]),pb=player(t[j]);
        if(!pa||!pb)continue;
        if(!['DEF','GK'].includes(pa.pos)||!['DEF','GK'].includes(pb.pos))continue;
        const k=t[i]<t[j]?t[i]+'|'+t[j]:t[j]+'|'+t[i];
        if(!dmap[k])dmap[k]={a:t[i],b:t[j],P:0,GA:0};
        dmap[k].P++; dmap[k].GA+=(conceded||0);
      }});
  });
  const back=Object.values(dmap).filter(x=>x.P>=3).sort((a,b)=>a.GA/a.P-b.GA/b.P)[0];
  if(back)out.push({t:'The back line',e:'🧱',b:`${p(back.a)} and ${p(back.b)}`,
    d:`${(back.GA/back.P).toFixed(1)} conceded a game across ${back.P} outings — the meanest pairing at the back.`});

  // most goals alongside a team-mate
  const smap={};
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,team])=>{
      const t=(team||[]);
      for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){
        const k=t[i]<t[j]?t[i]+'|'+t[j]:t[j]+'|'+t[i];
        if(!smap[k])smap[k]={a:t[i],b:t[j],P:0,G:0};
        smap[k].P++; smap[k].G+=((x.goals||{})[t[i]]||0)+((x.goals||{})[t[j]]||0);
      }});
  });
  const front=Object.values(smap).filter(x=>x.P>=3).sort((a,b)=>b.G/b.P-a.G/a.P)[0];
  if(front&&front.G)out.push({t:'The front two',e:'⚡',b:`${p(front.a)} and ${p(front.b)}`,
    d:`${front.G} goals between them in ${front.P} games — ${(front.G/front.P).toFixed(1)} a game when they line up together.`});

  // form
  const st=statsAll().filter(x=>x.P>=3);
  const hot=st.map(x=>{
    const last=x.seq.slice(-4);
    return {id:x.id,pts:last.reduce((t,s)=>t+(s.r==='W'?3:s.r==='D'?1:0),0),n:last.length};
  }).filter(x=>x.n>=3).sort((a,b)=>b.pts-a.pts)[0];
  if(hot&&hot.pts>=7)out.push({t:'In form',e:'🔥',b:p(hot.id),
    d:`${hot.pts} points from the last ${hot.n} games. Whoever gets them on their side right now is starting ahead.`});

  // scoreline character
  const avg=g.reduce((t,x)=>t+(x.scoreA||0)+(x.scoreB||0),0)/g.length;
  out.push({t:'The story of the season',e:'📈',b:`${avg.toFixed(1)} goals a game`,
    d: avg>8?'Chaos. Nobody is defending and everybody is enjoying it.'
      : avg>6?'End to end, and the defenders are earning their money.'
      : 'Tight, low-scoring football — the shut-outs are deciding it.'});
  return out;
}

/* ============ TEAM OF THE WEEK ============ */
function totw(){
  const gws=playedGws(); if(!gws.length)return null;
  const gw=gws[gws.length-1];
  const pool=season().players.filter(p=>p.active!==false)
    .map(p=>({p,pts:fplPlayerGw(p.id,gw)})).filter(x=>x.pts>0);
  if(pool.length<3)return null;
  const pick=pos=>pool.filter(x=>(x.p.pos||'MID')===pos).sort((a,b)=>b.pts-a.pts)[0];
  const gk=pick('GK'), def=pool.filter(x=>x.p.pos==='DEF').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const mid=pool.filter(x=>x.p.pos==='MID').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const att=pool.filter(x=>x.p.pos==='ATT').sort((a,b)=>b.pts-a.pts).slice(0,2);
  const star=[...pool].sort((a,b)=>b.pts-a.pts)[0];
  return {gw,gk,def,mid,att,star};
}

/* ============ RADAR CHART (Compare) ============ */
function radarChart(a,b){
  const axes=[
    ['Points','pts'],['Goals','G'],['Win %','wr'],
    ['Clean sheets','cs'],['Form','form'],['Games','P']
  ];
  const all=statsAll().filter(x=>x.P>0);
  const max=k=>Math.max(...all.map(x=>x[k]||0),0.001);
  const N=axes.length, R=78, CX=100, CY=95;
  const pt=(i,v)=>{
    const ang=(Math.PI*2*i)/N-Math.PI/2, r=Math.max(4,v*R);
    return [CX+Math.cos(ang)*r, CY+Math.sin(ang)*r];
  };
  const poly=(m,col)=>{
    const pts=axes.map(([,k],i)=>pt(i,(m[k]||0)/max(k)).join(',')).join(' ');
    return `<polygon points="${pts}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  };
  const grid=[0.25,0.5,0.75,1].map(f=>{
    const pts=axes.map((_,i)=>pt(i,f).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--sep)" stroke-width="1"/>`;
  }).join('');
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,1);
    return `<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="var(--sep)" stroke-width="1"/>`}).join('');
  const labels=axes.map(([l],i)=>{const [x,y]=pt(i,1.24);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="9.5" font-weight="700" fill="var(--label3)">${l}</text>`}).join('');
  return `<div class="sechead">Radar</div>
    <div class="card pad">
      <svg viewBox="0 0 200 200" style="width:100%;max-width:340px;display:block;margin:0 auto">
        ${grid}${spokes}${poly(a,'var(--tint)')}${poly(b,'var(--blue)')}${labels}
      </svg>
      <div class="potsleg" style="justify-content:center">
        <span><i style="background:var(--tint)"></i>${esc(a.name)}</span>
        <span><i style="background:var(--blue)"></i>${esc(b.name)}</span></div>
      <div class="note" style="padding:8px 0 0">Each axis is scaled against the best in the squad.</div>
    </div>`;
}

/* ============ AUTO MATCH REPORTS ============ */
function matchReport(g){
  if(!g)return '';
  const a=g.scoreA??0,b=g.scoreB??0,marg=Math.abs(a-b),tot=a+b;
  const nm=(l,f)=>{const n=(l||[]).map(p=>player(p)?.name).filter(Boolean).concat(f||[]);return n};
  const A=nm(g.teamA,g.fillA), B=nm(g.teamB,g.fillB);
  const winners=a>b?A:B, losers=a>b?B:A;
  const scorers=Object.entries(g.goals||{}).filter(([,n])=>n>0)
    .map(([pid,n])=>({name:player(pid)?.name,n})).filter(x=>x.name).sort((x,y)=>y.n-x.n);
  const top=scorers[0];
  const list=arr=>arr.length<=1?(arr[0]||'—'):arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  let open;
  if(a===b) open = tot===0 ? `A goalless stalemate.` : `Honours even in a ${a}–${b} draw.`;
  else if(marg>=4) open = `A ${Math.max(a,b)}–${Math.min(a,b)} demolition.`;
  else if(marg===1) open = `Settled by a single goal, ${Math.max(a,b)}–${Math.min(a,b)}.`;
  else open = `${Math.max(a,b)}–${Math.min(a,b)} in the end.`;
  const bits=[open];
  if(a!==b) bits.push(`${list(winners)} came out on top against ${list(losers)}.`);
  else bits.push(`${list(A)} and ${list(B)} couldn't be separated.`);
  if(top){
    if(top.n>=3) bits.push(`${top.name} helped himself to a hat-trick.`);
    else if(top.n===2) bits.push(`${top.name} grabbed a brace.`);
    else if(scorers.length) bits.push(`${list(scorers.map(x=>x.name))} got on the scoresheet.`);
  }
  if(Math.min(a,b)===0&&tot>0) bits.push(`A clean sheet for the winners.`);
  if(tot>=8) bits.push(`${tot} goals in one game — chaos.`);
  return bits.join(' ');
}

/* ============ PLAYER OF THE SEASON RACE ============ */
function potsRace(){
  const g=allGames().filter(x=>x.date).sort((p,q)=>(p.date||'').localeCompare(q.date||'')||(p.created||0)-(q.created||0));
  if(g.length<4)return '';
  const st=lgStats().filter(x=>x.P>0).sort(tableSort).slice(0,5);
  if(st.length<2)return '';
  const ids=st.map(x=>x.id);
  const run={};ids.forEach(i=>run[i]=0);
  const series={};ids.forEach(i=>series[i]=[0]);
  g.forEach(x=>{
    [['A',x.teamA],['B',x.teamB]].forEach(([sd,t])=>(t||[]).forEach(pid=>{
      if(!(pid in run))return;
      if(x.result==='D')run[pid]+=1; else if(x.result===sd)run[pid]+=3;
    }));
    ids.forEach(i=>series[i].push(run[i]));
  });
  const max=Math.max(...ids.map(i=>run[i]),1);
  const W=300,H=110,n=g.length;
  const cols=['var(--tint)','var(--green)','var(--orange)','var(--purple)','var(--teal)'];
  const line=(i,ix)=>{
    const pts=series[i].map((v,k)=>`${(k/n)*W},${H-(v/max)*(H-8)-4}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${cols[ix%5]}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  return `<div class="sechead">🏁 Player of the Season race</div>
    <div class="card pad">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:118px;display:block">
        ${[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${H-(H-8)*f-4}" x2="${W}" y2="${H-(H-8)*f-4}"
          stroke="var(--sep)" stroke-width="1"/>`).join('')}
        ${ids.map(line).join('')}
      </svg>
      <div class="potsleg">${st.map((x,ix)=>`<span onclick="openPlayer('${x.id}')">
        <i style="background:${cols[ix%5]}"></i>${esc(x.name)} <b>${x.pts}</b></span>`).join('')}</div>
      <div class="note" style="padding:8px 0 0">Points accumulated across the season — the top five, gameweek by gameweek.</div>
    </div>`;
}

/* ============ PERSONAL BESTS / SEASON SUMMARY / COUNTDOWNS ============ */
function personalBests(pid){
  const m=statsAll().find(x=>x.id===pid); if(!m||!m.P)return null;
  const seq=m.seq||[];
  const bestGoals=Math.max(0,...seq.map(s=>s.goals||0));
  const winRun=(function(){let b=0,c=0;seq.forEach(s=>{c=s.r==='W'?c+1:0;if(c>b)b=c});return b})();
  const unbeaten=(function(){let b=0,c=0;seq.forEach(s=>{c=s.r!=='L'?c+1:0;if(c>b)b=c});return b})();
  const csRun=(function(){let b=0,c=0;seq.forEach(s=>{c=s.ga===0?c+1:0;if(c>b)b=c});return b})();
  const scoreRun=(function(){let b=0,c=0;seq.forEach(s=>{c=(s.goals||0)>0?c+1:0;if(c>b)b=c});return b})();
  // best month
  const g=allGames().filter(x=>(x.teamA||[]).includes(pid)||(x.teamB||[]).includes(pid));
  const months={};
  g.forEach(x=>{const k=(x.date||'').slice(0,7);if(!k)return;
    const onA=(x.teamA||[]).includes(pid),sd=onA?'A':'B';
    const e=months[k]=months[k]||{P:0,pts:0,G:0};
    e.P++;e.G+=(x.goals&&x.goals[pid])||0;
    if(x.result==='D')e.pts++;else if(x.result===sd)e.pts+=3;});
  let bestMonth=null;
  Object.keys(months).forEach(k=>{const e=months[k];
    if(e.P>=2&&(!bestMonth||e.pts/e.P>bestMonth.ppg))bestMonth={k,ppg:e.pts/e.P,...e}});
  return {bestGoals,winRun,unbeaten,csRun,scoreRun,bestMonth};
}
function pbBlock(pid){
  const pb=personalBests(pid); if(!pb)return '';
  const gm=n=>n?n+(n===1?' game':' games'):'—';
  const items=[
    ['⚽','Most in a game',pb.bestGoals?pb.bestGoals+(pb.bestGoals===1?' goal':' goals'):'—'],
    ['🔥','Longest win run',gm(pb.winRun)],
    ['🛡️','Longest unbeaten',gm(pb.unbeaten)],
    ['🎯','Scored in a row',gm(pb.scoreRun)],
    ['🧤','Clean sheets in a row',gm(pb.csRun)],
    ['📅','Best month',pb.bestMonth?MONTHNAME(pb.bestMonth.k).split(' ')[0]:'—']
  ];
  return `<div class="sechead">Personal bests</div>
    <div class="pbgrid">${items.map(([e,l,v])=>`<div class="pbcard">
      <div class="pb-e">${e}</div><div class="pb-l">${l}</div><div class="pb-v">${esc(String(v))}</div></div>`).join('')}</div>`;
}
/* plain-English season summary */
function seasonLine(pid){
  const p=player(pid),m=statsAll().find(x=>x.id===pid);
  if(!m||!m.P)return '';
  const pb=personalBests(pid);
  const bits=[`You played ${m.P}`];
  if(m.W)bits.push(`won ${m.W}`);
  if(m.G)bits.push(`scored ${m.G}`);
  let txt=bits.join(', ')+'.';
  const extra=[];
  if(pb&&pb.scoreRun>=3)extra.push(`You scored in ${pb.scoreRun} straight games`);
  else if(pb&&pb.winRun>=3)extra.push(`You won ${pb.winRun} in a row at one point`);
  else if(pb&&pb.unbeaten>=4)extra.push(`You went ${pb.unbeaten} games unbeaten`);
  if(m.cs>=3)extra.push(`kept ${m.cs} clean sheets`);
  if(pb&&pb.bestMonth&&pb.bestMonth.P>=2)extra.push(`and ${MONTHNAME(pb.bestMonth.k).split(' ')[0]} was your best month`);
  if(extra.length)txt+=' '+extra.join(', ').replace(/^(\w)/,c=>c.toUpperCase())+'.';
  const rank=ranks(lgStats()).find(x=>x.id===pid);
  if(rank)txt+=` You're sitting ${ordinal(rank.rank)} in the table.`;
  return `<div class="sechead">Your season</div>
    <div class="card pad seasonline">${esc(txt)}</div>`;
}
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

/* ---- milestone countdowns: who is close to a round number ---- */
function countdowns(){
  const st=lgStats().filter(x=>x.P>0), out=[];
  const marks=[10,25,50,75,100,150,200];
  st.forEach(x=>{
    const life=lifetime().find(l=>l.name.trim().toLowerCase()===x.name.trim().toLowerCase());
    const apps=life?life.P:x.P;
    marks.forEach(mk=>{const left=mk-apps;
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:'🎖️',t:`${left} game${left===1?'':'s'} from ${mk} appearances`,v:left})});
    [10,25,50,100].forEach(mk=>{const left=mk-(life?life.G:x.G);
      if(left>0&&left<=3)out.push({id:x.id,name:x.name,e:'⚽',t:`${left} goal${left===1?'':'s'} from ${mk} career goals`,v:left})});
  });
  return out.sort((a,b)=>a.v-b.v).slice(0,4);
}

/* ---- rotation fairness: are the same people always together? ---- */
function rotationWatch(){
  const g=allGames().slice(-6);
  if(g.length<4)return '';
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, m={};
  g.forEach(x=>{[x.teamA,x.teamB].forEach(t=>{
    const arr=(t||[]).filter(id=>player(id));
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const k=key(arr[i],arr[j]); m[k]=(m[k]||0)+1;
    }})});
  const stuck=Object.entries(m).filter(([,n])=>n>=Math.min(5,g.length))
    .map(([k,n])=>{const [a,b]=k.split('|');return {a,b,n}})
    .filter(x=>player(x.a)&&player(x.b))
    .sort((p,q)=>q.n-p.n).slice(0,3);
  if(!stuck.length)return '';
  return `<div class="sechead">🔄 Rotation watch</div>
    <div class="card">${stuck.map(x=>`<div class="row">
      <div style="font-size:20px;flex:0 0 26px">🔗</div>
      <div class="rt"><div class="r1" style="font-size:15px">${esc(player(x.a).name)} &amp; ${esc(player(x.b).name)}</div>
        <div class="r2">Same team ${x.n} of the last ${g.length} games</div></div></div>`).join('')}</div>
    <div class="note">Worth splitting these up to keep games even.</div>`;
}

/* lifetime totals keyed by player NAME (ids differ between seasons) */
function lifetime(){
  const m={};
  (DB.seasons||[]).forEach(s=>{
    const byId={};(s.players||[]).forEach(p=>byId[p.id]=p);
    (s.games||[]).forEach(g=>{
      [['A',g.teamA,g.scoreA,g.scoreB],['B',g.teamB,g.scoreB,g.scoreA]].forEach(([sd,team,gf,ga])=>{
        (team||[]).forEach(pid=>{
          const p=byId[pid]; if(!p)return;
          const k=p.name.trim().toLowerCase();
          const e=m[k]=m[k]||{name:p.name,P:0,W:0,D:0,L:0,G:0,GF:0,GA:0,cs:0,pts:0,seasons:new Set(),seq:[]};
          e.P++; e.GF+=gf??0; e.GA+=ga??0; e.G+=(g.goals&&g.goals[pid])||0;
          if((ga??0)===0)e.cs++;
          e.seasons.add(s.id);
          if(g.result==='D'){e.D++;e.pts++;e.seq.push('D')}
          else if(g.result===sd){e.W++;e.pts+=3;e.seq.push('W')}
          else {e.L++;e.seq.push('L')}
        })});
    });
  });
  return Object.values(m).map(x=>({...x,seasons:x.seasons.size,
    wr:x.P?x.W/x.P:0, gpg:x.P?x.G/x.P:0, GD:x.GF-x.GA})).sort((a,b)=>b.P-a.P);
}

/* remember what has been asked so a session does not repeat itself */
let GSEEN=[];
function buildQuiz(){
  let pool=BALLQ.filter(q=>!GSEEN.includes(q.q));
  if(pool.length<8){ GSEEN=[]; pool=BALLQ; }          // seen them all, start over
  const qs=pool.slice().sort(()=>0.5-Math.random()).slice(0,8)
    .map(q=>({...q,o:[...new Set(q.o)].sort(()=>0.5-Math.random())}));
  GSEEN=[...GSEEN,...qs.map(q=>q.q)];
  return qs;
}
function startQuiz(){
  GQ=buildQuiz(); GSCORE=0; GIDX=0; GPICK=null; GDONE=false;
  if(!GQ.length){toast('Not enough games logged for that one yet');return}
  haptic('light'); render();
}
function answerQuiz(opt){
  if(!GQ||!GQ[GIDX]||GPICK!==null)return;
  GPICK=opt;
  const right=GQ[GIDX].a===opt;
  if(right){GSCORE++;haptic('success')}else haptic('heavy');
  render();
  /* the quiz can be quit while this is pending, so re-check before touching it */
  const token=GQ;
  setTimeout(()=>{
    if(!GQ||GQ!==token)return;
    if(GIDX>=GQ.length-1){GDONE=true;postScore('quiz',GSCORE,`${GSEEN.length} questions seen`)}else{GIDX++;GPICK=null}
    render();
  },900);
}
function quitQuiz(){ GQ=null; GDONE=false; render(); }

/* ============ SEASON END ============ */
function preflight(){
  const S=season(), gs=allGames(), out=[];
  const ok=(t,d)=>out.push({ok:true,t,d});
  const bad=(t,d)=>out.push({ok:false,t,d});
  const warn=(t,d)=>out.push({ok:null,t,d});
  gs.length?ok(`${gs.length} games logged`,'The season has a record'):bad('No games logged','There is nothing to end');
  const noRes=gs.filter(g=>!g.result);
  noRes.length?bad(`${noRes.length} games without a result`,'Fix them before ending'):ok('Every game has a result','');
  const mismatch=gs.filter(g=>{
    const sum=Object.values(g.goals||{}).reduce((t,n)=>t+n,0);
    return sum>((g.scoreA||0)+(g.scoreB||0));
  });
  mismatch.length?bad(`${mismatch.length} games with more scorers than goals`,'Check the scorelines'):ok('Scorers match the scorelines','');
  const open=bets().open.length;
  open?warn(`${open} open bet${open===1?'':'s'}`,'They will be voided and refunded'):ok('No open bets','');
  const half=(fpl().managers||[]).filter(m=>m.teamName&&m.squad.length&&m.squad.length<FPL_RULES.squadSize);
  half.length?warn(`${half.length} incomplete fantasy team${half.length===1?'':'s'}`,'They will score what they have'):ok('Fantasy teams are complete','');
  let backup=null;
  try{ backup=localStorage.getItem('ss_last_backup') }catch(e){}
  const days=backup?Math.floor((Date.now()-(+backup))/86400000):null;
  (days!==null&&days<=14)?ok(`Backup taken ${days===0?'today':days+' day'+(days===1?'':'s')+' ago'}`,'')
    :warn('No recent backup','Download one from Admin first');
  return out;
}
function seasonAwards(){
  const st=statsAll().filter(x=>x.P>0), p=id=>(player(id)||{}).name||'—';
  const out=[];
  const table=[...st].sort((a,b)=>b.pts-a.pts||b.GD-a.GD);
  if(table[0])out.push({e:'🏆',t:'Champion',who:p(table[0].id),id:table[0].id,
    d:`${table[0].pts} points from ${table[0].P} games`});
  const boot=[...st].sort((a,b)=>b.G-a.G)[0];
  if(boot&&boot.G)out.push({e:'👟',t:'Golden Boot',who:p(boot.id),id:boot.id,d:`${boot.G} goals`});
  const def=st.filter(x=>['DEF','GK'].includes((player(x.id)||{}).pos)&&x.P>=3)
    .sort((a,b)=>(a.GA/a.P)-(b.GA/b.P))[0];
  if(def)out.push({e:'🧤',t:'Golden Defence',who:p(def.id),id:def.id,
    d:`${(def.GA/def.P).toFixed(1)} conceded a game`});
  const mid=st.filter(x=>(player(x.id)||{}).pos==='MID'&&x.P>=3)
    .sort((a,b)=>(b.pts+b.G*2)-(a.pts+a.G*2))[0];
  if(mid)out.push({e:'🎩',t:'Golden Midfielder',who:p(mid.id),id:mid.id,d:`${mid.pts} points, ${mid.G} goals`});
  const imp=mostImproved()[0];
  if(imp)out.push({e:'📈',t:'Most Improved',who:imp.name,id:imp.id,d:`+${imp.delta.toFixed(2)} points a game`});
  const bd=st.map(x=>({...x,xp:(careerOf(x.id)||{xp:0}).xp})).sort((a,b)=>b.xp-a.xp)[0];
  if(bd)out.push({e:'🥇',t:"Ballon d'Or",who:p(bd.id),id:bd.id,
    d:`${bd.xp.toLocaleString()} XP · ${(careerOf(bd.id)||{}).lvl.t}`});
  const ft=fplTable();
  if(ft.length)out.push({e:'🕹️',t:'Sunday FPL',who:ft[0].m.teamName||ft[0].m.name,id:ft[0].m.pid,
    d:`${ft[0].total} points`});
  const bt=betTable().filter(x=>pnl(x.m.pid).played>0)
    .sort((a,b)=>pnl(b.m.pid).profit-pnl(a.m.pid).profit)[0];
  if(bt)out.push({e:'🎰',t:'Best on the Betting',who:bt.m.name,id:bt.m.pid,
    d:`${usdSigned(pnl(bt.m.pid).profit)} profit`});
  return out;
}

async function runEndSeason(){

/* ============ MOMENTS ============
   Derived from the games, so they cannot drift out of step with the record.
   Only the people who played that day own one. */
function moments(){
  const gs=allGames(); const out=[]; 
  let seenHat=false, seenTen=false, bestBy={}, scoredBy={};
  gs.forEach((g,idx)=>{
    const played=[...(g.teamA||[]),...(g.teamB||[])];
    const total=(g.scoreA||0)+(g.scoreB||0);
    const add=(id,e,t,line)=>out.push({id:`${g.id}|${id}`,gid:g.id,e,t,line,
      date:g.date,round:g.round,score:`${g.scoreA}–${g.scoreB}`,owners:played.slice()});
    if(idx===0)add('first','🌅','The First Sunday',
      `Where it started. ${g.scoreA}–${g.scoreB}, and nobody knew what they were beginning.`);
    Object.entries(g.goals||{}).forEach(([pid,n])=>{
      const nm=(player(pid)||{}).name||'someone';
      if(n>=3&&!seenHat){seenHat=true;add('hat','⚡','First Hat-Trick of the Season',
        `${nm} took the ball home. Three goals and no arguments.`)}
      if(n>=4)add('four_'+pid,'🎯',`${nm} scored four`,
        `Four in one afternoon. The kind of day people bring up years later.`);
      if(!scoredBy[pid]){scoredBy[pid]=true;
        if(idx>0)add('debut_'+pid,'🥅',`${nm}'s first goal`,`Off the mark at last.`)}
    });
    if(total>=10&&!seenTen){seenTen=true;add('ten','🔥','The Ten Goal Game',
      `${total} goals in one game. Defending was optional and everybody enjoyed it.`)}
    if(Math.abs((g.scoreA||0)-(g.scoreB||0))>=6)add('rout','💥','The Rout',
      `${g.scoreA}–${g.scoreB}. Somebody had a very quiet drive home.`);
    if((g.scoreA||0)===(g.scoreB||0)&&total>=12)add('epic','🤯','The One That Would Not End',
      `${g.scoreA}–${g.scoreB}. Two teams that refused to stop scoring or defending.`);
    if(idx===gs.length-1&&gs.length>=10)add('decider','🏆','The Final Sunday',
      `The last game of the season, and the table settled for good.`);
  });
  return out.map((m,i)=>({...m,serial:i+1}));
}
function momentsFor(pid){ return moments().filter(m=>m.owners.includes(pid)) }
function momentCard(m,pid){
  const n=m.owners.indexOf(pid);
  return `<div class="moment ${pid?cosmClass(pid):''}">
    <div class="mtag">MOMENT · UNREPEATABLE</div>
    <div class="mtitle">${m.e} ${esc(m.t)}</div>

      <span class="serial">${pid&&n>=0?`#${String(n+1).padStart(3,'0')} / ${m.owners.length}`:`${m.owners.length} owners`}</span></div>

}

/* ============ SHOP & WAGES ============
   One wallet. Wages are earned by playing and rise with your career level; the
   same balance funds bets and cosmetics. The split is shown so people can see
   how much they earned honestly versus how much came from gambling. */
const WAGE={base:350, perLevel:50, appearance:450, win:650, draw:280, goal:500,
  /* Paid on goals let in. This league concedes about five a game, so the table
     still pays well at five and six — it never drops to nothing. */
  defend:[1700,1450,1250,1050,850,700,550,400],
  defendW:{GK:1.15, DEF:1, MID:0.55, ATT:0.25}};
function weeklyWage(pid){
  const c=careerOf(pid);
  const lvl=c?c.lvl.n:1;
  return WAGE.base + (lvl-1)*WAGE.perLevel;      /* Level 1 earns exactly the base */
}
/* what a player earned in one gameweek — deterministic, so it can be replayed */
function wagesForGw(pid,gw){
  const gs=gamesInGw(gw).filter(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(pid));
  if(!gs.length)return 0;
  const pos=(player(pid)||{}).pos||'MID';
  const dw=WAGE.defendW[pos]??0.55;
  let t=weeklyWage(pid)+(bootFor(pid)?bootFor(pid).bonus:0);
  gs.forEach(g=>{
    t+=WAGE.appearance;
    const a=(g.teamA||[]).includes(pid);
    const won=(a&&g.result==='A')||(!a&&g.result==='B');
    if(won)t+=WAGE.win; else if(g.result==='D')t+=WAGE.draw;
    t+=((g.goals||{})[pid]||0)*WAGE.goal;
    const con=a?(g.scoreB||0):(g.scoreA||0);
    t+=Math.round((WAGE.defend[Math.min(con,7)]||0)*dw);
  });
  return t;
}
/* pay everyone for any gameweek they have not been paid for yet */
/* pay a sponsor the instant its target is met, rather than making people wait */
function paySponsors(){
  const b=bets(), f=fpl();
  if(!b.spPaid)b.spPaid={};
  let paid=[];
  (f.managers||[]).forEach(m=>{
    if(b.spPaid[m.pid])return;
    const sp=sponsorProgress(m.pid);
    if(sp&&sp.done){
      b.spPaid[m.pid]=sp.id;
      b.wallets[m.pid]=wallet(m.pid)+sp.pay;
      paid.push({pid:m.pid,name:m.name,n:sp.n,pay:sp.pay});
    }
  });
  return paid;
}
function sponsorPaid(pid){ return !!(bets().spPaid||{})[pid] }
function payWages(){
  const b=bets(), f=fpl();
  if(!b.paid)b.paid={};
  if(!b.earned)b.earned={};
  let total=0;
  playedGws().forEach(gw=>{
    (f.managers||[]).forEach(m=>{
      const key=m.pid+'|'+gw;
      if(b.paid[key])return;
      const amt=wagesForGw(m.pid,gw);
      if(!amt){b.paid[key]=0;return}
      b.paid[key]=amt;
      b.earned[m.pid]=(b.earned[m.pid]||0)+amt;
      b.wallets[m.pid]=wallet(m.pid)+amt;
      total+=amt;
    });
  });
  return total;
}
function wagesEarned(pid){ return (bets().earned||{})[pid]||0 }
function spentInShop(pid){ return (bets().spent||{})[pid]||0 }
/* net profit or loss from betting alone, so the wallet can show its make-up */
function bettingNet(pid){
  const h=bets().settled.filter(x=>x.by===pid&&x.res!=='void');
  return h.reduce((t,x)=>t+((x.ret||0)-x.stake),0);
}

/* ============ BETTING ============
   Play money only. Odds are priced from each player's own record, so a striker
   who scores in most games is genuinely short. Markets are per player because
   teams are not known until Sunday. */
const BET_RULES={start:10000, min:10, max:2500, margin:0.90, bailout:1000};
const usd=n=>'$'+Math.round(n).toLocaleString('en-US');
const usdSigned=n=>(n>0?'+':n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
function bets(){
  const S=season();
  if(!S.bets)S.bets={wallets:{},open:[],settled:[]};
  if(!S.bets.wallets)S.bets.wallets={};
  if(!S.bets.open)S.bets.open=[];
  if(!S.bets.settled)S.bets.settled=[];
  return S.bets;
}
function wallet(pid){
  const b=bets();
  if(b.wallets[pid]==null)b.wallets[pid]=BET_RULES.start;
  return b.wallets[pid];
}
/* odds from a probability, with a small house margin so it is not a free lunch */
function toOdds(p){
  const q=Math.max(0.04,Math.min(0.94,p));
  return Math.max(1.05,Math.round((1/q)*BET_RULES.margin*100)/100);
}
/* how often has this happened, softened toward a prior when there is little data */
/* Blend a position-based opening price with what the player has actually done.
   Early on the prior dominates, so week one is sensibly segmented by position.
   After a handful of games the real record takes over almost entirely. */
function rate(hits,games,prior){
  const k=3;
  return (hits + (prior??0.3)*k) / (games + k);
}
/* Opening prices before anyone has a record. Tuned to this league: roughly
   5 goals against a side per game, so a clean sheet is genuinely rare and
   conceding under 8 is close to routine. */
const BET_PRIORS={
  ATT:{g1:.58,g2:.26,g3:.09,g4:.03, win:.45, motm:.16},
  MID:{g1:.38,g2:.13,g3:.04,g4:.012,win:.45, motm:.14},
  DEF:{g1:.20,g2:.05,g3:.012,g4:.004,win:.45,motm:.12},
  GK :{g1:.03,g2:.01,g3:.003,g4:.001,win:.45,motm:.10},
};
/* conceded ladder — the same for everyone, it is a team outcome */
const CONCEDE_PRIOR={0:.04,1:.10,2:.22,3:.38,4:.55,5:.70,6:.82,7:.90};
/* How strong is this player relative to the group? Keeps the best player's
   prices short even before their own sample is large. */
function formEdge(pid){
  const st=statsAll().filter(x=>x.P>=2);
  if(st.length<3)return 1;
  const me=st.find(x=>x.id===pid);
  if(!me)return 1;
  const avg=st.reduce((t,x)=>t+x.ppg,0)/st.length;
  if(!avg)return 1;
  return Math.max(0.65,Math.min(1.5,me.ppg/avg));
}
function playerMarkets(pid){
  const gs=allGames().filter(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(pid));
  const n=gs.length;
  const p=player(pid)||{};
  const goals=g=>((g.goals||{})[pid]||0);
  const conceded=g=>((g.teamA||[]).includes(pid)?(g.scoreB||0):(g.scoreA||0));
  const won=g=>{const a=(g.teamA||[]).includes(pid);return (a&&g.result==='A')||(!a&&g.result==='B')};
  const PR=BET_PRIORS[p.pos||'MID']||BET_PRIORS.MID;
  const edge=formEdge(pid);
  const M=[];
  const add=(k,l,d,hits,prior,grp,scale)=>{
    let pr=rate(hits,n,prior);
    if(scale)pr=Math.max(0.01,Math.min(0.94,pr*edge));
    M.push({k,l,d,grp,p:pr,pid,odds:toOdds(pr),n});
  };
  /* --- goals --- */
  [[1,'To score','Any time'],[2,'To score 2 or more','A brace or better'],
   [3,'To score a hat-trick','Three or more'],[4,'To score 4 or more','A big afternoon']]
   .forEach(([t,l,d])=>add('g'+t,l,d,gs.filter(g=>goals(g)>=t).length,PR['g'+t],'Goals',true));
  /* --- goals against, full ladder --- */
  add('c0','Clean sheet','Their team concedes none',
      gs.filter(g=>conceded(g)===0).length,CONCEDE_PRIOR[0],'Goals against');
  for(let t=1;t<=7;t++){
    add('c'+t,`Concede under ${t+1}`,`${t} or fewer against`,
        gs.filter(g=>conceded(g)<=t).length,CONCEDE_PRIOR[t],'Goals against');
  }
  /* --- the rest --- */
  add('win','To be on the winning side','Their team wins',gs.filter(won).length,PR.win,'Result');
  add('motm','Top rating of the day','Highest rated on the pitch',
      gs.filter(g=>{const r=matchRatings(g);return r.length&&r[0].id===pid}).length,PR.motm,'Result',true);
  return M.map(m=>({...m,edge}));
}
function marketResult(pid,g,k){
  const on=[...(g.teamA||[]),...(g.teamB||[])].includes(pid);
  if(!on)return null;                                    // did not play, bet is void
  const goals=(g.goals||{})[pid]||0;
  const a=(g.teamA||[]).includes(pid);
  const con=a?(g.scoreB||0):(g.scoreA||0);
  const won=(a&&g.result==='A')||(!a&&g.result==='B');
  if(k[0]==='g'&&/^\d$/.test(k[1]))return goals>=(+k[1]);
  if(k[0]==='c'&&/^\d$/.test(k[1]))return con<=(+k[1]);
  if(k==='win')return won;
  if(k==='motm'){const r=matchRatings(g);return !!(r.length&&r[0].id===pid)}
  return null;
}
function betLabel(k){
  if(k==='win')return 'On the winning side';
  if(k==='motm')return 'Top rating';
  if(k[0]==='g')return k[1]==='1'?'To score':`To score ${k[1]}+`;
  if(k[0]==='c')return k[1]==='0'?'Clean sheet':`Concede under ${(+k[1])+1}`;
  return k;
}
const BET_LABEL=new Proxy({},{get:(t,k)=>betLabel(String(k))});

async function cancelBet(id){
