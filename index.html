/* ============ PLAYER ANALYTICS ============
   Six attributes, an archetype, and a set of pattern detectors. Everything is
   computed from games already logged — no model, no guessing, so a number here
   can always be traced back to a Sunday. */

/* each axis 0-100, scored against others in the SAME position, so a defender
   is never measured against a striker's goal rate */
function playerAxes(pid){
  const all=statsAll().filter(x=>x.P>0);
  const me=all.find(x=>x.id===pid); if(!me)return null;
  /* measured against the whole squad, not just your position — these are what
     you actually did, not what is impressive for a defender */
  const pool=all;
  const games=allGames();
  const consistencyOf=id=>{
    const rs=games.filter(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(id))
      .map(g=>ratingFor(id,g)).filter(v=>v!=null);
    if(rs.length<2)return 0.5;
    const mean=rs.reduce((t,v)=>t+v,0)/rs.length;
    const sd=Math.sqrt(rs.reduce((t,v)=>t+(v-mean)*(v-mean),0)/rs.length);
    return Math.max(0,1-sd/2.2);            /* steady = high */
  };
  const raw={
    Finishing:x=>x.G/Math.max(1,x.P),
    Creating:x=>(x.A||0)/Math.max(1,x.P),
    Winning:x=>x.pts/Math.max(1,x.P),
    Defending:x=>-(x.GA/Math.max(1,x.P)),
    Availability:x=>x.P,
    Consistency:x=>consistencyOf(x.id)
  };
  const out={};
  Object.keys(raw).forEach(k=>{
    const vals=pool.map(raw[k]);
    const lo=Math.min(...vals), hi=Math.max(...vals);
    const v=raw[k](me);
    out[k]=hi===lo?60:Math.round(8+92*((v-lo)/(hi-lo)));
  });
  /* players with Strava data get two more axes; everyone else keeps six */
  const sx=stravaAxes(pid); if(sx)Object.assign(out,sx);
  return out;
}

/* a label for how someone actually plays, from the axes */
function archetypeOf(pid){
  const a=playerAxes(pid); if(!a)return null;
  const pos=(player(pid)||{}).pos||'MID';
  const top=Object.entries(a).sort((x,y)=>y[1]-x[1]);
  const [k1,v1]=top[0], k2=top[1][0];
  /* the label has to fit the position — a midfielder is never a Poacher */
  const BY={
    ATT:{Finishing:['Poacher','Lives on the shoulder'],
         Creating:['False Nine','Drops in and makes them'],
         Winning:['Match Winner','Turns up when it counts'],
         Defending:['Pressing Forward','Defends from the front'],
         Availability:['Ever Present','First name on the sheet'],
         Consistency:['Reliable Forward','Same threat every week']},
    MID:{Finishing:['Goalscoring Midfielder','Arrives late in the box'],
         Creating:['Playmaker','The last pass is his'],
         Winning:['Orchestrator','Sets the tempo, wins games'],
         Defending:['Holding Midfielder','Screens everything'],
         Availability:['Engine','Never comes off'],
         Consistency:['Metronome','Same performance every week']},
    DEF:{Finishing:['Attacking Defender','Turns up for corners'],
         Creating:['Ball-Playing Defender','Starts it from the back'],
         Winning:['Leader','The team wins with him in it'],
         Defending:['The Wall','Built to keep them out'],
         Availability:['Anchor','Never misses, never beaten'],
         Consistency:['Rock','You know what you get']},
    GK:{Finishing:['Sweeper Keeper','Comes off his line'],
        Creating:['Distributor','Starts the attack'],
        Winning:['Winner','Somehow the score is always right'],
        Defending:['Shot Stopper','Keeps them out'],
        Availability:['Ever Present','First name on the sheet'],
        Consistency:['Safe Hands','No surprises']}
  };
  const set=BY[pos]||BY.MID;
  const hit=[true].map(()=>set[k1]||['All-Rounder','Does a bit of everything'])[0];
  return {name:hit[0],line:hit[1],lead:k1,leadV:v1,second:k2,pos};
}
/* the hexagon */
const AX_SHORT={Finishing:'FIN',Creating:'CRE',Winning:'WIN',Defending:'DEF',
  Availability:'APP',Consistency:'CON',Stamina:'STA','Work rate':'WRK'};
function radarSVG(axes,size){
  if(!axes)return '';
  const keys=Object.keys(axes), n=keys.length, S=size||210, C=S/2, R=S*0.32;
  const pt=(i,r)=>{const a=(Math.PI*2*i/n)-Math.PI/2;
    return [C+Math.cos(a)*r, C+Math.sin(a)*r];};
  const ring=f=>keys.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const shape=keys.map((k,i)=>pt(i,R*(axes[k]/100)).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 ${S} ${S}" style="width:100%;max-width:300px;display:block;margin:0 auto">
    ${[1,.75,.5,.25].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--sep)" stroke-width="1"/>`).join('')}
    ${keys.map((_,i)=>{const [x,y]=pt(i,R);
      return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--sep)" stroke-width="1"/>`}).join('')}
    <polygon points="${shape}" fill="var(--tint)" fill-opacity=".26" stroke="var(--tint)" stroke-width="2.4" stroke-linejoin="round"/>
    ${keys.map((k,i)=>{const [x,y]=pt(i,R*1.34);
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
        font-size="10.5" font-weight="800" fill="var(--label3)" letter-spacing=".06em">${AX_SHORT[k]||k.slice(0,3).toUpperCase()}</text>`}).join('')}
    ${keys.map((k,i)=>{const [x,y]=pt(i,R*1.34);
      return `<text x="${x.toFixed(1)}" y="${(y+11).toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
        font-size="9" font-weight="700" fill="var(--tint)">${axes[k]}</text>`}).join('')}
    ${keys.map((k,i)=>{const [x,y]=pt(i,R*(axes[k]/100));
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--tint)"/>`}).join('')}
  </svg>`;
}

/* a small inline line chart */
function sparkPath(vals,w,h){
  if(!vals.length)return '';
  const lo=Math.min(...vals), hi=Math.max(...vals), sp=hi-lo||1;
  return vals.map((v,i)=>`${(i/Math.max(1,vals.length-1))*w},${h-((v-lo)/sp)*h}`).join(' ');
}
function lineChart(vals,label,baseline){
  if(vals.length<2)return '';
  const W=300,H=90;
  const lo=Math.min(...vals,baseline??Infinity), hi=Math.max(...vals,baseline??-Infinity);
  const sp=(hi-lo)||1;
  const y=v=>H-((v-lo)/sp)*H;
  const pts=vals.map((v,i)=>`${(i/Math.max(1,vals.length-1))*W},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="-2 -8 ${W+4} ${H+16}" style="width:100%;height:118px;overflow:visible">
    ${baseline!=null?`<line x1="0" y1="${y(baseline).toFixed(1)}" x2="${W}" y2="${y(baseline).toFixed(1)}"
      stroke="var(--label3)" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>`:''}
    <polyline points="${pts}" fill="none" stroke="var(--tint)" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${((i/Math.max(1,vals.length-1))*W).toFixed(1)}" cy="${y(v).toFixed(1)}"
      r="${i===vals.length-1?3.6:2.2}" fill="var(--tint)"/>`).join('')}
  </svg>${label?`<div class="note" style="padding:6px 0 0">${label}</div>`:''}`;
}

/* a donut, for where someone's contributions come from */
function donut(parts,size){
  const tot=parts.reduce((t,p)=>t+p.v,0); if(!tot)return '';
  const S=size||132, C=S/2, R=S*0.36, TH=S*0.15;
  let a=-Math.PI/2, out='';
  parts.forEach(p=>{
    const frac=p.v/tot, end=a+frac*Math.PI*2;
    const big=frac>0.5?1:0;
    const x1=C+Math.cos(a)*R, y1=C+Math.sin(a)*R;
    const x2=C+Math.cos(end)*R, y2=C+Math.sin(end)*R;
    if(frac>0.999){ out+=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${p.c}" stroke-width="${TH}"/>`; }
    else out+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
      fill="none" stroke="${p.c}" stroke-width="${TH}" stroke-linecap="butt"/>`;
    a=end;
  });
  return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px;flex:0 0 ${S}px">${out}
    <text x="${C}" y="${C-2}" text-anchor="middle" dominant-baseline="middle"
      font-size="20" font-weight="800" fill="var(--label)">${tot}</text>
    <text x="${C}" y="${C+15}" text-anchor="middle" dominant-baseline="middle"
      font-size="8.5" font-weight="700" fill="var(--label3)" letter-spacing=".08em">TOTAL</text></svg>`;
}

/* ---- football intelligence: patterns worth telling someone about ---- */
function playerInsights(pid){
  const out=[], games=allGames(), st=statsAll(), me=st.find(x=>x.id===pid);
  if(!me||!me.P)return out;
  const nm=id=>(player(id)||{}).name||'—';
  const mine=games.filter(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(pid));
  const rate=g=>ratingFor(pid,g);
  /* form */
  const rs=mine.map(rate).filter(v=>v!=null);
  if(rs.length>=6){
    const last=rs.slice(-5), avgL=last.reduce((t,v)=>t+v,0)/last.length;
    const avgA=rs.reduce((t,v)=>t+v,0)/rs.length;
    if(avgL-avgA>=0.5)out.push({s:90,e:'🔥',t:'Best form of the season',
      d:`Your average rating over the last 5 is ${avgL.toFixed(1)}, against ${avgA.toFixed(1)} for the season.`});
    else if(avgA-avgL>=0.6)out.push({s:60,e:'📉',t:'Off the boil',
      d:`Last 5 average ${avgL.toFixed(1)}, down from ${avgA.toFixed(1)}.`});
  }
  /* nemesis — someone who keeps scoring against you */
  const opp={};
  mine.forEach(g=>{
    const onA=(g.teamA||[]).includes(pid);
    const them=onA?(g.teamB||[]):(g.teamA||[]);
    them.forEach(id=>{
      const n=(g.goals||{})[id]||0;
      opp[id]=opp[id]||{run:0,best:0,tot:0};
      if(n>0){opp[id].run++;opp[id].tot+=n;opp[id].best=Math.max(opp[id].best,opp[id].run)}
      else opp[id].run=0;
    });
  });
  const nem=Object.entries(opp).filter(([,v])=>v.best>=3).sort((a,b)=>b[1].best-a[1].best)[0];
  if(nem)out.push({s:85,e:'👀',t:'Interesting matchup',
    d:`${esc(nm(nem[0]))} has scored against your team in ${nem[1].best} straight meetings.`});
  /* who you win with */
  const pr=partnerships(3).filter(x=>x.a===pid||x.b===pid).sort((a,b)=>b.wr-a.wr)[0];
  if(pr&&pr.wr>=0.6)out.push({s:70,e:'🤝',t:'Better together',
    d:`With ${esc(nm(pr.a===pid?pr.b:pr.a))} you win ${Math.round(pr.wr*100)}% — ${pr.W} of ${pr.P}.`});
  /* breakout: first half vs second half */
  if(mine.length>=8){
    const h=Math.floor(mine.length/2);
    const wr=a=>a.filter(g=>{const onA=(g.teamA||[]).includes(pid);
      return (onA&&g.result==='A')||(!onA&&g.result==='B')}).length/Math.max(1,a.length);
    const w1=wr(mine.slice(0,h)), w2=wr(mine.slice(h));
    if(w2-w1>=0.18)out.push({s:80,e:'📈',t:'Breakout run',
      d:`Win rate up from ${Math.round(w1*100)}% to ${Math.round(w2*100)}% over the second half of your season.`});
  }
  /* the chase */
  const tbl=st.filter(x=>x.P>0).sort(tableSort);
  const i=tbl.findIndex(x=>x.id===pid);
  if(i>0){const above=tbl[i-1], gap=above.pts-me.pts;
    out.push({s:75,e:'🏆',t:'Race for '+(i===1?'top spot':'#'+i),
      d:gap<=0?`Level with ${esc(above.name)} — win rate is keeping you behind.`
        :`You need ${gap} more point${gap===1?'':'s'} to overtake ${esc(above.name)}.`});}
  /* streak */
  if(me.streak&&me.streak.n>=3)out.push({s:me.streak.type==='W'?88:50,
    e:me.streak.type==='W'?'🔥':'🧊',t:me.streak.type==='W'?'On a run':'Rough patch',
    d:`${me.streak.n} ${me.streak.type==='W'?'wins':me.streak.type==='L'?'losses':'draws'} in a row.`});
  /* hot streak in front of goal */
  if(me.P>=6){
    const recent=mine.slice(-4), rg=recent.reduce((t,g)=>t+((g.goals||{})[pid]||0),0);
    const rateAll=me.G/me.P, rateNow=rg/Math.max(1,recent.length);
    if(rateNow>=rateAll*1.8&&rg>=3)out.push({s:82,e:'⚡',t:'Red hot',
      d:`${rg} goals in your last ${recent.length} — well above your ${rateAll.toFixed(1)} a game.`});
  }
  return out.sort((a,b)=>b.s-a.s).slice(0,3);
}

/* season by season, for the career timeline */
function careerSeasons(pid){
  return (DB.seasons||[]).map(S=>{
    const lg=(S.comps||[]).find(c=>c.type==='league')||(S.comps||[])[0];
    const gs=(S.games||[]).filter(g=>!lg||g.compId===lg.id);
    let P=0,W=0,D=0,L=0,G=0,A=0,GF=0,GA=0;
    gs.forEach(g=>{
      const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
      if(!onA&&!onB)return;
      P++; G+=(g.goals||{})[pid]||0; A+=(g.assists||{})[pid]||0;
      const gf=onA?(g.scoreA||0):(g.scoreB||0), ga=onA?(g.scoreB||0):(g.scoreA||0);
      GF+=gf;GA+=ga;
      if(g.result==='D')D++; else if((onA&&g.result==='A')||(onB&&g.result==='B'))W++; else L++;
    });
    return {id:S.id,name:S.name,P,W,D,L,G,A,GF,GA,pts:W*3+D,
            wr:P?W/P:0,cur:S.id===DB.current};
  }).filter(x=>x.P>0);
}

/* ============ WEATHER ============
   Half the season is indoors, so this only ever applies to games marked
   outdoor. Free archive API — no key, no account, no per-user anything —
   which is why it works for all 29 rather than ten.
   Deliberately no forecasts and no insights: it decorates a game you
   already logged, nothing more. */
const WX_CACHE_KEY='wx_v1';
function wxCoords(){
  const s=season();
  return (s.lat!=null&&s.lng!=null)?{lat:+s.lat,lng:+s.lng}:{lat:25.2048,lng:55.2708}; /* Dubai */
}
/* Open-Meteo's archive lags a few days, so recent games come from the
   forecast endpoint, which keeps ~3 months of past days. */
function wxUrl(date){
  const {lat,lng}=wxCoords();
  const age=(Date.now()-new Date(date+'T12:00:00').getTime())/86400000;
  const base=age>7
    ? 'https://archive-api.open-meteo.com/v1/archive'
    : 'https://api.open-meteo.com/v1/forecast';
  return `${base}?latitude=${lat}&longitude=${lng}&start_date=${date}&end_date=${date}`
    +`&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max`
    +`&timezone=auto`;
}
async function wxFetch(date){
  try{
    const r=await fetch(wxUrl(date));
    if(!r.ok)return null;
    const d=await r.json();
    const dy=d&&d.daily; if(!dy||!dy.time||!dy.time.length)return null;
    const t=dy.temperature_2m_max?.[0], lo=dy.temperature_2m_min?.[0];
    const mm=dy.precipitation_sum?.[0], w=dy.windspeed_10m_max?.[0];
    if(t==null)return null;
    return {t:Math.round(t), lo:lo!=null?Math.round(lo):null,
            mm:mm!=null?+mm.toFixed(1):null, w:w!=null?Math.round(w):null};
  }catch(e){ return null }
}
/* Fill in anything missing, oldest first, a few at a time so a long back
   catalogue never blocks the interface. */
let WX_RUNNING=false;
async function wxBackfill(limit){
  if(WX_RUNNING)return; WX_RUNNING=true;
  try{
    const todo=allGames().filter(g=>g.venue==='out'&&!g.wx&&g.date).slice(0,limit||6);
    let got=0;
    for(const g of todo){
      const w=await wxFetch(g.date);
      if(w){ g.wx=w; got++ } else { g.wx={none:true} }
    }
    if(got){ await save(); render() }
  }catch(e){}
  WX_RUNNING=false;
}
/* one quiet line, never a heading */
function wxLine(g){
  if(!g||g.venue!=='out')return '';
  const w=g.wx; if(!w||w.none||w.t==null)return '';
  const bits=[`${w.t}°`];
  if(w.mm>=1)bits.push(w.mm>=6?'wet':'a bit of rain');
  if(w.w>=25)bits.push('windy');
  return `<span class="wx"> · ${bits.join(' · ')}</span>`;
}
const wxHot=()=>{
  const g=allGames().filter(x=>x.wx&&!x.wx.none&&x.wx.t!=null);
  if(!g.length)return null;
  return g.reduce((a,b)=>b.wx.t>a.wx.t?b:a);
};

/* ============ STRAVA ============
   Read-only from the app's side. Activities are attached by the webhook
   function; the app just displays them. Nothing here can create a game or
   mark anyone as having played — Strava only decorates games you logged. */
let STRAVA=[], STRAVA_WHO={}, STRAVA_STATE={};              /* activities; pid -> athlete name */
const stravaConfigured=()=>!STRAVA_CLIENT_ID.startsWith('REPLACE');

async function loadStrava(){
  if(!supaConfigured||!supa)return;
  try{
    const [{data:acts},{data:who}]=await Promise.all([
      supa.from('strava_activities').select('*'),
      supa.from('strava_connected').select('pid,athlete_name'),
    ]);
    STRAVA=acts||[];
    STRAVA_WHO={}; STRAVA_STATE={};
    (who||[]).forEach(w=>{
      STRAVA_WHO[w.pid]=w.athlete_name||'Connected';
      STRAVA_STATE[w.pid]={lapsed:!!w.lapsed, at:w.lapsed_at, last:w.last_ok};
    });
  }catch(e){ /* the profile simply shows no physical data */ }
}
/* ---- typed-in physical ----
   Not everyone can connect a wearable — Strava caps a free app at ten people,
   and Whoop the same. So anyone can type the three numbers their watch shows
   after a game. Stored in the season document, so it syncs and backs up with
   everything else. */
/* Calories rather than minutes: Whoop, Garmin and Apple Watch all show it
   after a session, and it reflects effort rather than just time on the pitch.
   Minutes still come through from Strava when a device reports them. */
const PHYS_BOUNDS={kcal:[80,2000], hr:[80,200], maxHr:[100,220], km:[0.5,20], mins:[20,150]};
function physLog(){ const s=season(); if(!s.phys)s.phys=[]; return s.phys }
const physFor=pid=>physLog().filter(x=>x.pid===pid);
const physGame=(pid,gid)=>physLog().find(x=>x.pid===pid&&x.gid===gid)||null;

/* A Strava row and a typed row describe the same thing, so normalise both
   into one shape before anything reads them. Strava wins when both exist —
   a device beats a memory. */
function physAll(pid){
  const out=stravaFor(pid).map(a=>({
    gid:a.game_id, mins:+a.moving_sec?+a.moving_sec/60:null,
    hr:+a.avg_hr||null, maxHr:+a.max_hr||null,
    km:+a.distance_m?+a.distance_m/1000:null, kcal:+a.calories||null,
    at:a.start_at, src:'strava'
  }));
  const have=new Set(out.map(x=>x.gid));
  physFor(pid).forEach(x=>{ if(!have.has(x.gid))out.push({...x,src:x.src||'typed'}) });
  return out.sort((a,b)=>{
    const ga=allGames().find(g=>g.id===a.gid), gb=allGames().find(g=>g.id===b.gid);
    return (ga?ga.created:0)-(gb?gb.created:0);
  });
}
const stravaFor=pid=>STRAVA.filter(a=>a.pid===pid);
const stravaGame=(pid,gid)=>STRAVA.find(a=>a.pid===pid&&a.game_id===gid)||null;

/* one player's physical picture, averaged over every game with data */
function stravaSummary(pid){
  const a=physAll(pid); if(!a.length)return null;
  const avg=(k)=>{const v=a.map(x=>+x[k]).filter(v=>isFinite(v)&&v>0);
    return v.length?v.reduce((t,x)=>t+x,0)/v.length:null};
  return {
    n:a.length,
    mins:avg('mins'), km:avg('km'), hr:avg('hr'), maxHr:avg('maxHr'), kcal:avg('kcal'),
    hasGps:a.some(x=>+x.km>0),
    typed:a.filter(x=>x.src!=='strava').length,
    synced:a.filter(x=>x.src==='strava').length,
  };
}

/* Two extra attributes, scored against the other connected players only —
   it would be meaningless to rank someone's heart rate against people who
   have no data. */
function stravaAxes(pid){
  const mine=stravaSummary(pid); if(!mine||mine.n<1)return null;
  const pool=[...new Set([...STRAVA.map(a=>a.pid),...physLog().map(x=>x.pid)])]
    .map(p=>stravaSummary(p)).filter(Boolean);
  const scale=(k,v)=>{
    const vals=pool.map(p=>p[k]).filter(x=>x!=null);
    if(v==null||vals.length<2){return 60}
    const lo=Math.min(...vals),hi=Math.max(...vals);
    return hi===lo?60:Math.round(8+92*((v-lo)/(hi-lo)));
  };
  return { Stamina:scale('kcal',mine.kcal), 'Work rate':scale('hr',mine.hr) };
}


/* ---- entering your own numbers ----
   Bounded so a typo or a joke cannot poison the averages, and every entry is
   stamped with who logged it and when, so the data is auditable rather than
   anonymous. Deliberately NOT wired to XP or challenges — the moment a number
   is worth points, someone games it. */
async function physAdd(pid,gid){
  const me=fplMine();
  if(!me)  { toast('Enter your code first'); return }
  if(me.pid!==pid && !isAdmin()){ toast('You can only log your own numbers'); return }

  const games=allGames().filter(g=>[...(g.teamA||[]),...(g.teamB||[])].includes(pid))
    .slice().sort((a,b)=>b.created-a.created);
  if(!games.length){ toast('No games played yet'); return }

  let g = gid ? games.find(x=>x.id===gid) : null;
  if(!g){
    const pick=await askChoice('Which game?','Pick the match these numbers came from',
      games.slice(0,8).map(x=>({
        label:`${x.round||fmtDate(x.date)} · ${x.scoreA}–${x.scoreB}${physGame(pid,x.id)?' ✓':''}`,
        value:x.id})));
    if(!pick)return;
    g=games.find(x=>x.id===pick);
  }
  if(!g)return;

  const prev=physGame(pid,g.id)||{};
  const ask=async(label,hint,key,cur)=>{
    const [lo,hi]=PHYS_BOUNDS[key];
    const v=await askText(label,`${hint} (${lo}–${hi})`,cur!=null?String(cur):'','Next');
    if(v==null)return null;
    if(v.trim()==='')return '';
    const n=parseFloat(v);
    if(!isFinite(n)||n<lo||n>hi){ toast(`${label} must be between ${lo} and ${hi}`); return undefined }
    return n;
  };
  const kcal=await ask('Calories','What your watch says you burned','kcal',prev.kcal);
  if(kcal===null||kcal===undefined)return;
  const hr=await ask('Average heart rate','The average your watch showed','hr',prev.hr);
  if(hr===null||hr===undefined)return;
  const maxHr=await ask('Max heart rate','The highest it hit','maxHr',prev.maxHr);
  if(maxHr===null||maxHr===undefined)return;
  const km=await ask('Distance in km','Leave blank if your device has no GPS','km',prev.km);
  if(km===null||km===undefined)return;

  if(hr!==''&&maxHr!==''&&+maxHr<=+hr){ toast('Max heart rate must be higher than the average'); return }
  if(kcal===''&&hr===''&&maxHr===''&&km===''){ toast('Nothing entered'); return }

  const log=physLog();
  const i=log.findIndex(x=>x.pid===pid&&x.gid===g.id);
  const row={ pid, gid:g.id, src:'typed', by:me.pid, at:Date.now(),
    kcal:kcal===''?null:+kcal, hr:hr===''?null:+hr,
    maxHr:maxHr===''?null:+maxHr, km:km===''?null:+km,
    mins:prev.mins??null };
  if(i>=0) log[i]=row; else log.push(row);
  await save(); haptic('light'); toast('Saved'); render();
}

/* what you are earning right now, shown where the level actually lives */
/* ============ PUSH NOTIFICATIONS ============
   Web Push, no third party. The browser holds the subscription, Supabase holds
   the list, and an Edge Function does the sending.

   The iOS catch, which decides whether any of this works for a given person:
   Safari only permits push when the app has been added to the home screen.
   In a browser tab the API is simply absent, so we detect that and say so
   plainly rather than showing a button that can never work. */

const pushSupported = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

/* isStandalone() and isIOS() already exist further down — reused here */

/* why push is unavailable, in words a player can act on */
function pushBlockedReason(){
  if(!pushSupported()){
    if(isIOS() && !isStandalone())
      return 'Add Super Sunday to your home screen first — iPhone only allows alerts from installed apps.';
    return 'This browser cannot do notifications.';
  }
  if(Notification.permission === 'denied')
    return 'Notifications are blocked in your browser settings for this site.';
  return null;
}

let SW_REG = null;
async function ensureSW(){
  if(SW_REG) return SW_REG;
  if(!('serviceWorker' in navigator)) return null;
  try{ SW_REG = await navigator.serviceWorker.register('/sw.js'); return SW_REG; }
  catch(e){ return null; }
}

function b64ToU8(base64){
  const pad='='.repeat((4 - base64.length % 4) % 4);
  const raw=atob((base64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function pushStatus(){
  const set=v=>{ if(PUSH_ON!==v){PUSH_ON=v;} return v };
  if(!pushSupported()) return set('unsupported');
  if(Notification.permission === 'denied') return set('denied');
  const reg = await ensureSW(); if(!reg) return set('unsupported');
  const sub = await reg.pushManager.getSubscription();
  return set(sub ? 'on' : 'off');
}
/* The bell reads a cached value so it can render synchronously. Refresh it
   whenever the answer could have changed, then repaint if it did. */
async function refreshPushState(){
  const was=PUSH_ON;
  await pushStatus();
  if(PUSH_ON!==was && typeof render==='function') render();
}

async function pushEnable(){
  const me = fplMine();
  if(!me){ toast('Enter your code first so we know who to notify'); return }
  const why = pushBlockedReason();
  if(why){ toast(why); return }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Not allowed — nothing will be sent'); render(); return }
    const reg = await ensureSW();
    if(!reg){ toast('Could not start the notification service'); return }
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({
      userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)
    });
    const j = sub.toJSON();
    if(supa){
      /* one row per device, so a person can have their phone and their iPad */
      await supa.from('push_subs').insert({
        pid: me.pid, name: me.name, endpoint: j.endpoint,
        p256dh: j.keys.p256dh, auth: j.keys.auth,
        ua: navigator.userAgent.slice(0,120)
      });
    }
    PUSH_ON='on'; haptic('light'); toast('🔔 Alerts on for this device'); render();
  }catch(e){ toast('Could not turn alerts on'); }
}

async function pushDisable(){
  try{
    const reg = await ensureSW(); if(!reg) return;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      const ep = sub.endpoint;
      await sub.unsubscribe();
      if(supa) await supa.from('push_subs').delete().eq('endpoint', ep);
    }
    PUSH_ON='off'; toast('Alerts off for this device'); render();
  }catch(e){ toast('Could not turn alerts off'); }
}

async function pushToggle(){
  const st = await pushStatus();
  if(st === 'on') return pushDisable();
  return pushEnable();
}

/* Fire a notification at the group. Never throws — a failed notification must
   never stop a game being saved. */
async function pushSend(title, body, kind, opts){
  try{
    if(!supaConfigured || PUSH_TOKEN.startsWith('REPLACE')) return;
    await fetch(PUSH_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-push-token': PUSH_TOKEN },
      body: JSON.stringify({ title, body, kind: kind||'general', ...(opts||{}) })
    });
  }catch(e){ /* silence is correct here */ }
}

let LADOPEN=false;
/* every level, shown up top so people can see what they are climbing towards */
function levelLadder(board){
  const me=board[0];
  const reached={};
  board.forEach(({m,c})=>{ for(let i=1;i<=c.lvl.n;i++)reached[i]=(reached[i]||0)+1 });
  /* Collapsed, show only what matters: the top of the ladder, the one you are
     chasing, and the one you are on. Everything else is a tap away. */
  const mine=fplMine();
  const c=mine?careerOf(mine.pid):(board[0]&&board[0].c);
  let show;
  if(LADOPEN){ show=LEVELS.slice().reverse(); }
  else {
    const top=LEVELS[LEVELS.length-1];
    const cur=c?LEVELS.find(L=>L.n===c.lvl.n):null;
    const nxt=c&&c.lvl.next?LEVELS.find(L=>L.n===c.lvl.next.n):null;
    const picks=[top,nxt,cur].filter(Boolean);
    const seen=new Set();
    show=picks.filter(L=>{ if(seen.has(L.n))return false; seen.add(L.n); return true })
              .sort((a,b)=>b.n-a.n);
    /* Someone at the top has no "next", and their level IS the top — which
       collapsed to a single lonely row. Pad downwards so there is always
       something to look at. */
    if(show.length<3){
      for(let i=LEVELS.length-1;i>=0&&show.length<3;i--){
        const L=LEVELS[i];
        if(!seen.has(L.n)){ seen.add(L.n); show.push(L); }
      }
      show.sort((a,b)=>b.n-a.n);
    }
  }
  return `<div class="sechead">🪜 The ${LEVELS.length} levels</div>
    <div class="card ladder">
      <div class="lad-top">
        <div class="lad-t"><b>Academy Prospect</b> → <b>Ballon d'Or</b></div>

          :`The top, the one you're chasing, and where you are now.`}</div>
      </div>
      <div class="lad-list">${show.map(L=>{
        const n=reached[L.n]||0, top=L.n>=30;
        return `<div class="lad-r ${top?'gold':''}">
          <div class="lad-b">${top?'🥇':L.e}</div>
          <div class="lad-i"><div class="lad-n">${esc(L.t)}</div>
            <div class="lad-x">LV${L.n} · ${L.xp.toLocaleString()} XP</div></div>
          <div class="lad-c">${n?`${n} there`:'—'}</div></div>`}).join('')}</div>
      <button class="lvltoggle" onclick="LADOPEN=!LADOPEN;render()">${LADOPEN?'Show fewer ▲':`See all ${LEVELS.length} levels ▼`}</button>
    </div>`;
}

/* ============ iOS-STYLE GESTURES ============ */
/* ============ HISTORY ============
   We snapshot the ACTUAL state you are leaving (which view, which player,
   which tab, where you were scrolled) rather than a fixed destination — so
   Denis's profile → his Career → back lands you on Denis's profile again. */
let BACKSTACK=[];
const NAV_LABEL={home:'Home',league:'League',fixtures:'Fixtures',squad:'Squad',tactics:'Tactics',
  career:'Career',fpl:'Sunday FPL',sky:'Sky Sports',bets:'Betting',shop:'Shop',gws:'Gameweeks',pgw:'Player',stats:'Stats',compare:'Compare',history:'Hall of Fame',
  comps:'Competitions',admin:'Admin',player:'Player',pcareer:'Career',match:'Match',seasonView:'Season'};
function viewSnap(){
  return {v:VIEW, pid:app()._pid, gid:app()._gid, sid:app()._sid,
    y:window.scrollY||0,
    t:{FTAB,HMODE,SMODE,CMODE,TAC,SCOMP,PF,SMIN,LADOPEN,POTMOPEN,LVLOPEN}};
}
const trimLabel=t=>{t=String(t||'Back'); return t.length>14?t.slice(0,13).trim()+'…':t};
function labelFor(snap){
  if(!snap)return 'Back';
  if(snap.v==='player'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Player')}
  if(snap.v==='pcareer'){const p=player(snap.pid); return trimLabel(p?p.name.split(' ')[0]:'Career')}
  return trimLabel(NAV_LABEL[snap.v]||'Back');
}
function backLabel(){ return labelFor(BACKSTACK[BACKSTACK.length-1]) }
function pushBack(){
  const snap=viewSnap();
  const top=BACKSTACK[BACKSTACK.length-1];
  /* don't stack the same place twice */
  if(top&&top.v===snap.v&&top.pid===snap.pid&&top.gid===snap.gid&&top.sid===snap.sid)return;
  BACKSTACK.push(snap);
  if(BACKSTACK.length>20)BACKSTACK.shift();
}
function goBack(){
  const s=BACKSTACK.pop();
  if(!s){ go('squad'); return; }
  haptic('light');
  VIEW=s.v;
  if(s.pid!=null)app()._pid=s.pid;
  if(s.gid!=null)app()._gid=s.gid;
  if(s.sid!=null)app()._sid=s.sid;
  const t=s.t||{};
  if(t.FTAB!=null)FTAB=t.FTAB; if(t.HMODE!=null)HMODE=t.HMODE; if(t.SMODE!=null)SMODE=t.SMODE;
  if(t.CMODE!=null)CMODE=t.CMODE; if(t.TAC!=null)TAC=t.TAC; if(t.SCOMP!=null)SCOMP=t.SCOMP;
  if(t.PF!=null)PF=t.PF; if(t.SMIN!=null)SMIN=t.SMIN; if(t.LADOPEN!=null)LADOPEN=t.LADOPEN;
  if(t.POTMOPEN!=null)POTMOPEN=t.POTMOPEN; if(t.LVLOPEN!=null)LVLOPEN=t.LVLOPEN;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===VIEW));
  render();
  requestAnimationFrame(()=>window.scrollTo(0,s.y||0));
}

function initGestures(){
  const main=document.querySelector('.main')||document.body;

  /* ---- swipe from left edge to go back ---- */
  let sx=0,sy=0,tracking=false,moved=0;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    tracking=(t.clientX<32);           // only from the left edge, like iOS
    sx=t.clientX;sy=t.clientY;moved=0;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!tracking||e.touches.length!==1)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if(dy>44){tracking=false;main.style.transform='';return}
    if(dx>0){moved=dx; main.style.transform=`translateX(${Math.min(dx*.35,60)}px)`; main.style.opacity=String(1-Math.min(dx/700,.2))}
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!tracking)return; tracking=false;
    main.style.transition='transform .26s cubic-bezier(.32,.72,0,1),opacity .26s';
    main.style.transform='';main.style.opacity='';
    setTimeout(()=>{main.style.transition=''},280);
    if(moved>90){ if(BACKSTACK.length){goBack()} }
    moved=0;
  },{passive:true});

  /* ---- pull to refresh (iOS style: arrow rotates, then becomes a spinner) ---- */
  const ind=document.createElement('div');
  ind.className='ptr';
  ind.innerHTML='<svg class="ptr-a" viewBox="0 0 24 24"><path d="M12 5v14M12 19l-5-5M12 19l5-5"/></svg><div class="ptr-s"></div>';
  document.body.appendChild(ind);
  const TRIG=72;
  let py=0,pulling=false,dist=0,armed=false,busy=false;
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||busy)return;
    pulling=(window.scrollY<=0); py=e.touches[0].clientY; dist=0; armed=false;
    ind.style.transition='';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling||e.touches.length!==1)return;
    if($('#sbg').classList.contains('open')||$('#vbg').classList.contains('open')){pulling=false;return}
    dist=e.touches[0].clientY-py;
    if(dist>0&&window.scrollY<=0){
      const d=Math.min(dist*0.55,96);                 // rubber-band
      const p=Math.min(d/TRIG,1);
      ind.style.transform=`translateY(${d}px)`;
      ind.style.opacity=String(Math.min(p*1.2,1));
      ind.querySelector('.ptr-a').style.transform=`rotate(${p>=1?180:p*180}deg)`;
      if(p>=1&&!armed){armed=true;haptic('light');ind.classList.add('armed')}
      if(p<1&&armed){armed=false;ind.classList.remove('armed')}
    }
  },{passive:true});
  document.addEventListener('touchend',async()=>{
    if(!pulling)return; pulling=false;
    ind.style.transition='transform .34s cubic-bezier(.32,.72,0,1),opacity .3s';
    if(armed){
      busy=true;
      ind.classList.add('spin');
      ind.style.transform='translateY(58px)'; ind.style.opacity='1';
      haptic('success');
      try{
        if(supa){
          const fresh=await Store.get(MAIN_KEY);
          if(fresh&&fresh.seasons&&fresh.seasons.length){
            DB=fresh; CUR=DB.current||DB.seasons[0].id;
            if(!season().comps.some(c=>c.id===COMP))COMP=season().comps[0].id;
          }
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,420));        // let the spinner be seen
      render();
      toast(CLOUD_FAIL?'⚠️ Could not reach the database':'↻ Up to date');
      busy=false;
    }
    ind.style.transform=''; ind.style.opacity='0';
    setTimeout(()=>{ind.style.transition='';ind.classList.remove('spin','armed');
      ind.querySelector('.ptr-a').style.transform='';},360);
    dist=0; armed=false;
  },{passive:true});

  /* ---- large title shrinks into the nav bar on scroll ---- */
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return; ticking=true;
    requestAnimationFrame(()=>{
      const lt=document.querySelector('.largetitle'), nb=document.querySelector('.navbar');
      if(lt&&nb){
        const y=window.scrollY, r=lt.getBoundingClientRect();
        const hidden=r.bottom<58;
        nb.classList.toggle('shrunk',hidden);
        if(hidden&&!nb.querySelector('.nb-title')){
          const t=document.createElement('div');t.className='nb-title';t.textContent=lt.textContent.trim();
          nb.appendChild(t);
        } else if(!hidden){ const t=nb.querySelector('.nb-title'); if(t)t.remove(); }
        lt.style.opacity=String(Math.max(0,1-Math.max(0,y)/70));
      }
      ticking=false;
    });
  },{passive:true});
}

/* Turn an SVG string into a PNG blob at 2x for crisp phone screens */
async function svgToPng(svg,w,h,scale){
  const sc=scale||2;
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('render'));img.src=url});
    const cv=document.createElement('canvas');
    cv.width=w*sc; cv.height=h*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0,w,h);
    return await new Promise(r=>cv.toBlob(r,'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
/* iOS-friendly: open the native share sheet (which offers "Save Image"),
   falling back to a plain download on desktop browsers. */
async function shareOrSave(blob,filename,title){
  if(!blob){toast('Could not create the image');return}
  const file=new File([blob],filename,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    try{ await navigator.share({files:[file],title}); toast('📤 Shared'); return; }
    catch(e){ if(e&&e.name==='AbortError')return; }
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast('📸 Saved to your downloads');
}

/* ============================================================
   SUNDAY FPL — a small fantasy game running off the real season.
   Squad of 3: one DEF, one MID, one ATT. Everyone starts at £10m.
   Teams lock the moment the first game of a gameweek is logged.
   ============================================================ */
const FPL_RULES={
  played:2, win:3, draw:1, assist:3,
  goal:{GK:6,DEF:6,MID:5,ATT:4},
  /* Paid on goals let in, indexed 0..8+. Calibrated for 7-a-side, where about
     five a side is a normal Sunday — so it still pays at realistic scorelines
     instead of only rewarding clean sheets. Nothing goes blank until 8+. */
  defence:{
    GK :[8,7,6,5,4,3,2,1,0],
    DEF:[8,7,6,5,4,3,2,1,0],
    MID:[4,4,3,3,2,2,1,1,0],
    ATT:[2,2,2,1,1,1,1,1,0]
  },
  hatTrick:3,
  budget:50, startPrice:8, chips:3,
  /* Prices move relative to each player's own starting price, so a £4m player
     can never become a £14m one. */
  /* One floor and one ceiling for everyone. No relative cap, so a player who
     keeps performing climbs as far as they deserve. The floor stops anyone
     becoming a free pick; the ceiling stops one player eating a whole budget. */
  minPrice:4, maxPrice:25,
  /* how far above or below the average of those who played, over 3 gameweeks */
  moveBig:24, moveMid:16, moveSmall:10,
  transfersPerWeek:2, transferBank:5, squadSize:5,
  slots:['DEF','MID','ATT'],
  eligible:['DEF','MID','ATT']
};
/* Opening prices for this squad. Anyone not listed starts at startPrice. */
const BASE_PRICES={
  Talal:14, Ziyad:14, Anas:14, Raza:10, Seb:8, Basil:8, Zach:8,
  Sourena:14, Jean:14, JR:14, Firas:10, Willem:10, Jordan:10,
  Wael:6, 'Soroush M':6, Koen:4,
  Denis:7, Liam:7, Nader:7, Purva:6, Luca:6, Ronak:6,
  Slade:5, 'Soroush S':5,
  Rayan:4, Noah:4, Dylan:4, Yousef:4, Joshua:4
};
/* Match a squad name to the price list without being fussy about case, spacing
   or extra names — "hassan  raza" and "Raza" both find the same entry. */
const _norm=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
const BASE_BY_NORM=(()=>{const o={};Object.entries(BASE_PRICES).forEach(([k,v])=>o[_norm(k)]=v);return o})();
function basePrice(pid){
  const p=player(pid); if(!p)return FPL_RULES.startPrice;
  if(p.basePrice!=null)return p.basePrice;          /* an explicit override always wins */
  const n=_norm(p.name);
  if(BASE_BY_NORM[n]!=null)return BASE_BY_NORM[n];
  /* try the surname, then any listed name contained in theirs */
  const parts=n.split(' ');
  const last=parts[parts.length-1];
  if(BASE_BY_NORM[last]!=null)return BASE_BY_NORM[last];
  const hit=Object.keys(BASE_BY_NORM).find(k=>{
    const kp=k.split(' ');
    return parts.includes(k)||kp.every(w=>parts.includes(w));
  });
  if(hit)return BASE_BY_NORM[hit];
  return FPL_RULES.startPrice;
}
function priceBand(pid){ return {lo:FPL_RULES.minPrice, hi:FPL_RULES.maxPrice} }
/* The cheapest legal five, so we can prove a team is always affordable. */
function cheapestLegalCost(){
  const pool=season().players.filter(p=>p.active!==false&&FPL_RULES.eligible.includes(p.pos||'MID'))
    .map(p=>({pos:p.pos||'MID',v:fplPrice(p.id)})).sort((a,b)=>a.v-b.v);
  if(pool.length<FPL_RULES.squadSize)return 0;
  const pick=[]; const used=new Set();
  FPL_RULES.slots.forEach(pos=>{
    const i=pool.findIndex((x,ix)=>x.pos===pos&&!used.has(ix));
    if(i>=0){used.add(i);pick.push(pool[i].v)}
  });
  pool.forEach((x,ix)=>{ if(pick.length<FPL_RULES.squadSize&&!used.has(ix)){used.add(ix);pick.push(x.v)} });
  return pick.reduce((t,v)=>t+v,0);
}
function fpl(){
  const S=season();
  if(!S.fpl)S.fpl={managers:[],gw:1,locked:false,prices:{},ticker:[],league:'Sunday FPL Mini League'};
  const f=S.fpl;
  if(!f.managers)f.managers=[];
  if(!f.prices)f.prices={};
  if(!f.ticker)f.ticker=[];
  if(!f.league)f.league='Sunday FPL Mini League';
  if(f.gw==null)f.gw=1;
  syncManagers();
  return f;
}
/* every squad player automatically gets a manager slot + private code */
function fplCode(name,id){
  const base=String(name||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)||'MGR';
  let h=0; const t=String(id||name);
  for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))>>>0}
  return base+'-'+h.toString(36).toUpperCase().slice(0,4).padEnd(4,'X');
}
function syncManagers(){
  const S=season(),f=S.fpl;
  const live=S.players.filter(p=>p.active!==false);
  live.forEach(p=>{
    if(!f.managers.some(m=>m.pid===p.id)){
      f.managers.push({pid:p.id,name:p.name,code:fplCode(p.name,p.id),
        teamName:null,squad:[],captain:null,transfers:{},wildcards:0,tripleCaps:0,tcGws:[],doublePts:0,dpGws:[],history:[],joined:Date.now()});
    }
  });
  /* Drop manager slots whose player no longer exists at all — otherwise a
     removed player keeps a private code and a row in the codes list forever.
     Someone merely marked inactive keeps their slot, so nothing is lost when
     they come back. */
  f.managers=f.managers.filter(m=>!!player(m.pid));
  f.managers.forEach(m=>{
    const p=player(m.pid); if(p)m.name=p.name;
    /* migrate the old single-use chip fields */
    if(m.wildcards==null)m.wildcards=m.wildcard?1:0;
    if(m.tripleCaps==null)m.tripleCaps=m.tripleCap?1:0;
    if(!m.tcGws)m.tcGws=m.tcGw?[m.tcGw]:[];
    if(m.doublePts==null)m.doublePts=0;
    if(!m.dpGws)m.dpGws=[];
  });
}
const fplManager=code=>fpl().managers.find(m=>m.code===String(code||'').trim().toUpperCase());
function fplRemember(code){
  try{localStorage.setItem('ss_fpl_code',code)}catch(e){}
  try{sessionStorage.setItem('ss_fpl_code',code)}catch(e){}
}
function fplForget(){

  try{sessionStorage.removeItem('ss_fpl_code')}catch(e){}
}
/* Personal links: opening  <site>/#c=CODE  signs that person in automatically.
   Phones sometimes clear stored data after a week of not opening a site, so a
   saved personal link means nobody ever has to retype their code. */
function fplAutoLogin(){
  try{
    const h=(location.hash||'').replace(/^#/,'');
    const m=h.match(/(?:^|&)c=([A-Za-z0-9\-]+)/);
    if(!m)return;
    const mgr=fplManager(decodeURIComponent(m[1]));
    if(mgr){
      fplRemember(mgr.code);
      try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}   // tidy the address bar
      setTimeout(()=>toast(`Welcome back, ${mgr.name}`),600);
    }
  }catch(e){}
}

const fplMine=()=>{
  let c=null;
  try{c=localStorage.getItem('ss_fpl_code')}catch(e){}
  if(!c){try{c=sessionStorage.getItem('ss_fpl_code')}catch(e){}}
  return c?fplManager(c):null;
};

/* ---------- prices ---------- */
function fplPrice(pid){
  const f=fpl();
  if(f.prices[pid]==null)f.prices[pid]=basePrice(pid);
  return f.prices[pid];
}
/* Prices are RECOMPUTED from scratch off the games that actually exist, rather
   than drifting incrementally. That makes them deterministic and self-healing:
   delete a game and the prices correct themselves instead of staying stuck. */
/* Single source of truth for prices. Returns the final price map, the moves
   made in the latest gameweek, and the full per-gameweek history — so the
   stocks chart can never drift from what the rest of the app shows. */
function walkPrices(){
  const S=season(), gws=playedGws();
  const live=S.players.filter(p=>p.active!==false);
  const price={}, hist={};
  live.forEach(p=>{ const b=basePrice(p.id); price[p.id]=b; hist[p.id]=[{gw:0,v:b}]; });
  let moves=[];
  gws.forEach((gw,idx)=>{
    const win=gws.slice(Math.max(0,idx-2),idx+1);
    const pts={}; live.forEach(p=>pts[p.id]=win.reduce((t,g)=>t+fplPlayerGw(p.id,g),0));
    /* Only players who actually turned out in this window are judged, and they
       are judged against each other. Including the people who did not play
       dragged the average down so far that simply showing up looked elite and
       everybody rose every week. Anyone absent holds their price. */
    const appeared=new Set();
    win.forEach(g=>gamesInGw(g).forEach(x=>
      [...(x.teamA||[]),...(x.teamB||[])].forEach(pid=>appeared.add(pid))));
    /* Compare points PER GAME PLAYED, not totals. With ten of thirty out each
       week, a three-week window mixes someone who played once with someone who
       played three times — so totals rewarded turning up rather than playing
       well, and regulars drifted upward every single week. */
    const apps={};
    live.forEach(p=>apps[p.id]=win.filter(g=>gamesInGw(g).some(x=>
      [...(x.teamA||[]),...(x.teamB||[])].includes(p.id))).length);
    const rate={}; live.forEach(p=>rate[p.id]=apps[p.id]?pts[p.id]/apps[p.id]:0);
    const vals=live.filter(p=>appeared.has(p.id)).map(p=>rate[p.id]);
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const stepMoves=[];
    live.forEach(p=>{
      if(!appeared.has(p.id)){ hist[p.id].push({gw,v:price[p.id]}); return }
      const diff=rate[p.id]-avg;
      /* Both sides are now per-game, so the bar is a per-game figure and does
         not need to change with the window length. */
      const big=FPL_RULES.moveBig/3, mid=FPL_RULES.moveMid/3, small=FPL_RULES.moveSmall/3;
      let d=0;
      if(diff>=big)d=0.5; else if(diff>=mid)d=0.3; else if(diff>=small)d=0.2;
      else if(diff<=-big)d=-0.5; else if(diff<=-mid)d=-0.3; else if(diff<=-small)d=-0.2;
      if(d){
        const was=price[p.id];
        const bd=priceBand(p.id);
        const now=Math.max(bd.lo,Math.min(bd.hi,Math.round((was+d)*10)/10));
        if(now!==was){ price[p.id]=now; stepMoves.push({pid:p.id,name:p.name,from:was,to:now}); }
      }
      hist[p.id].push({gw,v:price[p.id]});
    });
    if(idx===gws.length-1)moves=stepMoves;
  });
  return {price,moves,hist};
}
function recalcPrices(){
  const f=fpl(), r=walkPrices();
  f.prices=r.price;
  f.ticker=r.moves.slice(0,20);
  return r.moves;
}
const updatePrices=recalcPrices;    // keep the old name working

/* ---------- scoring ---------- */
/* points a player earned in one specific game */
function fplGamePoints(pid,g){
  const p=player(pid); if(!p||!g)return 0;
  const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
  if(!onA&&!onB)return 0;                       // didn't play
  /* use the position the player had ON THE DAY, so changing someone's position
     later never rewrites points they already earned */
  const pos=(g.pos&&g.pos[pid])||p.pos||'MID';
  const sd=onA?'A':'B';
  const ga=onA?(g.scoreB??0):(g.scoreA??0);
  const goals=(g.goals&&g.goals[pid])||0;
  const asts=(g.assists&&g.assists[pid])||0;
  let pts=FPL_RULES.played;
  if(g.result==='D')pts+=FPL_RULES.draw; else if(g.result===sd)pts+=FPL_RULES.win;
  pts+=goals*(FPL_RULES.goal[pos]||FPL_RULES.goal.MID);
  pts+=asts*FPL_RULES.assist;
  const dl=FPL_RULES.defence[pos]||FPL_RULES.defence.MID;
  pts+=dl[Math.min(ga??0,dl.length-1)];
  if(goals>=3)pts+=FPL_RULES.hatTrick;
  return pts;
}
/* the same sum as fplGamePoints, itemised — used by the gameweek history */
function fplBreakdown(pid,g){
  const p=player(pid); if(!p||!g)return null;
  const onA=(g.teamA||[]).includes(pid), onB=(g.teamB||[]).includes(pid);
  if(!onA&&!onB)return null;
  const pos=(g.pos&&g.pos[pid])||p.pos||'MID';
  const sd=onA?'A':'B';
  const ga=onA?(g.scoreB??0):(g.scoreA??0);
  const goals=(g.goals&&g.goals[pid])||0, asts=(g.assists&&g.assists[pid])||0;
  const rows=[{k:'Played',v:FPL_RULES.played}];
  if(g.result==='D')rows.push({k:'Draw',v:FPL_RULES.draw});
  else if(g.result===sd)rows.push({k:'Win',v:FPL_RULES.win});
  else rows.push({k:'Lost',v:0});
  if(goals)rows.push({k:`${goals} goal${goals>1?'s':''}`,v:goals*(FPL_RULES.goal[pos]||5)});
  if(asts)rows.push({k:`${asts} assist${asts>1?'s':''}`,v:asts*FPL_RULES.assist});
  const dl=FPL_RULES.defence[pos]||FPL_RULES.defence.MID;
  rows.push({k:`Conceded ${ga}`,v:dl[Math.min(ga??0,dl.length-1)]});
  if(goals>=3)rows.push({k:'Hat-trick bonus',v:FPL_RULES.hatTrick});
  return {pos,rows,total:rows.reduce((t,r)=>t+r.v,0)};
}
const gamesInGw=gw=>allGames().filter(g=>gwOf(g)===gw);
/* Which gameweek a game belongs to. Normally the round label carries the
   number ("GW3"). A game logged without one used to belong to NO gameweek at
   all — invisible to ratings, points, wages and prices, so anyone who only
   played in that game silently vanished. It now inherits the gameweek of
   anything else played the same day, and failing that gets its own. */
let _GWMAP=null,_GWKEY='';
function gwMap(){
  const gs=allGames();
  const key=gs.map(g=>g.id+':'+(g.round||'')+':'+(g.date||'')).join('|');
  if(_GWMAP&&_GWKEY===key)return _GWMAP;
  const map={},byDate={};
  gs.forEach(g=>{
    const m=String(g.round||'').match(/(\d+)/);
    if(m){ map[g.id]=+m[1]; if(g.date&&byDate[g.date]==null)byDate[g.date]=+m[1]; }
  });
  const known=Object.values(map);
  let next=(known.length?Math.max(...known):0)+1;
  gs.forEach(g=>{
    if(map[g.id]!=null)return;
    if(g.date&&byDate[g.date]!=null){ map[g.id]=byDate[g.date]; return }
    map[g.id]=next; if(g.date)byDate[g.date]=next; next++;
  });
  _GWMAP=map;_GWKEY=key;return map;
}
const gwOf=g=>{ if(!g)return null; const v=gwMap()[g.id]; return v==null?null:v };
/* a player's points across a gameweek (can be more than one game) */
function fplPlayerGw(pid,gw){
  return gamesInGw(gw).reduce((t,g)=>t+fplGamePoints(pid,g),0);
}
function fplRecentPoints(pid,n){
  const gws=playedGws().slice(-(n||3));
  return gws.reduce((t,gw)=>t+fplPlayerGw(pid,gw),0);
}
function playedGws(){
  const set=new Set();
  allGames().forEach(g=>{const n=gwOf(g); if(n)set.add(n)});
  return [...set].sort((a,b)=>a-b);
}
/* a manager's points for one gameweek, using the squad they had locked in */
function fplManagerGw(m,gw){
  if(!inGw(m,gw))return 0;      /* they had not joined yet */
  const snap=(m.history||[]).find(h=>h.gw===gw);
  const squad=snap?snap.squad:m.squad, cap=snap?snap.captain:m.captain;
  if(!squad||!squad.length)return 0;
  const mult=((m.tcGws||[]).includes(gw))?3:2;   // triple captain applies only to the gameweeks it was played on
  let total=squad.reduce((t,pid)=>{
    let p=fplPlayerGw(pid,gw);
    if(pid===cap)p*=mult;
    return t+p;
  },0);
  if((m.dpGws||[]).includes(gw))total*=2;       // double points doubles the whole week
  return total;
}
function fplManagerTotal(m){
  return playedGws().reduce((t,gw)=>t+fplManagerGw(m,gw),0);
}
function fplTable(){
  const f=fpl(), gws=playedGws(), last=gws[gws.length-1];
  const rows=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize).map(m=>({
    m, total:fplManagerTotal(m), gw:last?fplManagerGw(m,last):0, from:firstGwOf(m)
  })).sort((a,b)=>b.total-a.total||b.gw-a.gw);
  // movement vs previous gameweek
  const prevGws=gws.slice(0,-1);
  const prev=f.managers.filter(m=>m.teamName&&m.squad.length===FPL_RULES.squadSize)
    .map(m=>({id:m.pid,t:prevGws.reduce((s,gw)=>s+fplManagerGw(m,gw),0)}))
    .sort((a,b)=>b.t-a.t).map((x,i)=>({id:x.id,r:i+1}));
  rows.forEach((r,i)=>{
    const was=prev.find(p=>p.id===r.m.pid);
    r.move = was ? was.r-(i+1) : 0;
  });
  return rows;
}

/* ---------- player market stats ---------- */
function fplStats(){
  const f=fpl(), gws=playedGws();
  const managers=f.managers.filter(m=>m.squad&&m.squad.length===FPL_RULES.squadSize);
  const owners=managers.length||1;
  const totalGoals=allGames().reduce((t,g)=>t+Object.values(g.goals||{}).reduce((a,b)=>a+b,0),0)||1;
  return season().players.filter(p=>p.active!==false&&FPL_RULES.eligible.includes(p.pos||'MID')).map(p=>{
    const total=gws.reduce((t,gw)=>t+fplPlayerGw(p.id,gw),0);
    const form=gws.length?fplRecentPoints(p.id,3)/Math.min(3,gws.length):0;
    const owned=managers.filter(m=>m.squad.includes(p.id)).length;
    const st=statsAll().find(x=>x.id===p.id)||{G:0,P:0,cs:0};
    return {
      id:p.id,name:p.name,pos:p.pos||'MID',price:fplPrice(p.id),
      total, form:Math.round(form*10)/10,
      ownedPct:Math.round(owned/owners*100),
      threat:Math.round((st.G/totalGoals)*100),         // share of all goals scored
      ppg: st.P?Math.round(total/st.P*10)/10:0,
      value: total? Math.round(total/fplPrice(p.id)*10)/10 : 0,
      G:st.G, cs:st.cs, P:st.P,
      captainPct:Math.round(managers.filter(m=>m.captain===p.id).length/owners*100)
    };
  });
}

/* keep FPL consistent when games are removed */
function fplResync(){
  try{
    const f=fpl(), gws=new Set(playedGws());
    f.managers.forEach(m=>{ if(m.history)m.history=m.history.filter(h=>gws.has(h.gw)); });
    if(!gws.size){ f.gw=1; f.ticker=[]; }
    else f.gw=Math.max(...gws);
    recalcPrices();
  }catch(e){}
}

/* ---------- how scoring is fixed in time ----------
   There is no lock and no deadline. You can change your team whenever you like.
   The moment the admin logs a game, a snapshot of every team is taken, and that
   snapshot is what scores for that gameweek. Later edits only affect future
   gameweeks, so nobody can react to a result — and nobody gets shut out either. */
function fplLocked(){ return false; }
function fplNextGw(){
  const played=playedGws();
  return played.length?Math.max(...played)+1:1;
}
/* called after a game is saved: rolls the gameweek forward and repricing */
async function fplAfterGame(){
  const f=fpl();
  const played=playedGws();
  if(!played.length)return;
  const latest=Math.max(...played);
  /* freeze each manager's team for the gameweek that was just logged */
  f.managers.forEach(m=>{
    if(!m.squad||m.squad.length!==FPL_RULES.squadSize)return;
    if(!m.history)m.history=[];
    if(!m.history.some(h=>h.gw===latest))
      m.history.push({gw:latest,squad:[...m.squad],captain:m.captain,at:Date.now()});
  });
  if(f.gw!==latest){ f.gw=latest; }
  updatePrices();
}
/* open the next gameweek: unlocks teams for everyone */
async function fplOpenNextGw(){
  if(!requireAdmin())return;
  const f=fpl();
  const next=fplNextGw();
  if(!await askConfirm('Open the next gameweek?',
     `Teams unlock so managers can make transfers for GW${next}. They lock again the moment you log the first GW${next} game.`,
     'Open GW'+next,false))return;
  f.gw=next; await save(); render(); toast(`✅ GW${next} open — teams unlocked`);
}
/* transfers remaining this calendar month */
/* transfers reset every week (Monday-based ISO week) */
function weekKey(d){
  const t=new Date(d||Date.now());
  t.setHours(0,0,0,0);
  t.setDate(t.getDate()+4-(t.getDay()||7));          // nearest Thursday
  const y0=new Date(t.getFullYear(),0,1);
  const wk=Math.ceil((((t-y0)/86400000)+1)/7);
  return t.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
const preSeason=()=>playedGws().length===0;   // nothing logged yet = free rein
/* Transfers accrue weekly and BANK if you don't use them, up to a ceiling.
   With prices moving every week, being stuck on a fixed weekly allowance meant
   one bad run could leave you unable to react. Banking gives you room to wait. */
function transfersLeft(m){
  if(preSeason())return Infinity;
  const gws=playedGws().length;
  /* Each completed gameweek grants the allowance for the NEXT one. The old
     "+1" also counted the week just played, so after GW1 everybody was shown
     four transfers when the rule says two a week. */
  const earned=FPL_RULES.transfersPerWeek*gws;
  const used=Object.values(m.transfers||{}).reduce((t,n)=>t+n,0);
  /* the bank caps how far ahead you can save, not the lifetime total */
  const banked=Math.min(FPL_RULES.transferBank,earned-used);
  return Math.max(0,banked);
}
function transferInfo(m){
  const gws=playedGws().length;
  return {left:transfersLeft(m),perWeek:FPL_RULES.transfersPerWeek,
          bank:FPL_RULES.transferBank,
          used:Object.values(m.transfers||{}).reduce((t,n)=>t+n,0),
          earned:FPL_RULES.transfersPerWeek*gws};
}
function useTransfer(m,n){
  if(preSeason())return;
  const k=weekKey();
  if(!m.transfers)m.transfers={};
  m.transfers[k]=((m.transfers[k])||0)+(n||1);
}

/* the same code unlocks the fantasy game and the betting, so signing in from

/* ---------- my team ---------- */
/* A left/right gameweek pager on My Team, the way FPL does it. */
let SQTAB='people', PCAR='season', PUSH_ON='off';
let TEAMGW=null, PREDOPEN=false, PREDPASTOPEN=false, WAGEOPEN=false, BOOTOPEN=false, SPONOPEN=false, LADDEROPEN=false;
/* My Team has two jobs — showing what a past gameweek scored, and picking the
   side for the next one. Real FPL splits these; ours did not, which made it
   unclear which gameweek you were looking at. */
let TMODE='pts';
function teamGw(){ const g=playedGws(); return TEAMGW&&g.includes(TEAMGW)?TEAMGW:(g[g.length-1]||null) }
function stepTeamGw(d){
  const g=playedGws(), i=g.indexOf(teamGw());
  const n=g[Math.max(0,Math.min(g.length-1,i+d))];
  if(n){ TEAMGW=n; TEAMOPEN=null; render() }
}
let TEAMOPEN=null;
/* how each of your players did in that gameweek, with a tappable breakdown */
function gwSquadCard(m,gw){

    <div class="card">${lines.map(l=>`
      <div class="row tap" onclick="TEAMOPEN=TEAMOPEN==='${l.pid}'?null:'${l.pid}';render()">
        <div class="rt"><div class="r1">${esc(l.name)}${l.isCap?` <span class="pill" style="background:var(--tint-soft);color:var(--tint)">C${l.mult===3?'³':''}</span>`:''}

          `<div class="bd-r"><span>${esc(r.k)}</span><b>${r.v>0?'+':''}${r.v}</b></div>`).join('')
        :'<div class="bd-r"><span>Did not play</span><b>0</b></div>'}
        ${l.isCap?`<div class="bd-r"><span>Captain ×${l.mult}</span><b>+${l.total-l.raw}</b></div>`:''}
        <div class="bd-r tot"><span>Total</span><b>${l.total}</b></div></div>`:''}`).join('')}
      <div class="row"><div class="rt"><div class="r1" style="font-weight:800">Gameweek total</div>

/* A short read on the five you own: form, value and how they're trending.
   Sits under the chips so the pitch stays the first thing you see. */
function squadAnalysis(m){
  const squad=(m.squad||[]).slice();
  if(squad.length!==FPL_RULES.squadSize)return '';
  const gws=playedGws();
  const rows=squad.map(pid=>{
    const p=player(pid)||{}, st=statsAll().find(x=>x.id===pid)||{P:0,G:0,A:0,pts:0};
    const last3=gws.slice(-3).reduce((t,g)=>t+fplPlayerGw(pid,g),0);
    const total=gws.reduce((t,g)=>t+fplPlayerGw(pid,g),0);
    const price=fplPrice(pid), paid=paidPrice(m,pid);
    return {pid,name:p.name||'—',pos:p.pos||'',price,paid,delta:Math.round((price-paid)*10)/10,
            gp:st.P||0,g:st.G||0,a:st.A||0,total,last3,
            per:price?total/price:0, isCap:pid===m.captain};
  });
  const tot=rows.reduce((t,r)=>t+r.total,0);
  const val=rows.reduce((t,r)=>t+r.price,0);
  const swing=rows.reduce((t,r)=>t+r.delta,0);
  const best=rows.slice().sort((a,b)=>b.per-a.per)[0];
  const cold=rows.slice().sort((a,b)=>a.last3-b.last3)[0];
  return `<div class="sechead">Your five</div>
    <div class="card" style="padding:0">
      <div class="tw"><table class="anal">
        <thead><tr><td>Player</td><td class="c">Gm</td><td class="c">⚽</td><td class="c">🅰️</td>
          <td class="c">Last 3</td><td class="c">Pts</td><td class="c">Per £m</td><td class="c">Price</td></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td class="nm">${esc(r.name.split(' ')[0])}${r.isCap?' <span class="pill" style="background:var(--tint-soft);color:var(--tint)">C</span>':''}
            ${r.pos?`<span class="pill ${r.pos}">${r.pos}</span>`:''}</td>
          <td class="c">${r.gp}</td><td class="c">${r.g}</td><td class="c">${r.a}</td>
          <td class="c" style="font-weight:700">${r.last3}</td>
          <td class="c">${r.total}</td>
          <td class="c">${r.per.toFixed(1)}</td>
          <td class="c">£${r.price.toFixed(1)}m${r.delta?`<div style="font-size:10.5px;font-weight:700;color:${r.delta>0?'var(--green)':'var(--red)'}">${r.delta>0?'+':''}${r.delta}</div>`:''}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="tiles" style="margin-bottom:10px">
      ${tile(tot,'Squad points')}
      ${tile('£'+val.toFixed(1)+'m','Team value',swing?`${swing>0?'+':''}${swing.toFixed(1)} since you bought`:'unchanged')}
      ${best?tile(best.per.toFixed(1),'Best value',esc(best.name.split(' ')[0])+' · per £m','var(--green)'):''}
      ${cold&&gws.length>=3?tile(cold.last3,'Coldest',esc(cold.name.split(' ')[0])+' · last 3','var(--red)'):''}
    </div>
    <div class="note">Last 3 is their points over the last three gameweeks — the same window the price engine uses, so it tells you who is about to rise or fall.</div>`;
}

function fplMyTeam(m,locked){

  const viewing = TMODE==='pts' && gws.length;

  const emptySlot=(pos,required)=>`<div class="sh">

  return `

        <div class="gwp-mid"><b>Gameweek ${teamGw()}</b>

    ${TMODE==='pick'?squadAnalysis(m):''}

/* if two of a manager's picks now share a position, name the culprit */
/* Positions may now repeat (2 attackers is fine), so the only structural
   problem is someone in your squad becoming a keeper. */
function squadClash(squad){
  for(const id of (squad||[])){
    const p=player(id); if(!p)continue;
    if(!FPL_RULES.eligible.includes(p.pos||'MID'))return p.name;
  }
  return null;
}

/* ---------- picking: changes go into a draft you must confirm ---------- */
let FDRAFT=null;     // {squad:[], captain:null}
function draftOf(m){
  if(!FDRAFT)FDRAFT={squad:[...(m.squad||[])],captain:m.captain||null};
  return FDRAFT;
}
function draftDirty(m){
  const d=draftOf(m);
  const a=[...d.squad].sort().join(','), b=[...(m.squad||[])].sort().join(',');
  return a!==b || d.captain!==m.captain;
}
/* What a squad costs against the budget. Players you already own are valued at
   the price you PAID; only new signings cost today's price. Without this a rise
   in your own players' value could put you over budget and block all transfers. */
function paidPrice(m,pid){
  const bought=(m.bought||{})[pid];
  return bought!=null?bought:fplPrice(pid);
}
/* You sell at the full market price and keep every penny of the rise. Real FPL
   only gives you half, to stop team values running away — here the squad is 29
   players and the season is short, so the simpler rule is worth more than the
   protection. A fall comes off in full too, so holding a slider costs you. */
function sellPrice(m,pid){ return fplPrice(pid); }
/* Profit you have banked by selling risers this session. */
function realisedProfit(m){
  const d=draftOf(m), had=(m.squad||[]);
  return had.filter(x=>!d.squad.includes(x))
            .reduce((t,x)=>t+(sellPrice(m,x)-paidPrice(m,x)),0);
}
function draftSpend(m){
  const d=draftOf(m), owned=new Set(m.squad||[]);
  const gross=d.squad.reduce((t,x)=>t+(owned.has(x)?paidPrice(m,x):fplPrice(x)),0);
  return Math.round((gross-realisedProfit(m))*10)/10;
}
function squadValue(m){ return (m.squad||[]).reduce((t,x)=>t+fplPrice(x),0) }
function draftChanges(m){
  const d=draftOf(m), out=(m.squad||[]).filter(x=>!d.squad.includes(x));
  const inn=d.squad.filter(x=>!(m.squad||[]).includes(x));
  return {out,inn,count:Math.max(out.length,inn.length)};
}
/* everything wrong with the current draft, in plain English */
function squadShape(squad){
  const c={DEF:0,MID:0,ATT:0};
  (squad||[]).forEach(id=>{const p=player(id); if(p&&c[p.pos]!=null)c[p.pos]++});
  return c;
}
/* Which positions still have to be covered, and how many slots are left.
   A pick is only refused when taking it would make the minimum unreachable —
   otherwise every position stays open, which is what people expect. */
function shapeState(m){
  const d=draftOf(m), sh=squadShape(d.squad);
  const missing=FPL_RULES.slots.filter(pos=>!sh[pos]);
  const slotsLeft=FPL_RULES.squadSize-d.squad.length;
  return {sh,missing,slotsLeft,
          /* if slots left exactly equals what's missing, only those may be picked */
          forced: slotsLeft>0 && missing.length>=slotsLeft ? missing : null};
}
function canPickPos(m,pos){
  const st=shapeState(m);
  if(!st.forced)return true;
  return st.forced.includes(pos);
}
function shapeHint(m){
  const st=shapeState(m);
  if(!st.forced)return '';
  const list=st.forced.join(' and ');
  return `<div class="warn" style="margin-bottom:12px">⚠️ ${st.slotsLeft} slot${st.slotsLeft===1?'':'s'} left, so you still need ${st.forced.length===1?'a':'one'} <b>${list}</b>. Only those are shown.</div>`;
}
function draftProblems(m){
  const d=draftOf(m), p=[], n=d.squad.length, need=FPL_RULES.squadSize;
  if(n<need)p.push(`Pick ${need-n} more player${need-n===1?'':'s'} (${n} of ${need})`);
  if(n>need)p.push(`You have ${n} players — only ${need} allowed`);
  /* Only enforce the shape while the team is being changed. A squad that was
     valid when confirmed stays valid even if the admin later moves someone to
     a different position. */
  const settled = (m.squad||[]).length===need && !draftDirty(m);
  if(!settled){
    const sh=squadShape(d.squad);
    FPL_RULES.slots.forEach(pos=>{ if(!sh[pos])p.push(`You need at least one ${pos}`) });
  }
  const spend=draftSpend(m);
  if(spend>FPL_RULES.budget)p.push(`You're £${(spend-FPL_RULES.budget).toFixed(1)}m over budget`);
  if(!d.captain&&n===need)p.push('Choose a captain');
  const ch=draftChanges(m);
  const firstTeam=!(m.squad&&m.squad.length===FPL_RULES.squadSize);
  if(!firstTeam&&!m.wildcardActive&&!preSeason()&&ch.count>transfersLeft(m))
    p.push(`That's ${ch.count} transfer${ch.count===1?'':'s'} but you only have ${transfersLeft(m)} left this week`);
  return p;
}
let FSWAP=null;   // the player being replaced, if any
function fplSwapOut(pid){
  const p=player(pid); if(!p)return;

function fplDrop(pid){

function fplSwap(pos){ FSWAP=null; FPICK=null; FTAB='market'; render(); }
function fplPick(pid){
  haptic('light');
  const m=fplMine(); if(!m)return;
  const p=player(pid); if(!p)return;
  if(!FPL_RULES.eligible.includes(p.pos||'MID')){toast('Keepers aren\'t in the fantasy game');return}
  const d=draftOf(m);
  if(d.squad.includes(pid)){ toast('Already in your team'); return; }
  if(FSWAP){                                   // replacing someone specific
    const after=draftOf(m).squad.map(x=>x===FSWAP?pid:x);
    const sh=squadShape(after);
    const gap=FPL_RULES.slots.filter(pos=>!sh[pos]);
    if(gap.length){ toast(`That would leave you without a ${gap.join(' or ')}`); return; }
    const outName=player(FSWAP)?.name.split(' ')[0]||'them';
    d.squad=d.squad.map(x=>x===FSWAP?pid:x);
    if(d.captain===FSWAP)d.captain=null;
    FSWAP=null; FPICK=null; FTAB='team'; render();
    toast(`${p.name.split(' ')[0]} in for ${outName}`); return;
  }
  if(d.squad.length>=FPL_RULES.squadSize){
    toast(`You already have ${FPL_RULES.squadSize} — tap a player to replace them`); return;
  }
  if(!canPickPos(m,p.pos||'MID')){
    const st=shapeState(m);
    toast(`Only ${st.forced.join(' or ')} left — you need one of each`); return;
  }
  d.squad.push(pid);
  if(d.squad.length===FPL_RULES.squadSize){ FPICK=null; FTAB='team'; }
  render();
}
function draftCaptain(pid){
  haptic('light');
  const m=fplMine(); if(!m)return;
  const d=draftOf(m);
  if(!d.squad.includes(pid)){toast('You can only captain someone in your team');return}

}
function discardDraft(){ FDRAFT=null; render(); toast('Changes discarded'); }
async function confirmDraft(){
  const m=fplMine(); if(!m)return;
  const probs=draftProblems(m);
  if(probs.length){ toast('⚠️ '+probs[0]); render(); return; }
  const d=draftOf(m), ch=draftChanges(m);
  const firstTeam=!(m.squad&&m.squad.length===FPL_RULES.squadSize);
  if(!firstTeam&&ch.count>0&&!m.wildcardActive&&!preSeason()){
    const names=ch.out.map((x,i)=>`${player(x)?.name} → ${player(ch.inn[i])?.name}`).join('\n');
    if(!await askConfirm(`Confirm ${ch.count} transfer${ch.count===1?'':'s'}?`,
       `${names}\n\nYou'll have ${transfersLeft(m)-ch.count} left this month.`,'Confirm',false))return;
    useTransfer(m,ch.count);
  }
  /* lock in what each new player cost, so later price rises can't break the budget */
  if(!m.bought)m.bought={};
  d.squad.forEach(pid=>{ if(m.bought[pid]==null)m.bought[pid]=fplPrice(pid) });
  Object.keys(m.bought).forEach(pid=>{ if(!d.squad.includes(pid))delete m.bought[pid] });
  /* first team ever? record which gameweek they start scoring from, so a
     mid-season joiner is not credited with points from before they existed */
  if(m.firstGw==null){
    const played=playedGws();
    m.firstGw = played.length ? Math.max(...played)+1 : 1;
  }
  m.squad=[...d.squad]; m.captain=d.captain;
  m.needsReview=false;                       /* migration prompt clears once they confirm */
  if(m.wildcardActive){ m.wildcardActive=false; m.wildcards=(m.wildcards||0)+1; }
  FDRAFT=null;
  await fplSave();
  render();
  haptic('success');
  toast(firstTeam?'✅ Team confirmed — you\'re in the league':'✅ Transfers confirmed');
}
async function fplSave(){
  if(CLOUD_FAIL){toast('⛔️ Not saved — database unreachable');return}
  await save();
}
async function playWildcard(){
  const m=fplMine(); if(!m)return;
  if(m.wildcardActive){
    if(!await askConfirm('Cancel your wildcard?','Your team goes back to how it was and you keep the chip.','Cancel it',false))return;
    m.wildcardActive=false; FDRAFT=null;
    await fplSave(); render(); toast('Wildcard cancelled');
    return;
  }
  const clash=chipArmedFor(m,fplNextGw());
  if(clash){toast(`${clash} is already on for GW${fplNextGw()} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.wildcards||0);
  if(left<=0){toast('You have used all your wildcards');return}
  if(!await askConfirm('Play a wildcard?',
     `Unlimited free transfers for one set of changes. You have ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.wildcardActive=true; FDRAFT={squad:[],captain:null};

}
/* The triple captain can be taken back off as long as the gameweek it is armed
   for has not been played yet — once a game is logged it is locked in. */
/* Only one chip may be armed for any given gameweek — stacking Triple Captain
   with Double Points turned a normal week into a runaway score. */
function chipArmedFor(m,gw){
  if((m.tcGws||[]).includes(gw))return 'Triple Captain';
  if((m.dpGws||[]).includes(gw))return 'Double Points';
  if(m.wildcardActive)return 'Wildcard';
  return null;
}
const tcArmed=m=>(m.tcGws||[]).includes(fplNextGw());
async function playTripleCaptain(){
  const m=fplMine(); if(!m)return;

       `It will no longer apply to GW${next} and you get the chip back.`,'Remove',false))return;
    m.tcGws=(m.tcGws||[]).filter(g=>g!==next);
    m.tripleCaps=Math.max(0,(m.tripleCaps||0)-1);
    await fplSave(); render(); toast('Triple captain removed');
    return;
  }
  const clash=chipArmedFor(m,next);
  if(clash){toast(`${clash} is already on for GW${next} — only one chip a week`);return}
  const left=FPL_RULES.chips-(m.tripleCaps||0);
  if(left<=0){toast('You have used all your triple captains');return}
  if(!m.captain){toast('Pick a captain first');return}
  if(!await askConfirm('Play a triple captain?',
     `${player(m.captain)?.name} scores ×3 in GW${next} instead of ×2. You can take it off again any time before that game is logged. ${left} of ${FPL_RULES.chips} left.`,'Play it',false))return;
  m.tripleCaps=(m.tripleCaps||0)+1;

const dpArmed=m=>(m.dpGws||[]).includes(fplNextGw());

/* ============ FPL STOCKS ============
   The price history is replayed with exactly the same maths recalcPrices uses,
   so every gameweek value is the real one. Between gameweeks we draw a small
   deterministic wobble so the chart looks alive — it is seeded from the player
   id and gameweek, so it never changes between renders, and it always lands
   exactly on the true price at each gameweek. */
function priceSeries(){ return walkPrices().hist; }

/* stable 0..1 from a string — no Math.random, so the chart never flickers */
function seedRand(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%100000)/100000;
}
/* a drawable curve: real anchors plus gentle in-between motion */
function priceCurve(pid,perStep){
  const ser=(priceSeries()[pid])||[];
  if(ser.length<2)return ser.map(x=>({...x,real:true}));
  const step=perStep||4, out=[];
  for(let i=0;i<ser.length-1;i++){
    const a=ser[i], b=ser[i+1];
    out.push({gw:a.gw,v:a.v,real:true});
    for(let k=1;k<step;k++){
      const t=k/step;
      const lin=a.v+(b.v-a.v)*t;
      // wobble is a fraction of the move, biggest mid-way, zero at both ends
      const amp=Math.max(0.05,Math.abs(b.v-a.v)*0.45)*Math.sin(Math.PI*t);
      const n=(seedRand(pid+'|'+a.gw+'|'+k)-0.5)*2;
      out.push({gw:a.gw+t,v:Math.max(FPL_RULES.minPrice,Math.min(FPL_RULES.maxPrice,lin+n*amp)),real:false});
    }
  }
  const last=ser[ser.length-1];
  out.push({gw:last.gw,v:last.v,real:true});
  return out;
}
function stockOf(pid){
  const ser=(priceSeries()[pid])||[];
  const base=basePrice(pid);
  const now=ser.length?ser[ser.length-1].v:base;
  const prev=ser.length>1?ser[ser.length-2].v:base;
  const open=base;                 /* their own opening price, not a flat default */
  const chg=now-prev, pct=prev?(chg/prev*100):0;
  const season=now-open, seasonPct=open?(season/open*100):0;
  const highs=ser.map(x=>x.v);
  return {pid,now,prev,chg,pct,season,seasonPct,
          hi:Math.max(...highs,now), lo:Math.min(...highs,now), n:ser.length};
}
/* sparkline: 8-10 gameweeks, coloured by direction */
function sparkline(pid,w,h){
  const c=priceCurve(pid,4);
  const keep=c.slice(Math.max(0,c.length-40));
  if(keep.length<2)return `<svg width="${w||72}" height="${h||26}"></svg>`;
  const W=w||72, H=h||26, pad=2;
  const vs=keep.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), rng=(hi-lo)||1;
  const x=i=>pad+(i/(keep.length-1))*(W-pad*2);
  const y=v=>H-pad-((v-lo)/rng)*(H-pad*2);
  const up=keep[keep.length-1].v>=keep[0].v;
  const col=up?'#30D158':'#FF453A';
  const d=keep.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=`${d}L${x(keep.length-1).toFixed(1)},${H-pad}L${x(0).toFixed(1)},${H-pad}Z`;
  const id='sp'+pid.replace(/\W/g,'');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
/* full chart for the expanded view */
function priceChart(pid,range){
  const all=priceCurve(pid,5);
  const gws=playedGws(), lastGw=gws[gws.length-1]||0;
  const spans={'3W':3,'1M':4,'3M':12,'ALL':9999};
  const back=spans[range]||9999;
  const from=Math.max(0,lastGw-back);
  const c=all.filter(p=>p.gw>=from);
  if(c.length<2)return `<div class="note" style="padding:22px;text-align:center">Not enough history yet — prices move once games are logged.</div>`;
  const W=340,H=170,padT=12,padB=26,padL=34,padR=10;
  const vs=c.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  const pad=Math.max(0.2,(hi-lo)*0.18); lo=Math.max(0,lo-pad); hi=hi+pad;   // breathing room
  const rng=(hi-lo)||1;
  const x=i=>padL+(i/(c.length-1))*(W-padL-padR);
  const y=v=>H-padB-((v-lo)/rng)*(H-padT-padB);
  const up=c[c.length-1].v>=c[0].v, col=up?'#30D158':'#FF453A';
  /* smooth the line so it reads like a chart, not a saw */
  const d=c.map((p,i)=>{
    const px=x(i),py=y(p.v);
    if(!i)return `M${px.toFixed(1)},${py.toFixed(1)}`;
    const qx=x(i-1),qy=y(c[i-1].v),mx=(qx+px)/2;
    return `C${mx.toFixed(1)},${qy.toFixed(1)} ${mx.toFixed(1)},${py.toFixed(1)} ${px.toFixed(1)},${py.toFixed(1)}`;
  }).join('');
  const area=`${d}L${x(c.length-1).toFixed(1)},${H-padB}L${x(0).toFixed(1)},${H-padB}Z`;
  const anchors=c.map((p,i)=>({...p,i})).filter(p=>p.real);
  const ticks=[0,.25,.5,.75,1].map(f=>lo+rng*f);
  const lastPt=c[c.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="stk-chart">
    <defs><linearGradient id="cg${pid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`
      <line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}"
        stroke="var(--sep)" stroke-width=".7" stroke-dasharray="2 3"/>
      <text x="${padL-5}" y="${(y(v)+3).toFixed(1)}" font-size="8.5" fill="var(--label3)" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    <path d="${area}" fill="url(#cg${pid})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${anchors.map(a2=>`<circle cx="${x(a2.i).toFixed(1)}" cy="${y(a2.v).toFixed(1)}" r="2" fill="var(--card)" stroke="${col}" stroke-width="1.4"/>`).join('')}
    <circle cx="${x(c.length-1).toFixed(1)}" cy="${y(lastPt.v).toFixed(1)}" r="4.5" fill="${col}"/>
    <circle cx="${x(c.length-1).toFixed(1)}" cy="${y(lastPt.v).toFixed(1)}" r="8" fill="${col}" opacity=".18"/>
    <text x="${padL}" y="${H-8}" font-size="9" fill="var(--label3)">GW${Math.max(1,Math.ceil(from))}</text>
    <text x="${W-padR}" y="${H-8}" font-size="9" fill="var(--label3)" text-anchor="end">GW${lastGw}</text>
  </svg>`;
}
function marketIndex(){
  const st=fplStats();
  const rows=st.map(x=>stockOf(x.id));
  const total=rows.reduce((t,r)=>t+r.now,0);
  const up=rows.slice().sort((a,b)=>b.chg-a.chg)[0];
  const dn=rows.slice().sort((a,b)=>a.chg-b.chg)[0];
  return {total,up,dn,n:rows.length};
}

let SSORT='movers', SOPEN=null, SRANGE='ALL';

      </div>
      <button class="btn sec full" style="margin-top:10px" onclick="event.stopPropagation();openPlayer('${r.id}')">Full profile ›</button>
    </div>`;

  return `
    <div class="idx">
      <div class="idx-h"><b>SUNDAY MARKET</b><span>${idx.n} listed</span></div>
      <div class="idx-b">

function fplMarket(m,locked){

     whole point is being able to change shape. Only narrow when the minimum

  if(shape.forced)st=st.filter(x=>shape.forced.includes(x.pos));
  else if(FPOS!=='ALL')st=st.filter(x=>x.pos===FPOS);
  const key={total:'total',form:'form',price:'price',owned:'ownedPct',threat:'threat',value:'value'}[FSORT2]||'total';
